      function formatPace(distanceM,durationSec) {
        const distance=Number(distanceM),duration=Number(durationSec);
        if(!Number.isFinite(distance)||distance<=0||!Number.isFinite(duration)||duration<=0) return "—";
        const total=Math.round(duration/(distance/1000));
        return `${Math.floor(total/60)}:${String(total%60).padStart(2,"0")} min/km`;
      }

      function formatActivityDateTime(value, fallbackDate) {
        if (!value) return fallbackDate || "—";
        const raw = String(value).replace(" ", "T");
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString("es-ES", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function decodePolyline(encoded) {
        if (!encoded || typeof encoded !== "string") return [];
        const points = [];
        let index = 0, lat = 0, lng = 0;

        while (index < encoded.length) {
          let b, shift = 0, result = 0;
          do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20 && index <= encoded.length);

          const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
          lat += dlat;

          shift = 0;
          result = 0;
          do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20 && index <= encoded.length);

          const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
          lng += dlng;
          points.push([lat / 1e5, lng / 1e5]);
        }

        return points;
      }

      function routeSvg(encoded) {
        const points = decodePolyline(encoded);
        if (points.length < 2) {
          return `<div class="empty">Ruta no disponible.</div>`;
        }

        const lats = points.map((p) => p[0]);
        const lngs = points.map((p) => p[1]);
        const minLat = Math.min(...lats), maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
        const latSpan = maxLat - minLat || 1;
        const lngSpan = maxLng - minLng || 1;

        const coords = points.map(([lat, lng]) => {
          const x = 12 + ((lng - minLng) / lngSpan) * 276;
          const y = 168 - ((lat - minLat) / latSpan) * 156;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");

        return `
          <svg viewBox="0 0 300 180" role="img" aria-label="Ruta de la actividad"
            style="width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2)">
            <polyline points="${coords}" fill="none" stroke="var(--blue)"
              stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
      }

      function equipmentText(value) {
        if (!value) return "—";
        const items = Array.isArray(value) ? value : [value];
        const names = items.map((item) =>
          item?.displayName ||
          item?.gearName ||
          item?.name ||
          item?.customMakeModel ||
          null
        ).filter(Boolean);
        return names.length ? names.join(", ") : "—";
      }

      function firstVisible(...values) {
        for (const value of values) {
          if (value !== null && value !== undefined && value !== "") return value;
        }
        return null;
      }

      function formatCadence(value) {
        if (value == null || !Number.isFinite(Number(value))) return "—";
        return String(Math.round(Number(value)));
      }

      function formatStrideLength(value) {
        if (value == null || !Number.isFinite(Number(value))) return "—";
        const n = Number(value);
        const meters = n > 10 ? n / 100 : n;
        return meters.toLocaleString("es-ES", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });
      }

      function normalizeLapRows(payload) {
        const raw =
          Array.isArray(payload?.lapDTOs) ? payload.lapDTOs :
          Array.isArray(payload) ? payload :
          [];

        return raw.map((lap, index) => {
          const distanceM = Number(
            lap?.distance ??
            lap?.summaryDTO?.distance ??
            0
          );
          const durationSec = Number(
            lap?.duration ??
            lap?.movingDuration ??
            lap?.summaryDTO?.duration ??
            0
          );

          return {
            number: index + 1,
            distanceM,
            durationSec,
            averageHR:
              lap?.averageHR ??
              lap?.avgHr ??
              lap?.summaryDTO?.averageHR ??
              null,
            averagePower:
              lap?.averagePower ??
              lap?.avgPower ??
              lap?.summaryDTO?.averagePower ??
              null,
            elevationGainM: Number(
              lap?.elevationGain ??
              lap?.totalAscent ??
              lap?.summaryDTO?.elevationGain ??
              lap?.summaryDTO?.totalAscent ??
              0
            ),
            elevationLossM: Number(
              lap?.elevationLoss ??
              lap?.totalDescent ??
              lap?.summaryDTO?.elevationLoss ??
              lap?.summaryDTO?.totalDescent ??
              0
            )
          };
        }).filter((lap) => lap.distanceM > 0 || lap.durationSec > 0);
      }

      function lapPaceSecKm(lap) {
        const distance = Number(lap?.distanceM);
        const duration = Number(lap?.durationSec);

        if (
          !Number.isFinite(distance) ||
          distance <= 0 ||
          !Number.isFinite(duration) ||
          duration <= 0
        ) {
          return null;
        }

        return duration / (distance / 1000);
      }

      function formatLapPace(lap) {
        const pace = lapPaceSecKm(lap);
        if (!Number.isFinite(pace)) return "—";

        const total = Math.round(pace);
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")} min/km`;
      }

      function formatPaceSeconds(seconds) {
        const total=Math.max(0,Math.round(Number(seconds)||0));
        return `${Math.floor(total/60)}:${String(total%60).padStart(2,"0")}`;
      }

      function chartEligibleLaps(laps) {
        const rows = [...laps];
        if (!rows.length) return rows;

        const last = rows[rows.length - 1];
        const distance = Number(last?.distanceM);
        const duration = Number(last?.durationSec);

        // Garmin often creates a tiny final residual lap when the watch is
        // stopped just after a round distance. Ignore only that final residue
        // in the chart, never short laps in the middle of a workout.
        const looksResidual =
          Number.isFinite(distance) &&
          Number.isFinite(duration) &&
          distance >= 0 &&
          duration >= 0 &&
          distance < 20 &&
          duration < 10;

        return looksResidual ? rows.slice(0, -1) : rows;
      }

      function roundPaceFloor(seconds, step = 10) {
        return Math.floor(Number(seconds) / step) * step;
      }

      function roundPaceCeil(seconds, step = 10) {
        return Math.ceil(Number(seconds) / step) * step;
      }

      function selectActivityLap(lapNumber, {toggle=true}={}) {
        const value=lapNumber==null?null:String(lapNumber);
        const next=toggle && value && String(state.selectedActivityLap||"")===value
          ? null

          el.classList.toggle("selected",next!=null&&String(el.dataset.lapNumber)===String(next));
        });
        document.querySelectorAll(".laps-table tbody tr[data-lap-number]").forEach(el=>{
          el.classList.toggle("lap-row-selected",next!=null&&String(el.dataset.lapNumber)===String(next));
        });
      }

      function bindActivityLapSelection() {
        const chart=document.querySelector(".laps-chart");
        const table=document.querySelector(".laps-table");

        if(chart && chart.dataset.selectionBound!=="1"){

        if(table && table.dataset.selectionBound!=="1"){
          table.dataset.selectionBound="1";

      }

      function lapPaceFixedColor(paceSecKm) {
        const pace=Number(paceSecKm);
        if(!Number.isFinite(pace))return "hsl(210 100% 58%)";
        if(pace<240)return "hsl(210 100% 24%)"; // <4:00
        if(pace<270)return "hsl(210 100% 32%)"; // 4:00-4:29
        if(pace<300)return "hsl(210 100% 40%)"; // 4:30-4:59
        if(pace<330)return "hsl(210 100% 49%)"; // 5:00-5:29
        if(pace<360)return "hsl(210 100% 58%)"; // 5:30-5:59
        if(pace<390)return "hsl(210 100% 67%)"; // 6:00-6:29
        if(pace<420)return "hsl(210 100% 75%)"; // 6:30-6:59
        return "hsl(210 100% 82%)";             // >=7:00
      }

      function lapsPaceChart(laps) {
        const chartLaps=chartEligibleLaps(laps);
        if(!chartLaps.length)return `<div class="empty">Vueltas no disponibles.</div>`;
        const rows=chartLaps.map(lap=>({...lap,pace:lapPaceSecKm(lap)})).filter(lap=>Number.isFinite(lap.pace));
        if(!rows.length)return `<div class="empty">Ritmo por vuelta no disponible.</div>`;

        const fastest=Math.min(...rows.map(x=>x.pace));
        const slowest=Math.max(...rows.map(x=>x.pace));
        const totalDistance=rows.reduce((s,x)=>s+Math.max(1,x.distanceM),0);
        const W=760,H=310,left=60,right=12,top=34,bottom=48;
        const plotW=W-left-right,plotH=H-top-bottom;

        const rawMid=(fastest+slowest)/2;
        const minSpan=90;
        let yFast=Math.max(1,roundPaceFloor(Math.min(fastest-10,rawMid-minSpan/2),10));
        let ySlow=roundPaceCeil(Math.max(slowest+10,rawMid+minSpan/2),10);
        if(ySlow-yFast<minSpan)ySlow=yFast+minSpan;

        let tickEvery=10;
        while(((ySlow-yFast)/tickEvery)>9)tickEvery+=5;
        const y=pace=>top+((pace-yFast)/(ySlow-yFast))*plotH;
        const ticks=[];
        for(let tick=yFast;tick<=ySlow+0.001;tick+=tickEvery)ticks.push(tick);

        let cumulative=0;
        const bars=rows.map(lap=>{
          const x0=left+(cumulative/totalDistance)*plotW;
          const width=Math.max(4,(lap.distanceM/totalDistance)*plotW-2);
          cumulative+=Math.max(1,lap.distanceM);
          const barTop=y(lap.pace),barHeight=top+plotH-barTop;
          const color=lapPaceFixedColor(lap.pace);
          return `<rect class="lap-pace-bar" data-lap-number="${lap.number}" x="${x0.toFixed(1)}" y="${barTop.toFixed(1)}" width="${width.toFixed(1)}" height="${Math.max(2,barHeight).toFixed(1)}" rx="4" fill="${color}"><title>Vuelta ${lap.number} · ${formatLapPace(lap)}</title></rect>
          <text class="lap-x-label" x="${(x0+width/2).toFixed(1)}" y="${H-17}" text-anchor="middle" fill="#C7C7CC">${lap.number}</text>`;
        }).join("");

        return `<div class="laps-chart-wrap"><svg class="laps-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ritmo por vuelta">
          <text class="lap-axis-title" x="${left-5}" y="15" text-anchor="end" fill="#8E8E93">min/km</text>
          ${ticks.map(tick=>`<line x1="${left}" x2="${W-right}" y1="${y(tick).toFixed(1)}" y2="${y(tick).toFixed(1)}" stroke="#2C2C2E" stroke-width="1"/><text class="lap-axis-label" x="${left-6}" y="${(y(tick)+5).toFixed(1)}" text-anchor="end" fill="#C7C7CC">${formatPaceSeconds(tick)}</text>`).join("")}
          ${bars}
        </svg></div>`;
      }

      function normalizeGarminStepType(step) {
        const candidates = [
          step?.stepType?.stepTypeKey,
          step?.stepType?.key,
          step?.stepTypeKey,
          step?.workoutStepTypeKey,
          step?.type,
          step?.intensityType?.intensityTypeKey,
          step?.intensityTypeKey,
          step?.intensity
        ];

        const raw = candidates.find(
          (value) => value !== null && value !== undefined && value !== ""
        );

        if (raw == null) return null;

        const key = String(raw)
          .trim()
          .toLowerCase()
          .replace(/[\s_.-]+/g, "");

        if (key.includes("warmup") || key.includes("warm")) return "WU";
        if (key.includes("cooldown") || key.includes("cool")) return "CD";

        if (
          key.includes("interval") ||
          key.includes("recovery") ||
          key.includes("recover") ||
          key.includes("active") ||
          key.includes("main") ||
          key.includes("rest") ||
          key.includes("run") ||
          key.includes("work")
        ) {
          return "MAIN";
        }

        return null;
      }

      function flattenActivityWorkoutSteps(payload) {
        const workouts = Array.isArray(payload)
          ? payload
          : Array.isArray(payload?.workouts)
            ? payload.workouts
            : payload
              ? [payload]
              : [];

        const out = [];

        const childrenOf = (node) =>
          Array.isArray(node?.steps) ? node.steps :
          Array.isArray(node?.workoutSteps) ? node.workoutSteps :
          Array.isArray(node?.childSteps) ? node.childSteps :
          [];

        const visit = (node) => {
          if (!node) return;

          if (Array.isArray(node)) {
            for (const item of node) visit(item);
            return;
          }

          if (typeof node !== "object") return;

          const rawType = String(
            node?.stepType?.stepTypeKey ??
            node?.stepType?.key ??
            node?.stepTypeKey ??
            node?.workoutStepTypeKey ??
            node?.type ??
            ""
          ).toLowerCase();

          const children = childrenOf(node);

          const isRepeat =
            rawType.includes("repeat") ||
            Number(node?.stepType?.stepTypeId) === 6 ||
            Number(node?.stepTypeId) === 6;

          if (isRepeat && children.length) {
            const repeats = Math.max(
              1,
              Math.round(
                Number(
                  node?.numberOfIterations ??
                  node?.repeatCount ??
                  node?.iterations ??
                  node?.endConditionValue ??
                  1
                )
              ) || 1
            );

            for (let i = 0; i < repeats; i++) {
              for (const child of children) visit(child);
            }
            return;
          }

          const phase = normalizeGarminStepType(node);

          if (phase) {
            out.push({
              phase,
              rawType:
                node?.stepType?.stepTypeKey ??
                node?.stepTypeKey ??
                node?.workoutStepTypeKey ??
                node?.type ??
                node?.intensityTypeKey ??
                node?.intensity ??
                null
            });
          }

          for (const child of children) visit(child);
        };

        for (const workout of workouts) {
          const rootSteps =
            Array.isArray(workout?.steps) ? workout.steps :
            Array.isArray(workout?.workoutSteps) ? workout.workoutSteps :
            Array.isArray(workout?.workoutSegments)
              ? workout.workoutSegments.flatMap((segment) =>
                  Array.isArray(segment?.workoutSteps)
                    ? segment.workoutSteps
                    : []
                )
              : [];

          visit(rootSteps);
        }

        return out;
      }

      function activityWorkoutSegments(payload, laps) {
        const usefulLaps = chartEligibleLaps(laps);
        const steps = flattenActivityWorkoutSteps(payload);

        if (!usefulLaps.length || !steps.length) return [];

        // Garmin structured steps must line up with useful laps.
        // One extra tiny final Garmin lap is already removed by chartEligibleLaps.
        if (steps.length !== usefulLaps.length) return [];

        const phases = steps.map((step) => step.phase);
        const set = new Set(phases);

        if (!set.has("WU") || !set.has("MAIN") || !set.has("CD")) {
          return [];
        }

        return phases;
      }

      function normalizeTypedSplitRows(payload) {
        let rows = [];

        if (Array.isArray(payload)) {
          rows = payload;
        } else if (Array.isArray(payload?.splits)) {
          rows = payload.splits;
        } else if (Array.isArray(payload?.lapDTOs)) {
          rows = payload.lapDTOs;
        } else if (payload && typeof payload === "object") {
          const looksLikeOne =
            payload.type != null ||
            payload.splitType != null ||
            payload.messageIndex != null;
          if (looksLikeOne) rows = [payload];
        }

        return rows.map((row, index) => {
          const type = String(
            row?.type ??
            row?.splitType ??
            row?.splitTypeKey ??
            ""
          ).trim().toUpperCase();

          const distanceM = Number(
            row?.distance ??
            row?.distanceM ??
            row?.summaryDTO?.distance ??
            0
          );

          const durationSec = Number(
            row?.duration ??
            row?.durationSec ??
            row?.movingDuration ??
            row?.elapsedDuration ??
            row?.summaryDTO?.duration ??
            0
          );

          return {
            raw: row,
            type,
            number: index + 1,
            messageIndex:
              row?.messageIndex != null
                ? Number(row.messageIndex)
                : null,
            distanceM: Number.isFinite(distanceM) ? distanceM : 0,
            durationSec: Number.isFinite(durationSec) ? durationSec : 0,
            averageHR:
              row?.averageHR ??
              row?.avgHR ??
              row?.summaryDTO?.averageHR ??
              null,
            elevationGainM: Number(
              row?.elevationGain ??
              row?.totalAscent ??
              row?.summaryDTO?.elevationGain ??
              row?.summaryDTO?.totalAscent ??
              0
            ),
            elevationLossM: Number(
              row?.elevationLoss ??
              row?.totalDescent ??
              row?.summaryDTO?.elevationLoss ??
              row?.summaryDTO?.totalDescent ??
              0
            )
          };
        });
      }

      function typedSplitPhase(type) {
        const key = String(type || "").toUpperCase();

        if (key === "INTERVAL_WARMUP") return "WU";
        if (key === "INTERVAL_COOLDOWN") return "CD";

        if (
          key === "INTERVAL_ACTIVE" ||
          key === "INTERVAL_REST" ||
          key === "INTERVAL_RECOVERY" ||
          key === "INTERVAL_OTHER" ||
          key === "RUN_ACTIVE" ||
          key === "RUN_REST"
        ) {
          return "MAIN";
        }

        return null;
      }

      function structuredTypedSplitRows(payload) {
        const rows = normalizeTypedSplitRows(payload)
          .map((row) => ({
            ...row,
            phase: typedSplitPhase(row.type)
          }))
          .filter((row) => row.phase);

        const phases = new Set(rows.map((row) => row.phase));

        if (
          !phases.has("WU") ||
          !phases.has("MAIN") ||
          !phases.has("CD")
        ) {
          return [];
        }

        return rows;
      }

      function segmentsFromSplitSummaries(splitSummaries, laps) {
        const usefulLaps = chartEligibleLaps(laps);
        const summaries = Array.isArray(splitSummaries) ? splitSummaries : [];

        if (!usefulLaps.length || !summaries.length) return [];

        let warmupCount = 0;
        let cooldownCount = 0;
        let mainCount = 0;

        for (const item of summaries) {
          const type = String(item?.splitType || "").toUpperCase();
          const count = Math.max(
            0,
            Math.round(Number(item?.noOfSplits) || 0)
          );

          if (type === "INTERVAL_WARMUP") {
            warmupCount += count;
          } else if (type === "INTERVAL_COOLDOWN") {
            cooldownCount += count;
          } else if (
            type === "INTERVAL_ACTIVE" ||
            type === "INTERVAL_RECOVERY" ||
            type === "INTERVAL_REST" ||
            type === "INTERVAL_OTHER" ||
            type === "INTERVAL_WALK"
          ) {
            mainCount += count;
          }
        }

        const totalStructured = warmupCount + mainCount + cooldownCount;

        if (
          warmupCount < 1 ||
          mainCount < 1 ||
          cooldownCount < 1 ||
          totalStructured !== usefulLaps.length
        ) {
          return [];
        }

        return usefulLaps.map((_, index) => {
          if (index < warmupCount) return "WU";
          if (index >= usefulLaps.length - cooldownCount) return "CD";
          return "MAIN";
        });
      }

      function lapGroupName(code) {
        return code==="WU"?"Calentamiento":code==="MAIN"?"Bloque principal":code==="CD"?"Enfriamiento":null;
      }

      function lapGroupDisplayName(value) {
        const name=lapGroupName(value);
        if (!name) return "";
        const key=String(name).toLowerCase();
        if (key.includes("calent")) return `🔥 ${name}`;
        if (key.includes("principal") || key.includes("trabajo")) return `⚡ ${name}`;
        if (key.includes("enfri")) return `❄️ ${name}`;
        return name;
      }

      function lapElevationValue(lap) {
        return Math.round((Number(lap.elevationGainM)||0)-(Number(lap.elevationLossM)||0));
      }

      function lapElevationHtml(lap) {
        const net = lapElevationValue(lap);
        const cls = net > 0 ? "lap-elev-pos" : net < 0 ? "lap-elev-neg" : "lap-elev-zero";
        const value = net > 0 ? `+${net}` : String(net);
        return `<span class="${cls}"><span class="lap-cell-main">${value}</span><span class="lap-cell-unit">m</span></span>`;
      }

      function lapDistanceHtml(distanceM) {
        const meters = Number(distanceM);
        if (!Number.isFinite(meters)) return "—";
        if (meters < 1000) {
          return `<span class="lap-cell-main">${Math.round(meters).toLocaleString("es-ES")}</span><span class="lap-cell-unit">m</span>`;
        }
        const km = (meters/1000).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:2});
        return `<span class="lap-cell-main">${km}</span><span class="lap-cell-unit">km</span>`;
      }

      function lapPaceHtml(lap) {
        const pace = lapPaceSecKm(lap);
        if (!Number.isFinite(pace)) return "—";
        return `<span class="lap-cell-main">${formatPaceSeconds(pace)}</span><span class="lap-cell-unit">min/km</span>`;
      }

      function lapHrHtml(value) {
        const hr = Number(value);
        if (!Number.isFinite(hr)) return "—";
        return `<span class="lap-cell-main">${Math.round(hr)}</span><span class="lap-cell-unit">ppm</span>`;
      }

      function typedSplitsTable(rows) {
        if (!Array.isArray(rows) || !rows.length) return "";

        let lastGroup = null;
        const body = rows.map((row, index) => {
          const group = lapGroupDisplayName(row.phase);
          const groupRow =
            group && group !== lastGroup
              ? `<tr class="lap-group-row"><td colspan="6">${escapeHtml(group)}</td></tr>`
              : "";
          if (group) lastGroup = group;
          const lapNumber=index+1;

          return `${groupRow}<tr data-lap-number="${lapNumber}">
            <td>${lapNumber}</td>
            <td>${lapDistanceHtml(row.distanceM)}</td>
            <td>${formatCardDuration(row.durationSec)}</td>
            <td>${lapPaceHtml(row)}</td>
            <td>${lapHrHtml(row.averageHR)}</td>
            <td>${lapElevationHtml(row)}</td>
          </tr>`;
        }).join("");

        return `<div class="laps-table-wrap"><table class="laps-table">
          <thead><tr>
            <th>Vuelta</th><th>Distancia</th><th>Tiempo</th><th>Ritmo</th><th>FC</th><th>Desnivel</th>
          </tr></thead>
          <tbody>${body}</tbody>
        </table></div>`;
      }

      function lapsTable(laps,segments=[]) {
        const tableLaps = chartEligibleLaps(laps);
        if (!tableLaps.length) return "";

        let lastGroup=null;
        const body=tableLaps.map((lap,index)=>{
          const group=lapGroupDisplayName(segments[index]);
          const groupRow=group&&group!==lastGroup
            ? `<tr class="lap-group-row"><td colspan="6">${escapeHtml(group)}</td></tr>`:"";
          if (group) lastGroup=group;

          return `${groupRow}<tr data-lap-number="${lap.number}">
            <td>${lap.number}</td>
            <td>${lapDistanceHtml(lap.distanceM)}</td>
            <td>${formatCardDuration(lap.durationSec)}</td>
            <td>${lapPaceHtml(lap)}</td>
            <td>${lapHrHtml(lap.averageHR)}</td>
            <td>${lapElevationHtml(lap)}</td>
          </tr>`;
        }).join("");

        return `<div class="laps-table-wrap"><table class="laps-table">
          <thead><tr><th>Vuelta</th><th>Distancia</th><th>Tiempo</th><th>Ritmo</th><th>FC</th><th>Desnivel</th></tr></thead>
          <tbody>${body}</tbody></table></div>`;
      }

      function renderActivityDetail(id) {
        const activity=state.activities.find(item=>String(item.id)===String(id));
        const summary=activity?.summary||{},detail=activity?.detail||{},running=activity?.running||{};
        if(!activity)return `${backButton()}${header("Actividad")}<section class="section"><div class="card empty">Actividad no encontrada.</div></section>`;

        const d={};
        const keys=new Set([...Object.keys(summary),...Object.keys(detail),...Object.keys(running)]);
        for(const key of keys)d[key]=firstVisible(running[key],detail[key],summary[key]);
        d.distanceM=firstVisible(summary.distanceM,detail.distanceM,running.distanceM);
        d.durationSec=firstVisible(summary.durationSec,detail.durationSec,running.durationSec);
        d.calories=firstVisible(summary.calories,detail.calories,running.calories);
        d.averageHR=firstVisible(summary.averageHR,detail.averageHR,running.averageHR);
        d.averagePower=firstVisible(summary.averagePower,detail.averagePower,running.averagePower);
        d.elevationGainM=firstVisible(summary.elevationGainM,detail.elevationGainM,running.elevationGainM);

        const lapRows=normalizeLapRows(activity?.freshLaps);
        const fitSegments=Array.isArray(activity?.fitSegments)?activity.fitSegments:[];
        const summarySegments=segmentsFromSplitSummaries(summary?.splitSummaries,lapRows);
        const typedSplitRows=structuredTypedSplitRows(activity?.garminTypedSplits);
        const rpe=rpePresentation(d.rpe),feeling=feelingPresentation(d.feeling);
        const gearPayload=Array.isArray(activity?.garminActivityGear)&&activity.garminActivityGear.length
          ? activity.garminActivityGear
          : d.equipment;
        const gear=gearInfo(gearPayload);
        const sportFamily=activitySportFamily(summary.sport,summary.title);
        const hasGps=(Array.isArray(activity?.fitMeta?.trackPoints)&&activity.fitMeta.trackPoints.length>=2)||Boolean(d.encodedPolyline);
        const vo2=activity?.activityPreciseVo2?.matched&&activity.activityPreciseVo2.value!=null?formatGarminDecimal(activity.activityPreciseVo2.value):"—";
        const activeSegments=summarySegments.length?summarySegments:fitSegments;
        const localAnalysis=localActivityAnalysis(activity,d,lapRows,activeSegments);
        const localBenefit=localActivityBenefit(activity,d);
        const garminBenefit=translateGarminBenefit(d.trainingEffectLabel);

        return `
          ${backButton()}
          ${activityDetailHeader(summary.title||"Actividad",summary.sport)}

          <section class="section">
            <div class="activity-overview-grid ${hasGps?"":"no-map"}">
              <div class="activity-context-line">
                <div class="activity-context-item">📅 ${escapeHtml(activityMetaDate(d.startTimeLocal,summary.date))}</div>
                <div class="activity-context-item">⌚️ ${escapeHtml(activityMetaTime(d.startTimeLocal))}</div>
                <div class="activity-context-item">🌡 ${escapeHtml(formatTemperature(d.averageTemperatureC))}</div>
                <div class="activity-context-item">${rpe.emoji} RPE · ${escapeHtml(rpe.text)}/10</div>
                <div class="activity-context-item">${feeling.emoji} ${escapeHtml(feeling.text)}</div>
              </div>
              ${hasGps?`<div id="activity-map" class="activity-map"></div>`:""}
            </div>
            ${activityGearSection(sportFamily,gear)}
          </section>

          ${activity.detailLoaded?"":`<div class="row-meta" style="margin-top:10px">Cargando detalle de Garmin…</div>`}

          <section class="section">
            <div class="activity-metric-grid">
              ${sportSpecificMetrics(sportFamily,d,summary,vo2)}
            </div>
          </section>

          <section class="section">
            <div class="card">
              <div class="row-title">${escapeHtml(garminBenefit)}</div>
              <div class="row-meta" style="margin-top:10px;line-height:1.5"><strong>Análisis:</strong> ${escapeHtml(localAnalysis)}</div>
              <div class="row-meta" style="margin-top:8px;line-height:1.5"><strong>Beneficio:</strong> ${escapeHtml(localBenefit)}</div>
              <div class="analysis-grid">
                <div class="analysis-chip"><div class="analysis-chip-label">Efecto aeróbico</div><div class="analysis-chip-value">${formatHundredth(d.trainingEffect)}</div></div>
                <div class="analysis-chip"><div class="analysis-chip-label">Efecto anaeróbico</div><div class="analysis-chip-value">${formatHundredth(d.anaerobicTrainingEffect)}</div></div>
                <div class="analysis-chip"><div class="analysis-chip-label">Carga</div><div class="analysis-chip-value">${formatHundredth(d.trainingLoad)}</div></div>
              </div>
            </div>
          </section>

          ${sportFamily==="running"?`
            <section class="section"><div class="card">${lapsPaceChart(lapRows)}${activity.activityFreshLoading&&lapRows.length?`<div class="row-meta" style="margin-top:8px">Actualizando Garmin…</div>`:""}</div></section>

            ${lapRows.length?`<section class="section"><div class="card">${summarySegments.length?lapsTable(lapRows,summarySegments):typedSplitRows.length?typedSplitsTable(typedSplitRows):lapsTable(lapRows,fitSegments)}</div></section>`:""}

            <section class="section">
              <div class="activity-metric-grid running-dynamics-grid">
                ${dynamicBox("Cad. media",formatCadence(d.averageCadence),"spm")}
                ${dynamicBox("Cad. máx.",formatCadence(d.maxCadence),"spm")}
                ${dynamicBox("Zancada",formatStrideLength(d.averageStrideLength),"m")}
                ${dynamicBox("Osc. vertical",d.averageVerticalOscillation!=null?Number(d.averageVerticalOscillation).toLocaleString("es-ES",{maximumFractionDigits:1}):"—","cm")}
                ${dynamicBox("Ratio vert.",d.averageVerticalRatio!=null?Number(d.averageVerticalRatio).toLocaleString("es-ES",{maximumFractionDigits:1}):"—","%")}
                ${dynamicBox("Contacto",d.averageGroundContactTime!=null?`${Math.round(Number(d.averageGroundContactTime))}`:"—","ms")}
                ${dynamicBox("Balance",d.averageGroundContactBalance!=null?Number(d.averageGroundContactBalance).toLocaleString("es-ES",{maximumFractionDigits:1}):"—","%")}
                ${dynamicBox("Pot. norm.",d.normalizedPower!=null?`${Math.round(Number(d.normalizedPower))}`:"—","W")}
              </div>
            </section>`:""}
        `;
      }

      function firstNumber(...values) {
        for (const value of values) {
          if (value === null || value === undefined || value === "") continue;
          const number = Number(value);
          if (Number.isFinite(number)) return number;
        }
        return null;
      }

      function findObject(value, predicate) {
        if (value == null) return null;
        if (Array.isArray(value)) {
          for (const item of value) {
            const found = findObject(item, predicate);
            if (found) return found;
          }
          return null;
        }
        if (typeof value !== "object") return null;
        if (predicate(value)) return value;
        for (const child of Object.values(value)) {
          if (child && typeof child === "object") {
            const found = findObject(child, predicate);
            if (found) return found;
          }
        }
        return null;
      }

      function metricValueFromHealthDay(day, id) {
        const sources = day?.sources || {};

        if (id === "readiness") {
          const rows = sources.trainingReadiness || [];
          const candidates = [];
          for (const root of rows) {
            const visit = (value) => {
              if (value == null) return;
              if (Array.isArray(value)) {
                value.forEach(visit);
                return;
              }
              if (typeof value !== "object") return;
              const score = firstNumber(value.score);
              if (
                score != null &&
                score >= 0 &&
                score <= 100 &&
                (
                  value.level != null ||
                  value.recoveryTime != null ||
                  value.acuteLoad != null ||
                  value.timestampLocal != null ||
                  value.timestamp != null
                )
              ) {
                candidates.push({
                  value: score,
                  stamp: String(value.timestampLocal || value.timestamp || "")
                });
              }
              Object.values(value).forEach((child) => {
                if (child && typeof child === "object") visit(child);
              });
            };
            visit(root);
          }
          candidates.sort((a, b) => b.stamp.localeCompare(a.stamp));
          return candidates[0]?.value ?? null;
        }

        if (id === "sleep") {
          const root = findObject(
            sources.sleep || [],
            (value) => firstNumber(
              value?.sleepScores?.overall?.value,
              value?.overallSleepScore,
              value?.sleepScore
            ) != null
          );
          return root
            ? firstNumber(
                root?.sleepScores?.overall?.value,
                root?.overallSleepScore,
                root?.sleepScore
              )
            : null;
        }

        if (id === "hrv") {
          const root = findObject(
            sources.hrv || [],
            (value) => firstNumber(
              value?.lastNightAvg,
              value?.hrvSummary?.lastNightAvg
            ) != null
          );
          return root
            ? firstNumber(
                root?.lastNightAvg,
                root?.hrvSummary?.lastNightAvg
              )
            : null;
        }

        if (id === "resting-hr") {
          const root = findObject(
            sources.dailySummaries || [],
            (value) => firstNumber(
              value?.heartRate?.restingHeartRate,
              value?.restingHeartRate
            ) != null
          );
          return root
            ? firstNumber(
                root?.heartRate?.restingHeartRate,
                root?.restingHeartRate
              )
            : null;
        }

        if (id === "stress") {
          const root = findObject(
            sources.dailySummaries || [],
            (value) => firstNumber(
              value?.stress?.averageStressLevel,
              value?.stress?.overallStressLevel,
              value?.averageStressLevel,
              value?.overallStressLevel
            ) != null
          );
          return root
            ? firstNumber(
                root?.stress?.averageStressLevel,
                root?.stress?.overallStressLevel,
                root?.averageStressLevel,
                root?.overallStressLevel
              )
            : null;
        }

        if (id === "vo2max") {
          const root = findObject(
            sources.vo2max || [],
            (value) => {
              const precise = firstNumber(value?.vo2MaxPreciseValue);
              return precise != null && precise > 10 && precise < 100;
            }
          );
          return root ? firstNumber(root.vo2MaxPreciseValue) : null;
        }

        return null;
      }

      function hrvPointFromHealthDay(day) {
        const root = findObject(
          day?.sources?.hrv || [],
          (value) => {
            const n = firstNumber(value?.lastNightAvg, value?.hrvSummary?.lastNightAvg);
            return n != null && n > 0;
          }
        );
        if (!root) return null;

        const summary = root?.hrvSummary || root;
        const value = firstNumber(summary?.lastNightAvg);
        if (value == null || value <= 0) return null;

        return {
          date: day.date,
          value,
          baselineLow: firstNumber(
            summary?.baseline?.balancedLow,
            summary?.baselineBalancedLow
          ),
          baselineHigh: firstNumber(
            summary?.baseline?.balancedUpper,
            summary?.baselineBalancedHigh
          )
        };
      }

      function sleepPointFromHealthDay(day) {
        const root=findObject(day?.sources?.sleep||[],value=>{const seconds=firstNumber(value?.sleepTimeSeconds,value?.dailySleepDTO?.sleepTimeSeconds);return seconds!=null&&seconds>0;});
        if(!root)return null;
        const dto=root?.dailySleepDTO||root;
        const durationSec=firstNumber(dto?.sleepTimeSeconds);
        if(durationSec==null||durationSec<=0)return null;
        const score=firstNumber(dto?.sleepScores?.overall?.value,dto?.overallSleepScore,dto?.sleepScore);
        return {
          date:day.date,value:durationSec/3600,durationSec,
          score:score!=null&&score>=0&&score<=100?score:null,
          deepSec:firstNumber(dto?.deepSleepSeconds),remSec:firstNumber(dto?.remSleepSeconds),lightSec:firstNumber(dto?.lightSleepSeconds),awakeSec:firstNumber(dto?.awakeSleepSeconds,dto?.awakeSeconds),
          sleepStart:dto?.sleepStartTimestampLocal||dto?.sleepStartTimestampGMT||dto?.sleepStartTimeLocal||null,
          sleepEnd:dto?.sleepEndTimestampLocal||dto?.sleepEndTimestampGMT||dto?.sleepEndTimeLocal||null
        };
      }

      function restingHrPointFromHealthDay(day) {
        const row = state.restingHeartRateHistory.find(
          (item) => item?.date === day?.date
        );

        const value = Number(row?.value);
        if (Number.isFinite(value) && value > 20 && value < 250) {
          return {
            date: day.date,
            value,
            source: "FC reposo Garmin"
          };
        }

        return null;
      }

      function metricSeries(id) {
        if (id === "volume") return runningVolumeSeries();
        if (id === "load") return evolutionLoadSeries();
        if (id === "aerobic-efficiency") return evolutionAerobicEfficiencySeries();
        if (id === "lactate") return lactateThresholdSeries();
        if (id === "body-battery") return state.healthDays.map(bodyBatteryPointFromHealthDay).filter(Boolean).sort((a,b)=>a.date.localeCompare(b.date));

        return state.healthDays
          .map((day) => {
            if (id === "sleep") return sleepPointFromHealthDay(day);
            if (id === "hrv") return hrvPointFromHealthDay(day);
            if (id === "resting-hr") return restingHrPointFromHealthDay(day);

            return {
              date: day.date,
              value: metricValueFromHealthDay(day, id)
            };
          })
          .filter((item) => {
            if (!item) return false;
            if (!/^\d{4}-\d{2}-\d{2}$/.test(String(item.date || ""))) return false;

            // Importante: null NO es 0. Evita ceros falsos en VO₂, FC, etc.
            if (item.value === null || item.value === undefined || item.value === "") {
              return false;
            }

            const number = Number(item.value);
            if (!Number.isFinite(number)) return false;
            if (id === "vo2max" && (number <= 10 || number >= 100)) return false;
            if (id === "resting-hr" && (number <= 0 || number >= 250)) return false;
            return true;
          })
          .map((item) => ({ ...item, value: Number(item.value) }))
          .sort((a, b) => a.date.localeCompare(b.date));
      }

      function rangeStartDate(range, lastDate) {
        if (!lastDate || range === "all") return null;
        const [y, m, d] = lastDate.split("-").map(Number);
        const date = new Date(Date.UTC(y, m - 1, d));

        if (range === "7d") date.setUTCDate(date.getUTCDate() - 6);
        if (range === "1m") date.setUTCMonth(date.getUTCMonth() - 1);
        if (range === "1y") date.setUTCFullYear(date.getUTCFullYear() - 1);

        return date.toISOString().slice(0, 10);
      }

      function filterMetricSeries(series, range) {
        if (!series.length || range === "all") return series;
        const lastDate =
          state.healthDays[state.healthDays.length - 1]?.date ||
          series[series.length - 1]?.date ||
          localDate(0);
        const start = rangeStartDate(range, lastDate);
        return start ? series.filter((item) => item.date >= start) : series;
      }

      function periodKey(date, mode) {
        if (mode === "month") return String(date).slice(0, 7);
        if (mode === "year") return String(date).slice(0, 4);
        return String(date);
      }

      function aggregateSeries(rows, mode, reducer = "average") {
        if (mode === "day") return rows;

        const groups = new Map();
        for (const row of rows) {
          const key = periodKey(row.date, mode);
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(row);
        }

        return [...groups.entries()].map(([key, group]) => {
          const values = group
            .map((x) => Number(x.value))
            .filter(Number.isFinite);

          if (!values.length) return null;

          const value = reducer === "sum"
            ? values.reduce((a, b) => a + b, 0)
            : values.reduce((a, b) => a + b, 0) / values.length;

          const durations = group
            .map((x) => Number(x.durationSec))
            .filter(Number.isFinite);

          const scores = group
            .map((x) => Number(x.score))
            .filter((x) => Number.isFinite(x) && x >= 0 && x <= 100);

          return {
            date: mode === "month" ? `${key}-01` : `${key}-01-01`,
            label: key,
            value,
            durationSec: durations.length
              ? durations.reduce((a, b) => a + b, 0) / durations.length
              : null,
            score: scores.length
              ? scores.reduce((a, b) => a + b, 0) / scores.length
              : null
          };
        }).filter(Boolean);
      }

      function displayRowsForMetric(id, allRows, range) {
        const filtered = filterMetricSeries(allRows, range);

        if (id === "sleep" || id === "volume") {
          const mode =
            range === "1y"
              ? "month"
              : range === "all"
                ? "year"
                : "day";

          return aggregateSeries(
            filtered,
            mode,
            id === "volume" ? "sum" : "average"
          );
        }

        return filtered;
      }

      function formatMetricChartValue(id, value) {
        if (!Number.isFinite(Number(value))) return "—";
        const number = Number(value);

        if (id === "vo2max") return `${formatGarminDecimal(number)} ml/kg/min`;
        if (id === "hrv") return `${Math.round(number)} ms`;
        if (id === "resting-hr") return `${Math.round(number)} ppm`;
        if (id === "volume") return `${number.toFixed(1).replace(".", ",")} km`;
        if (id === "load") return `${Math.round(number)} carga`;
        if (id === "aerobic-efficiency") return number.toFixed(2).replace(".", ",");
        if (id === "sleep") return `${number.toFixed(1).replace(".", ",")} h`;
        if (id === "body-battery") return `${Math.round(number)}/100`;
        return String(Math.round(number));
      }

      function formatSleepDuration(seconds) {
        const total = Math.max(0, Math.round(Number(seconds) || 0));
        const hours = Math.floor(total / 3600);
        const minutes = Math.round((total % 3600) / 60);
        if (minutes === 60) return `${hours + 1}h00m`;
        return `${hours}h${String(minutes).padStart(2, "0")}m`;
      }

      function sleepScoreColor(score) {
        const value = Number(score);
        if (!Number.isFinite(value)) return "var(--text-3)";
        if (value >= 90) return "var(--blue)";
        if (value >= 80) return "var(--green)";
        if (value >= 60) return "var(--yellow)";
        return "var(--red)";
      }

      function integerAxisScale(values, options = {}) {
        const finite = values.map(Number).filter(Number.isFinite);
        if (!finite.length) return { min: 0, max: 1 };

        let min = options.zeroMin ? 0 : Math.min(...finite);
        let max = Math.max(...finite);

        if (!options.zeroMin) {
          const pad = Math.max(1, (max - min) * 0.08);
          min -= pad;
          max += pad;
        } else {
          max *= 1.08;
        }

        min = Math.floor(min);
        max = Math.ceil(max);

        if (max <= min) max = min + 1;
        return { min, max };
      }

      function axisTickIndices(rows, range) {
        const count = rows.length;
        if (!count) return [];
        const target =
          range === "7d"
            ? Math.min(7, count)
            : range === "1m"
              ? Math.min(6, count)
              : range === "1y"
                ? Math.min(6, count)
                : Math.min(5, count);

        if (target <= 1) return [0];

        const indexes = new Set();
        for (let i = 0; i < target; i++) {
          indexes.add(Math.round((i / (target - 1)) * (count - 1)));
        }
        return [...indexes].sort((a, b) => a - b);
      }

      function axisDateLabel(item, range) {
        const label = String(item?.label || "");
        if (/^\d{4}-\d{2}$/.test(label)) {
          return `${label.slice(5, 7)}/${label.slice(2, 4)}`;
        }
        if (/^\d{4}$/.test(label)) return label;

        const date = String(item?.date || "");
        const match = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return label || date;

        if (range === "all") return `${match[2]}/${match[1].slice(2)}`;
        return `${match[3]}/${match[2]}`;
      }

      function chartSelectionHtml(id) {
        const selected=state.chartSelection;
        if(!selected||selected.metricId!==id)return "";
        if(id==="sleep"&&selected.date){
          const row=metricSeries("sleep").find(item=>item.date===selected.date||item.label===selected.date);
          if(row){
            const clock=(value)=>{if(!value)return "—";const d=new Date(value);if(Number.isNaN(d.getTime()))return String(value).slice(11,16)||"—";return d.toLocaleTimeString("es-ES",{hour:"2-digit",minute:"2-digit"});};
            const stage=(v)=>Number.isFinite(Number(v))?formatSleepDuration(v):"—";
            return `<div style="margin-top:12px;border-top:1px solid var(--divider);padding-top:12px"><div class="row-title">${escapeHtml(selected.date)}</div><div class="row-meta">${clock(row.sleepStart)}–${clock(row.sleepEnd)} · Profundo ${stage(row.deepSec)} · REM ${stage(row.remSec)} · Ligero ${stage(row.lightSec)}</div></div>`;
          }
        }
        return `<div class="row" style="margin-top:12px;border-top:1px solid var(--divider);padding-top:12px"><div><div class="row-title">${escapeHtml(selected.date||"—")}</div><div class="row-meta">${escapeHtml(selected.primary||"—")}${selected.secondary?` · ${escapeHtml(selected.secondary)}`:""}</div></div><span class="chip blue">Detalle</span></div>`;
      }

      function pointDataAttrs(id, date, primary, secondary = "") {
        return `
          data-chart-point
          data-chart-metric="${escapeHtml(id)}"
          data-chart-date="${escapeHtml(date)}"
          data-chart-primary="${escapeHtml(primary)}"
          data-chart-secondary="${escapeHtml(secondary)}"
          style="cursor:pointer"
        `;
      }

      function metricChartHtml(id, rows) {
        if (!rows.length) {
          return `<div class="empty">No hay datos históricos disponibles para este rango.</div>`;
        }

        const width = 720;
        const height = 330;
        const left = 52;
        const right = 18;
        const top = 48;
        const bottom = 52;
        const plotW = width - left - right;
        const plotH = height - top - bottom;
        const isBars = id === "sleep" || id === "volume";

        const values = rows
          .map((item) => Number(item.value))
          .filter(Number.isFinite);

        const scale = integerAxisScale(values, { zeroMin: isBars });

        const x = (index) =>
          left + (
            rows.length <= 1
              ? plotW / 2
              : (index / (rows.length - 1)) * plotW
          );

        const y = (value) =>
          top + (
            (scale.max - Number(value)) /
            (scale.max - scale.min || 1)
          ) * plotH;

        const grid = [0, .25, .5, .75, 1].map((ratio) => {
          const yy = top + ratio * plotH;
          const label = Math.round(
            scale.max - ratio * (scale.max - scale.min)
          );
          return `
            <line x1="${left}" y1="${yy}" x2="${width - right}" y2="${yy}"
              stroke="var(--divider)" stroke-width="1"/>
            <text x="${left - 9}" y="${yy + 4}" text-anchor="end"
              fill="var(--text-3)" font-size="11">${label}</text>
          `;
        }).join("");

        const xTicks = axisTickIndices(rows, state.metricRange)
          .map((index) => {
            const xx = x(index);
            return `
              <text x="${xx}" y="${height - 16}" text-anchor="middle"
                fill="var(--text-3)" font-size="10">
                ${escapeHtml(axisDateLabel(rows[index], state.metricRange))}
              </text>
            `;
          }).join("");

        let marks = "";

        if (isBars) {
          const slot = plotW / Math.max(rows.length, 1);
          const barW = Math.max(8, Math.min(46, slot * .9));

          marks = rows.map((item, index) => {
            const xx = x(index) - barW / 2;
            const yy = y(item.value);
            const hh = top + plotH - yy;

            const fill =
              id === "sleep"
                ? sleepScoreColor(item.score)
                : "var(--blue)";

            const primary =
              id === "sleep"
                ? formatSleepDuration(
                    Number.isFinite(Number(item.durationSec))
                      ? Number(item.durationSec)
                      : Number(item.value) * 3600
                  )
                : formatMetricChartValue(id, item.value);

            const secondary =
              id === "sleep" && Number.isFinite(Number(item.score))
                ? `Puntuación ${Math.round(Number(item.score))}`
                : "";

            const labelY = Math.max(13, yy - 7);
            const rotate = false;
            const labelSize = rows.length <= 7 ? 15 : rows.length <= 31 ? 13 : 11;

            return `
              <rect x="${xx.toFixed(2)}" y="${yy.toFixed(2)}"
                width="${barW.toFixed(2)}"
                height="${Math.max(1, hh).toFixed(2)}"
                rx="${Math.min(3, barW / 2).toFixed(2)}"
                fill="${fill}"
                ${pointDataAttrs(
                  id,
                  item.label || item.date,
                  primary,
                  secondary
                )}>
                <title>${escapeHtml(item.label || item.date)} · ${escapeHtml(primary)}${secondary ? ` · ${escapeHtml(secondary)}` : ""}</title>
              </rect>
              <text x="${x(index).toFixed(2)}" y="${labelY.toFixed(2)}"
                text-anchor="${rotate ? "start" : "middle"}"
                fill="var(--text-2)"
                font-size="${labelSize}"
                ${rotate ? `transform="rotate(-62 ${x(index).toFixed(2)} ${labelY.toFixed(2)})"` : ""}>
                ${escapeHtml(primary)}
              </text>
            `;
          }).join("");
        } else {
          let band = "";

          if (id === "hrv") {
            const bandRows = rows
              .map((item, index) => ({ item, index }))
              .filter(({ item }) =>
                Number.isFinite(Number(item.baselineLow)) &&
                Number.isFinite(Number(item.baselineHigh))
              );

            if (bandRows.length >= 2) {
              const topPoints = bandRows.map(({ item, index }) =>
                `${x(index).toFixed(2)},${y(item.baselineHigh).toFixed(2)}`
              );

              const bottomPoints = [...bandRows].reverse().map(({ item, index }) =>
                `${x(index).toFixed(2)},${y(item.baselineLow).toFixed(2)}`
              );

              band = `
                <polygon points="${[...topPoints, ...bottomPoints].join(" ")}"
                  fill="var(--green)" fill-opacity=".13" stroke="none"/>
              `;
            }
          }

          const points = rows
            .map((item, index) =>
              `${x(index).toFixed(2)},${y(item.value).toFixed(2)}`
            )
            .join(" ");

          const circles = rows.map((item, index) => {
            const primary = formatMetricChartValue(id, item.value);
            const secondary =
              id === "hrv" &&
              Number.isFinite(Number(item.baselineLow)) &&
              Number.isFinite(Number(item.baselineHigh))
                ? `Referencia ${Math.round(item.baselineLow)}–${Math.round(item.baselineHigh)} ms`
                : item.source || "";

            return `
              <circle cx="${x(index).toFixed(2)}"
                cy="${y(item.value).toFixed(2)}"
                r="${rows.length > 500 ? 2.1 : rows.length > 120 ? 2.5 : 3.5}"
                fill="var(--blue)"
                ${pointDataAttrs(id, item.date, primary, secondary)}>
                <title>${escapeHtml(item.date)} · ${escapeHtml(primary)}${secondary ? ` · ${escapeHtml(secondary)}` : ""}</title>
              </circle>
            `;
          }).join("");

          const labelIndexes=(()=>{
            if(rows.length<=1)return new Set([0]);
            if(state.metricRange==="7d"||state.metricRange==="1m")return new Set(rows.map((_,index)=>index));
            const indexes=new Set(axisTickIndices(rows,state.metricRange));
            let minIndex=0,maxIndex=0;
            rows.forEach((item,index)=>{
              if(Number(item.value)<Number(rows[minIndex].value))minIndex=index;
              if(Number(item.value)>Number(rows[maxIndex].value))maxIndex=index;
            });
            indexes.add(0);indexes.add(rows.length-1);indexes.add(minIndex);indexes.add(maxIndex);
            return indexes;
          })();
          const valueLabels=rows.map((item,index)=>{
            if(!labelIndexes.has(index))return "";
            const primary=formatMetricChartValue(id,item.value)
              .replace(/\s+(ms|ppm)$/i,"")
              .replace(/\/100$/i,"");
            return `<text x="${x(index).toFixed(2)}" y="${Math.max(14,y(item.value)-10).toFixed(2)}" text-anchor="middle" fill="var(--text-2)" font-size="${rows.length<=7?16:rows.length<=31?12:10}" font-weight="700">${escapeHtml(primary)}</text>`;
          }).join("");

          marks = `
            ${band}
            <polyline points="${points}" fill="none"
              stroke="var(--blue)" stroke-width="2.3"
              stroke-linecap="round" stroke-linejoin="round"/>
            ${circles}
            ${valueLabels}
          `;
        }

        return `
          <div class="chart-wrap">
            <svg viewBox="0 0 ${width} ${height}"
              style="min-width:${isBars?Math.max(720,rows.length*(state.metricRange==="7d"?86:state.metricRange==="1m"?40:22)):720}px"
              role="img" aria-label="Histórico de la métrica">
              ${grid}
              ${marks}
              ${xTicks}
            </svg>
          </div>
          ${id === "hrv" ? `
            <div class="chart-legend">
              <span><span class="legend-dot" style="background:var(--blue)"></span>VFC nocturna</span>
              <span><span class="legend-dot" style="background:var(--green)"></span>Rango Garmin histórico</span>
            </div>
          ` : ""}
        `;
      }

      function lactateThresholdSeries() {
        const byDate = new Map();
        let current = null;

        for (const chunk of state.lactateThreshold) {
          const rows = Array.isArray(chunk?.payload?.rows)
            ? chunk.payload.rows
            : [];

          for (const row of rows) {
            const date = String(row?.date || "");
            const paceSecKm = Number(row?.paceSecKm);
            const heartRate = Number(row?.heartRate);

            if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;

            if (
              !Number.isFinite(paceSecKm) &&
              !(Number.isFinite(heartRate) && heartRate > 30 && heartRate < 250)
            ) {
              continue;
            }

            byDate.set(date, {
              date,
              paceSecKm:
                Number.isFinite(paceSecKm)
                  ? paceSecKm
                  : null,
              heartRate:
                Number.isFinite(heartRate) &&
                heartRate > 30 &&
                heartRate < 250
                  ? heartRate
                  : null
            });
          }

          const candidate = chunk?.payload?.current;
          if (candidate && typeof candidate === "object") {
            const paceSecKm = Number(candidate.paceSecKm);
            const heartRate = Number(candidate.heartRate);
            const date = String(
              candidate.date ||
              chunk?.endDate ||
              ""
            );

            if (
              /^\d{4}-\d{2}-\d{2}$/.test(date) &&
              (
                Number.isFinite(paceSecKm) ||
                (Number.isFinite(heartRate) && heartRate > 30 && heartRate < 250)
              )
            ) {
              current = {
                date,
                paceSecKm:
                  Number.isFinite(paceSecKm)
                    ? paceSecKm
                    : null,
                heartRate:
                  Number.isFinite(heartRate) &&
                  heartRate > 30 &&
                  heartRate < 250
                    ? heartRate
                    : null
              };
            }
          }
        }

        // El valor actual de Garmin es autoritativo para su fecha.
        if (current) {
          const previous = byDate.get(current.date) || {
            date: current.date,
            paceSecKm: null,
            heartRate: null
          };

          byDate.set(current.date, {
            date: current.date,
            paceSecKm:
              Number.isFinite(current.paceSecKm)
                ? current.paceSecKm
                : previous.paceSecKm,
            heartRate:
              Number.isFinite(current.heartRate)
                ? current.heartRate
                : previous.heartRate
          });
        }

        return [...byDate.values()].sort(
          (a, b) => a.date.localeCompare(b.date)
        );
      }

      function runningVolumeSeries() {
        const byDate = new Map();

        for (const activity of state.activities) {
          if (!isRunningActivity(activity)) continue;

          const date = String(activity?.summary?.date || "");
          const km = (Number(activity?.summary?.distanceM) || 0) / 1000;

          if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || km <= 0) continue;
          byDate.set(date, (byDate.get(date) || 0) + km);
        }

        return [...byDate.entries()]
          .map(([date, value]) => ({ date, value }))
          .sort((a, b) => a.date.localeCompare(b.date));
      }

      function formatPace(secondsPerKm) {
        const seconds = Number(secondsPerKm);
        if (!Number.isFinite(seconds) || seconds <= 0) return "—";

        const total = Math.round(seconds);
        const min = Math.floor(total / 60);
        const sec = String(total % 60).padStart(2, "0");
        return `${min}:${sec}/km`;
      }


      function lactateRowsForRange(allRows, range) {
        const filtered = filterMetricSeries(allRows, range);
        if (!allRows.length || range === "all") {
          return {
            rows: filtered,
            inheritedOnly: false,
            inheritedDate: null
          };
        }

        const lastDate =
          state.healthDays[state.healthDays.length - 1]?.date ||
          allRows[allRows.length - 1]?.date ||
          localDate(0);

        const start = rangeStartDate(range, lastDate);

        if (!start) {
          return {
            rows: filtered,
            inheritedOnly: false,
            inheritedDate: null
          };
        }

        const previous = [...allRows]
          .reverse()
          .find((item) => item.date < start);

        if (!previous) {
          return {
            rows: filtered,
            inheritedOnly: false,
            inheritedDate: null
          };
        }

        // No real update inside range: show a horizontal reference built from
        // the last known value at both ends of the selected window.
        if (!filtered.length) {
          const end = lastDate;
          return {
            rows: [
              {
                ...previous,
                date: start,
                inherited: true,
                inheritedSourceDate: previous.date
              },
              {
                ...previous,
                date: end,
                inherited: true,
                inheritedSourceDate: previous.date
              }
            ],
            inheritedOnly: true,
            inheritedDate: previous.date
          };
        }

        // Real updates exist: prepend the previous known value as context so
        // the first update connects from the existing threshold.
        return {
          rows: [
            {
              ...previous,
              date: start,
              inherited: true,
              inheritedSourceDate: previous.date
            },
            ...filtered
          ],
          inheritedOnly: false,
          inheritedDate: previous.date
        };
      }

      function lactateChartHtml(rows) {
        if (!rows.length) {
          return `<div class="empty">No hay histórico Garmin de umbral de lactato disponible.</div>`;
        }

        const width = 720;
        const height = 330;
        const left = 58;
        const right = 58;
        const top = 24;
        const bottom = 52;
        const plotW = width - left - right;
        const plotH = height - top - bottom;

        const x = (index) =>
          left + (
            rows.length <= 1
              ? plotW / 2
              : (index / (rows.length - 1)) * plotW
          );

        const paceValues = rows
          .map((item) => Number(item.paceSecKm))
          .filter(Number.isFinite);

        const hrValues = rows
          .map((item) => Number(item.heartRate))
          .filter(Number.isFinite);

        const paceScale = integerAxisScale(paceValues);
        const hrScale = integerAxisScale(hrValues);

        const yPace = (value) =>
          top + (
            (Number(value) - paceScale.min) /
            (paceScale.max - paceScale.min || 1)
          ) * plotH;

        const yHr = (value) =>
          top + (
            (hrScale.max - Number(value)) /
            (hrScale.max - hrScale.min || 1)
          ) * plotH;

        const grid = [0, .25, .5, .75, 1].map((ratio) => {
          const yy = top + ratio * plotH;
          const pace = Math.round(
            paceScale.min + ratio * (paceScale.max - paceScale.min)
          );
          const hr = Math.round(
            hrScale.max - ratio * (hrScale.max - hrScale.min)
          );

          return `
            <line x1="${left}" y1="${yy}" x2="${width - right}" y2="${yy}"
              stroke="var(--divider)" stroke-width="1"/>
            <text x="${left - 8}" y="${yy + 4}" text-anchor="end"
              fill="var(--cyan)" font-size="10">${escapeHtml(formatPace(pace).replace("/km", ""))}</text>
            <text x="${width - right + 8}" y="${yy + 4}" text-anchor="start"
              fill="var(--orange)" font-size="10">${hr}</text>
          `;
        }).join("");

        const paceRows = rows
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => Number.isFinite(item.paceSecKm));

        const hrRows = rows
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => Number.isFinite(item.heartRate));

        const pacePoints = paceRows
          .map(({ item, index }) =>
            `${x(index).toFixed(2)},${yPace(item.paceSecKm).toFixed(2)}`
          )
          .join(" ");

        const hrPoints = hrRows
          .map(({ item, index }) =>
            `${x(index).toFixed(2)},${yHr(item.heartRate).toFixed(2)}`
          )
          .join(" ");

        const pointCircles = rows.map((item, index) => {
          const paceText = Number.isFinite(item.paceSecKm)
            ? formatPace(item.paceSecKm)
            : "Ritmo —";

          const hrText = Number.isFinite(item.heartRate)
            ? `${Math.round(item.heartRate)} ppm`
            : "FC —";

          const attrs = pointDataAttrs(
            "lactate",
            item.date,
            paceText,
            hrText
          );

          return `
            ${Number.isFinite(item.paceSecKm) ? `
              <circle cx="${x(index)}" cy="${yPace(item.paceSecKm)}"
                r="${item.inherited ? 2.6 : 3.5}"
                fill="var(--cyan)"
                fill-opacity="${item.inherited ? ".45" : "1"}"
                ${attrs}>
                <title>${escapeHtml(item.inherited ? `Último valor conocido (${item.inheritedSourceDate || "—"})` : item.date)} · ${escapeHtml(paceText)} · ${escapeHtml(hrText)}</title>
              </circle>
            ` : ""}
            ${Number.isFinite(item.heartRate) ? `
              <circle cx="${x(index)}" cy="${yHr(item.heartRate)}"
                r="${item.inherited ? 2.6 : 3.5}"
                fill="var(--orange)"
                fill-opacity="${item.inherited ? ".45" : "1"}"
                ${attrs}>
                <title>${escapeHtml(item.inherited ? `Último valor conocido (${item.inheritedSourceDate || "—"})` : item.date)} · ${escapeHtml(paceText)} · ${escapeHtml(hrText)}</title>
              </circle>
            ` : ""}
          `;
        }).join("");

        const xTicks = axisTickIndices(rows, state.metricRange)
          .map((index) => `
            <text x="${x(index)}" y="${height - 16}" text-anchor="middle"
              fill="var(--text-3)" font-size="10">
              ${escapeHtml(axisDateLabel(rows[index], state.metricRange))}
            </text>
          `).join("");

        return `
          <div class="chart-wrap">
            <svg viewBox="0 0 ${width} ${height}" role="img"
              aria-label="Umbral de lactato">
              ${grid}
              ${pacePoints ? `
                <polyline points="${pacePoints}" fill="none"
                  stroke="var(--cyan)" stroke-width="2.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
              ` : ""}
              ${hrPoints ? `
                <polyline points="${hrPoints}" fill="none"
                  stroke="var(--orange)" stroke-width="2.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
              ` : ""}
              ${pointCircles}
              ${xTicks}
            </svg>
          </div>

          <div class="chart-legend">
            <span><span class="legend-dot" style="background:var(--cyan)"></span>Ritmo</span>
            <span><span class="legend-dot" style="background:var(--orange)"></span>FC</span>
            ${rows.some((item) => item.inherited) ? `
              <span>· Último valor conocido usado como referencia</span>
            ` : ""}
          </div>
        `;
      }

      function renderMetricDetail(id) {
        const definitions={
          "sleep":{name:"💤 Sueño",unit:"duración"},
          "hrv":{name:"🫀 VFC",unit:"ms"},
          "resting-hr":{name:"❤️ FC reposo",unit:"ppm"},
          "vo2max":{name:"VO₂ máx.",unit:"ml/kg/min"},
          "lactate":{name:"Umbral de lactato",unit:"ritmo + FC"},
          "volume":{name:"Volumen",unit:"km de carrera"},
          "load":{name:"Carga",unit:"carga Garmin"},
          "aerobic-efficiency":{name:"Eficiencia aeróbica",unit:"m/min/ppm"}
        };
        const definition=definitions[id]||{name:"Métrica",unit:""};
        const isBody=id==="body-battery";
        const allRows=metricSeries(id);
        const lactateRange=id==="lactate"?lactateRowsForRange(allRows,state.metricRange):null;
        const rows=isBody?(allRows.length?[allRows[allRows.length-1]]:[]):id==="lactate"?lactateRange.rows:displayRowsForMetric(id,allRows,state.metricRange);
        const latest=allRows[allRows.length-1]||null;
        const ranges=[["7d","7 días"],["1m","1 mes"],["1y","1 año"],["all","Todo"]];
        let latestValue="—";
        if(id==="sleep"&&latest)latestValue=formatSleepDuration(latest.durationSec);
        else if(id==="lactate"&&latest)latestValue=latest.paceSecKm?formatPace(latest.paceSecKm):`${Math.round(latest.heartRate)} ppm`;
        else if(latest)latestValue=formatMetricChartValue(id,latest.value);

        const bodyChart=()=>{
          if(!latest)return `<div class="empty">No hay Body Battery disponible hoy.</div>`;
          const low=Number(latest.low),high=Number(latest.high),current=Number(latest.value);
          const rawSeries=Array.isArray(latest.series)?latest.series.map(Number).filter(v=>Number.isFinite(v)&&v>=0&&v<=100):[];
          const points=rawSeries.length>1?rawSeries:[low,current,high].filter(Number.isFinite);
          const sampled=points.length>180?points.filter((_,i)=>i===0||i===points.length-1||i%Math.ceil(points.length/180)===0):points;
          const xs=sampled.map((_,i)=>60+i*(610/Math.max(1,sampled.length-1)));
          const y=v=>260-(Math.max(0,Math.min(100,v))/100)*210;
          const labelIndexes=new Set(sampled.length?[0,Math.floor(sampled.length/2),sampled.length-1]:[]);
          return `<div class="chart-wrap"><svg viewBox="0 0 720 300" role="img" aria-label="Body Battery de hoy"><line x1="60" y1="260" x2="670" y2="260" stroke="var(--divider)"/><line x1="60" y1="155" x2="670" y2="155" stroke="var(--divider)"/><line x1="60" y1="50" x2="670" y2="50" stroke="var(--divider)"/><polyline points="${sampled.map((v,i)=>`${xs[i]},${y(v)}`).join(" ")}" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${sampled.map((v,i)=>labelIndexes.has(i)?`<circle cx="${xs[i]}" cy="${y(v)}" r="4" fill="var(--blue)"/><text x="${xs[i]}" y="${Math.max(18,y(v)-10)}" text-anchor="middle" fill="var(--text-2)" font-size="11">${Math.round(v)}</text>`:"").join("")}</svg></div><div class="body-battery-summary"><div><strong>${Number.isFinite(high)?Math.round(high):"—"}</strong><span>Máximo</span></div><div><strong>${Number.isFinite(Number(latest.charged))?`+${Math.round(latest.charged)}`:"—"}</strong><span>Cargado</span></div><div><strong>${Number.isFinite(Number(latest.drained))?`-${Math.round(latest.drained)}`:"—"}</strong><span>Consumido</span></div></div>`;
        };

        return `${backButton()}${header(definition.name)}
          ${!isBody?`<section class="section"><div class="card"><div class="metric-range-grid">${ranges.map(([key,label])=>`<button class="metric-range-button ${state.metricRange===key?"active":""}" data-metric-range="${key}">${label}</button>`).join("")}</div></div></section>`:""}
          <section class="section"><div class="card">${isBody?bodyChart():id==="lactate"?lactateChartHtml(rows):metricChartHtml(id,rows)}${isBody?"":chartSelectionHtml(id)}</div></section>`;
      }

          const minSize = 9;

          el.style.fontSize = `${size}px`;

          while (
            size > minSize &&
            el.scrollWidth > el.clientWidth

            el.style.fontSize = `${size}px`;
          }
        });

      function fitActivityDetailCommonText() {
        const context=document.querySelector(".activity-context-line");
        if(context){

          while(size>minSize&&context.scrollWidth>context.clientWidth){size-=0.25;context.style.fontSize=`${size}px`;}
        }

        const fitGroup=(nodes,startSize,minSize)=>{
          if(!nodes.length)return;
          let size=startSize;
          const apply=()=>nodes.forEach(el=>el.style.fontSize=`${size}px`);
          apply();
          while(size>minSize&&nodes.some(el=>el.scrollWidth>el.clientWidth)){size-=0.25;apply();}

        document.querySelectorAll(".activity-metric-grid").forEach(grid=>{
          fitGroup([...grid.querySelectorAll(".activity-metric-label")],13.5,8.2);

      function fitPlanMetricGroups() {
        const fit=(nodes,start=25,min=11.5)=>{

          if(!rows.length)return;

      function bindChartPinchZoom() {
        document.querySelectorAll(".chart-wrap svg,.laps-chart-wrap svg").forEach(svg=>{
          if(svg.dataset.pinchBound)return;svg.dataset.pinchBound="1";
          let startDistance=0,startScale=1,scale=1;
          const distance=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
          svg.addEventListener("touchstart",e=>{if(e.touches.length===2){startDistance=distance(e.touches);startScale=scale;}},{passive:true});
          svg.addEventListener("touchmove",e=>{if(e.touches.length!==2||!startDistance)return;e.preventDefault();scale=Math.max(1,Math.min(6,startScale*distance(e.touches)/startDistance));svg.style.transform=`scale(${scale})`;},{passive:false});
          svg.addEventListener("touchend",e=>{if(e.touches.length<2)startDistance=0;},{passive:true});
          svg.addEventListener("dblclick",()=>{scale=1;svg.style.transform="scale(1)";});
        });
      }
