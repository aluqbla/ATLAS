      const WeeklyPlacementPriority = Object.freeze([
        "race",
        "long_run",
        "primary_quality",
        "secondary_quality",
        "strength",
        "easy_aerobic_recovery",
        "rest"
      ]);

      const PreferredRunningRoutine = Object.freeze({
        3: Object.freeze(["wed", "fri", "sun"]),
        4: Object.freeze(["mon", "wed", "fri", "sun"]),
        5: Object.freeze(["mon", "tue", "wed", "fri", "sun"])
      });

      const StrengthDayPreference = Object.freeze([
        "thu",
        "tue"
      ]);

      const WeekdayIndex = Object.freeze({
        mon: 0,
        tue: 1,
        wed: 2,
        thu: 3,
        fri: 4,
        sat: 5,
        sun: 6
      });

      function weekdayDistance(a, b) {
        const ia = WeekdayIndex[a];
        const ib = WeekdayIndex[b];

        if (
          !Number.isInteger(ia) ||
          !Number.isInteger(ib)
        ) {
          return null;
        }

        return Math.abs(ia - ib);
      }

      function preferredRunDays(
        runDays,
        availableDays = []
      ) {
        const count = Number(runDays);
        const preferred =
          PreferredRunningRoutine[count];

        if (!preferred) {
          return Object.freeze({
            days: Object.freeze([]),
            complete: false,
            dependency:
              "UNSUPPORTED_FREQUENCY_FOR_PREFERRED_ROUTINE"
          });
        }

        const available =
          new Set(
            Array.isArray(availableDays)
              ? availableDays
              : []
          );

        const direct =
          preferred.filter((day) =>
            available.has(day)
          );

        if (direct.length === count) {
          return Object.freeze({
            days: Object.freeze(direct),
            complete: true,
            usedFallback: false
          });
        }

        const remaining = Weekday
          .filter((day) =>
            available.has(day) &&
            !direct.includes(day)
          )
          .sort((a, b) => {
            const aSaturday =
              a === "sat" ? 1 : 0;
            const bSaturday =
              b === "sat" ? 1 : 0;

            if (aSaturday !== bSaturday) {
              return aSaturday - bSaturday;
            }

            return (
              WeekdayIndex[a] -
              WeekdayIndex[b]
            );
          });

        const filled = [
          ...direct,
          ...remaining.slice(
            0,
            Math.max(0, count - direct.length)
          )
        ].sort((a, b) =>
          WeekdayIndex[a] -
          WeekdayIndex[b]
        );

        return Object.freeze({
          days: Object.freeze(filled),
          complete:
            filled.length === count,
          usedFallback: true
        });
      }

      function chooseLongRunDay(runDays) {
        const days = new Set(runDays || []);

        if (days.has("sun")) return "sun";
        if (days.has("sat")) return "sat";

        return null;
      }

      function chooseStrengthDay(
        availableDays,
        occupiedDays = []
      ) {
        const available =
          new Set(availableDays || []);
        const occupied =
          new Set(occupiedDays || []);

        for (
          const day
          of StrengthDayPreference
        ) {
          if (
            available.has(day) &&
            !occupied.has(day)
          ) {
            return day;
          }
        }

        return null;
      }

      function hardStimulusSeparationOk(
        hardDays,
        previousWeekHardDays = []
      ) {
        const current = [...new Set(hardDays || [])]
          .filter((day) =>
            day in WeekdayIndex
          )
          .sort((a, b) =>
            WeekdayIndex[a] -
            WeekdayIndex[b]
          );

        const violations = [];

        for (let i = 1; i < current.length; i++) {
          const gap =
            weekdayDistance(
              current[i - 1],
              current[i]
            );

          if (gap != null && gap < 2) {
            violations.push(
              Object.freeze({
                type: "WITHIN_WEEK",
                from: current[i - 1],
                to: current[i],
                dayGap: gap
              })
            );
          }
        }

        const previous =
          [...new Set(previousWeekHardDays || [])]
            .filter((day) =>
              day in WeekdayIndex
            );

        for (const prev of previous) {
          for (const cur of current) {
            const crossGap =
              (7 - WeekdayIndex[prev]) +
              WeekdayIndex[cur];

            if (crossGap < 2) {
              violations.push(
                Object.freeze({
                  type: "CROSS_WEEK",
                  from: prev,
                  to: cur,
                  dayGap: crossGap
                })
              );
            }
          }
        }

        return Object.freeze({
          ok: violations.length === 0,
          violations:
            Object.freeze(violations)
        });
      }

      function buildWeeklySkeleton({
        availableDays = [],
        desiredRunDays = null,
        raceDay = null,
        includeStrength = true,
        previousWeekHardDays = [],
        doublesPreference = "avoid"
      } = {}) {
        const available = Object.freeze(
          [...new Set(
            (availableDays || [])
              .filter((day) =>
                Weekday.includes(day)
              )
          )]
        );

        const raceWeek =
          raceDay != null;

        const requestedRunDays =
          raceWeek
            ? Math.min(
                Number(desiredRunDays) || 3,
                3
              )
            : Number(desiredRunDays);

        const runRoutine =
          preferredRunDays(
            requestedRunDays,
            available
          );

        const runDays =
          [...runRoutine.days];

        if (
          raceDay &&
          available.includes(raceDay) &&
          !runDays.includes(raceDay)
        ) {
          if (
            runDays.length >=
            requestedRunDays
          ) {
            runDays.pop();
          }
          runDays.push(raceDay);
          runDays.sort((a, b) =>
            WeekdayIndex[a] -
            WeekdayIndex[b]
          );
        }

        const longRunDay =
          raceWeek
            ? null
            : chooseLongRunDay(runDays);

        const roles = {};

        for (const day of Weekday) {
          roles[day] = "rest";
        }

        for (const day of runDays) {
          roles[day] =
            day === longRunDay
              ? "long_run"
              : "easy_aerobic_recovery";
        }

        if (raceDay) {
          roles[raceDay] = "race";
        }

        const qualityCandidates =
          runDays.filter((day) =>
            day !== longRunDay &&
            day !== raceDay
          );

        let primaryQualityDay = null;

        for (const day of qualityCandidates) {
          const proposedHardDays = [
            day,
            ...(raceDay ? [raceDay] : []),
            ...(longRunDay ? [longRunDay] : [])
          ];

          if (
            hardStimulusSeparationOk(
              proposedHardDays,
              previousWeekHardDays
            ).ok
          ) {
            primaryQualityDay = day;
            break;
          }
        }

        if (primaryQualityDay) {
          roles[primaryQualityDay] =
            "primary_quality";
        }

        const occupied =
          Object.entries(roles)
            .filter(([, role]) =>
              role !== "rest"
            )
            .map(([day]) => day);

        const strengthDay =
          includeStrength
            ? chooseStrengthDay(
                available,
                occupied
              )
            : null;

        if (strengthDay) {
          roles[strengthDay] = "strength";
        }

        const hardDays = Object.entries(roles)
          .filter(([, role]) =>
            [
              "race",
              "long_run",
              "primary_quality",
              "secondary_quality"
            ].includes(role)
          )
          .map(([day]) => day);

        const separation =
          hardStimulusSeparationOk(
            hardDays,
            previousWeekHardDays
          );

        return Object.freeze({
          availableDays: available,
          desiredRunDays:
            Number.isFinite(requestedRunDays)
              ? requestedRunDays
              : null,
          raceWeek,
          raceDay,
          runDays: Object.freeze(runDays),
          longRunDay,
          primaryQualityDay,
          secondaryQualityDay: null,
          strengthDay,
          saturdayProtected:
            roles.sat === "rest",
          roles: Object.freeze(roles),
          hardDays:
            Object.freeze(hardDays),
          hardSeparation: separation,
          doubles: Object.freeze({
            preference:
              DoublesPreference.includes(
                doublesPreference
              )
                ? doublesPreference
                : null,
            used: false,
            allowed:
              doublesPreference !== "avoid"
          }),
          complete:
            runRoutine.complete &&
            separation.ok,
          dependencies: Object.freeze({
            desiredRunDays:
              Number.isFinite(requestedRunDays)
                ? "available"
                : "pending",
            secondaryQualityPlacement:
              "pending_prescription_core",
            doublesNeedAssessment:
              doublesPreference === "avoid"
                ? "not_needed"
                : "pending"
          })
        });
      }

          });
        }

        const requested =
          DoseLevel.includes(requestedDose)
            ? requestedDose
            : "MEDIUM";

        if (requested !== "HIGH") {
          return Object.freeze({
            dose: requested,
            reason: "REQUEST_ACCEPTED"
          });
        }

        if (
          baseLevel !== "HIGH" ||
          Number(existingHighCount) >= 1 ||
          specificProgressAdvanced !== true
        ) {
          return Object.freeze({
            dose: "MEDIUM",
            reason: "HIGH_NOT_ALLOWED"
          });
        }

        return Object.freeze({
          dose: "HIGH",
          reason: "HIGH_ALLOWED"
        });
      }

      function prescriptionProfile(
        family,
        dose
      ) {
        const profile =
          PrescriptionProfiles[family];

        if (!profile) return null;

        const selectedDose =
          DoseLevel.includes(dose)
            ? dose
            : null;

        if (!selectedDose) return null;

        return profile[selectedDose] || null;
      }

      function qualitySessionStructure({
        family,
        dose,
        taper = false
      } = {}) {
        const work =
          prescriptionProfile(
            family,
            dose
          );

        if (!work) return null;

        return Object.freeze({
          warmup: Object.freeze({
            type: "WU",
            distanceM:
              taper ? 1000 : null,
            proportional:
              taper ? false : true
          }),
          work: Object.freeze({
            type: "work",
            family,
            dose,
            prescription: work
          }),
          cooldown: Object.freeze({
            type: "CD",
            distanceM:
              taper ? 1000 : null,
            proportional:
              taper ? false : true
          })
        });
      }

      function specificGoalWeight({
        phase,
        phaseProgress = 0,
        goalAssessmentStatus = null
      } = {}) {
        const progress =
          Math.max(
            0,
            Math.min(1, Number(phaseProgress) || 0)
          );

        const limited =
          goalAssessmentStatus ===
            "NOT_SUPPORTED_CURRENTLY" ||
          goalAssessmentStatus ===
            "PREPARATION_INSUFFICIENT";

        if (phase === "development") {
          if (limited) return 0.20;
          return 0.20 + 0.30 * progress;
        }

        if (phase === "specific") {
          if (limited) return 0.45;
          return 0.50 + 0.50 * progress;
        }

        if (phase === "taper") {
          return 0.95 + 0.05 * progress;
        }

        if (phase === "race") {
          return 1;
        }

        return 0;
      }

      function interpolateSpecificPace({
        currentPaceSecKm,
        targetPaceSecKm,
        goalWeight
      } = {}) {
        const current =
          Number(currentPaceSecKm);
        const target =
          Number(targetPaceSecKm);
        const weight =
          Number(goalWeight);

        if (
          !Number.isFinite(current) ||
          !Number.isFinite(target) ||
          !Number.isFinite(weight) ||
          current <= 0 ||
          target <= 0
        ) {
          return null;
        }

        const bounded =
          Math.max(0, Math.min(1, weight));

        return (
          current * (1 - bounded) +
          target * bounded
        );
      }

      function buildPrescriptionCore({
        family = null,
        requestedDose = "MEDIUM",
        weekType = null,
        baseLevel = null,
        existingHighCount = 0,

        const resolved =
          resolveDoseLevel({

            existingHighCount,
            specificProgressAdvanced
          });

        const profile =
          prescriptionProfile(
            family,
            resolved.dose
          );

        if (!profile) {
          return Object.freeze({
            available: false,
            family,
            dose: resolved.dose,
            reason: "UNSUPPORTED_FAMILY"
          });
        }

        return Object.freeze({
          available: true,
          family,
          dose: resolved.dose,
          doseReason: resolved.reason,
          profile,
          structure:
            qualitySessionStructure({
              family,
              dose: resolved.dose,
              taper
            }),
          constraints: Object.freeze({
            maxHighPerWeek: 1,
            forcedLowWeek:
              forcedLowDoseWeek(weekType)
          })
        });
      }

          Object.freeze({

          Object.freeze({

          Object.freeze({

              ContinuousRunMinimumM
                .recovery === 5000 &&

                .easy === 5000 &&
              ContinuousRunMinimumM
                .aerobic === 6000 &&

                .raceWeekRecovery === 4000
          })
        ]);

        return Object.freeze({
          passed:
            results.every(
              (result) => result.pass
            ),
          results
        });
      }


      const StrengthLevel = Object.freeze([

      const CanonicalStrengthExercises = Object.freeze([

      function createStrengthExerciseContract(

      function canonicalStrengthLibrary() {

      function rotateStrengthVariant(
        previousVariant = null
      ) {
        return previousVariant === "A"
          ? "B"
          : "A";
      }

      function strengthSessionsForWeek({
        phase = null,
        availableDaysCount = 0,
        targetRunDays = 0,
        strengthHistoryWeeks = 0,
        broadAvailability = false,
        initialPartialWeek = false,
        raceWeek = false,
        taperWeekIndex = null
      } = {}) {
        const available =
          Number(availableDaysCount) || 0;
        const runDays =
          Number(targetRunDays) || 0;
        const history =
          Number(strengthHistoryWeeks) || 0;

        if (raceWeek) {
          return Object.freeze({
            count: 0,
            levels: Object.freeze([]),
            reason: "RACE_WEEK"
          });
        }

        if (initialPartialWeek) {
          const count =
            available >= 3 ? 1 : 0;

          return Object.freeze({
            count,
            levels: Object.freeze(
              count ? ["principal"] : []
            ),
            reason:
              count
                ? "INITIAL_PARTIAL_MAIN"
                : "INITIAL_PARTIAL_INSUFFICIENT_AVAILABILITY"
          });
        }

        if (phase === "preparation") {
          const allowTwo =
            history >= 6 &&
            broadAvailability === true;

          return Object.freeze({
            count: allowTwo ? 2 : 1,
            levels: Object.freeze(
              allowTwo
                ? ["principal", "principal"]
                : ["principal"]
            ),
            reason:
              allowTwo
                ? "PREPARATION_TWO_ALLOWED"
                : "PREPARATION_ONE_MAIN"
          });
        }

        if (phase === "development") {
          const allowTwo =
            ["5K", "10K"].includes(
              String(
                arguments[0]?.distanceKey ||
                ""
              )
            ) &&
            history >= 6 &&
            available >= 6 &&
            runDays <= 4;

          return Object.freeze({
            count: allowTwo ? 2 : 1,
            levels: Object.freeze(
              allowTwo
                ? ["principal", "principal"]
                : ["principal"]
            ),
            reason:
              allowTwo
                ? "DEVELOPMENT_TWO_ALLOWED"
                : "DEVELOPMENT_ONE_MAIN"
          });
        }

        if (phase === "specific") {
          return Object.freeze({
            count: 1,
            levels: Object.freeze([
              "maintenance"
            ]),
            reason: "SPECIFIC_MAINTENANCE"
          });
        }

        if (phase === "taper") {
          const firstTaperWeek =
            Number(taperWeekIndex) === 1;

          return Object.freeze({
            count:
              firstTaperWeek ? 1 : 0,
            levels: Object.freeze(
              firstTaperWeek
                ? ["microdose"]
                : []
            ),
            reason:
              firstTaperWeek
                ? "TAPER_MICRODOSE"
                : "TAPER_NO_STRENGTH"
          });
        }

        return Object.freeze({
          count: 0,
          levels: Object.freeze([]),
          reason: "PHASE_PENDING"
        });
      }

      function strengthLoadAdjustment({
        runningLoadIncreasing = false,
        currentSets = null
      } = {}) {
        const sets =
          Number(currentSets);

        if (
          runningLoadIncreasing !== true ||
          !Number.isFinite(sets) ||
          sets <= 0
        ) {
          return Object.freeze({
            action: "KEEP",
            sets:
              Number.isFinite(sets)
                ? sets
                : currentSets
          });
        }

        return Object.freeze({
          action:
            sets > 1
              ? "REDUCE_ONE_SET"
              : "KEEP_MINIMUM",
          sets:
            sets > 1
              ? sets - 1
              : sets,
          protects: Object.freeze([
            "running_quality",
            "long_run"
          ])
        });
      }

      function buildStrengthPlan({
        phase = null,
        distanceKey = null,
        availableDaysCount = 0,
        targetRunDays = 0,
        strengthHistoryWeeks = 0,
        broadAvailability = false,
        initialPartialWeek = false,
        raceWeek = false,
        taperWeekIndex = null,
        previousVariant = null
      } = {}) {
        const sessions =
          strengthSessionsForWeek({
            phase,
            distanceKey,
            availableDaysCount,
            targetRunDays,
            strengthHistoryWeeks,
            broadAvailability,
            initialPartialWeek,
            raceWeek,
            taperWeekIndex
          });

        const variant =
          sessions.count > 0
            ? rotateStrengthVariant(
                previousVariant
              )
            : null;

        return Object.freeze({
          phase,
          count: sessions.count,
          levels: sessions.levels,
          reason: sessions.reason,
          variant,
          preserveFullRestDay: true,
          principles: Object.freeze({
            avoidMuscularFailure: true,
            principalFocus: Object.freeze([
              "useful_strength",
              "stability",
              "single_leg",
              "posterior_chain",
              "calf_soleus",
              "core"
            ]),
            maintenance:
              "minimum_effective_dose",
            microdose:
              "activation_without_fatigue"
          }),
          library:
            canonicalStrengthLibrary(),
          dependencies: Object.freeze({
            exercisePrescriptionDetails:
              "pending_source_detail"
          })
        });
      }

      function runStrengthTests() {

        const results = Object.freeze([

      const MatchClass = Object.freeze([
        "direct",
        "strong",
        "weak",
        "ambiguous",
        "extra",
        "out_of_date"
      ]);

      const WorkoutOutcome = Object.freeze([
        "COMPLETED_AS_PLANNED",
        "COMPLETED_BETTER_THAN_PLANNED",
        "COMPLETED_PARTIALLY",
        "COMPLETED_HARDER_THAN_EXPECTED",
        "COMPLETED_EASIER_THAN_EXPECTED",
        "FAILED_TARGET",
        "ABORTED",
        "NOT_COMPLETED",
        "PENDING",
        "NOT_EXPECTED",
        "INSUFFICIENT_DATA"
      ]);

      function normalizeExecutionMatch(source = {}) {
        const matchClass =
          MatchClass.includes(source.matchClass)
            ? source.matchClass
            : null;

        return Object.freeze({
          plannedSessionId:
            source.plannedSessionId != null
              ? String(source.plannedSessionId)
              : null,
          activityId:
            source.activityId != null
              ? String(source.activityId)
              : null,
          matchClass,
          evidenceSufficient:
            source.evidenceSufficient === true,
          explicitAbort:
            source.explicitAbort === true,
          completionRatio:
            Number.isFinite(
              Number(source.completionRatio)
            )
              ? Math.max(
                  0,
                  Math.min(
                    1,
                    Number(source.completionRatio)
                  )
                )
              : null,
          performanceSignal:
            [
              "as_planned",
              "better",
              "harder",
              "easier",
              "failed"
            ].includes(source.performanceSignal)
              ? source.performanceSignal
              : null
        });
      }

      function reconciledCompletionStatus(
        match
      ) {
        if (!match?.matchClass) {
          return "UNMATCHED";
        }

        if (match.matchClass === "extra") {
          return "EXTRA";
        }

        if (match.matchClass === "ambiguous") {
          return "AMBIGUOUS";
        }

        if (
          match.matchClass === "weak" &&
          match.evidenceSufficient !== true
        ) {
          return "AMBIGUOUS";
        }

        if (
          match.matchClass === "out_of_date" &&
          match.evidenceSufficient !== true
        ) {
          return "AMBIGUOUS";
        }

        if (
          ["direct", "strong"].includes(
            match.matchClass
          ) ||
          (
            match.matchClass === "out_of_date" &&
            match.evidenceSufficient === true
          ) ||
          (
            match.matchClass === "weak" &&
            match.evidenceSufficient === true
          )
        ) {
          return "MATCHED";
        }

        return "UNMATCHED";
      }

      function resolveWorkoutOutcome({
        match = null,
        sessionExpected = true,
        sessionPending = false,
        mainRace = false
      } = {}) {
        if (sessionExpected !== true) {
          return Object.freeze({
            outcome: "NOT_EXPECTED",
            adherenceCreditEligible: false
          });
        }

        if (sessionPending === true) {
          return Object.freeze({
            outcome: "PENDING",
            adherenceCreditEligible: false
          });
        }

        const normalized =
          normalizeExecutionMatch(match || {});

        const completion =
          reconciledCompletionStatus(
            normalized
          );

        if (
          completion === "AMBIGUOUS" ||
          completion === "UNMATCHED"
        ) {
          return Object.freeze({
            outcome: "INSUFFICIENT_DATA",
            adherenceCreditEligible:
              mainRace !== true
          });
        }

        if (completion === "EXTRA") {
          return Object.freeze({
            outcome: "NOT_EXPECTED",
            adherenceCreditEligible: false
          });
        }

        if (
          normalized.explicitAbort === true
        ) {
          return Object.freeze({
            outcome: "ABORTED",
            adherenceCreditEligible:
              mainRace !== true
          });
        }

        if (
          normalized.completionRatio != null &&
          normalized.completionRatio < 1
        ) {
          return Object.freeze({
            outcome: "COMPLETED_PARTIALLY",
            adherenceCreditEligible:
              mainRace !== true
          });
        }

        const signalMap = Object.freeze({
          as_planned:
            "COMPLETED_AS_PLANNED",
          better:
            "COMPLETED_BETTER_THAN_PLANNED",
          harder:
            "COMPLETED_HARDER_THAN_EXPECTED",
          easier:
            "COMPLETED_EASIER_THAN_EXPECTED",
          failed:
            "FAILED_TARGET"
        });

        const outcome =
          signalMap[
            normalized.performanceSignal
          ] || "COMPLETED_AS_PLANNED";

        if (
          outcome ===
            "COMPLETED_BETTER_THAN_PLANNED" &&
          !["direct", "strong"].includes(
            normalized.matchClass
          )
        ) {
          return Object.freeze({
            outcome: "INSUFFICIENT_DATA",
            adherenceCreditEligible:
              mainRace !== true
          });
        }

        return Object.freeze({
          outcome,
          adherenceCreditEligible:
            mainRace !== true
        });
      }

      function futureOnlyBoundary({
        asOfDate,
        planStartDate
      } = {}) {
        if (
          !isIsoDate(asOfDate) ||
          !isIsoDate(planStartDate)
        ) {
          return null;
        }

        return asOfDate >= planStartDate
          ? asOfDate
          : planStartDate;
      }

      function preservePastSessions({
        existingSessions = [],
        regeneratedFutureSessions = [],
        asOfDate,
        planStartDate
      } = {}) {
        const boundary =
          futureOnlyBoundary({
            asOfDate,
            planStartDate
          });

        if (!boundary) {
          return Object.freeze({
            valid: false,
            boundary: null,
            sessions: Object.freeze([])
          });
        }

        const past = (existingSessions || [])
          .filter((session) =>
            isIsoDate(session?.date) &&
            session.date < boundary
          );

        const future = (
          regeneratedFutureSessions || []
        ).filter((session) =>
          isIsoDate(session?.date) &&
          session.date >= boundary
        );

        return Object.freeze({
          valid: true,
          boundary,
          sessions: Object.freeze([
            ...past,
            ...future
          ]),
          preservedPastCount:
            past.length,
          regeneratedFutureCount:
            future.length
        });
      }

      function buildEffectivePlan({
        canonicalPlan = [],
        acceptedManualChanges = [],
        acceptedAdaptiveChanges = [],
        asOfDate,
        planStartDate
      } = {}) {
        const boundary =
          futureOnlyBoundary({
            asOfDate,
            planStartDate
          });

        if (!boundary) {
          return Object.freeze({
            valid: false,
            sessions: Object.freeze([])
          });
        }

        const byId = new Map();

        for (const session of canonicalPlan || []) {
          if (session?.id != null) {
            byId.set(
              String(session.id),
              Object.freeze({
                ...session,
                source: "canonical"
              })
            );
          }
        }

        const applyAccepted = (
          changes,
          source
        ) => {
          for (const change of changes || []) {
            if (
              change?.accepted !== true ||
              change?.sessionId == null
            ) {
              continue;
            }

            const id =
              String(change.sessionId);
            const current = byId.get(id);

            if (!current) continue;

            if (
              isIsoDate(current.date) &&
              current.date < boundary
            ) {
              continue;
            }

            byId.set(
              id,
              Object.freeze({
                ...current,
                ...(change.patch || {}),
                source
              })
            );
          }
        };

        applyAccepted(
          acceptedAdaptiveChanges,
          "adaptive_accepted"
        );

        applyAccepted(
          acceptedManualChanges,
          "manual_accepted"
        );

        return Object.freeze({
          valid: true,
          boundary,
          sessions: Object.freeze(
            [...byId.values()]
          ),
          manualAuthority: true,
          adaptiveRequiresAcceptance: true
        });
      }

      const AdaptiveDetectedAction = Object.freeze([

      function normalizeAdaptiveSignal(
        source = {}
      ) {
        const action =
          AdaptiveDetectedAction.includes(
            source.action
          )

        return Object.freeze({
          id:
            source.id != null
              ? String(source.id)

        });

      function resolveAdaptiveProposal(
        signal
      ) {
        const normalized =
          normalizeAdaptiveSignal(signal);

        if (!normalized.action) {
          return Object.freeze({
            valid: false,
            proposalAction: null,
            requiresUserDecision: true,
            autoApplied: false,
            remoteWriteAllowed: false
          });
        }

        const map = Object.freeze({
          CANCEL: "CANCEL",
          SOFTEN: "SOFTEN",
          SUBSTITUTE: "SUBSTITUTE",
          MOVE: "MOVE",
          MOVE_REQUEST: "MOVE",
          PROGRESSION_HOLD: "HOLD",
          CONSOLIDATE: "HOLD",
          REENTRY_BLOCK: "REVIEW",
          ANCHOR_REFRESH: "REVIEW",
          AVAILABILITY_REMAP: "REVIEW"
        });

        return Object.freeze({
          valid: true,
          signalId: normalized.id,
          sessionId: normalized.sessionId,
          detectedAction: normalized.action,
          proposalAction:
            map[normalized.action],
          reason: normalized.reason,
          targetDate: normalized.targetDate,
          substituteFamily:
            normalized.substituteFamily,
          evidence: normalized.evidence,
          requiresUserDecision: true,
          autoApplied: false,
          remoteWriteAllowed: false
        });
      }

      function buildAdaptiveRecommendations(
        signals = []
      ) {
        const proposals =
          (signals || [])
            .map(resolveAdaptiveProposal)
            .filter((proposal) =>
              proposal.valid
            );

        return Object.freeze({
          consultative: true,
          autoApplied: false,
          remoteWriteAllowed: false,
          proposals: Object.freeze(
            proposals
          )
        });
      }

      function decideAdaptiveProposal({
        proposal,
        accepted
      } = {}) {
        if (!proposal?.valid) {
          return Object.freeze({
            status: "INVALID_PROPOSAL",
            accepted: false,
            applicable: false,
            change: null
          });
        }

        if (accepted !== true) {
          return Object.freeze({
            status: "REJECTED",
            accepted: false,
            applicable: false,
            change: null
          });
        }

        const patchByAction = {
          MOVE:
            proposal.targetDate
              ? {
                  date:
                    proposal.targetDate
                }
              : null,
          SOFTEN: {
            adaptation: "soften"
          },
          SUBSTITUTE:
            proposal.substituteFamily
              ? {
                  family:
                    proposal.substituteFamily
                }
              : {
                  adaptation:
                    "substitute_review"
                },
          CANCEL: {
            cancelled: true
          },
          HOLD: {
            adaptation: "hold"
          },
          SWAP: {
            adaptation: "swap"
          },
          REVIEW: {
            adaptation: "review"
          }
        };

        return Object.freeze({
          status: "ACCEPTED",
          accepted: true,
          applicable:
            proposal.sessionId != null,
          change:
            proposal.sessionId != null
              ? Object.freeze({
                  accepted: true,
                  sessionId:
                    proposal.sessionId,
                  patch:
                    Object.freeze(
                      patchByAction[
                        proposal.proposalAction
                      ] || {
                        adaptation: "review"
                      }
                    )
                })
              : null
        });
      }

        canonicalPlan = [],

        acceptedManualChanges = [],
        asOfDate,

      } = {}) {
        const adaptiveChanges =
          acceptedDecision?.accepted === true &&
          acceptedDecision.change
            ? [
                acceptedDecision.change
              ]
            : [];

        return buildEffectivePlan({
          canonicalPlan,
          acceptedManualChanges,
          acceptedAdaptiveChanges:
            adaptiveChanges,
          asOfDate,
          planStartDate
        });
      }

          modifiesPlanAutomatically:

          recommendations:

            "detect",

          ])
        });

      function adherenceCredit({
        outcome,
        completionRatio = null,
        reliableProportion = false,
        mainRace = false,
        extraActivity = false
      } = {}) {
        if (
          mainRace === true ||
          extraActivity === true ||
          outcome === "PENDING" ||
          outcome === "NOT_EXPECTED"
        ) {
          return 0;
        }

        if (
          [
            "COMPLETED_AS_PLANNED",
            "COMPLETED_BETTER_THAN_PLANNED",
            "COMPLETED_HARDER_THAN_EXPECTED",
            "COMPLETED_EASIER_THAN_EXPECTED"
          ].includes(outcome)
        ) {
          return 1;
        }

        if (outcome === "COMPLETED_PARTIALLY") {
          if (
            reliableProportion === true &&
            Number.isFinite(Number(completionRatio))
          ) {
            return Math.max(
              0.4,
              Math.min(
                0.8,
                Number(completionRatio)
              )
            );
          }

          return 0.6;
        }

        if (
          [
            "FAILED_TARGET",
            "ABORTED",
            "NOT_COMPLETED"
          ].includes(outcome)
        ) {
          return 0;
        }

        return null;
      }

      function planHealthBand(score) {
        const value = Number(score);

        if (!Number.isFinite(value)) {
          return null;
        }

        if (value >= 90) return "Excelente";
        if (value >= 80) return "Buena";
        if (value >= 70) return "Aceptable";
        if (value >= 55) return "Irregular";
        return "Deficiente";

      function buildPlanHealth({
        adherence = null,

          volume,
          strength,
          consistency

        const available = Object.entries(dimensions)
          .filter(([, value]) =>
            Number.isFinite(Number(value))

          return Object.freeze({
            available: false,
            score: null,
            band: null,
            windowDays: 28,
            dimensions,
            reason: "INSUFFICIENT_DATA"
          });

        const bounded = Object.fromEntries(
          Object.entries(dimensions).map(
            ([key, value]) => [
              key,
              Math.max(
                0,
                Math.min(100, Number(value))
              )
            ]
          )
        );

        const score =
          bounded.adherence *
            PlanHealthWeights.adherence +
          bounded.keySessions *
            PlanHealthWeights.keySessions +
          bounded.volume *
            PlanHealthWeights.volume +
          bounded.strength *
            PlanHealthWeights.strength +
          bounded.consistency *
            PlanHealthWeights.consistency;

          available: true,

      function stableSerialize(value) {
        if (value === null) return "null";

        const type = typeof value;

        if (
          type === "number" ||
          type === "boolean"
        ) {
          return JSON.stringify(value);
        }

        if (type === "string") {
          return JSON.stringify(value);
        }

        if (Array.isArray(value)) {
          return (
            "[" +
            value
              .map(stableSerialize)
              .join(",") +
            "]"
          );
        }

        if (type === "object") {
          const keys = Object.keys(value)
            .sort();

          return (
            "{" +
            keys
              .map((key) =>
                JSON.stringify(key) +
                ":" +
                stableSerialize(value[key])
              )
              .join(",") +
            "}"
          );
        }

        return JSON.stringify(null);
      }

      function deterministicFingerprint(
        value
      ) {
        const text = stableSerialize(value);

        let hash = 2166136261;

        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(
            hash,
            16777619
          );
        }

        return (
          "fnv1a32:" +
          (hash >>> 0)
            .toString(16)
            .padStart(8, "0")
        );
      }

      function clampNumber(
        value,
        min,
        max
      ) {
        return Math.max(
          min,
          Math.min(max, value)
        );
      }

      function initialVolumeStepKm(
        habitualVolumeKm
      ) {
        const habitual =
          Number(habitualVolumeKm);

        if (
          !Number.isFinite(habitual) ||
          habitual < 0
        ) {
          return null;
        }

        return clampNumber(
          Math.round(
            habitual * 0.06
          ),
          2,
          5
        );
      }

      function peakDemandForGoal(
        distanceKey,
        targetTimeSec
      ) {
        const rows =
          PeakDemandProfiles[
            distanceKey
          ];

        const target =
          Number(targetTimeSec);

        if (
          !rows ||
          !Number.isFinite(target) ||
          target <= 0
        ) {
          return null;
        }

        const row =
          rows.find((item) =>
            target <= item.maxTimeSec
          ) || null;

        return row
          ? Object.freeze({
              distanceKey,
              targetTimeSec: target,
              peakKm: row.peakKm,
              longRunKm:
                row.longRunKm,
              maxRunDays:
                row.maxRunDays
            })
          : null;
      }

      function buildVolumeProgression({
        planInput = null,
        athleteSnapshot = null
      } = {}) {
        const normalizedPlan =
          createPlanInput(
            planInput || {}
          );

        const validation =
          validatePlanInput(
            normalizedPlan
          );

        if (!validation.valid) {
          return Object.freeze({
            available: false,
            reason:
              "INVALID_PLAN_INPUT"
          });
        }

        const habitualVolumeKm =
          Number(
            athleteSnapshot
              ?.habitualVolumeMedianKm
          );

        const frequencyMedian =
          Number(
            athleteSnapshot
              ?.frequencyMedian
          );

        const demand =
          peakDemandForGoal(
            normalizedPlan.distanceKey,
            normalizedPlan.targetTimeSec
          );

        if (
          !Number.isFinite(
            habitualVolumeKm
          ) ||
          habitualVolumeKm < 0 ||
          !demand
        ) {
          return Object.freeze({
            available: false,
            reason:
              "ATHLETE_VOLUME_OR_DEMAND_PENDING",
            habitualVolumeKm:
              Number.isFinite(
                habitualVolumeKm
              )
                ? habitualVolumeKm
                : null,
            demand
          });
        }

        const stepKm =
          initialVolumeStepKm(
            habitualVolumeKm
          );

        const targetPeakKm =
          Math.max(
            habitualVolumeKm,
            demand.peakKm
          );

        const availableDaysCount =
          normalizedPlan
            .availableDays.length;

        const startRunDays =
          Number.isFinite(
            frequencyMedian
          )
            ? Math.max(
                1,
                Math.min(
                  availableDaysCount,
                  Math.round(
                    frequencyMedian
                  )
                )
              )
            : null;

        const maximumRunDays =
          Math.min(
            availableDaysCount,
            demand.maxRunDays
          );

        return Object.freeze({
          available: true,
          habitualVolumeKm,
          stepKm,
          demand,
          targetPeakKm,
          targetPeakNeverBelowHabitual:
            targetPeakKm >=
            habitualVolumeKm,
          startRunDays,
          maximumRunDays,
          frequencyMayIncreaseGradually:
            startRunDays != null &&

              true,

            exactWeeklySequence:

          })
        });

      function addIsoDays(
        isoDate,
        days
      ) {
        if (!isIsoDate(isoDate)) return null;

        const date = new Date(
          isoDate + "T12:00:00Z"
        );

        date.setUTCDate(
          date.getUTCDate() +
          Number(days || 0)
        );

        return date
          .toISOString()
          .slice(0, 10);
      }

      function isoWeekdayKey(
        isoDate
      ) {
        if (!isIsoDate(isoDate)) {
          return null;
        }

        const keys = [
          "sun",
          "mon",
          "tue",
          "wed",
          "thu",
          "fri",
          "sat"
        ];

        const date = new Date(
          isoDate + "T12:00:00Z"
        );

        return keys[
          date.getUTCDay()
        ];
      }

      function enumeratePlanWeeks({
        startDate,
        raceDate
      } = {}) {
        if (
          !isIsoDate(startDate) ||
          !isIsoDate(raceDate) ||
          raceDate < startDate
        ) {
          return Object.freeze([]);
        }

        const weeks = [];
        let cursor = startDate;
        let index = 0;

        while (cursor <= raceDate) {
          const weekStart =
            index === 0
              ? cursor
              : cursor;

          const weekMonday =
            startOfIsoWeek(
              weekStart
            );

          const weekSunday =
            addIsoDays(
              weekMonday,
              6
            );

          const endDate =
            weekSunday < raceDate
              ? weekSunday
              : raceDate;

          weeks.push(
            Object.freeze({
              index,
              startDate:
                weekStart,
              endDate,
              initialPartial:
                index === 0 &&
                weekStart !==
                  weekMonday,
              containsRace:
                raceDate >=
                  weekStart &&
                raceDate <=
                  endDate
            })
          );

          if (endDate >= raceDate) {
            break;
          }

          cursor =
            addIsoDays(
              endDate,
              1
            );

          index += 1;
        }

        return Object.freeze(
          weeks
        );
      }

      function assignKnownCalendarPhases({
        planInput = null,
        macrocycle = null
      } = {}) {
        const normalizedPlan =
          createPlanInput(
            planInput || {}
          );

        const validation =
          validatePlanInput(
            normalizedPlan
          );

        if (!validation.valid) {
          return Object.freeze({
            available: false,
            reason:
              "INVALID_PLAN_INPUT",
            weeks:
              Object.freeze([])
          });
        }

        const weeks =
          enumeratePlanWeeks({
            startDate:
              normalizedPlan.startDate,
            raceDate:
              normalizedPlan.raceDate
          });

        if (!weeks.length) {
          return Object.freeze({
            available: false,
            reason:
              "NO_WEEKS",
            weeks
          });
        }

        const taperWeeks =
          Number(
            macrocycle
              ?.phases
              ?.taper
              ?.weeks
          );

        if (
          !Number.isFinite(
            taperWeeks
          ) ||
          taperWeeks < 0
        ) {
          return Object.freeze({
            available: false,
            reason:
              "TAPER_PENDING",
            weeks
          });
        }

        const raceWeekIndex =
          weeks.findIndex(
            (week) =>
              week.containsRace
          );

        const taperStartIndex =
          Math.max(
            0,
            raceWeekIndex -
              taperWeeks
          );

        const assigned =
          weeks.map((week) => {
            let phase =
              "UNASSIGNED";

            if (
              week.containsRace
            ) {
              phase =
                "race_week";
            } else if (
              week.index >=
                taperStartIndex &&
              week.index <
                raceWeekIndex
            ) {
              phase =
                "taper";
            } else if (
              week.initialPartial
            ) {
              phase =
                "initial_partial";
            }

            return Object.freeze({
              ...week,
              phase,
              weekdayStart:
                isoWeekdayKey(
                  week.startDate
                )
            });
          });

        const unresolvedWeeks =
          assigned.filter(
            (week) =>
              week.phase ===
              "UNASSIGNED"
          );

        return Object.freeze({
          available: true,
          weeks:
            Object.freeze(
              assigned
            ),
          raceWeekIndex,
          taperWeeks,
          unresolvedWeeks:
            unresolvedWeeks.length,
          phaseAllocationStatus:
            unresolvedWeeks.length
              ? "PARTIAL"
              : "COMPLETE",
          dependencies:
            Object.freeze({
              preparationDevelopmentSpecificAllocation:
                unresolvedWeeks.length
                  ? "pending_source_rule"
                  : "resolved"
            })
        });
      }

      function phaseAllocationCandidates({
        distanceKey,
        coreWeeks
      } = {}) {
        const profile =
          MacrocycleProfiles[
            distanceKey
          ];

        const total =
          Number(coreWeeks);

        if (
          !profile ||
          !Number.isInteger(total) ||
          total < 0
        ) {
          return Object.freeze([]);
        }

        const candidates = [];

        for (
          let preparation =
            profile.preparation.minWeeks;
          preparation <=
            profile.preparation.maxWeeks;
          preparation++
        ) {
          for (
            let development =
              profile.development.minWeeks;
            development <=
              profile.development.maxWeeks;
            development++
          ) {
            for (
              let specific =
                profile.specific.minWeeks;
              specific <=
                profile.specific.maxWeeks;
              specific++
            ) {
              if (
                preparation +
                  development +
                  specific !==
                total
              ) {
                continue;
              }

              candidates.push(
                Object.freeze({
                  preparation,
                  development,
                  specific
                })
              );
            }
          }
        }

        return Object.freeze(
          candidates
        );
      }

      function resolvePhaseAllocation({
        planInput = null,
        macrocycle = null,
        canonicalCalendar = null
      } = {}) {
        const normalizedPlan =
          createPlanInput(
            planInput || {}
          );

        const validation =
          validatePlanInput(
            normalizedPlan
          );

        if (!validation.valid) {
          return Object.freeze({
            status: "INVALID_INPUT",
            selected: null,
            candidates:
              Object.freeze([]),
            coreWeeks: null
          });
        }

        if (
          !canonicalCalendar
            ?.available
        ) {
          return Object.freeze({
            status:
              "CALENDAR_PENDING",
            selected: null,
            candidates:
              Object.freeze([]),
            coreWeeks: null
          });
        }

        const coreWeeks =
          canonicalCalendar.weeks
            .filter((week) =>
              week.phase ===
              "UNASSIGNED"
            )
            .length;

        const candidates =
          phaseAllocationCandidates({
            distanceKey:
              normalizedPlan.distanceKey,
            coreWeeks
          });

        if (candidates.length === 1) {
          return Object.freeze({
            status: "UNIQUE",
            selected:
              candidates[0],
            candidates,
            coreWeeks,
            source:
              "MACROCYCLE_RANGE_CONSTRAINTS"
          });
        }

        if (candidates.length > 1) {
          return Object.freeze({
            status: "MULTIPLE_VALID",
            selected: null,
            candidates,
            coreWeeks,
            source:
              "MACROCYCLE_RANGE_CONSTRAINTS",
            reason:
              "SOURCE_DOES_NOT_DEFINE_TIE_BREAK"
          });
        }

        const profile =
          MacrocycleProfiles[
            normalizedPlan.distanceKey
          ];

        const minimumCoreWeeks =
          profile
            ? (
                profile.preparation
                  .minWeeks +
                profile.development
                  .minWeeks +
                profile.specific
                  .minWeeks
              )
            : null;

        const maximumCoreWeeks =
          profile
            ? (
                profile.preparation
                  .maxWeeks +
                profile.development
                  .maxWeeks +
                profile.specific
                  .maxWeeks
              )
            : null;

        return Object.freeze({
          status:
            minimumCoreWeeks != null &&
            coreWeeks <
              minimumCoreWeeks
              ? "INSUFFICIENT_CORE_WEEKS"
              : maximumCoreWeeks != null &&
                  coreWeeks >
                    maximumCoreWeeks
                ? "EXCESS_CORE_WEEKS"
                : "NO_VALID_ALLOCATION",
          selected: null,
          candidates,
          coreWeeks,
          minimumCoreWeeks,
          maximumCoreWeeks
        });
      }

      function applyUniquePhaseAllocation({
        canonicalCalendar = null,
        phaseAllocation = null
      } = {}) {
        if (
          !canonicalCalendar
            ?.available ||
          phaseAllocation?.status !==
            "UNIQUE" ||
          !phaseAllocation.selected
        ) {
          return Object.freeze({
            applied: false,
            calendar:
              canonicalCalendar,
            reason:
              "UNIQUE_ALLOCATION_REQUIRED"
          });
        }

        const {
          preparation,
          development,
          specific
        } = phaseAllocation.selected;

        let remainingPreparation =
          preparation;
        let remainingDevelopment =
          development;
        let remainingSpecific =
          specific;

        const weeks =
          canonicalCalendar.weeks
            .map((week) => {
              if (
                week.phase !==
                "UNASSIGNED"
              ) {
                return week;
              }

              let phase = null;

              if (
                remainingPreparation >
                0
              ) {
                phase = "preparation";
                remainingPreparation--;
              } else if (
                remainingDevelopment >
                0
              ) {
                phase = "development";
                remainingDevelopment--;
              } else if (
                remainingSpecific > 0
              ) {
                phase = "specific";
                remainingSpecific--;
              }

              return Object.freeze({
                ...week,
                phase:
                  phase ||
                  "UNASSIGNED"
              });
            });

        const unresolvedWeeks =
          weeks.filter(
            (week) =>
              week.phase ===
              "UNASSIGNED"
          ).length;

        return Object.freeze({
          applied:
            unresolvedWeeks === 0,
          calendar:
            Object.freeze({
              ...canonicalCalendar,
              weeks:
                Object.freeze(weeks),
              unresolvedWeeks,
              phaseAllocationStatus:
                unresolvedWeeks === 0
                  ? "COMPLETE"
                  : "PARTIAL"
            }),
          reason:
            unresolvedWeeks === 0
              ? "UNIQUE_ALLOCATION_APPLIED"
              : "UNRESOLVED_WEEKS_REMAIN"
        });
      }

    function trainingEngineSnapshotInputFromActivities(
      storedActivities,
      asOfDate
    ) {
      const activities = (storedActivities || []).map((item) => {
        const summary = item?.summary || {};
        const sport = String(summary.sport || "")
          .trim()
          .toLowerCase();
        const title = String(summary.title || "")
          .trim()
          .toLowerCase();

        const isRun =
          sport.includes("run") ||
          sport.includes("running") ||
          sport.includes("treadmill") ||
          sport.includes("track") ||
          sport.includes("trail") ||
          title.includes("carrera") ||
          title.includes("running");

        const isStrength =
          sport.includes("strength") ||
          sport.includes("weight") ||
          title.includes("fuerza");

        return {
          id: item?.id ?? summary.id ?? null,
          date: summary.date ?? null,
          distanceM: summary.distanceM ?? 0,
          durationSec: summary.durationSec ?? 0,
          isRun,
          isStrength,
          isQuality: null
        };
      });

      return { activities, asOfDate };
    }

    function trainingEngineOfficialThresholdFromChunks(
      thresholdChunks
    ) {
      const rowsByDate = new Map();
      let current = null;

      for (const chunk of thresholdChunks || []) {
        const rows = Array.isArray(chunk?.payload?.rows)
          ? chunk.payload.rows
          : [];

        for (const row of rows) {
          const date = String(row?.date || "");
          const paceSecKm = Number(row?.paceSecKm);

          if (
            !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
            !Number.isFinite(paceSecKm) ||
            paceSecKm <= 0
          ) {
            continue;
          }

          rowsByDate.set(date, {
            official: true,
            source: "garmin_official",
            date,
            paceSecKm
          });
        }

        const candidate = chunk?.payload?.current;

        if (candidate && typeof candidate === "object") {
          const date = String(
            candidate.date ||
            chunk?.endDate ||
            ""
          );
          const paceSecKm =
            Number(candidate.paceSecKm);

          if (
            /^\d{4}-\d{2}-\d{2}$/.test(date) &&
            Number.isFinite(paceSecKm) &&
            paceSecKm > 0
          ) {
            current = {
              official: true,
              source: "garmin_official",
              date,
              paceSecKm
            };
          }
        }
      }

      if (current) return Object.freeze(current);

      const latest = [...rowsByDate.values()]
        .sort((a, b) =>
          a.date.localeCompare(b.date)
        )
        .at(-1);

      return latest
        ? Object.freeze(latest)
        : null;
    }

        currentAbility: null,
        paceAnchors: null,
        goalAssessment: null,
        macrocycle: null,
        weeklySkeleton: null,
        prescriptionCore: null,
        strengthPlan: null,
        executionReconciliation: null,
        adaptive: null,
        intelligence: null,
        trainingEngineResult: null,
        volumeProgression: null,
        canonicalCalendar: null,
        phaseAllocation: null
      };

      function routeScrollKey(route = state.route) {
        return [
          route?.tab || "today",
          route?.view || "main",
          route?.id ?? ""
        ].join("::");
      }

      function saveRouteScroll(route = state.route) {
        state.scrollPositions[routeScrollKey(route)] = window.scrollY || 0;
      }

      function hasRouteScroll(route) {
        return Object.prototype.hasOwnProperty.call(
          state.scrollPositions,
          routeScrollKey(route)
        );
      }

      function navigate(route, options = {}) {
        saveRouteScroll();

        if (!options.replace) {
          state.history.push({ ...state.route });
        }

        const nextRoute = { ...route };
        const restore = hasRouteScroll(nextRoute);

        state.route = nextRoute;
        render({ scrollMode: restore ? "restore" : "top" });
      }

      function goBack() {
        const previous = state.history.pop();
        if (!previous) return;

        saveRouteScroll();
        state.route = previous;
        render({ scrollMode: "restore" });
      }

      function goTab(tab) {
        saveRouteScroll();

        const nextRoute = { tab, view: "main", id: null };
        const restore = hasRouteScroll(nextRoute);

        state.history = [];
        state.route = nextRoute;
        render({ scrollMode: restore ? "restore" : "top" });
      }

      function navItems() {
        return [
          ["today", "☀️", "Hoy"],
          ["activities", "🏃", "Actividades"],
          ["plan", "📅", "Plan"],
          ["evolution", "📈", "Evolución"]
        ];
      }

      function sidebar() {
        return `
          <aside class="sidebar">
            <div class="brand">ATLAS</div>
            <nav class="sidebar-nav">
              ${navItems().map(([tab, icon, label]) => `
                <button class="nav-item ${state.route.tab === tab ? "active" : ""}" data-tab="${tab}">
                  <span class="nav-icon">${icon}</span>
                  <span class="nav-label">${label}</span>
                </button>
              `).join("")}
            </nav>
            <div class="sidebar-spacer"></div>
            <button class="profile-item" data-tab="profile">
              <span class="nav-icon">👤</span>
              <span class="nav-label">Perfil</span>
            </button>
          </aside>
        `;
      }

      function tabbar() {
        return `
          <div class="tabbar-wrap">
            <nav class="tabbar">
              ${navItems().map(([tab, icon, label]) => `
                <button class="${state.route.tab === tab ? "active" : ""}" data-tab="${tab}">
                  <span class="tab-icon">${icon}</span>
                  <span class="tab-label">${label}</span>
                </button>
              `).join("")}
            </nav>

      function header(title, options = {}) {
        const showProfile =
          options.showProfile ??
          (state.route?.view === "main");

        return `
          <header class="screen-header">
            <h1 class="screen-title ${options.dynamicTitle ? "dynamic-screen-title" : ""}" ${options.dynamicTitle ? "data-fit-screen-title" : ""}>${title}</h1>
            ${showProfile
              ? `<button class="icon-button mobile-profile" data-tab="profile" aria-label="Perfil">👤</button>`
              : ""}
          </header>
        `;
      }

      function backButton() {
        if (!state.history.length) return "";
        return `<button class="back-button" data-action="back">← Atrás</button>`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function metric(type) {
        return state.metrics
          .filter((item) => item.type === type)
          .sort((a, b) =>
            String(b?.date || "").localeCompare(String(a?.date || ""))
          )[0] || null;
      }

      function formatDistance(meters) {
        const value = Number(meters);
        if (!Number.isFinite(value) || value < 0) return "—";

        if (value < 1000) {
          return `${Math.round(value).toLocaleString("es-ES")} m`;
        }

        const km = value / 1000;
        return `${km.toLocaleString("es-ES", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        })} km`;
      }

      function formatMetricDistanceKm(meters) {
        const value = Number(meters);
        if (!Number.isFinite(value) || value < 0) return "—";
        return (value / 1000).toLocaleString("es-ES", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        });
      }

      function paceMainValue(value) {
        return String(value || "—").replace(/\s*min\/km\s*$/i, "");
      }

      function formatHundredth(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        return n.toLocaleString("es-ES", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        });
      }

      function formatCardDuration(seconds) {
        const total = Math.max(0, Math.round(Number(seconds) || 0));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = total % 60;

        if (hours > 0) {
          return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        }

        return `${minutes}:${String(secs).padStart(2, "0")}`;
      }

      function formatCardPace(distanceM, durationSec) {
        const distance = Number(distanceM);
        const duration = Number(durationSec);

        if (!Number.isFinite(distance) || distance <= 0 ||
            !Number.isFinite(duration) || duration <= 0) {
          return null;
        }

        const pace = Math.round(duration / (distance / 1000));
        const minutes = Math.floor(pace / 60);
        const seconds = pace % 60;
        return `${minutes}:${String(seconds).padStart(2, "0")} min/km`;
      }

      function formatDuration(seconds) {
        const total = Math.max(0, Number(seconds) || 0);
        const h = Math.floor(total / 3600);
        const m = Math.round((total % 3600) / 60);
        return h ? `${h} h ${m} min` : `${m} min`;
      }

      function syncLabel(value) {
        return {
          idle: "—",
          syncing: "…",
          ok: "OK",
          error: "Error"
        }[value] || "—";
      }

      function readinessZone(score) {
        const value = Number(score);
        if (!Number.isFinite(value)) {
          return { color: "var(--text-3)", label: "Sin datos" };
        }
        if (value >= 95) return { color: "var(--purple)", label: "Excelente" };
        if (value >= 75) return { color: "var(--blue-active)", label: "Alta" };
        if (value >= 50) return { color: "var(--green)", label: "Moderada" };
        if (value >= 25) return { color: "var(--orange)", label: "Baja" };
        return { color: "var(--red)", label: "Deficiente" };
      }

      function trainingReadinessPresentation(readiness) {
        const zone = readinessZone(readiness?.value);
        if (!readiness || readiness.value == null) {
          return {
            score: "—",
            title: "Sin datos de preparación",
            detail: "Garmin no ha devuelto Training Readiness para hoy.",
            color: zone.color
          };
        }

        const score = formatGarminDecimal(readiness.value);
        return {
          score,
          title: `Preparación ${zone.label.toLowerCase()}`,
          detail: readiness.feedbackShort
            ? String(readiness.feedbackShort)
            : `Training Readiness · ${score}/100`,
          color: zone.color
        };
      }

      function localDate(offsetDays = 0) {
        const date = new Date();
        date.setDate(date.getDate() + Number(offsetDays || 0));
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function addDaysIso(dateString, days) {
        const match = String(dateString || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return dateString;
        const date = new Date(
          Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]))
        );
        date.setUTCDate(date.getUTCDate() + Number(days || 0));
        return date.toISOString().slice(0, 10);
      }

      function atlasDateFromRecord(value) {
        if (!value || typeof value !== "object") return null;

        const direct = [
          value.calendarDate,
          value.date,
          value.startDate,
          value.measurementDate,
          value.timestampLocal,
          value.timestamp,
          value.measurementTimeGMT,
          value.measurementTimeLocal
        ];

        for (const candidate of direct) {
          if (candidate == null || candidate === "") continue;

          if (typeof candidate === "string") {
            const match = candidate.match(/(\d{4}-\d{2}-\d{2})/);
            if (match) return match[1];
          }

          if (typeof candidate === "number" && Number.isFinite(candidate)) {
            const ms = candidate > 1e12 ? candidate : candidate * 1000;
            const date = new Date(ms);
            if (!Number.isNaN(date.getTime())) {
              return date.toISOString().slice(0, 10);
            }
          }
        }

        return null;
      }

      function isRunningActivity(activity) {
        const sport = String(
          activity?.summary?.sport ||
          activity?.sport ||
          activity?.summary?.raw?.activityType?.typeKey ||
          ""
        ).toLowerCase();
        return sport.includes("run") || sport.includes("running") || sport.includes("carrera");
      }

      function runningVolumeKm(days = 7) {
        const today = localDate(0);
        const start = addDaysIso(today, -(days - 1));
        const meters = state.activities.reduce((sum, activity) => {
          const date = String(activity?.summary?.date || "");
          if (!isRunningActivity(activity) || date < start || date > today) return sum;
          return sum + (Number(activity?.summary?.distanceM) || 0);
        }, 0);
        return meters / 1000;
      }

      function latestLactatePoint() {
        const rows = lactateThresholdSeries();
        return rows[rows.length - 1] || null;
      }

      function renderToday() {
        const sleep = metric("sleep");
        const hrv = metric("hrv");
        const vo2 = metric("vo2max");
        const readiness = metric("training-readiness");
        const restingHR = metric("resting-hr");
        const readinessState = trainingReadinessPresentation(readiness);
        const lactate = latestLactatePoint();

            return (
              /^\d{4}-\d{2}-\d{2}$/.test(date) &&
              date >= today &&

        return `

          <section class="section">

              <div class="readiness-score-wrap">

                  ${escapeHtml(readinessState.score)}
                </div>
                <div>
                  <div class="row-title">${escapeHtml(readinessState.title)}</div>
                  <div class="row-meta">${escapeHtml(readinessState.detail)}${state.syncing ? " · Actualizando Garmin…" : ""}</div>
                </div>

          <section class="section">

                ["FC reposo", restingHR?.value ?? "—", restingHR?.value != null ? "ppm" : "Sin datos", "resting-hr"],
                ["VO₂ máx.", vo2?.value != null ? formatGarminDecimal(vo2.value) : "—", "ml/kg/min", "vo2max"],
                ["Umbral lactato", lactate ? formatPace(lactate.paceSecKm) : "—", lactate?.heartRate != null ? `${Math.round(lactate.heartRate)} ppm` : "Sin datos", "lactate"],
                ["Volumen", volumeKm.toFixed(1).replace(".", ","), "km · últimos 7 días", "volume"]
              ].map(([label, value, caption, id]) => `
                <article class="metric" data-metric="${id}">
                  <div class="metric-label">${label}</div>
                  <div class="metric-value">${value}</div>
                  <div class="metric-caption">${caption}</div>

              `).join("")}
            </div>
          </section>

          <section class="section">
            <h2 class="section-title">Último entrenamiento</h2>
            ${lastActivity ? `
              <div class="card">
                ${activityCardHtml({
                  id: lastActivity.id,
                  date: lastActivity.summary?.date,
                  title: lastActivity.summary?.title,
                  sport: lastActivity.summary?.sport,
                  distanceM: lastActivity.summary?.distanceM,
                  durationSec: lastActivity.summary?.durationSec,
                  pace: true
                })}
              </div>
            ` : `<div class="card empty">Todavía no hay actividades sincronizadas.</div>`}
          </section>

          <section class="section">
            <h2 class="section-title">Próximos entrenamientos</h2>
            <div class="card">
              ${nextTraining.length ? nextTraining.map(item =>
                activityCardHtml({
                  id: item.associatedActivityId || null,
                  date: item.date,
                  title: item.title,
                  sport: item.sport,
                  distanceM: item.estimatedDistanceM,
                  durationSec: item.estimatedDurationSec,
                  pace: true,
                  status: null
                })
              ).join("") : `<div class="empty">No hay próximos entrenamientos.</div>`}
            </div>

      function renderReadinessDetail() {

          <section class="section">

            <div class="readiness-factor-grid">
              ${factors.map((factor) => `
                <article class="readiness-factor">
                  <div class="readiness-factor-name">${escapeHtml(factor.name)}</div>
                  <div class="readiness-factor-value">${escapeHtml(factor.value)}</div>
                  <div class="readiness-factor-meta">
                    ${factor.factor != null ? `Factor Garmin: ${escapeHtml(formatGarminDecimal(factor.factor))}%` : "Factor Garmin: —"}
                    ${factor.feedback ? `<br>${escapeHtml(factor.feedback)}` : ""}

          <section class="section">
