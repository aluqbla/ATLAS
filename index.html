      function buildGoalAssessment({
        planInput = null,
        currentAbility = null,
        paceAnchors = null,
        preparationInsufficient = null
      } = {}) {
        const normalizedPlan =
          createPlanInput(planInput || {});

        const validation =
          validatePlanInput(normalizedPlan);

        if (!validation.valid) {
          return Object.freeze({
            status: null,
            supported: false,
            dependencies: Object.freeze({
              planInput: "invalid",
              currentAbility:
                currentAbility ? "available" : "pending",
              paceAnchors:
                paceAnchors ? "available" : "pending",
              preparationAssessment:
                preparationInsufficient == null
                  ? "pending"
                  : "available"
            }),
            reasons: Object.freeze([
              "INVALID_PLAN_INPUT"
            ])
          });
        }

        if (
          paceAnchors?.status ===
          GoalAssessmentStatus.NEEDS_ANCHOR_TEST
        ) {
          return Object.freeze({
            status:
              GoalAssessmentStatus
                .NEEDS_ANCHOR_TEST,
            supported: false,
            dependencies: Object.freeze({
              planInput: "available",
              currentAbility:
                currentAbility ? "available" : "pending",
              paceAnchors: "pending",
              preparationAssessment:
                preparationInsufficient == null
                  ? "pending"
                  : "available"
            }),
            reasons: Object.freeze([
              "OFFICIAL_THRESHOLD_MISSING"
            ])
          });
        }

        if (preparationInsufficient === true) {
          return Object.freeze({
            status:
              GoalAssessmentStatus
                .PREPARATION_INSUFFICIENT,
            supported: false,
            dependencies: Object.freeze({
              planInput: "available",
              currentAbility:
                currentAbility ? "available" : "pending",
              paceAnchors:
                paceAnchors ? "available" : "pending",
              preparationAssessment: "available"
            }),
            reasons: Object.freeze([
              "PREPARATION_HORIZON_INSUFFICIENT"
            ])
          });
        }

        const incoherence =
          goalPaceIncoherence(
            normalizedPlan,
            currentAbility
          );

        if (incoherence) {
          return Object.freeze({
            status:
              GoalAssessmentStatus
                .NOT_SUPPORTED_CURRENTLY,
            supported: false,
            target: Object.freeze({
              distanceKey:
                normalizedPlan.distanceKey,
              distanceM:
                normalizedPlan.distanceM,
              targetTimeSec:
                normalizedPlan.targetTimeSec
            }),
            incoherence,
            dependencies: Object.freeze({
              planInput: "available",
              currentAbility: "available",
              paceAnchors:
                paceAnchors ? "available" : "pending",
              preparationAssessment:
                preparationInsufficient == null
                  ? "pending"
                  : "available"
            }),
            reasons: Object.freeze([
              "LONG_DISTANCE_TARGET_PACE_NOT_SLOWER_THAN_SHORTER_CURRENT_ABILITY"
            ])
          });
        }

        const targetAbility =
          currentAbility?.abilities?.[
            normalizedPlan.distanceKey
          ] || null;

        if (
          targetAbility?.available &&
          Number.isFinite(
            Number(targetAbility.predictedTimeSec)
          )
        ) {
          const currentTime =
            Number(targetAbility.predictedTimeSec);

          const targetTime =
            Number(normalizedPlan.targetTimeSec);

          const supported =
            currentTime <= targetTime;

          return Object.freeze({
            status:
              supported
                ? GoalAssessmentStatus.SUPPORTED
                : GoalAssessmentStatus.DEMANDING,
            supported,
            target: Object.freeze({
              distanceKey:
                normalizedPlan.distanceKey,
              distanceM:
                normalizedPlan.distanceM,
              targetTimeSec:
                normalizedPlan.targetTimeSec
            }),
            current: Object.freeze({
              predictedTimeSec:
                currentTime,
              confidence:
                targetAbility.confidence ?? null,
              trace:
                targetAbility.trace ?? null
            }),
            dependencies: Object.freeze({
              planInput: "available",
              currentAbility: "available",
              paceAnchors:
                paceAnchors ? "available" : "pending",
              preparationAssessment:
                preparationInsufficient == null
                  ? "pending"
                  : "available"
            }),
            reasons: Object.freeze([
              supported
                ? "CURRENT_ABILITY_SUPPORTS_TARGET"
                : "TARGET_FASTER_THAN_CURRENT_ABILITY"
            ])
          });
        }

        return Object.freeze({
          status: null,
          supported: false,
          target: Object.freeze({
            distanceKey:
              normalizedPlan.distanceKey,
            distanceM:
              normalizedPlan.distanceM,
            targetTimeSec:
              normalizedPlan.targetTimeSec

          dependencies: Object.freeze({

              preparationInsufficient == null
                ? "pending"
                : "available"
          }),
          reasons: Object.freeze([
            "CURRENT_ABILITY_EVIDENCE_PENDING"
          ])
        });
      }

      function macrocycleTaperWeeks(
        distanceKey,
        baseLevel,
        shortHorizon = false
      ) {
        const profile = MacrocycleProfiles[distanceKey];
        if (!profile) return null;

        if (
          distanceKey === "MARATHON" &&
          baseLevel === "HIGH" &&
          shortHorizon === true
        ) {
          return profile.taper.highBaseShortHorizonWeeks;
        }

        return profile.taper.standardWeeks;
      }

      function macrocycleMinimumWeeks(
        distanceKey,
        baseLevel = null,
        shortHorizon = false
      ) {
        const profile = MacrocycleProfiles[distanceKey];
        if (!profile) return null;

        return (
          profile.preparation.minWeeks +
          profile.development.minWeeks +
          profile.specific.minWeeks +
          macrocycleTaperWeeks(
            distanceKey,
            baseLevel,
            shortHorizon
          )
        );
      }

      function planHorizonDays(startDate, raceDate) {
        const days = daysBetweenIso(startDate, raceDate);
        if (days == null || days < 0) return null;
        return days + 1;
      }

      function planHorizonWeeks(startDate, raceDate) {
        const days = planHorizonDays(startDate, raceDate);
        return days == null ? null : days / 7;
      }

      function isInitialPartialWeek(startDate) {
        if (!isIsoDate(startDate)) return null;
        const monday = startOfIsoWeek(startDate);
        return monday ? monday !== startDate : null;
      }

      function canEnterSpecificDirectly({
        athleteSnapshot = null,
        longRunDeveloped = null,
        weeklyAvailabilitySufficient = null,
        horizonCompatible = null
      } = {}) {
        const baseHigh =
          athleteSnapshot?.base?.effective === "HIGH";

        const qualityEstablished =
          athleteSnapshot?.qualityEstablished === true;

        const dependenciesAvailable =
          longRunDeveloped != null &&
          weeklyAvailabilitySufficient != null &&
          horizonCompatible != null;

        if (!dependenciesAvailable) {
          return Object.freeze({
            allowed: false,
            status: "PENDING_DEPENDENCIES",
            checks: Object.freeze({
              baseHigh,
              qualityEstablished,
              longRunDeveloped,
              weeklyAvailabilitySufficient,
              horizonCompatible
            })
          });
        }

        const allowed =
          baseHigh &&
          qualityEstablished &&
          longRunDeveloped === true &&
          weeklyAvailabilitySufficient === true &&
          horizonCompatible === true;

        return Object.freeze({
          allowed,
          status: allowed ? "ALLOWED" : "NOT_ALLOWED",
          checks: Object.freeze({
            baseHigh,
            qualityEstablished,
            longRunDeveloped,
            weeklyAvailabilitySufficient,
            horizonCompatible
          })
        });
      }

      function buildMacrocycle({
        planInput = null,
        athleteSnapshot = null
      } = {}) {
        const normalizedPlan = createPlanInput(planInput || {});
        const validation = validatePlanInput(normalizedPlan);

        if (!validation.valid) {
          return Object.freeze({
            valid: false,
            preparationInsufficient: null,
            reasons: Object.freeze(["INVALID_PLAN_INPUT"])
          });
        }

        const profile =
          MacrocycleProfiles[normalizedPlan.distanceKey];

        if (!profile) {
          return Object.freeze({
            valid: false,
            preparationInsufficient: null,
            reasons: Object.freeze(["UNSUPPORTED_DISTANCE"])
          });
        }

        const baseLevel =
          athleteSnapshot?.base?.effective || null;

        const standardMinimumWeeks =
          macrocycleMinimumWeeks(
            normalizedPlan.distanceKey,
            baseLevel,
            false
          );

        const horizonWeeks =
          planHorizonWeeks(
            normalizedPlan.startDate,
            normalizedPlan.raceDate
          );

        const highBaseMarathonShortHorizon =
          normalizedPlan.distanceKey === "MARATHON" &&
          baseLevel === "HIGH" &&
          horizonWeeks != null &&
          horizonWeeks < standardMinimumWeeks;

        const taperWeeks =
          macrocycleTaperWeeks(
            normalizedPlan.distanceKey,
            baseLevel,
            highBaseMarathonShortHorizon
          );

        const minimumWeeks =
          macrocycleMinimumWeeks(
            normalizedPlan.distanceKey,
            baseLevel,
            highBaseMarathonShortHorizon
          );

        const preparationInsufficient =
          horizonWeeks != null
            ? horizonWeeks < minimumWeeks
            : null;

        const progressionLimit =
          baseLevel
            ? ProgressionLimits[baseLevel] ?? null
            : null;

        const directSpecific =
          canEnterSpecificDirectly({
            athleteSnapshot,
            longRunDeveloped: null,
            weeklyAvailabilitySufficient: null,
            horizonCompatible:
              preparationInsufficient === false
                ? true
                : preparationInsufficient === true
                  ? false
                  : null
          });

        return Object.freeze({
          valid: true,
          distanceKey: normalizedPlan.distanceKey,
          startDate: normalizedPlan.startDate,
          raceDate: normalizedPlan.raceDate,
          horizonDays:
            planHorizonDays(
              normalizedPlan.startDate,
              normalizedPlan.raceDate
            ),
          horizonWeeks,
          initialPartialWeek:
            isInitialPartialWeek(normalizedPlan.startDate),
          phases: Object.freeze({
            preparation: profile.preparation,
            development: profile.development,
            specific: profile.specific,
            taper: Object.freeze({
              weeks: taperWeeks,
              standardWeeks: profile.taper.standardWeeks
            }),
            raceWeek: Object.freeze({
              special: true
            })
          }),
          minimumWeeks,
          preparationInsufficient,
          longRunKm:
            baseLevel
              ? profile.longRunKm[baseLevel] ?? null
              : null,
          progression: Object.freeze({
            maxConsecutiveProgressiveWeeks:
              progressionLimit,
            consolidationRequiredAfterLimit:
              progressionLimit != null
          }),
          directSpecific,
          dependencies: Object.freeze({
            baseLevel:
              baseLevel ? "available" : "pending",
            longRunDevelopment: "pending",
            weeklyAvailabilityAssessment: "pending",
            exactPhaseAllocation: "pending"
          })
        });
      }

      const WeeklyPlacementPriority = Object.freeze([
        "race",
        "long_run",
        "primary_quality",
        "secondary_quality",
        "strength",
        "easy_aerobic_recovery",
        "rest"
      ]);

      const PreferredRunningRoutine = Object.freeze({
        3: Object.freeze(["wed", "fri", "sun"]),
        4: Object.freeze(["mon", "wed", "fri", "sun"]),
        5: Object.freeze(["mon", "tue", "wed", "fri", "sun"])
      });

      const StrengthDayPreference = Object.freeze([
        "thu",
        "tue"
      ]);

      const WeekdayIndex = Object.freeze({
        mon: 0,
        tue: 1,
        wed: 2,
        thu: 3,
        fri: 4,
        sat: 5,
        sun: 6
      });

      function weekdayDistance(a, b) {
        const ia = WeekdayIndex[a];
        const ib = WeekdayIndex[b];

        if (
          !Number.isInteger(ia) ||
          !Number.isInteger(ib)
        ) {
          return null;
        }

        return Math.abs(ia - ib);
      }

      function preferredRunDays(
        runDays,
        availableDays = []
      ) {
        const count = Number(runDays);
        const preferred =
          PreferredRunningRoutine[count];

        if (!preferred) {
          return Object.freeze({
            days: Object.freeze([]),
            complete: false,
            dependency:
              "UNSUPPORTED_FREQUENCY_FOR_PREFERRED_ROUTINE"
          });
        }

        const available =
          new Set(
            Array.isArray(availableDays)
              ? availableDays
              : []
          );

        const direct =
          preferred.filter((day) =>
            available.has(day)
          );

        if (direct.length === count) {
          return Object.freeze({
            days: Object.freeze(direct),
            complete: true,
            usedFallback: false
          });
        }

        const remaining = Weekday
          .filter((day) =>
            available.has(day) &&
            !direct.includes(day)
          )
          .sort((a, b) => {
            const aSaturday =
              a === "sat" ? 1 : 0;
            const bSaturday =
              b === "sat" ? 1 : 0;

            if (aSaturday !== bSaturday) {
              return aSaturday - bSaturday;
            }

            return (
              WeekdayIndex[a] -
              WeekdayIndex[b]
            );
          });

        const filled = [
          ...direct,
          ...remaining.slice(
            0,
            Math.max(0, count - direct.length)
          )
        ].sort((a, b) =>
          WeekdayIndex[a] -
          WeekdayIndex[b]
        );

        return Object.freeze({
          days: Object.freeze(filled),
          complete:
            filled.length === count,
          usedFallback: true
        });
      }

      function chooseLongRunDay(runDays) {
        const days = new Set(runDays || []);

        if (days.has("sun")) return "sun";
        if (days.has("sat")) return "sat";

        return null;
      }

      function chooseStrengthDay(
        availableDays,
        occupiedDays = []
      ) {
        const available =
          new Set(availableDays || []);
        const occupied =
          new Set(occupiedDays || []);

        for (
          const day
          of StrengthDayPreference
        ) {
          if (
            available.has(day) &&
            !occupied.has(day)
          ) {
            return day;
          }
        }

        return null;
      }

      function hardStimulusSeparationOk(
        hardDays,
        previousWeekHardDays = []
      ) {
        const current = [...new Set(hardDays || [])]
          .filter((day) =>
            day in WeekdayIndex
          )
          .sort((a, b) =>
            WeekdayIndex[a] -
            WeekdayIndex[b]
          );

        const violations = [];

        for (let i = 1; i < current.length; i++) {
          const gap =
            weekdayDistance(
              current[i - 1],
              current[i]
            );

          if (gap != null && gap < 2) {
            violations.push(
              Object.freeze({
                type: "WITHIN_WEEK",
                from: current[i - 1],
                to: current[i],
                dayGap: gap
              })
            );
          }
        }

        const previous =
          [...new Set(previousWeekHardDays || [])]
            .filter((day) =>
              day in WeekdayIndex
            );

        for (const prev of previous) {
          for (const cur of current) {
            const crossGap =
              (7 - WeekdayIndex[prev]) +
              WeekdayIndex[cur];

            if (crossGap < 2) {
              violations.push(
                Object.freeze({
                  type: "CROSS_WEEK",
                  from: prev,
                  to: cur,
                  dayGap: crossGap
                })
              );
            }
          }
        }

        return Object.freeze({
          ok: violations.length === 0,
          violations:
            Object.freeze(violations)
        });
      }

      function buildWeeklySkeleton({
        availableDays = [],
        desiredRunDays = null,
        raceDay = null,
        includeStrength = true,
        previousWeekHardDays = [],
        doublesPreference = "avoid"
      } = {}) {
        const available = Object.freeze(
          [...new Set(
            (availableDays || [])
              .filter((day) =>
                Weekday.includes(day)
              )
          )]
        );

        const raceWeek =
          raceDay != null;

        const requestedRunDays =
          raceWeek
            ? Math.min(
                Number(desiredRunDays) || 3,
                3
              )
            : Number(desiredRunDays);

        const runRoutine =
          preferredRunDays(
            requestedRunDays,
            available
          );

        const runDays =
          [...runRoutine.days];

        if (
          raceDay &&
          available.includes(raceDay) &&
          !runDays.includes(raceDay)
        ) {
          if (
            runDays.length >=
            requestedRunDays
          ) {
            runDays.pop();
          }
          runDays.push(raceDay);
          runDays.sort((a, b) =>
            WeekdayIndex[a] -
            WeekdayIndex[b]
          );
        }

        const longRunDay =
          raceWeek
            ? null
            : chooseLongRunDay(runDays);

        const roles = {};

        for (const day of Weekday) {
          roles[day] = "rest";
        }

        for (const day of runDays) {
          roles[day] =
            day === longRunDay
              ? "long_run"
              : "easy_aerobic_recovery";
        }

        if (raceDay) {
          roles[raceDay] = "race";
        }

        const qualityCandidates =
          runDays.filter((day) =>
            day !== longRunDay &&
            day !== raceDay
          );

        let primaryQualityDay = null;

        for (const day of qualityCandidates) {
          const proposedHardDays = [
            day,
            ...(raceDay ? [raceDay] : []),
            ...(longRunDay ? [longRunDay] : [])
          ];

          if (
            hardStimulusSeparationOk(
              proposedHardDays,
              previousWeekHardDays
            ).ok
          ) {
            primaryQualityDay = day;
            break;
          }
        }

        if (primaryQualityDay) {
          roles[primaryQualityDay] =
            "primary_quality";
        }

        const occupied =
          Object.entries(roles)
            .filter(([, role]) =>
              role !== "rest"
            )
            .map(([day]) => day);

        const strengthDay =
          includeStrength
            ? chooseStrengthDay(
                available,
                occupied
              )
            : null;

        if (strengthDay) {
          roles[strengthDay] = "strength";
        }

        const hardDays = Object.entries(roles)
          .filter(([, role]) =>
            [
              "race",
              "long_run",
              "primary_quality",
              "secondary_quality"
            ].includes(role)
          )
          .map(([day]) => day);

        const separation =
          hardStimulusSeparationOk(
            hardDays,
            previousWeekHardDays
          );

        return Object.freeze({
          availableDays: available,
          desiredRunDays:
            Number.isFinite(requestedRunDays)
              ? requestedRunDays
              : null,
          raceWeek,
          raceDay,
          runDays: Object.freeze(runDays),
          longRunDay,
          primaryQualityDay,
          secondaryQualityDay: null,
          strengthDay,
          saturdayProtected:
            roles.sat === "rest",
          roles: Object.freeze(roles),
          hardDays:
            Object.freeze(hardDays),
          hardSeparation: separation,
          doubles: Object.freeze({
            preference:
              DoublesPreference.includes(
                doublesPreference
              )
                ? doublesPreference
                : null,
            used: false,
            allowed:
              doublesPreference !== "avoid"
          }),
          complete:
            runRoutine.complete &&
            separation.ok,
          dependencies: Object.freeze({
            desiredRunDays:
              Number.isFinite(requestedRunDays)
                ? "available"
                : "pending",
            secondaryQualityPlacement:
              "pending_prescription_core",
            doublesNeedAssessment:
              doublesPreference === "avoid"
                ? "not_needed"
                : "pending"
          })
        });
      }

      function forcedLowDoseWeek(weekType) {
        return LowDoseWeekTypes.includes(

      function resolveDoseLevel({
        requestedDose = "MEDIUM",
        weekType = null,
        baseLevel = null,
        existingHighCount = 0,
        specificProgressAdvanced = false
      } = {}) {
        if (forcedLowDoseWeek(weekType)) {
          return Object.freeze({
            dose: "LOW",
            reason: "FORCED_LOW_WEEK"
          });
        }

        const requested =
          DoseLevel.includes(requestedDose)
            ? requestedDose
            : "MEDIUM";

        if (requested !== "HIGH") {
          return Object.freeze({
            dose: requested,
            reason: "REQUEST_ACCEPTED"
          });
        }

        if (
          baseLevel !== "HIGH" ||
          Number(existingHighCount) >= 1 ||
          specificProgressAdvanced !== true
        ) {
          return Object.freeze({
            dose: "MEDIUM",
            reason: "HIGH_NOT_ALLOWED"
          });
        }

        return Object.freeze({
          dose: "HIGH",
          reason: "HIGH_ALLOWED"
        });
      }

      function prescriptionProfile(
        family,
        dose

        const profile =
          PrescriptionProfiles[family];

        if (!profile) return null;

        const selectedDose =
          DoseLevel.includes(dose)
            ? dose
            : null;

        if (!selectedDose) return null;

        return profile[selectedDose] || null;
      }

      function specificGoalWeight({
        phase,
        phaseProgress = 0,
        goalAssessmentStatus = null
      } = {}) {
        const progress =
          Math.max(
            0,
            Math.min(1, Number(phaseProgress) || 0)
          );

        const limited =
          goalAssessmentStatus ===
            "NOT_SUPPORTED_CURRENTLY" ||
          goalAssessmentStatus ===
            "PREPARATION_INSUFFICIENT";

        if (phase === "development") {
          if (limited) return 0.20;
          return 0.20 + 0.30 * progress;
        }

        if (phase === "specific") {
          if (limited) return 0.45;
          return 0.50 + 0.50 * progress;
        }

        if (phase === "taper") {
          return 0.95 + 0.05 * progress;
        }

        if (phase === "race") {
          return 1;
        }

        return 0;
      }

      function interpolateSpecificPace({
        currentPaceSecKm,
        targetPaceSecKm,
        goalWeight
      } = {}) {
        const current =
          Number(currentPaceSecKm);
        const target =
          Number(targetPaceSecKm);
        const weight =
          Number(goalWeight);

        if (
          !Number.isFinite(current) ||
          !Number.isFinite(target) ||
          !Number.isFinite(weight) ||
          current <= 0 ||
          target <= 0
        ) {
          return null;
        }

        const bounded =
          Math.max(0, Math.min(1, weight));

        return (
          current * (1 - bounded) +
          target * bounded
        );
      }

            match.evidenceSufficient === true

        const normalized =

        if (

          isIsoDate(session?.date) &&

        return Object.freeze({

            if (change?.patch?.deleted === true) {

          manualAuthority: true,
          adaptiveRequiresAcceptance: true

      function buildExecutionReconciliation({

      function normalizeAdaptiveSignal(
        source = {}
      ) {
        const action =
          AdaptiveDetectedAction.includes(
            source.action
          )
            ? source.action

        return Object.freeze({
          id:
            source.id != null
              ? String(source.id)

      function resolveAdaptiveProposal(
        signal
      ) {
        const normalized =
          normalizeAdaptiveSignal(signal);

        if (!normalized.action) {
          return Object.freeze({
            valid: false,
            proposalAction: null,
            requiresUserDecision: true,
            autoApplied: false,
            remoteWriteAllowed: false
          });
        }

        const map = Object.freeze({
          CANCEL: "CANCEL",
          SOFTEN: "SOFTEN",
          SUBSTITUTE: "SUBSTITUTE",
          MOVE: "MOVE",
          MOVE_REQUEST: "MOVE",
          PROGRESSION_HOLD: "HOLD",
          CONSOLIDATE: "HOLD",
          REENTRY_BLOCK: "REVIEW",
          ANCHOR_REFRESH: "REVIEW",
          AVAILABILITY_REMAP: "REVIEW"
        });

        return Object.freeze({
          valid: true,
          signalId: normalized.id,
          sessionId: normalized.sessionId,
          detectedAction: normalized.action,
          proposalAction:
            map[normalized.action],
          reason: normalized.reason,
          targetDate: normalized.targetDate,
          substituteFamily:
            normalized.substituteFamily,
          evidence: normalized.evidence,
          requiresUserDecision: true,
          autoApplied: false,
          remoteWriteAllowed: false
        });
      }

      function buildAdaptiveRecommendations(
        signals = []
      ) {
        const proposals =
          (signals || [])
            .map(resolveAdaptiveProposal)
            .filter((proposal) =>
              proposal.valid
            );

        return Object.freeze({
          consultative: true,
          autoApplied: false,
          remoteWriteAllowed: false,
          proposals: Object.freeze(
            proposals
          )
        });
      }

      function decideAdaptiveProposal({
        proposal,
        accepted
      } = {}) {
        if (!proposal?.valid) {
          return Object.freeze({
            status: "INVALID_PROPOSAL",
            accepted: false,
            applicable: false,
            change: null
          });
        }

        if (accepted !== true) {
          return Object.freeze({
            status: "REJECTED",
            accepted: false,
            applicable: false,
            change: null
          });
        }

        const patchByAction = {
          MOVE:
            proposal.targetDate
              ? {
                  date:
                    proposal.targetDate
                }
              : null,
          SOFTEN: {
            adaptation: "soften"
          },
          SUBSTITUTE:
            proposal.substituteFamily
              ? {
                  family:
                    proposal.substituteFamily
                }
              : {
                  adaptation:
                    "substitute_review"
                },
          CANCEL: {
            cancelled: true
          },
          HOLD: {
            adaptation: "hold"
          },
          SWAP: {
            adaptation: "swap"
          },
          REVIEW: {
            adaptation: "review"
          }
        };

        return Object.freeze({
          status: "ACCEPTED",
          accepted: true,
          applicable:
            proposal.sessionId != null,
          change:
            proposal.sessionId != null
              ? Object.freeze({
                  accepted: true,
                  sessionId:
                    proposal.sessionId,
                  patch:
                    Object.freeze(
                      patchByAction[
                        proposal.proposalAction
                      ] || {
                        adaptation: "review"
                      }
                    )
                })
              : null
        });
      }

            adaptiveChanges,

      function adherenceCredit({
        outcome,
        completionRatio = null,
        reliableProportion = false,
        mainRace = false,
        extraActivity = false
      } = {}) {
        if (
          mainRace === true ||
          extraActivity === true ||
          outcome === "PENDING" ||
          outcome === "NOT_EXPECTED"
        ) {
          return 0;
        }

        if (
          [
            "COMPLETED_AS_PLANNED",
            "COMPLETED_BETTER_THAN_PLANNED",
            "COMPLETED_HARDER_THAN_EXPECTED",
            "COMPLETED_EASIER_THAN_EXPECTED"
          ].includes(outcome)
        ) {
          return 1;
        }

        if (outcome === "COMPLETED_PARTIALLY") {
          if (
            reliableProportion === true &&
            Number.isFinite(Number(completionRatio))
          ) {
            return Math.max(
              0.4,
              Math.min(
                0.8,
                Number(completionRatio)
              )
            );
          }

          return 0.6;
        }

        if (
          [
            "FAILED_TARGET",
            "ABORTED",
            "NOT_COMPLETED"
          ].includes(outcome)
        ) {
          return 0;
        }

        return null;

      function planHealthBand(score) {
        const value = Number(score);

        if (!Number.isFinite(value)) {
          return null;

        if (value >= 90) return "Excelente";
        if (value >= 80) return "Buena";
        if (value >= 70) return "Aceptable";
        if (value >= 55) return "Irregular";
        return "Deficiente";

      function buildPlanHealth({
        adherence = null,

          volume,
          strength,
          consistency

        const available = Object.entries(dimensions)
          .filter(([, value]) =>
            Number.isFinite(Number(value))

        if (available.length !== 5) {
          return Object.freeze({
            available: false,
            score: null,
            band: null,
            windowDays: 28,
            dimensions,
            reason: "INSUFFICIENT_DATA"

        const bounded = Object.fromEntries(
          Object.entries(dimensions).map(
            ([key, value]) => [
              key,
              Math.max(
                0,
                Math.min(100, Number(value))
              )
            ]
          )
        );

        const score =
          bounded.adherence *
            PlanHealthWeights.adherence +
          bounded.keySessions *
            PlanHealthWeights.keySessions +
          bounded.volume *
            PlanHealthWeights.volume +
          bounded.strength *
            PlanHealthWeights.strength +
          bounded.consistency *
            PlanHealthWeights.consistency;

      function stableSerialize(value) {
        if (value === null) return "null";

        const type = typeof value;

        if (
          type === "number" ||
          type === "boolean"
        ) {
          return JSON.stringify(value);
        }

        if (type === "string") {
          return JSON.stringify(value);
        }

        if (Array.isArray(value)) {
          return (
            "[" +
            value
              .map(stableSerialize)
              .join(",") +
            "]"
          );
        }

        if (type === "object") {
          const keys = Object.keys(value)
            .sort();

          return (
            "{" +
            keys
              .map((key) =>
                JSON.stringify(key) +
                ":" +
                stableSerialize(value[key])
              )
              .join(",") +
            "}"
          );
        }

        return JSON.stringify(null);
      }

      function deterministicFingerprint(
        value
      ) {
        const text = stableSerialize(value);

        let hash = 2166136261;

        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(
            hash,
            16777619
          );
        }

        return (
          "fnv1a32:" +
          (hash >>> 0)
            .toString(16)
            .padStart(8, "0")
        );
      }

        });
      }

      function clampNumber(
        value,
        min,
        max
      ) {
        return Math.max(
          min,
          Math.min(max, value)
        );
      }

      function initialVolumeStepKm(
        habitualVolumeKm
      ) {
        const habitual =
          Number(habitualVolumeKm);

        if (
          !Number.isFinite(habitual) ||
          habitual < 0
        ) {
          return null;
        }

        return clampNumber(
          Math.round(
            habitual * 0.06
          ),
          2,
          5
        );
      }

      function peakDemandForGoal(
        distanceKey,
        targetTimeSec
      ) {
        const rows =
          PeakDemandProfiles[
            distanceKey
          ];

        const target =
          Number(targetTimeSec);

        if (
          !rows ||
          !Number.isFinite(target) ||
          target <= 0
        ) {
          return null;
        }

        const row =
          rows.find((item) =>
            target <= item.maxTimeSec
          ) || null;

        return row
          ? Object.freeze({
              distanceKey,
              targetTimeSec: target,
              peakKm: row.peakKm,
              longRunKm:
                row.longRunKm,
              maxRunDays:
                row.maxRunDays
            })
          : null;
      }

      function addIsoDays(
        isoDate,
        days
      ) {
        if (!isIsoDate(isoDate)) return null;

        const date = new Date(
          isoDate + "T12:00:00Z"
        );

        date.setUTCDate(
          date.getUTCDate() +
          Number(days || 0)
        );

        return date
          .toISOString()
          .slice(0, 10);
      }

      function isoWeekdayKey(
        isoDate
      ) {
        if (!isIsoDate(isoDate)) {
          return null;
        }

        const keys = [
          "sun",
          "mon",
          "tue",
          "wed",
          "thu",
          "fri",
          "sat"
        ];

        const date = new Date(
          isoDate + "T12:00:00Z"
        );

        return keys[
          date.getUTCDay()
        ];
      }

      function enumeratePlanWeeks({
        startDate,
        raceDate
      } = {}) {
        if (
          !isIsoDate(startDate) ||
          !isIsoDate(raceDate) ||
          raceDate < startDate
        ) {
          return Object.freeze([]);
        }

        const weeks = [];
        let cursor = startDate;
        let index = 0;

        while (cursor <= raceDate) {
          const weekStart =
            index === 0
              ? cursor
              : cursor;

          const weekMonday =
            startOfIsoWeek(
              weekStart
            );

          const weekSunday =
            addIsoDays(
              weekMonday,
              6
            );

          const endDate =
            weekSunday < raceDate
              ? weekSunday
              : raceDate;

          weeks.push(
            Object.freeze({
              index,
              startDate:
                weekStart,
              endDate,
              initialPartial:
                index === 0 &&
                weekStart !==
                  weekMonday,
              containsRace:
                raceDate >=
                  weekStart &&
                raceDate <=
                  endDate
            })
          );

          if (endDate >= raceDate) {
            break;
          }

          cursor =
            addIsoDays(
              endDate,
              1
            );

          index += 1;
        }

        return Object.freeze(
          weeks
        );
      }

          enumeratePlanWeeks({
            startDate:
              normalizedPlan.startDate,
            raceDate:
              normalizedPlan.raceDate
          });

        if (!weeks.length) {
          return Object.freeze({
            available: false,
            reason:
              "NO_WEEKS",
            weeks
          });
        }

        const taperWeeks =
          Number(
            macrocycle
              ?.phases
              ?.taper
              ?.weeks
          );

        if (
          !Number.isFinite(
            taperWeeks
          ) ||
          taperWeeks < 0
        ) {
          return Object.freeze({
            available: false,
            reason:
              "TAPER_PENDING",
            weeks
          });
        }

        const raceWeekIndex =
          weeks.findIndex(
            (week) =>
              week.containsRace
          );

        const taperStartIndex =
          Math.max(
            0,
            raceWeekIndex -
              taperWeeks
          );

        const assigned =
          weeks.map((week) => {
            let phase =
              "UNASSIGNED";

            if (
              week.containsRace
            ) {
              phase =
                "race_week";
            } else if (
              week.index >=
                taperStartIndex &&
              week.index <
                raceWeekIndex
            ) {
              phase =
                "taper";
            } else if (
              week.initialPartial
            ) {
              phase =
                "initial_partial";
            }

            return Object.freeze({
              ...week,
              phase,
              weekdayStart:
                isoWeekdayKey(
                  week.startDate
                )
            });
          });

        const unresolvedWeeks =
          assigned.filter(
            (week) =>
              week.phase ===
              "UNASSIGNED"
          );

        return Object.freeze({
          available: true,
          weeks:
            Object.freeze(
              assigned
            ),
          raceWeekIndex,
          taperWeeks,
          unresolvedWeeks:
            unresolvedWeeks.length,
          phaseAllocationStatus:
            unresolvedWeeks.length
              ? "PARTIAL"
              : "COMPLETE",
          dependencies:
            Object.freeze({
              preparationDevelopmentSpecificAllocation:
                unresolvedWeeks.length
                  ? "pending_source_rule"
                  : "resolved"
            })
        });
      }

      function phaseAllocationCandidates({
        distanceKey,
        coreWeeks
      } = {}) {
        const profile =
          MacrocycleProfiles[
            distanceKey
          ];

        const total =
          Number(coreWeeks);

        if (
          !profile ||
          !Number.isInteger(total) ||
          total < 0
        ) {
          return Object.freeze([]);
        }

        const candidates = [];

        for (
          let preparation =
            profile.preparation.minWeeks;
          preparation <=
            profile.preparation.maxWeeks;
          preparation++
        ) {
          for (
            let development =
              profile.development.minWeeks;
            development <=
              profile.development.maxWeeks;
            development++
          ) {
            for (
              let specific =
                profile.specific.minWeeks;
              specific <=
                profile.specific.maxWeeks;
              specific++
            ) {
              if (
                preparation +
                  development +
                  specific !==
                total
              ) {
                continue;
              }

              candidates.push(
                Object.freeze({
                  preparation,
                  development,
                  specific
                })
              );
            }
          }
        }

        return Object.freeze(
          candidates
        );
      }

      function scorePhaseAllocationCandidate({
        candidate,
        athleteSnapshot = null,
        volumeProgression = null,
        goalAssessment = null
      } = {}) {
        if (!candidate) return null;

        const base = athleteSnapshot?.base?.effective || "MEDIUM";
        const qualityEstablished = athleteSnapshot?.qualityEstablished === true;

        const habitualVolumeKm = Number(volumeProgression?.habitualVolumeKm);
        const targetPeakKm = Number(volumeProgression?.targetPeakKm);
        const lr0Km = Number(athleteSnapshot?.longRunBase?.distanceMedianM) / 1000;
        const targetLongRunKm = Number(volumeProgression?.demand?.longRunKm);

        const volumeRatio =
          Number.isFinite(habitualVolumeKm) &&
          Number.isFinite(targetPeakKm) &&
          targetPeakKm > 0
            ? habitualVolumeKm / targetPeakKm
            : null;

        const longRunRatio =
          Number.isFinite(lr0Km) &&
          Number.isFinite(targetLongRunKm) &&
          targetLongRunKm > 0
            ? lr0Km / targetLongRunKm
            : null;

        let preparationWeight = 1;
        let developmentWeight = 1;
        let specificWeight = 1;

        if (base === "LOW") {
          preparationWeight += 3;
          developmentWeight += 2;
        } else if (base === "MEDIUM") {
          preparationWeight += 1;
          developmentWeight += 3;
          specificWeight += 1.5;
        } else if (base === "HIGH") {
          developmentWeight += 2;
          specificWeight += 3;
        }

        if (qualityEstablished) {
          specificWeight += 1.5;
        } else {
          preparationWeight += 0.75;
          developmentWeight += 0.75;
        }

        if (volumeRatio != null) {
          if (volumeRatio < 0.65) {
            preparationWeight += 2;
            developmentWeight += 1;
          } else if (volumeRatio < 0.85) {
            developmentWeight += 1.5;
          } else {
            specificWeight += 1.25;
          }
        }

        if (longRunRatio != null) {
          if (longRunRatio < 0.60) {
            preparationWeight += 2;
            developmentWeight += 1;
          } else if (longRunRatio < 0.80) {
            developmentWeight += 1.5;
          } else {
            specificWeight += 1.5;
          }
        }

        const goalStatus = goalAssessment?.status || null;

        if (
          goalStatus === "PREPARATION_INSUFFICIENT" ||
          goalStatus === "NOT_SUPPORTED_CURRENTLY"
        ) {
          preparationWeight += 1.5;
          developmentWeight += 2;
          specificWeight -= 1;
        } else if (goalStatus === "DEMANDING") {
          developmentWeight += 1.5;
        } else if (goalStatus === "SUPPORTED") {
          specificWeight += 1;
        }

        const score =
          candidate.preparation * preparationWeight +
          candidate.development * developmentWeight +
          candidate.specific * specificWeight;

        return Object.freeze({
          candidate,
          score,
          weights: Object.freeze({
            preparation: preparationWeight,
            development: developmentWeight,
            specific: specificWeight
          }),
          signals: Object.freeze({
            base,
            qualityEstablished,
            volumeRatio,
            longRunRatio,
            goalStatus
          })
        });
      }

      function chooseAutomaticPhaseAllocation({
        candidates = [],
        athleteSnapshot = null,
        volumeProgression = null,
        goalAssessment = null
      } = {}) {
        if (!Array.isArray(candidates) || !candidates.length) return null;

        const ranked = candidates
          .map((candidate) =>
            scorePhaseAllocationCandidate({
              candidate,
              athleteSnapshot,
              volumeProgression,
              goalAssessment
            })
          )
          .filter(Boolean)
          .sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            if (b.candidate.development !== a.candidate.development) {
              return b.candidate.development - a.candidate.development;
            }
            if (b.candidate.specific !== a.candidate.specific) {
              return b.candidate.specific - a.candidate.specific;
            }
            return a.candidate.preparation - b.candidate.preparation;
          });

        const best = ranked[0];

        return best
          ? Object.freeze({
              selected: best.candidate,
              score: best.score,
              weights: best.weights,
              signals: best.signals,
              ranked: Object.freeze(ranked)
            })
          : null;
      }

      function resolvePhaseAllocation({
        planInput = null,
        macrocycle = null,
        canonicalCalendar = null,
        athleteSnapshot = null,
        volumeProgression = null,
        goalAssessment = null
      } = {}) {
        const normalizedPlan = createPlanInput(planInput || {});
        const validation = validatePlanInput(normalizedPlan);

        if (!validation.valid) {
          return Object.freeze({
            status: "INVALID_INPUT",
            selected: null,
            candidates: Object.freeze([]),
            coreWeeks: null
          });
        }

        if (!canonicalCalendar?.available) {
          return Object.freeze({
            status: "CALENDAR_PENDING",
            selected: null,
            candidates: Object.freeze([]),
            coreWeeks: null
          });
        }

        const coreWeeks = canonicalCalendar.weeks
          .filter((week) => week.phase === "UNASSIGNED")
          .length;

        const candidates = phaseAllocationCandidates({
          distanceKey: normalizedPlan.distanceKey,
          coreWeeks
        });

        const chosen = normalizedPlan.phaseAllocationChoice;

        if (chosen && candidates.length) {
          const matched = candidates.find((candidate) =>
            candidate.preparation === chosen.preparation &&
            candidate.development === chosen.development &&
            candidate.specific === chosen.specific
          ) || null;

          if (matched) {
            return Object.freeze({
              status: "USER_SELECTED",
              selected: matched,
              candidates,
              coreWeeks,
              source: "EXPLICIT_USER_DECISION"
            });
          }
        }

        if (candidates.length === 1) {
          return Object.freeze({
            status: "UNIQUE",
            selected: candidates[0],
            candidates,
            coreWeeks,
            source: "MACROCYCLE_RANGE_CONSTRAINTS"
          });
        }

        if (candidates.length > 1) {
          const automatic = chooseAutomaticPhaseAllocation({
            candidates,
            athleteSnapshot,
            volumeProgression,
            goalAssessment
          });

          if (automatic?.selected) {
            return Object.freeze({
              status: "AUTO_SELECTED",
              selected: automatic.selected,
              candidates,
              coreWeeks,
              source: "ATLAS_AUTOMATIC_MACROSTRUCTURE_POLICY",
              decision: Object.freeze({
                score: automatic.score,
                weights: automatic.weights,
                signals: automatic.signals,
                ranked: automatic.ranked
              })
            });
          }

          return Object.freeze({
            status: "MULTIPLE_VALID",
            selected: null,
            candidates,
            coreWeeks,
            source: "MACROCYCLE_RANGE_CONSTRAINTS",
            reason: "AUTOMATIC_SELECTOR_UNAVAILABLE"
          });
        }

        const profile = MacrocycleProfiles[normalizedPlan.distanceKey];

        const minimumCoreWeeks = profile
          ? profile.preparation.minWeeks +
            profile.development.minWeeks +
            profile.specific.minWeeks
          : null;

        const maximumCoreWeeks = profile
          ? profile.preparation.maxWeeks +
            profile.development.maxWeeks +
            profile.specific.maxWeeks
          : null;

        return Object.freeze({
          status:
            minimumCoreWeeks != null && coreWeeks < minimumCoreWeeks
              ? "INSUFFICIENT_CORE_WEEKS"
              : maximumCoreWeeks != null && coreWeeks > maximumCoreWeeks
                ? "EXCESS_CORE_WEEKS"
                : "NO_VALID_ALLOCATION",
          selected: null,
          candidates,
          coreWeeks,
          minimumCoreWeeks,
          maximumCoreWeeks
        });
      }

      function applyUniquePhaseAllocation({
        canonicalCalendar = null,
        phaseAllocation = null
      } = {}) {
        if (
          !canonicalCalendar
            ?.available ||
          !["UNIQUE", "USER_SELECTED", "AUTO_SELECTED"].includes(
            phaseAllocation?.status
          ) ||
          !phaseAllocation.selected
        ) {
          return Object.freeze({
            applied: false,
            calendar:
              canonicalCalendar,
            reason:
              "UNIQUE_ALLOCATION_REQUIRED"
          });
        }

        const {
          preparation,
          development,
          specific
        } = phaseAllocation.selected;

        let remainingPreparation =
          preparation;
        let remainingDevelopment =
          development;
        let remainingSpecific =
          specific;

        const weeks =
          canonicalCalendar.weeks
            .map((week) => {
              if (
                week.phase !==
                "UNASSIGNED"
              ) {
                return week;
              }

              let phase = null;

              if (
                remainingPreparation >
                0
              ) {
                phase = "preparation";
                remainingPreparation--;
              } else if (
                remainingDevelopment >
                0
              ) {
                phase = "development";
                remainingDevelopment--;
              } else if (
                remainingSpecific > 0
              ) {
                phase = "specific";
                remainingSpecific--;
              }

              return Object.freeze({
                ...week,
                phase:
                  phase ||
                  "UNASSIGNED"
              });
            });

        const unresolvedWeeks =
          weeks.filter(
            (week) =>
              week.phase ===
              "UNASSIGNED"
          ).length;

        return Object.freeze({
          applied:
            unresolvedWeeks === 0,
          calendar:
            Object.freeze({
              ...canonicalCalendar,
              weeks:
                Object.freeze(weeks),
              unresolvedWeeks,
              phaseAllocationStatus:
                unresolvedWeeks === 0
                  ? "COMPLETE"
                  : "PARTIAL"
            }),
          reason:
            unresolvedWeeks === 0
              ? "UNIQUE_ALLOCATION_APPLIED"
              : "UNRESOLVED_WEEKS_REMAIN"
        });
      }

      function runDaysForPhase({
        phase,
        startRunDays,
        maximumRunDays,
        availableDaysCount = null
      } = {}) {
        const start = Number(startRunDays);
        const maximum = Number(maximumRunDays);
        const available = Number(availableDaysCount);

        if (
          !Number.isInteger(start) ||
          !Number.isInteger(maximum) ||
          start < 1 ||
          maximum < 1
        ) {
          return null;
        }

        let target = Math.min(start, maximum);

        if (phase === "development") {
          target = Math.min(maximum, start + 1);
        } else if (phase === "specific") {
          target = maximum;
        } else if (phase === "taper") {
          target = Math.min(maximum, Math.max(3, start));
        } else if (phase === "race_week") {
          target = Math.min(3, maximum);
        }

        if (
          Number.isInteger(available) &&
          available > 0
        ) {
          target = Math.min(target, available);

    function liveActivitySportFamily(activity) {
      const sport = String(
        activity?.summary?.sport ||
        activity?.sport ||
        ""
      ).toLowerCase();

      const title = String(
        activity?.summary?.title ||
        ""
      ).toLowerCase();

      if (
        sport.includes("strength") ||
        sport.includes("weight") ||
        title.includes("fuerza")
      ) {
        return "strength";
      }

      if (
        sport.includes("run") ||
        title.includes("carrera") ||
        title.includes("running")
      ) {
        return "running";
      }

      return "other";
    }

    function liveSessionSportFamily(session) {
      return session?.role === "strength"
        ? "strength"
        : "running";
    }

    function liveExecutionForPlan({
      sessions = [],
      activities = [],
      asOfDate
    } = {}) {
      const today = String(asOfDate || "");
      const results = [];

      const sessionsByDate = new Map();
      for (const session of sessions || []) {
        if (!session?.date) continue;
        const key = String(session.date);
        if (!sessionsByDate.has(key)) sessionsByDate.set(key, []);
        sessionsByDate.get(key).push(session);
      }

      const activitiesByDate = new Map();
      for (const activity of activities || []) {
        const date = String(activity?.summary?.date || "");
        if (!date) continue;
        if (!activitiesByDate.has(date)) activitiesByDate.set(date, []);
        activitiesByDate.get(date).push(activity);
      }

      for (const session of sessions || []) {
        const date = String(session?.date || "");
        if (!date) continue;

        if (today && date >= today) {
          results.push(Object.freeze({
            plannedSessionId: String(session.id),
            activityId: null,
            matchClass: null,
            completion: "PENDING",
            outcome: "PENDING",
            adherenceCreditEligible: false,
            policy: "FUTURE_OR_TODAY_PENDING"
          }));
          continue;
        }

        const family = liveSessionSportFamily(session);

        const compatible =
          (activitiesByDate.get(date) || []).filter(
            (activity) =>
              liveActivitySportFamily(activity) === family
          );

        const sameFamilySessions =
          (sessionsByDate.get(date) || []).filter(
            (candidate) =>
              liveSessionSportFamily(candidate) === family
          );

        if (
          compatible.length === 1 &&
          sameFamilySessions.length === 1
        ) {
          const activity = compatible[0];

          const reconciliation =
            AtlasTrainingEngine.buildExecutionReconciliation({
              plannedSession: session,
              match: {
                plannedSessionId: session.id,
                activityId: activity.id,
                matchClass: "strong",
                evidenceSufficient: true,
                completionRatio: 1,
                performanceSignal: "as_planned"
              }
            });

          results.push(Object.freeze({
            ...reconciliation,
            policy: "EXACT_DATE_SPORT_UNIQUE"
          }));
          continue;
        }

        if (compatible.length > 0) {
          const reconciliation =
            AtlasTrainingEngine.buildExecutionReconciliation({
              plannedSession: session,
              match: {
                plannedSessionId: session.id,
                activityId: null,
                matchClass: "ambiguous",
                evidenceSufficient: false
              }
            });

          results.push(Object.freeze({
            ...reconciliation,
            policy: "AMBIGUOUS_SAME_DATE_SPORT"
          }));
          continue;
        }

        results.push(Object.freeze({
          plannedSessionId: String(session.id),
          activityId: null,
          matchClass: null,
          completion: "UNMATCHED",
          outcome: "NOT_COMPLETED",
          adherenceCreditEligible: session.role !== "race",
          policy: "PAST_NO_COMPATIBLE_ACTIVITY"
        }));
      }

      return Object.freeze(results);
    }

    function liveAdaptiveSignalsFromExecution(
      sessions,
      execution
    ) {
      const byId = new Map(
        (sessions || []).map((session) => [
          String(session.id),
          session
        ])
      );

      const keyFailures =
        (execution || [])
          .filter((item) => {
            const session =
              byId.get(String(item.plannedSessionId));

            return (
              session?.primaryStimulus === true &&
              [
                "NOT_COMPLETED",
                "FAILED_TARGET",
                "ABORTED"
              ].includes(item.outcome)
            );
          })
          .sort((a, b) => {
            const sa = byId.get(String(a.plannedSessionId));
            const sb = byId.get(String(b.plannedSessionId));
            return String(sb?.date || "").localeCompare(
              String(sa?.date || "")
            );
          });

      if (keyFailures.length >= 2) {
        return Object.freeze([
          Object.freeze({
            id: "live:progression-hold",
            action: "PROGRESSION_HOLD",
            sessionId: keyFailures[0].plannedSessionId,
            reason: "two_recent_key_failures",
            evidence: Object.freeze({
              failedKeySessions: 2
            })
          })
        ]);
      }

      return Object.freeze([]);
    }

    function livePlanHealthFromExecution(
      sessions,
      execution
    ) {
      const byId = new Map(
        (sessions || []).map((session) => [
          String(session.id),
          session
        ])
      );

      const eligible =
        (execution || []).filter(
          (item) =>
            !["PENDING", "NOT_EXPECTED"].includes(item.outcome)
        );

      function averageCredit(rows) {
        const values = rows
          .map((item) =>
            AtlasTrainingEngine.adherenceCredit({
              outcome: item.outcome,
              mainRace:
                byId.get(String(item.plannedSessionId))?.role === "race"
            })
          )
          .filter((value) =>
            Number.isFinite(Number(value))
          );

        return values.length
          ? (
              values.reduce(
                (sum, value) => sum + Number(value),
                0
              ) / values.length
            ) * 100
          : null;
      }

      return Object.freeze({
        available: false,
        adherence: averageCredit(eligible),
        keySessions: averageCredit(
          eligible.filter(
            (item) =>
              byId.get(String(item.plannedSessionId))
                ?.primaryStimulus === true
          )
        ),
        strength: averageCredit(
          eligible.filter(
            (item) =>
              byId.get(String(item.plannedSessionId))
                ?.role === "strength"

        volume: null,
        consistency: null,
        reason:
          "VOLUME_AND_CONSISTENCY_REQUIRE_COMPLETE_DISTANCE_PRESCRIPTION",
        partial: true
      });
    }

    function auditLiveTrainingEngine({
      plan,
      sessions,
      execution,
      adaptive,
      engineResult
    } = {}) {
      const issues = [];

      const ids = (sessions || [])
        .map((session) => String(session?.id || ""))
        .filter(Boolean);

      if (new Set(ids).size !== ids.length) {
        issues.push("DUPLICATE_SESSION_ID");
      }

      for (const session of sessions || []) {
        if (
          plan?.startDate &&
          session?.date < plan.startDate
        ) {
          issues.push("SESSION_BEFORE_PLAN_START");
        }

        if (
          plan?.raceDate &&
          session?.date > plan.raceDate
        ) {
          issues.push("SESSION_AFTER_RACE");
        }
      }

      const highByWeek = new Map();
      for (const session of sessions || []) {
        if (session?.dose !== "HIGH") continue;
        const key = String(session.weekIndex);
        highByWeek.set(key, (highByWeek.get(key) || 0) + 1);
      }

      if ([...highByWeek.values()].some((count) => count > 1)) {
        issues.push("MORE_THAN_ONE_HIGH_PER_WEEK");
      }

      if (adaptive?.modifiesPlanAutomatically === true) {
        issues.push("ADAPTIVE_AUTO_MODIFICATION");
      }

      if (
        (execution || []).some(
          (item) =>
            item.matchClass === "ambiguous" &&
            item.outcome === "FAILED_TARGET"
        )
      ) {
        issues.push("AMBIGUOUS_ACTIVITY_MARKED_FAILED");
      }

      return Object.freeze({
        passed: issues.length === 0,
        issues: Object.freeze(issues),
        checks: Object.freeze({
          uniqueSessionIds: true,
          dateBounds: true,
          maxOneHighPerWeek: true,
          adaptiveConsultative: true,
          ambiguousNeverFailed: true,
          deterministicFingerprint:
            typeof engineResult?.fingerprint === "string"
        })
      });
    }

        }));

      return Object.freeze(evidence);

    function trainingEngineObserved5KFromFastestSplits(payload) {
      let best = null;
      const seen = new Set();

      const scalar = (obj, keys) => {
        for (const key of keys) {
          const value = obj?.[key];
          if (value !== null && value !== undefined && value !== "") return value;
        }
        return null;
      };

      const inferDistance = (obj, path = "") => {
        const explicit = Number(
          scalar(obj, [
            "distance",
            "distanceM",
            "distanceMeters",
            "splitDistance",
            "splitDistanceMeters"
          ])
        );
        if (Number.isFinite(explicit) && explicit > 0) return explicit;

        const label = [
          path,
          scalar(obj, ["splitType", "type", "distanceName", "name", "label"])
        ].filter(Boolean).join(" ").toLowerCase();

        if (
          label.includes("5k") ||
          label.includes("5 km") ||
          label.includes("5000")
        ) {
          return 5000;
        }

        return null;
      };

      const walk = (node, path = "") => {
        if (Array.isArray(node)) {
          node.forEach((item, index) => walk(item, `${path}[${index}]`));
          return;
        }
        if (!node || typeof node !== "object") return;

        const activityId = scalar(node, [
          "activityId",
          "activityID",
          "activity_id",
          "id"
        ]);
        const timeSec = Number(
          scalar(node, [
            "duration",
            "durationSec",
            "elapsedDuration",
            "elapsedTime",
            "time",
            "timeSec",
            "value"
          ])
        );
        const distanceM = inferDistance(node, path);

        if (
          Number.isFinite(timeSec) &&
          timeSec > 0 &&
          Number.isFinite(distanceM) &&
          Math.abs(distanceM - 5000) <= 50
        ) {
          const key = `${activityId ?? "unknown"}|${Math.round(distanceM)}|${timeSec}`;
          if (!seen.has(key)) {
            seen.add(key);
            const candidate = Object.freeze({
              timeSec,
              distanceM: 5000,
              paceSecKm: timeSec / 5,
              activityId: activityId != null ? String(activityId) : null,
              date: String(
                scalar(node, [
                  "startTimeLocal",
                  "calendarDate",
                  "date",
                  "activityDate"
                ]) || ""
              ).slice(0, 10),
              source: "garmin_fastest_split_5k"
            });
            if (!best || candidate.timeSec < best.timeSec) best = candidate;
          }
        }

        Object.entries(node).forEach(([key, value]) =>
          walk(value, path ? `${path}.${key}` : key)
        );
      };

      walk(payload);
      return best;
    }

    function trainingEngineOfficialThresholdFromChunks(
      thresholdChunks
    ) {
      const rowsByDate = new Map();
      let current = null;

      for (const chunk of thresholdChunks || []) {
        const rows = Array.isArray(chunk?.payload?.rows)
          ? chunk.payload.rows
          : [];

        for (const row of rows) {
          const date = String(row?.date || "");
          const paceSecKm = Number(row?.paceSecKm);

          if (
            !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
            !Number.isFinite(paceSecKm) ||
            paceSecKm <= 0
          ) {
            continue;
          }

          rowsByDate.set(date, {
            official: true,
            source: "garmin_official",
            date,
            paceSecKm
          });
        }

        const candidate = chunk?.payload?.current;

        if (candidate && typeof candidate === "object") {
          const date = String(
            candidate.date ||
            chunk?.endDate ||
            ""
          );
          const paceSecKm =
            Number(candidate.paceSecKm);

          if (
            /^\d{4}-\d{2}-\d{2}$/.test(date) &&
            Number.isFinite(paceSecKm) &&
            paceSecKm > 0
          ) {
            current = {
              official: true,
              source: "garmin_official",
              date,
              paceSecKm
            };
          }
        }
      }

      if (current) return Object.freeze(current);

      const latest = [...rowsByDate.values()]
        .sort((a, b) =>
          a.date.localeCompare(b.date)
        )
        .at(-1);

      return latest
        ? Object.freeze(latest)
        : null;
    }

        intelligence: null,
        trainingEngineResult: null,
        volumeProgression: null,
        canonicalCalendar: null,
        phaseAllocation: null,
        canonicalSessions: null,
        effectivePlan: null,
        liveExecution: null,
        livePlanHealth: null,
        engineAudit: null,
        garminPublications: {},
        publicationBusy: null,
        planPublicationProgress: null,
        fastestSplits: null
      };

      function routeScrollKey(route = state.route) {
        return [
          route?.tab || "today",
          route?.view || "main",
          route?.id ?? ""
        ].join("::");
      }

      function saveRouteScroll(route = state.route) {
        state.scrollPositions[routeScrollKey(route)] = window.scrollY || 0;
      }

      function hasRouteScroll(route) {
        return Object.prototype.hasOwnProperty.call(
          state.scrollPositions,
          routeScrollKey(route)
        );
      }

      function navigate(route, options = {}) {
        saveRouteScroll();

        if (!options.replace) {
          state.history.push({ ...state.route });
        }

        const nextRoute = { ...route };

        state.route = nextRoute;
        render({ scrollMode: "top" });
      }

      function goBack() {
        const previous = state.history.pop();
        if (!previous) return;

        saveRouteScroll();
        state.route = previous;
        render({ scrollMode: "restore" });
      }

      function goTab(tab) {
        saveRouteScroll();

        const nextRoute = { tab, view: "main", id: null };

        state.history = [];
        state.route = nextRoute;
        render({ scrollMode: "top" });
      }

      function navItems() {
        return [
          ["today", "☀️", "Hoy"],
          ["activities", "🏃", "Actividades"],
          ["plan", "📅", "Plan"],
          ["evolution", "📈", "Evolución"]
        ];
      }

      function sidebar() {
        return `
          <aside class="sidebar">
            <div class="brand">ATLAS</div>
            <nav class="sidebar-nav">
              ${navItems().map(([tab, icon, label]) => `
                <button class="nav-item ${state.route.tab === tab ? "active" : ""}" data-tab="${tab}">
                  <span class="nav-icon">${icon}</span>
                  <span class="nav-label">${label}</span>
                </button>
              `).join("")}
            </nav>
            <div class="sidebar-spacer"></div>
            <button class="profile-item" data-tab="profile">
              <span class="nav-icon">👤</span>
              <span class="nav-label">Perfil</span>
            </button>
          </aside>
        `;
      }

      function tabbar() {
        return `
          <div class="tabbar-wrap">
            <nav class="tabbar">
              ${navItems().map(([tab, icon, label]) => `
                <button class="${state.route.tab === tab ? "active" : ""}" data-tab="${tab}">
                  <span class="tab-icon">${icon}</span>
                  <span class="tab-label">${label}</span>
                </button>
              `).join("")}
            </nav>
          </div>
        `;
      }
