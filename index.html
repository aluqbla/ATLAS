      function planDoseLabel(value) {
        return {
          LOW:"LOW",
          MEDIUM:"MEDIUM",
          HIGH:"HIGH"
        }[value] || "";
      }

      function planFormatPaceSecKm(value) {
        const sec = Number(value);
        if (!Number.isFinite(sec) || sec <= 0) return "";
        const rounded = Math.round(sec);
        const min = Math.floor(rounded / 60);
        const rest = String(rounded % 60).padStart(2, "0");
        return `${min}:${rest}/km`;
      }

      function planPaceBandText(band) {
        if(!band)return "";
        return paceRangeText(band.fasterPaceSecKm,band.slowerPaceSecKm,true);
      }

      function planTargetPaceSecKm() {
        const plan = state.planConfig;
        const time = Number(plan?.targetTimeSec);
        const distance = Number(plan?.distanceM);

        if (
          !Number.isFinite(time) ||
          !Number.isFinite(distance) ||
          time <= 0 ||
          distance <= 0
        ) {
          return null;
        }

        return time / (distance / 1000);
      }

      function planSessionPaceText(item) {
        if (!item?.atlasEngineSession) return "";

        const family = item.atlasFamily;
        const anchors = state.paceAnchors;
        const direct=item?.atlasTargetPace;
        if(Number(direct?.paceSecKm)>0)return `${formatPaceSeconds(Number(direct.paceSecKm))} min/km`;
        if(Number(direct?.fasterPaceSecKm)>0&&Number(direct?.slowerPaceSecKm)>0)return paceRangeText(direct.fasterPaceSecKm,direct.slowerPaceSecKm,true);

        if (
          ["recovery", "easy", "aerobic"].includes(family)
        ) {
          return planPaceBandText(
            anchors?.physiological?.[family]
          );
        }

        if (family === "long_run") {
          return planPaceBandText(
            anchors?.physiological?.easy
          );
        }

        if (family === "threshold") {
          return planPaceBandText(
            anchors?.physiological?.threshold
          );
        }

        if (family === "vo2") {
          return planFormatPaceSecKm(
            anchors?.vo2?.paceSecKm
          );
        }

        const specificKey = {
          specific_5k:"5K",
          specific_10k:"10K",
          specific_half:"HALF_MARATHON",
          specific_marathon:"MARATHON"
        }[family];

        if (specificKey) {
          const current =
            planFormatPaceSecKm(
              anchors?.specific?.[specificKey]?.paceSecKm
            );

          if (current) return current;

          if (
            specificKey ===
            state.planConfig?.distanceKey
          ) {
            return planFormatPaceSecKm(
              planTargetPaceSecKm()
            );
          }
        }

        if (family === "hills") {
          return "fuerte controlado";
        }

        if (family === "fast_repetitions") {
          return "rápido y limpio";
        }

        if (family === "activation") {
          return "suave + activación";
        }

        return "";
      }

      function planSessionContextText(item) {
        if (!item?.atlasEngineSession) return "";

        const parts = [];

        const phase =
          planPhaseLabel(item.atlasPhase);
        const family =
          planFamilyLabel(item.atlasFamily);
        const dose =
          planDoseLabel(item.atlasDose);
        const pace =
          planSessionPaceText(item);

        if (phase) parts.push(phase);
        if (family && family !== item.title) parts.push(family);
        if (pace) parts.push(pace);

        return parts.join(" · ");
      }

      function planPaceReferenceRows() {
        const anchors = state.paceAnchors;
        const rows = [];

        const physiological = [
          ["Recuperación", anchors?.physiological?.recovery],
          ["Fácil", anchors?.physiological?.easy],
          ["Aeróbico", anchors?.physiological?.aerobic],
          ["Umbral", anchors?.physiological?.threshold]
        ];

        for (const [label, band] of physiological) {
          const value = planPaceBandText(band);
          if (value) rows.push({ label, value });
        }

        const vo2 =
          planFormatPaceSecKm(
            anchors?.vo2?.paceSecKm
          );
        if (vo2) {
          rows.push({
            label:"VO₂",
            value:vo2
          });
        }

        const specificKey =
          state.planConfig?.distanceKey;

        const currentSpecific =
          specificKey
            ? planFormatPaceSecKm(
                anchors?.specific?.[specificKey]?.paceSecKm
              )
            : "";

        const objectivePace =
          planFormatPaceSecKm(
            planTargetPaceSecKm()
          );

        if (currentSpecific) {
          rows.push({
            label:`Capacidad ${planDistanceLabel(specificKey)}`,
            value:currentSpecific
          });
        }

        if (objectivePace) {
          rows.push({
            label:`Objetivo ${planDistanceLabel(specificKey)}`,
            value:objectivePace
          });
        }

        return rows;
      }

      function planNativeMetric({emoji="",label="",value="—",unit=""}={}) {
        return `<div class="activity-metric">
          ${emoji?`<div class="plan-native-metric-emoji">${emoji}</div>`:""}
          <div class="activity-metric-label">${escapeHtml(label)}</div>
          <div class="activity-metric-reading">
            <div class="activity-metric-value">${escapeHtml(value||"—")}</div>
            ${unit?`<div class="activity-metric-unit">${escapeHtml(unit)}</div>`:""}
          </div>
        </div>`;
      }

      function planNativeDate(value) {
        if(!value)return"—";
        const date=new Date(`${value}T12:00:00`);
        if(Number.isNaN(date.getTime()))return"—";
        const months=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
        return `${date.getDate()} ${months[date.getMonth()]} ${String(date.getFullYear()).slice(-2)}`;
      }

      function planNativeWeeks(plan) {
        if(!plan?.startDate||!plan?.raceDate)return null;
        const a=new Date(`${plan.startDate}T12:00:00`),b=new Date(`${plan.raceDate}T12:00:00`);
        const days=Math.round((b-a)/86400000)+1;
        return days>0?Math.ceil(days/7):null;
      }

      function planNativeBasicMetrics(plan) {
        const targetPace=planFormatPaceSecKm(planTargetPaceSecKm());
        const weeks=planNativeWeeks(plan);
        return `<div class="activity-metric-grid canonical-grid-3 plan-metric-grid plan-info-metrics">
          ${canonicalMetricHtml({emoji:"📏",label:"Distancia",value:({"5K":"5","10K":"10","HALF_MARATHON":"21,1","MARATHON":"42,2"}[plan.distanceKey]||planDistanceLabel(plan.distanceKey)),unit:"km"})}
          ${canonicalMetricHtml({emoji:"⏱️",label:"Objetivo",value:targetTimeFromSeconds(plan.targetTimeSec)||"—"})}
          ${canonicalMetricHtml({emoji:"🎯",label:"Ritmo",value:targetPace?targetPace.replace(/\s*(?:min\/km|\/km)$/i,""):"—",unit:targetPace?"min/km":""})}
          ${canonicalMetricHtml({emoji:"🚀",label:"Inicio",value:planNativeDate(plan.startDate)})}
          ${canonicalMetricHtml({emoji:"🏁",label:"Carrera",value:planNativeDate(plan.raceDate)})}
          ${canonicalMetricHtml({emoji:"🗓️",label:"Duración",value:weeks?String(weeks):"—",unit:weeks?"semanas":""})}
        </div>`;
      }

      function currentRacePredictions() {
        return metric("race-predictions") || null;
      }

      function racePredictionTimeSec(distanceKey) {
        const row=currentRacePredictions();
        const key={"5K":"time5K","10K":"time10K","HALF_MARATHON":"timeHalfMarathon","MARATHON":"timeMarathon"}[distanceKey];
        const value=Number(row?.[key]);
        return Number.isFinite(value)&&value>0?value:null;
      }

      function racePredictionPaceSecKm(distanceKey) {
        const time=racePredictionTimeSec(distanceKey);
        const distance={"5K":5000,"10K":10000,"HALF_MARATHON":21097.5,"MARATHON":42195}[distanceKey];
        return time&&distance?time/(distance/1000):null;
      }

      function planNativeCurrentAbility(plan) {
        const predicted=racePredictionPaceSecKm(plan?.distanceKey);
        if(Number(predicted)>0)return planFormatPaceSecKm(Number(predicted));
        const row=state.currentAbility?.abilities?.[plan?.distanceKey];
        if(Number(row?.predictedTimeSec)>0&&Number(plan?.distanceM)>0){
          return planFormatPaceSecKm(Number(row.predictedTimeSec)/(Number(plan.distanceM)/1000));
        }
        return "—";
      }

      function planNativeStateMetrics(plan) {
        const snapshot=state.athleteSnapshot||{};
        const baseLabel={LOW:"Baja",MEDIUM:"Media",HIGH:"Alta"}[String(snapshot?.base?.effective||"")]||"—";
        const thresholdPoint=latestLactatePoint();
        const thresholdPace=thresholdPoint?formatPaceSeconds(thresholdPoint.paceSecKm):"—";
        const thresholdHr=thresholdPoint?.heartRate!=null?String(Math.round(thresholdPoint.heartRate)):"—";
        const prediction=racePredictionTimeSec(plan.distanceKey);
        const weeks=Array.isArray(snapshot.weeks)?snapshot.weeks:[];
        const avgVolume=weeks.length?weeks.reduce((sum,w)=>sum+Math.max(0,Number(w?.km||0)),0)/weeks.length:null;
        const recentLong=Math.max(0,...weeks.map(w=>Number(w?.longRunDistanceM||0)));
        const goalLabel={SUPPORTED:"Alta",DEMANDING:"Exigente",NOT_SUPPORTED_CURRENTLY:"Baja ahora",PREPARATION_INSUFFICIENT:"Muy justa",NEEDS_ANCHOR_TEST:"Pendiente"}[state.goalAssessment?.status]||"Pendiente";
        return `<div class="activity-metric-grid canonical-grid-3 plan-metric-grid plan-state-metrics">
          ${canonicalMetricHtml({emoji:"🧱",label:"Base",value:baseLabel})}
          ${canonicalMetricHtml({emoji:"🔥",label:"Umbral",value:thresholdPace,unit:thresholdPace!=="—"?"min/km":"",secondValue:thresholdHr,secondUnit:thresholdHr!=="—"?"ppm":"",extraClass:"plan-threshold-compact"})}
          ${canonicalMetricHtml({emoji:"🏁",label:"Pronóstico",value:prediction?targetTimeFromSeconds(prediction):"—"})}
          ${canonicalMetricHtml({emoji:"📈",label:"Volumen",value:Number.isFinite(avgVolume)?compactNumber(avgVolume,1):"—",unit:Number.isFinite(avgVolume)?"km":""})}
          ${canonicalMetricHtml({emoji:"↗️",label:"Tirada larga",value:recentLong>0?compactNumber(recentLong/1000,1):"—",unit:recentLong>0?"km":""})}
          ${canonicalMetricHtml({emoji:"🎯",label:"Estado objetivo",value:goalLabel})}
        </div>`;
      }

      function planNativeCurrentRacePace(key) {
        // One source of truth for Plan, Profile and session prescription:
        // Training Engine pace anchors first; Garmin prediction only as fallback.
        const anchor = state.paceAnchors?.specific?.[key];
        if (Number(anchor?.paceSecKm) > 0) {
          return planFormatPaceSecKm(Number(anchor.paceSecKm));
        }

        const row = state.currentAbility?.abilities?.[key];
        const meters = {
          "5K": 5000,
          "10K": 10000,
          "HALF_MARATHON": 21097.5,
          "MARATHON": 42195
        }[key];
        if (Number(row?.predictedTimeSec) > 0 && meters) {
          return planFormatPaceSecKm(
            Number(row.predictedTimeSec) / (meters / 1000)
          );
        }

        const garminPrediction = racePredictionPaceSecKm(key);
        return Number(garminPrediction) > 0
          ? planFormatPaceSecKm(Number(garminPrediction))
          : "—";
      }

      function planPaceMetric({emoji,label,band=null,exact=null}={}) {
        let main="—", second="", range=false;
        if(band && Number(band.fasterPaceSecKm)>0 && Number(band.slowerPaceSecKm)>0){
          main=formatPaceSeconds(band.fasterPaceSecKm);second=formatPaceSeconds(band.slowerPaceSecKm);range=true;
        }else if(Number(exact)>0){main=formatPaceSeconds(Number(exact));}
        return `<article class="plan-pace-card ${range?"range":"exact"}"><div class="plan-pace-label"><span>${emoji}</span><span>${escapeHtml(label)}</span></div><div class="plan-pace-value">${range?`<span>${escapeHtml(main)}</span><span class="plan-pace-separator">–</span><span>${escapeHtml(second)}</span>`:`<span>${escapeHtml(main)}</span>`}<small>min/km</small></div></article>`;
      }

      function planNativePaceMetrics() {
        const p=state.paceAnchors?.physiological||{};
        const race=(key)=>{
          const anchor=state.paceAnchors?.specific?.[key];
          if(Number(anchor?.paceSecKm)>0)return Number(anchor.paceSecKm);
          const txt=planNativeCurrentRacePace(key);
          const m=String(txt||"").match(/(\d+):(\d{2})/);
          return m?Number(m[1])*60+Number(m[2]):null;
        };
        const thresholdPoint=latestLactatePoint();
        const thresholdSec=Number(thresholdPoint?.paceSecKm);
        const profileBand=(fastFactor,slowFactor)=>Number(thresholdSec)>0?{
          fasterPaceSecKm:thresholdSec/fastFactor,
          slowerPaceSecKm:thresholdSec/slowFactor
        }:null;
        // These bands are the same boundaries shown in Profile (Z1-Z5), so a new
        // official lactate-threshold pace updates Plan and Profile together.
        const recovery=profileBand(.78,.68);
        const easy=profileBand(.88,.78);
        const aerobic=profileBand(.96,.88);
        const threshold=profileBand(1.02,.96);
        const vo2=profileBand(1.11,1.02);
        return `<div class="plan-pace-grid">
          ${planPaceMetric({emoji:"🫧",label:"Recuperación",band:recovery||p.recovery})}
          ${planPaceMetric({emoji:"🌿",label:"Fácil",band:easy||p.easy})}
          ${planPaceMetric({emoji:"🌤️",label:"Aeróbico",band:aerobic||p.aerobic})}
          ${planPaceMetric({emoji:"🏁",label:"Maratón",exact:race("MARATHON")})}
          ${planPaceMetric({emoji:"🏁",label:"Media",exact:race("HALF_MARATHON")})}
          ${planPaceMetric({emoji:"🔥",label:"Umbral",band:threshold||p.threshold})}
          ${planPaceMetric({emoji:"⚡",label:"10K",exact:race("10K")})}
          ${planPaceMetric({emoji:"🚀",label:"5K",exact:race("5K")})}
          ${planPaceMetric({emoji:"💨",label:"VO₂ máx.",band:vo2})}
        </div>`;
      }

      function planNativePurpose(session) {
        const family=String(session?.family||"");
        const texts={
          recovery:"Rodaje deliberadamente muy suave para favorecer la recuperación entre estímulos y mantener la continuidad sin añadir fatiga relevante.",
          easy:"Rodaje cómodo para acumular volumen útil y sostener la frecuencia semanal sin interferir con las sesiones clave.",
          aerobic:"Rodaje continuo y estable para desarrollar la resistencia aeróbica con un esfuerzo claramente controlado.",
          threshold:"Trabajo alrededor del umbral para acumular tiempo de calidad con ritmo, técnica y respiración estables.",
          vo2:"Intervalos de alta intensidad para desarrollar la potencia aeróbica manteniendo una ejecución homogénea.",
          fast_repetitions:"Trabajo breve de velocidad y economía para mejorar coordinación, reactividad y calidad de zancada.",
          hills:"Trabajo de fuerza específica de carrera mediante esfuerzos en pendiente con ejecución fuerte y controlada.",
          long_run:"Sesión principal de durabilidad aeróbica para mejorar la resistencia muscular y la tolerancia a volúmenes mayores.",
          activation:"Sesión corta previa a competir para mantener movilidad, coordinación y sensación de velocidad sin generar fatiga."
        };
        if(family.startsWith("specific_"))return"Trabajo específico para convertir la capacidad actual en rendimiento útil para la carrera objetivo.";
        return texts[family]||session?.purpose||"Sesión integrada en la progresión del plan.";
      }

      function renderPlanSession(item, options = {}) {
        const actual=options.activity||null;
        const isPlanned=options.planned===true;
        const completed=options.completed??trainingCompleted(item);
        const summary=actual?.summary||{};
        const id=actual?.id??null;
        const date=summary.date??item?.date??null;
        const title=summary.title??item?.title??"Entrenamiento";
        const sport=summary.sport??item?.sport??"other";
        const distanceM=summary.distanceM??item?.estimatedDistanceM??null;
        const durationSec=summary.durationSec??item?.estimatedDurationSec??null;
        const status=isPlanned&&completed?"✅":null;
        const meta=[];
        if(Number(distanceM)>0)meta.push(formatDistance(distanceM));
        if(Number(durationSec)>0)meta.push(formatCardDuration(durationSec));
        const pace=actual?formatCardPace(distanceM,durationSec):planSessionPaceText(item);
        if(pace)meta.push(pace);
        return activityCardHtml({id,date,title,sport,distanceM,durationSec,pace:false,status,context:null,metaParts:meta,planSessionId:!id&&item?.atlasEngineSession?item.id:null});
      }

      function planEngineSessionById(sessionId) {
        const id = String(sessionId || "");

        const effective =
          state.effectivePlan?.valid &&
          Array.isArray(state.effectivePlan.sessions)
            ? state.effectivePlan.sessions
            : [];

        const canonical =
          state.canonicalSessions?.available &&
          Array.isArray(state.canonicalSessions.sessions)
            ? state.canonicalSessions.sessions
            : [];

        return (
          effective.find((session) =>
            String(session?.id) === id
          ) ||
          canonical.find((session) =>
            String(session?.id) === id
          ) ||
          null
        );
      }

      function planFormatSecondsRange(minSec, maxSec) {
        const min = Number(minSec);
        const max = Number(maxSec);

        if (
          !Number.isFinite(min) ||
          !Number.isFinite(max)
        ) {
          return "";
        }

        const toMin = (sec) => {
          const value = sec / 60;
          return Number.isInteger(value)
            ? `${value} min`
            : `${value.toLocaleString("es-ES", {
                maximumFractionDigits:1
              })} min`;
        };

        return min === max
          ? toMin(min)
          : `${toMin(min)}–${toMin(max)}`;
      }

      function planFormatMetersRange(minM, maxM) {
        const min = Number(minM);
        const max = Number(maxM);

        if (
          !Number.isFinite(min) ||
          !Number.isFinite(max)
        ) {
          return "";
        }

        const fmt = (m) =>
          m >= 1000
            ? `${(m / 1000).toLocaleString("es-ES", {
                maximumFractionDigits:1
              })} km`
            : `${Math.round(m)} m`;

        return min === max
          ? fmt(min)
          : `${fmt(min)}–${fmt(max)}`;
      }

      function planPrescriptionText(prescription) {
        if (!prescription) return "";

        const parts = [];

        const timeRange =
          planFormatSecondsRange(
            prescription.workMinSec,
            prescription.workMaxSec
          );

        const distanceRange =
          planFormatMetersRange(
            prescription.workMinM,
            prescription.workMaxM
          );

        if (timeRange) {
          parts.push(`Trabajo ${timeRange}`);
        }

        if (distanceRange) {
          parts.push(`Trabajo ${distanceRange}`);
        }

        if (
          Array.isArray(prescription.repetitionM) &&
          prescription.repetitionM.length
        ) {
          parts.push(
            `Repeticiones ${prescription.repetitionM
              .map((value) =>
                Number(value) >= 1000
                  ? `${Number(value) / 1000} km`
                  : `${Number(value)} m`
              )
              .join(" / ")}`
          );
        } else if (
          Number.isFinite(
            Number(prescription.repetitionM)
          )
        ) {
          parts.push(
            `Repeticiones ${Number(prescription.repetitionM)} m`
          );
        }

        if (
          Number.isFinite(
            Number(prescription.recoveryWorkRatio)
          )
        ) {
          parts.push(
            `Recuperación ${Math.round(
              Number(prescription.recoveryWorkRatio) * 100
            )}% del trabajo`
          );
        }

        const recoveryLabel = {
          easy_jog:"trote suave",
          full_walk_or_jog:"completa andando o trotando",
          easy_downhill:"bajada suave",
          not_proportional_short_interval:"recuperación corta no proporcional"
        }[prescription.recoveryMode];

        if (recoveryLabel) {
          parts.push(`Recuperación ${recoveryLabel}`);
        }

        const intensityLabel = {
          fast_clean_not_maximal:"rápido, limpio y no máximo",
          strong_controlled:"fuerte y controlado"
        }[prescription.intensity];

        if (intensityLabel) {
          parts.push(intensityLabel);
        }

        return parts.join(" · ");
      }

      function planStructureRows(session) {
        const structure =
          session?.structure;

        if (!structure) return [];

        const rows = [];

        if (structure.warmup) {
          const distance =
            Number(structure.warmup.distanceM);

          rows.push({
            title:"Calentamiento",
            meta:
              Number.isFinite(distance) && distance > 0
                ? formatDistance(distance)
                : structure.warmup.proportional
                  ? "Proporcional a la sesión"
                  : "Según prescripción"
          });
        }

        if (structure.work) {
          rows.push({
            title:"Bloque principal",
            meta:
              planPrescriptionText(
                structure.work.prescription
              ) ||
              planFamilyLabel(
                structure.work.family
              ) ||
              "Según prescripción"
          });
        }

        if (structure.cooldown) {
          const distance =
            Number(structure.cooldown.distanceM);

          rows.push({
            title:"Enfriamiento",
            meta:
              Number.isFinite(distance) && distance > 0
                ? formatDistance(distance)
                : structure.cooldown.proportional
                  ? "Proporcional a la sesión"
                  : "Según prescripción"
          });
        }

        return rows;
      }

      function planOutcomeLabel(value) {
        return {
          PENDING:"Pendiente",
          COMPLETED_AS_PLANNED:"Completado según plan",
          COMPLETED_BETTER_THAN_PLANNED:"Completado mejor de lo previsto",
          COMPLETED_PARTIALLY:"Completado parcialmente",
          COMPLETED_HARDER_THAN_EXPECTED:"Más duro de lo previsto",
          COMPLETED_EASIER_THAN_EXPECTED:"Más fácil de lo previsto",
          FAILED_TARGET:"Objetivo no alcanzado",
          ABORTED:"Interrumpido",
          NOT_COMPLETED:"No completado",
          INSUFFICIENT_DATA:"Datos insuficientes"
        }[value] || value || "Pendiente";
      }

      function planSecondaryMetric(session) {
        if (planDoseLabel(session?.dose)) {
          return {
            label:"Dosis",
            value:planDoseLabel(session.dose)
          };
        }

        if (
          Number.isFinite(Number(session?.distanceM)) &&
          Number(session.distanceM) > 0
        ) {
          return {
            label:"Distancia",
            value:formatDistance(Number(session.distanceM))
          };
        }

        return {
          label:"Dosis",
          value:"—"
        };
      }

      function planContinuousStructureRows(session, item) {
        if (
          !["easy_aerobic_recovery", "long_run"].includes(
            session?.role
          )
        ) {
          return [];
        }

        const pace = planSessionPaceText(item);

        const distance =
          Number.isFinite(Number(session.distanceM)) &&
          Number(session.distanceM) > 0
            ? formatDistance(Number(session.distanceM))
            : "";

        if (session.role === "long_run") {
          return [
            {
              title:"Tirada larga",
              meta:[
                distance,
                pace,
                "ritmo fácil"
              ].filter(Boolean).join(" · ")
            }
          ];
        }

        return [
          {
            title:
              planFamilyLabel(session.family) || "Rodaje",
            meta:[
              distance,
              pace,
              session.family === "recovery"
                ? "muy suave"
                : session.family === "aerobic"
                  ? "continuo aeróbico"
                  : "cómodo y controlado"
            ].filter(Boolean).join(" · ")
          }
        ];
      }

      function planShortDuration(sec) {
        const n=Math.max(0,Math.round(Number(sec)||0));
        if(!n)return "";
        if(n<60)return `${n}\"`;
        if(n%60===0)return `${n/60}'`;
        return n<=120?`${n}\"`:`${Math.floor(n/60)}'${String(n%60).padStart(2,"0")}\"`;
      }

      function planDistanceShort(meters) {
        const m=Number(meters);
        if(!(m>0))return "";
        if(m>=1000){
          const km=m/1000;
          return `${Number.isInteger(km)?km:km.toLocaleString("es-ES",{maximumFractionDigits:1})} km`;
        }
        return `${Math.round(m)} m`;
      }

      function planSessionDisplayTitle(session) {
        if(!session)return "Entrenamiento";
        const role=String(session.role||"");
        const family=String(session.family||"");
        const base=String(session.name||"").trim();
        if(role==="race"||role==="secondary_race")return `🏁 ${base.replace(/^🏁\\s*/,"")||"Carrera"}`;
        if(role==="strength")return base||"Fuerza";
        if(/tirada larga específica/i.test(base))return "Tirada larga específica";
        if(/progresiv/i.test(base))return "Rodaje fácil + progresivos";
        if(family==="activation")return "Activación precompetición";
        const q=planQualityRepInfo(session);
        const dose=q?(q.reps===1?planDistanceShort(q.repDistanceM):`${q.reps} x ${planDistanceShort(q.repDistanceM)}`):"";
        const prefix={
          threshold:"Umbral",
          vo2:"VO₂",
          specific_5k:"Ritmo 5K",
          specific_10k:"Ritmo 10K",
          specific_half:"Ritmo Media Maratón",
          specific_marathon:"Ritmo Maratón",
          fast_repetitions:"Repeticiones",
          hills:"Cuestas"
        }[family];
        if(prefix&&dose)return `${prefix}: ${dose}`;
        if(prefix&&Number(session?.structure?.work?.prescription?.workMinM)>0){
          const a=Number(session.structure.work.prescription.workMinM),b=Number(session.structure.work.prescription.workMaxM);
          const m=(a>0&&b>0)?(a+b)/2:a;
          return `${prefix}: ${planDistanceShort(m)}`;
        }
        if(role==="long_run"||family==="long_run")return base||"Tirada larga";
        if(family==="recovery")return "Recuperación";
        if(family==="easy")return base||"Rodaje fácil";
        if(family==="aerobic")return base||"Rodaje aeróbico";
        return base||planFamilyLabel(family)||"Entrenamiento";
      }

      function planSessionDemanding(session) {
        const family=String(session?.family||"");
        return session?.role==="long_run" || family==="long_run" || ["threshold","vo2","specific_5k","specific_10k","specific_half","specific_marathon","fast_repetitions","hills"].includes(family);
      }

      function planMoveCandidate(session,date) {
        const all=(state.effectivePlan?.valid?state.effectivePlan.sessions:state.canonicalSessions?.sessions)||[];
        const target=all.filter(s=>String(s?.id)!==String(session?.id)&&String(s?.date||"")===String(date));
        const occupied=target[0]||null;
        const baseAction=occupied?"swap":"move";
        let warning=false;
        let reason="";
        if(target.length>1){warning=true;reason="Hay varias sesiones previstas ese día.";}
        const proposed=[session,occupied].filter(Boolean);
        for(const moving of proposed){
          const proposedDate=String(moving.id)===String(session.id)?date:session.date;
          const prev=addDaysIso(proposedDate,-1),next=addDaysIso(proposedDate,1);
          const neighbors=all.filter(s=>![String(session.id),String(occupied?.id||"")].includes(String(s?.id)) && [prev,next].includes(String(s?.date||"")));
          if(neighbors.some(n=>planSessionDemanding(n)) && (planSessionDemanding(moving)||String(moving?.role||"")==="strength")){
            warning=true;
            reason=String(moving?.role||"")==="strength"?"La fuerza quedaría el día anterior o posterior a una sesión exigente o tirada larga.":"Quedaría justo antes o después de una sesión exigente o tirada larga.";
            break;
          }
        }
        return {baseAction,occupied,warning,reason,label:warning?"Revisar":(occupied?"Intercambiar":"Mover")};
      }

      function planMoveConfirmText(session,date,candidate) {
        const targetDate=new Date(`${date}T12:00:00`);
        const dateLabel=Number.isNaN(targetDate.getTime())?date:targetDate.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});
        const sourceTitle=planSessionDisplayTitle(session);
        if(candidate?.occupied){
          return `¿Intercambiar “${sourceTitle}” con “${planSessionDisplayTitle(candidate.occupied)}”?${candidate.reason?` ${candidate.reason}`:""}`;
        }
        return `¿Mover “${sourceTitle}” al ${dateLabel}?${candidate?.reason?` ${candidate.reason}`:""}`;
      }

      function parsePaceInput(value) {
        const raw=String(value||"").trim();
        if(!raw)return null;
        const parts=raw.split(/\s*-\s*/).map(x=>x.trim()).filter(Boolean);
        const parseOne=(x)=>{
          const m=x.match(/^(\d{1,2}):([0-5]\d)$/);
          return m?Number(m[1])*60+Number(m[2]):null;
        };
        if(parts.length===1){const p=parseOne(parts[0]);return p?{paceSecKm:p}:null;}
        if(parts.length===2){const a=parseOne(parts[0]),b=parseOne(parts[1]);return a&&b?{fasterPaceSecKm:Math.min(a,b),slowerPaceSecKm:Math.max(a,b)}:null;}
        return null;
      }

      function planTargetPaceInput(session,item) {
        const direct=session?.targetPace;
        if(Number(direct?.paceSecKm)>0)return formatPaceSeconds(direct.paceSecKm);
        if(Number(direct?.fasterPaceSecKm)>0&&Number(direct?.slowerPaceSecKm)>0)return paceRangeText(direct.fasterPaceSecKm,direct.slowerPaceSecKm,false);
        const text=planSessionPaceText(item)||"";
        return text.replace(/\s*(?:min\/km|\/km)$/i,"");
      }

      async function persistManualSessionPatches(entries=[]) {
        const plan=state.planConfig;
        if(!plan||!entries.length)return;
        const map=new Map((plan.manualChanges||[]).map(change=>[String(change.sessionId),{...change,patch:{...(change.patch||{})}}]));
        for(const entry of entries){
          const id=String(entry.sessionId||"");
          if(!id)continue;
          const previous=map.get(id);
          map.set(id,{sessionId:id,accepted:true,patch:{...(previous?.patch||{}),...(entry.patch||{})}});
        }
        const next=AtlasTrainingEngine.createPlanInput({...plan,manualChanges:[...map.values()],phaseAllocationChoice:null});
        await AtlasApp.persistPlan(next);
      }

      async function persistManualSessionPatch(sessionId,patch) {
        return persistManualSessionPatches([{sessionId,patch}]);
      }

      function plannedQualityChart(session,item) {
        const structure=session?.structure;
        const work=structure?.work?.prescription;
        if(!work || !["threshold","vo2","specific_5k","specific_10k","specific_half","specific_marathon","fast_repetitions","hills"].includes(String(session?.family||"")))return "";
        const paceText=planSessionPaceText(item);
        const paceMatch=paceText.match(/(\d+):(\d{2})(?:-(\d+):(\d{2}))?/);
        if(!paceMatch)return "";
        const p1=Number(paceMatch[1])*60+Number(paceMatch[2]);
        const p2=paceMatch[3]?Number(paceMatch[3])*60+Number(paceMatch[4]):p1;
        const workPace=(p1+p2)/2;
        const easy=state.paceAnchors?.physiological?.easy;
        const easyPace=Number(easy?.fasterPaceSecKm)>0&&Number(easy?.slowerPaceSecKm)>0?(Number(easy.fasterPaceSecKm)+Number(easy.slowerPaceSecKm))/2:workPace*1.25;
        const repCandidates=Array.isArray(work.repetitionM)?work.repetitionM:[work.repetitionM].filter(Boolean);
        const rep=Number(repCandidates[Math.floor(repCandidates.length/2)]||1000);
        const workTotal=Number(work.workDistanceM)>0?Number(work.workDistanceM):(Number(work.workMinM)>0&&Number(work.workMaxM)>0?(Number(work.workMinM)+Number(work.workMaxM))/2:rep*(Number(work.reps)||4));
        const reps=Math.max(1,Number(work.reps)||Math.round(workTotal/rep));
        const mainStep=(session.steps||[]).find(step=>String(step?.section||"").toLowerCase()==="main")||{};
        const recoverySec=Number(mainStep.recoverySec||0);
        const recoveryEstimate=Number(mainStep.recoveryDistanceMEstimate)>0?Number(mainStep.recoveryDistanceMEstimate):(recoverySec>0?Math.max(50,Math.round((recoverySec/easyPace*1000)/10)*10):0);
        const warm=Number(structure?.warmup?.distanceM)||2000;
        const cool=Number(structure?.cooldown?.distanceM)||2000;
        const synthetic=[{number:1,distanceM:warm,durationSec:(warm/1000)*easyPace}];
        for(let i=0;i<reps;i++){
          synthetic.push({number:synthetic.length+1,distanceM:rep,durationSec:(rep/1000)*workPace});
          if(i<reps-1&&recoveryEstimate>0)synthetic.push({number:synthetic.length+1,distanceM:recoveryEstimate,durationSec:recoverySec>0?recoverySec:(recoveryEstimate/1000)*easyPace});
        }
        synthetic.push({number:synthetic.length+1,distanceM:cool,durationSec:(cool/1000)*easyPace});
        return `<div class="card">${lapsPaceChart(synthetic)}</div>`;
      }

      function planStructureSummaryLines(session,item) {
        if(String(session?.role||"")==="strength") {
          const exercises=Array.isArray(session?.strengthExercises)?session.strengthExercises:[];
          return exercises.map((exercise)=>{
            const dose=exercise.timeSec>0?`${exercise.sets} x ${exercise.timeSec}"`:`${exercise.sets} x ${exercise.reps}${exercise.laterality==="unilateral"?"/lado":""}`;
            return `${exercise.name} · ${dose} · R${planShortDuration(exercise.restSec||0)}`;
          });
        }
        const pace=planSessionPaceText(item)||"—";
        const structure=session?.structure;
        const quality=planQualityRepInfo(session);
        const family=String(session?.family||"");
        const isQuality=Boolean(quality)||["threshold","vo2","specific_5k","specific_10k","specific_half","specific_marathon","fast_repetitions","hills"].includes(family)||/específica/i.test(String(session?.name||""));
        if(!isQuality){
          const distance=Number(session?.distanceM)>0?planDistanceShort(session.distanceM):"Sesión";
          return [`${distance} @ ${pace}`];
        }
        const lines=[];
        const easyBand=state.paceAnchors?.physiological?.easy;
        const easyPace=planPaceBandText(easyBand)||"ritmo fácil";
        const warm=Number(structure?.warmup?.distanceM)||Number((session.steps||[]).find(x=>x.section==="warmup")?.distanceM)||0;
        if(warm>0)lines.push(`🔥 ${planDistanceShort(warm)} @ ${easyPace}`);
        const main=(session.steps||[]).find(x=>String(x?.section||"").toLowerCase()==="main")||null;
        if(quality){
          const recoverySec=Number(main?.recoverySec||0);
          const recovery=recoverySec>0?` R${planShortDuration(recoverySec)} trote`:"";
          lines.push(`⚡ ${quality.reps} x (${planDistanceShort(quality.repDistanceM)} @ ${pace}${recovery})`);
        }else if(main?.distanceM||main?.workDistanceM){
          lines.push(`⚡ ${planDistanceShort(main.workDistanceM||main.distanceM)} @ ${pace}`);
        }else{
          const work=structure?.work?.prescription;
          const m=Number(work?.workMinM)>0&&Number(work?.workMaxM)>0?(Number(work.workMinM)+Number(work.workMaxM))/2:Number(work?.workMinM||0);
          lines.push(`⚡ ${m>0?planDistanceShort(m):planFamilyLabel(family)} @ ${pace}`);
        }
        const cool=Number(structure?.cooldown?.distanceM)||Number((session.steps||[]).find(x=>x.section==="cooldown")?.distanceM)||0;
        if(cool>0)lines.push(`❄️ ${planDistanceShort(cool)} @ ${easyPace}`);
        return lines;
      }

      function planQualityRepInfo(session) {
        const exact=(session?.steps||[]).find(step=>Number(step?.reps)>0&&Number(step?.repDistanceM)>0);
        if(exact)return {repDistanceM:Number(exact.repDistanceM),reps:Number(exact.reps)};
        const prescription=session?.structure?.work?.prescription;
        if(!prescription)return null;
        const candidates=Array.isArray(prescription.repetitionM)
          ? prescription.repetitionM
          : [prescription.repetitionM].filter(Boolean);
        const repDistanceM=Number(candidates[Math.floor(candidates.length/2)]||0);
        if(!(repDistanceM>0))return null;
        const workMin=Number(prescription.workMinM),workMax=Number(prescription.workMaxM);
        const workTotal=workMin>0&&workMax>0?(workMin+workMax)/2:null;
        if(!(workTotal>0))return null;
        return {repDistanceM,reps:Math.max(1,Math.round(workTotal/repDistanceM))};
      }

      function planMoveConsequenceText(session,date) {
        if(!session||!/^\d{4}-\d{2}-\d{2}$/.test(String(date||"")))return "Selecciona una fecha para comprobar el cambio.";
        const weekDates=Array.from({length:7},(_,i)=>addDaysIso(startOfIsoWeek(date),i));
        const weekday=["sun","mon","tue","wed","thu","fri","sat"][new Date(`${date}T12:00:00`).getDay()];
        if(!availabilityForWeek(weekDates).includes(weekday))return "Ese día no está disponible en esa semana.";
        const sameWeek=startOfIsoWeek(session.date)===startOfIsoWeek(date);
        const occupied=planTrainingRows().filter(item=>String(item?.id)!==String(session.id)&&String(item?.date||"")===String(date)).length;
        if(occupied>0)return `El entrenamiento coincidirá con ${occupied} sesión${occupied===1?"":"es"} ya prevista${occupied===1?"":"s"} ese día.`;
        return sameWeek
          ? "El cambio mantiene el volumen de la misma semana y modifica únicamente la distribución de días."
          : "El cambio trasladará carga entre semanas; ATLAS mantendrá intacto el pasado y el resto del plan efectivo.";
      }

      function planSessionPublicationFingerprint(session) {
        return AtlasTrainingEngine.deterministicFingerprint({
          id:String(session?.id||""),
          date:String(session?.date||""),
          name:String(session?.name||""),
          distanceM:Number(session?.distanceM)||null,
          durationSec:Number(session?.durationSec)||null,
          targetPace:session?.targetPace||null,
          strengthLevel:session?.strengthLevel||null,
          strengthVariant:session?.strengthVariant||null,
          strengthExercises:Array.isArray(session?.strengthExercises)?session.strengthExercises:[],
          steps:Array.isArray(session?.steps)?session.steps:[]
        });
      }

      function planSessionGarminEligible(session) {
        if(!session || !session.id || !/^\d{4}-\d{2}-\d{2}$/.test(String(session.date||""))) return false;
        if(String(session.date)<localDate(0)) return false;
        if(session.role==="race" || session.role==="secondary_race") return false;
        return Number(session.distanceM)>0 || Number(session.durationSec)>0 || (Array.isArray(session.steps)&&session.steps.length>0) || (Array.isArray(session.strengthExercises)&&session.strengthExercises.length>0);
      }

      function paceTargetForGarmin(pace) {
        const sec=Number(pace?.paceSecKm);
        if(!(sec>10)) return null;
        const slow=Math.max(20,sec+5), fast=Math.max(15,sec-5);
        return {
          targetType:{workoutTargetTypeId:6,workoutTargetTypeKey:"pace.zone",displayOrder:1},
          targetValueOne:1000/slow,
          targetValueTwo:1000/fast
        };
      }

      function garminExecutableStep({order,typeKey,distanceM=null,durationSec=null,pace=null,description=null}) {
        const stepTypes={warmup:[1,1],cooldown:[2,2],interval:[3,3],recovery:[4,4]};
        const [stepTypeId,displayOrder]=stepTypes[typeKey]||stepTypes.interval;
        const distance=Number(distanceM)>0;
        const duration=Number(durationSec)>0;
        const target=paceTargetForGarmin(pace);
        return {
          type:"ExecutableStepDTO",
          stepOrder:order,
          stepType:{stepTypeId,stepTypeKey:typeKey,displayOrder},
          endCondition:distance
            ? {conditionTypeId:3,conditionTypeKey:"distance",displayOrder:3,displayable:true}
            : duration
              ? {conditionTypeId:2,conditionTypeKey:"time",displayOrder:2,displayable:true}
              : {conditionTypeId:1,conditionTypeKey:"lap.button",displayOrder:1,displayable:true},
          ...(distance?{endConditionValue:Number(distanceM)}:duration?{endConditionValue:Number(durationSec)}:{}),
          targetType:target?.targetType||{workoutTargetTypeId:1,workoutTargetTypeKey:"no.target",displayOrder:1},
          ...(target?{targetValueOne:target.targetValueOne,targetValueTwo:target.targetValueTwo}:{}),
          ...(description?{description:String(description).slice(0,250)}:{})
        };
      }

      function garminStrengthExerciseStep(exercise, order) {
        const timed=Number(exercise?.timeSec)>0;
        return {
          type:"ExecutableStepDTO",
          stepOrder:order,
          stepType:{stepTypeId:3,stepTypeKey:"interval",displayOrder:3},
          endCondition:timed
            ? {conditionTypeId:2,conditionTypeKey:"time",displayOrder:2,displayable:true}
            : {conditionTypeId:10,conditionTypeKey:"reps",displayOrder:10,displayable:true},
          endConditionValue:timed?Number(exercise.timeSec):Math.max(1,Number(exercise?.reps)||1),
          targetType:{workoutTargetTypeId:1,workoutTargetTypeKey:"no.target",displayOrder:1},
          category:String(exercise?.garminCategory||"UNKNOWN"),
          ...(exercise?.garminExerciseName?{exerciseName:String(exercise.garminExerciseName)}:{}),
          description:String(exercise?.technicalCue||"").slice(0,120)
        };
      }

      function garminStrengthRestStep(seconds, order) {
        return {
          type:"ExecutableStepDTO",
          stepOrder:order,
          stepType:{stepTypeId:5,stepTypeKey:"rest",displayOrder:5},
          endCondition:{conditionTypeId:2,conditionTypeKey:"time",displayOrder:2,displayable:true},
          endConditionValue:Math.max(15,Number(seconds)||60),
          targetType:{workoutTargetTypeId:1,workoutTargetTypeKey:"no.target",displayOrder:1}
        };
      }

      function strengthSessionToGarminWorkout(session) {
        const sportType={sportTypeId:5,sportTypeKey:"strength_training",displayOrder:5};
        const exercises=Array.isArray(session?.strengthExercises)?session.strengthExercises:[];
        if(!exercises.length)return null;
        const workoutSteps=[];
        let order=1;
        for(const exercise of exercises){
          const sets=Math.max(1,Math.round(Number(exercise?.sets)||1));
          const child=[garminStrengthExerciseStep(exercise,1)];
          if(Number(exercise?.restSec)>0)child.push(garminStrengthRestStep(exercise.restSec,2));
          if(sets>1){
            workoutSteps.push({
              type:"RepeatGroupDTO",stepOrder:order++,
              stepType:{stepTypeId:6,stepTypeKey:"repeat",displayOrder:6},
              numberOfIterations:sets,workoutSteps:child,
              endCondition:{conditionTypeId:7,conditionTypeKey:"iterations",displayOrder:7,displayable:false},
              endConditionValue:sets,smartRepeat:false,skipLastRestStep:true
            });
          }else{
            workoutSteps.push({...child[0],stepOrder:order++});
          }
        }
        return {
          workoutName:`ATLAS · ${String(planSessionDisplayTitle(session)||"Fuerza").slice(0,70)}`,
          sportType,estimatedDurationInSecs:Math.max(0,Math.round(Number(session.durationSec)||0)),
          description:"ATLAS · Fuerza para correr",
          workoutSegments:[{segmentOrder:1,sportType,workoutSteps}]
        };
      }

      function planSessionToGarminWorkout(session) {
        if(!planSessionGarminEligible(session)) return null;
        if(String(session?.role||"")==="strength") return strengthSessionToGarminWorkout(session);
        const sportType={sportTypeId:1,sportTypeKey:"running",displayOrder:1};
        const sourceSteps=Array.isArray(session.steps)?session.steps:[];
        const steps=[];
        let order=1;
        const push=(step)=>{steps.push(step);order+=1;};

        for(const source of sourceSteps){
          const section=String(source?.section||"").toLowerCase();
          if(section==="warmup"){
            push(garminExecutableStep({order,typeKey:"warmup",distanceM:source.distanceM,durationSec:source.durationSec,pace:source.pace,description:"Calentamiento"}));
            continue;
          }
          if(section==="cooldown"){
            const openEnded=source?.openEnded===true || session?.structure?.cooldown?.openEnded===true;
            push(garminExecutableStep({order,typeKey:"cooldown",distanceM:openEnded?null:source.distanceM,durationSec:openEnded?null:source.durationSec,pace:source.pace,description:"Enfriamiento"}));
            continue;
          }
          const reps=Math.max(1,Math.round(Number(source?.reps)||1));
          const repDistance=Number(source?.repDistanceM)>0?Number(source.repDistanceM):(reps===1&&Number(source?.distanceM)>0?Number(source.distanceM):null);
          const repDuration=Number(source?.workSec)>0?Number(source.workSec):(reps===1&&Number(source?.durationSec)>0?Number(source.durationSec):null);
          const recoverySec=Number(source?.recoverySec)>0?Number(source.recoverySec):0;
          if(reps>1 && (repDistance||repDuration)){
            const child=[];
            child.push(garminExecutableStep({order:1,typeKey:"interval",distanceM:repDistance,durationSec:repDuration,pace:source.pace||session.targetPace,description:"Trabajo"}));
            if(recoverySec>0) child.push(garminExecutableStep({order:2,typeKey:"recovery",durationSec:recoverySec,description:"Recuperación"}));
            steps.push({
              type:"RepeatGroupDTO",
              stepOrder:order++,
              stepType:{stepTypeId:6,stepTypeKey:"repeat",displayOrder:6},
              numberOfIterations:reps,
              workoutSteps:child,
              endCondition:{conditionTypeId:7,conditionTypeKey:"iterations",displayOrder:7,displayable:false},
              endConditionValue:reps,
              smartRepeat:false,
              skipLastRestStep:false
            });
          }else{
            push(garminExecutableStep({order,typeKey:"interval",distanceM:repDistance||source.distanceM||session.distanceM,durationSec:repDuration,pace:source.pace||session.targetPace,description:source.label}));
          }
        }

        if(!steps.length){
          push(garminExecutableStep({order,typeKey:"interval",distanceM:session.distanceM,durationSec:session.durationSec,pace:session.targetPace,description:session.purpose}));
        }

        return {
          workoutName:`ATLAS · ${String(planSessionDisplayTitle(session)||"Entrenamiento").replace(/^🏁\s*/,"").slice(0,70)}`,
          sportType,
          estimatedDurationInSecs:Math.max(0,Math.round(Number(session.durationSec)||0)),
          description:"ATLAS",
          workoutSegments:[{segmentOrder:1,sportType,workoutSteps:steps}]
        };
      }

      function publicationSummary() {
        const sessions=planTrainingRows().map(item=>planEngineSessionById(item.id)).filter(Boolean).filter(planSessionGarminEligible);
        const rows=state.garminPublications||{};
        const published=sessions.filter(s=>rows[String(s.id)]?.workoutId).length;
        const stale=sessions.filter(s=>{
          const p=rows[String(s.id)];
          return p?.workoutId && (p.fingerprint!==planSessionPublicationFingerprint(s)||p.date!==s.date);
        }).length;
        const missing=Math.max(0,sessions.length-published);
        return {eligible:sessions.length,published,stale,missing,needsUpdate:(published>0&&(stale>0||missing>0)),fullyPublished:sessions.length>0&&published===sessions.length&&stale===0};
      }

        const diff=Math.round((current-start)/604800000);

      function automaticMacrostructureSummary() {
        const allocation = state.phaseAllocation;

        if (
          allocation?.status !== "AUTO_SELECTED" ||
          !allocation.selected
        ) {
          return "";
        }

        const selected =
          phaseAllocationChoiceLabel(allocation.selected);

        const signals =
          allocation.decision?.signals || {};

        const reasons = [];

        if (signals.base) {
          reasons.push(`base ${signals.base}`);
        }

        if (signals.qualityEstablished === true) {
          reasons.push("calidad establecida");
        }

        if (Number.isFinite(Number(signals.volumeRatio))) {
          reasons.push(
            `volumen ${Math.round(Number(signals.volumeRatio) * 100)}% de demanda pico`

        if (Number.isFinite(Number(signals.longRunRatio))) {

        return `${selected}${reasons.length ? ` · ${reasons.join(" · ")}` : ""}`;

      function targetTimeFromSeconds(value) {
        const total = Number(value);
        if (!Number.isFinite(total) || total <= 0) return "";

        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = Math.floor(total % 60);

        if (hours > 0) {
          return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
        }

        return `${minutes}:${String(seconds).padStart(2, "0")}`;
      }

      function targetTimeToSeconds(value) {
        const raw = String(value || "").trim();

        let match = raw.match(/^(\d{1,3}):([0-5]\d)$/);
        if (match) {
          return Number(match[1]) * 60 + Number(match[2]);
        }

        match = raw.match(/^(\d{1,2}):([0-5]\d):([0-5]\d)$/);
        if (!match) return null;

        return (
          Number(match[1]) * 3600 +
          Number(match[2]) * 60 +
          Number(match[3])
        );
      }

        const diff=(a,b)=>Math.round((new Date(`${a}T12:00:00Z`)-new Date(`${b}T12:00:00Z`))/604800000);
        const min=diff(planFirst,current),max=diff(planLast,current);
        return {min,max,current:Math.max(min,Math.min(max,Number(state.planDetailWeekOffset||0)))};
      }

        const workoutDisplayDates=workoutDates.filter(date=>date>=plan.startDate&&date<=plan.raceDate);

        const stats=planEffectiveWeekStats(workoutDisplayDates);

        const section=(name,emoji,title,body,{canonicalMetrics=false,raw=false}={})=>{

      function medianValue(values) {
        const rows=(values||[]).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
        if(!rows.length)return null;
        const mid=Math.floor(rows.length/2);
        return rows.length%2?rows[mid]:(rows[mid-1]+rows[mid])/2;
      }

      function evolutionTrend(series,{higherIsBetter=true,minSamples=4,minSpanDays=10,relativeThreshold=.01}={}) {
        const rows=(series||[])
          .filter(row=>/^\d{4}-\d{2}-\d{2}$/.test(String(row?.date||""))&&Number.isFinite(Number(row?.value)))
          .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
        if(rows.length<minSamples)return {status:"INSUFFICIENT_DATA",label:"Datos insuficientes",detail:`${rows.length}/${minSamples} muestras`};
        const first=new Date(`${rows[0].date}T12:00:00`),last=new Date(`${rows[rows.length-1].date}T12:00:00`);
        const span=Math.round((last-first)/86400000);
        if(!Number.isFinite(span)||span<minSpanDays)return {status:"INSUFFICIENT_DATA",label:"Datos insuficientes",detail:`${span>=0?span:0}/${minSpanDays} días`};
        const half=Math.floor(rows.length/2);
        const before=medianValue(rows.slice(0,half).map(row=>row.value));
        const after=medianValue(rows.slice(rows.length-half).map(row=>row.value));
        if(!Number.isFinite(before)||!Number.isFinite(after)||before===0)return {status:"INSUFFICIENT_DATA",label:"Datos insuficientes",detail:"Sin comparación fiable"};
        const raw=(after-before)/Math.abs(before);
        const adjusted=higherIsBetter?raw:-raw;
        if(Math.abs(adjusted)<relativeThreshold)return {status:"STABLE",label:"Estable",detail:`${(raw*100).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:1})}%`};
        return adjusted>0
          ? {status:"IMPROVING",label:"Mejorando",detail:`${raw>=0?"+":""}${(raw*100).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:1})}%`}
          : {status:"DECLINING",label:"Bajando",detail:`${raw>=0?"+":""}${(raw*100).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:1})}%`};
      }

      function evolutionRecentSeries(id,days=28) {
        const rows=metricSeries(id);
        if(!rows.length)return [];
        const last=rows[rows.length-1]?.date||localDate(0);
        const start=addDaysIso(last,-(days-1));
        return rows.filter(row=>String(row.date||"")>=start&&String(row.date||"")<=last);
      }

      function evolutionRunningLoad(days=7,offsetDays=0) {
        const end=addDaysIso(localDate(0),-offsetDays);
        const start=addDaysIso(end,-(days-1));
        const values=state.activities
          .filter(activity=>isRunningActivity(activity))
          .filter(activity=>{
            const date=String(activity?.summary?.date||"");
            return date>=start&&date<=end;
          })
          .map(activity=>Number(activity?.summary?.trainingLoad))
          .filter(Number.isFinite);
        return values.length?values.reduce((sum,value)=>sum+value,0):null;
      }

      function evolutionLoadSeries() {
        const byDate=new Map();
        for(const activity of state.activities||[]){
          if(!isRunningActivity(activity))continue;
          const date=String(activity?.summary?.date||"");
          const load=Number(activity?.summary?.trainingLoad);
          if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(load)||load<0)continue;
          byDate.set(date,(byDate.get(date)||0)+load);
        }
        return [...byDate.entries()].map(([date,value])=>({date,value})).sort((a,b)=>a.date.localeCompare(b.date));
      }

      function evolutionAerobicEfficiencySeries() {
        const rows=[];
        for(const activity of state.activities||[]){
          if(!isRunningActivity(activity))continue;
          const s=activity?.summary||{};
          const date=String(s.date||"");
          const distanceM=Number(s.distanceM), durationSec=Number(s.durationSec), hr=Number(s.averageHR);
          if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(distanceM)||distanceM<3000||!Number.isFinite(durationSec)||durationSec<=0||!Number.isFinite(hr)||hr<90||hr>190)continue;
          const paceSecKm=durationSec/(distanceM/1000);
          const threshold=latestLactatePoint();
          const thresholdPace=Number(threshold?.paceSecKm);
          const thresholdHr=Number(threshold?.heartRate);
          if(Number.isFinite(thresholdPace)&&paceSecKm<thresholdPace*1.06)continue;
          if(Number.isFinite(thresholdHr)&&hr>thresholdHr*.93)continue;
          const speedMPerMin=distanceM/(durationSec/60);
          const value=speedMPerMin/hr;
          if(Number.isFinite(value)&&value>.4&&value<2.5)rows.push({date,value});
        }
        return rows.sort((a,b)=>a.date.localeCompare(b.date));
      }

      function evolutionPredictionHistory() {
        return (state.metrics||[]).filter(row=>row?.type==="race-predictions"&&/^\d{4}-\d{2}-\d{2}$/.test(String(row?.date||"")))
          .map(row=>({date:String(row.date),time5K:Number(row.time5K),time10K:Number(row.time10K),timeHalfMarathon:Number(row.timeHalfMarathon),timeMarathon:Number(row.timeMarathon)}))
          .filter(row=>[row.time5K,row.time10K,row.timeHalfMarathon,row.timeMarathon].some(v=>Number.isFinite(v)&&v>0))
          .sort((a,b)=>a.date.localeCompare(b.date));
      }

      function evolutionCompletedWeekVolumes(weeks=8) {
        const today=new Date(`${localDate(0)}T12:00:00`);
        const day=today.getDay()||7;
        const currentMonday=new Date(today);
        currentMonday.setDate(today.getDate()-(day-1));
        const rows=[];
        for(let w=1;w<=weeks;w++){
          const start=new Date(currentMonday); start.setDate(currentMonday.getDate()-7*w);
          const end=new Date(start); end.setDate(start.getDate()+6);
          const startIso=start.toISOString().slice(0,10),endIso=end.toISOString().slice(0,10);
          const km=state.activities.reduce((sum,activity)=>{
            const date=String(activity?.summary?.date||"");
            if(!isRunningActivity(activity)||date<startIso||date>endIso)return sum;
            return sum+(Number(activity?.summary?.distanceM)||0)/1000;
          },0);
          rows.push({date:startIso,value:km});
        }
        return rows.reverse();
      }

      function evolutionVolumeTrend() {
        const rows=evolutionCompletedWeekVolumes(8);
        if(rows.length<8)return {status:"INSUFFICIENT_DATA",label:"Datos insuficientes",detail:"Menos de 8 semanas"};
        const previous=medianValue(rows.slice(0,4).map(row=>row.value));
        const recent=medianValue(rows.slice(4).map(row=>row.value));
        if(!Number.isFinite(previous)||!Number.isFinite(recent))return {status:"INSUFFICIENT_DATA",label:"Datos insuficientes",detail:"Sin comparación fiable"};
        if(previous===0)return {status:"VOLUME_CHANGE",label:"Volumen reciente",detail:`${compactNumber(recent,1)} km/sem`};
        const change=(recent-previous)/previous*100;
        return {status:"VOLUME_CHANGE",label:Math.abs(change)<5?"Volumen estable":change>0?"Más volumen":"Menos volumen",detail:`${change>=0?"+":""}${change.toLocaleString("es-ES",{maximumFractionDigits:0})}% · 4 sem`};
      }

      function evolutionTrendChip(trend) {
        const emoji={IMPROVING:"↗️",STABLE:"→",DECLINING:"↘️",INSUFFICIENT_DATA:"·",VOLUME_CHANGE:"↔️"}[trend?.status]||"·";
        return `${emoji} ${trend?.label||"Sin datos"}${trend?.detail?` · ${trend.detail}`:""}`;
      }

      const BEST_DISTANCE_DEFS = Object.freeze([
        {key:"1K",label:"1 km",meters:1000,aliases:["1k","1000","1000m","1 km","kilometer"]},
        {key:"5K",label:"5 km",meters:5000,aliases:["5k","5000","5000m","5 km"]},
        {key:"10K",label:"10 km",meters:10000,aliases:["10k","10000","10000m","10 km"]},
        {key:"HALF",label:"Media maratón",meters:21097.5,aliases:["half","half marathon","half_marathon","21097","21097.5","21.1"]},
        {key:"MARATHON",label:"Maratón",meters:42195,aliases:["marathon","42195","42.195","42.2"]}
      ]);

      function fastestSplitScalar(obj,names){
        for(const name of names){
          const v=obj?.[name];
          if(v!==null&&v!==undefined&&v!=="")return v;
        }
        return null;
      }

      function inferFastestSplitDistance(obj,path=""){
        const explicit=Number(fastestSplitScalar(obj,["distance","distanceM","distanceMeters","splitDistance","splitDistanceMeters"]));
        if(Number.isFinite(explicit)&&explicit>0)return explicit;
        const text=[path,fastestSplitScalar(obj,["splitType","type","distanceName","name","label"])].filter(Boolean).join(" ").toLowerCase();
        for(const def of BEST_DISTANCE_DEFS){
          if(def.aliases.some(alias=>text.includes(alias)))return def.meters;
        }
        return null;
      }

      function normalizeFastestSplitsPayload(payload){
        const out=[];
        const seen=new Set();
        const walk=(node,path="")=>{
          if(Array.isArray(node)){node.forEach((item,i)=>walk(item,`${path}[${i}]`));return;}
          if(!node||typeof node!=="object")return;
          const activityId=fastestSplitScalar(node,["activityId","activityID","activity_id","id"]);
          const timeSec=Number(fastestSplitScalar(node,["duration","durationSec","elapsedDuration","elapsedTime","time","timeSec","value"]));
          const distanceM=inferFastestSplitDistance(node,path);
          if(activityId!=null&&Number.isFinite(timeSec)&&timeSec>0&&Number.isFinite(distanceM)&&distanceM>0){
            const date=String(fastestSplitScalar(node,["startTimeLocal","calendarDate","date","activityDate"])||"").slice(0,10);
            const title=String(fastestSplitScalar(node,["activityName","title","name"])||"");
            const key=`${activityId}|${Math.round(distanceM)}|${timeSec}`;
            if(!seen.has(key)){seen.add(key);out.push({activityId:String(activityId),timeSec,distanceM,date,title});}
          }
          Object.entries(node).forEach(([key,value])=>walk(value,path?`${path}.${key}`:key));
        };
        walk(payload);
        return out;
      }

      function topFastestSplits(def){
        const tolerance=Math.max(20,def.meters*.012);
        const garmin=normalizeFastestSplitsPayload(state.fastestSplits)
          .filter(row=>Math.abs(row.distanceM-def.meters)<=tolerance)
          .map(row=>({...row,source:"garmin-fastest-splits"}));
        const candidates=[...garmin,...localBestEffortCandidates(def)]
          .filter(row=>row?.activityId!=null&&Number.isFinite(Number(row.timeSec))&&Number(row.timeSec)>0);
        // One podium position per real activity. Garmin and ATLAS can report the
        // same effort with tiny distance/time differences, so activityId is the
        // canonical deduplication key and we keep the fastest representation.
        const byActivity=new Map();
        for(const row of candidates){
          const key=String(row.activityId);
          const previous=byActivity.get(key);
          if(!previous||Number(row.timeSec)<Number(previous.timeSec))byActivity.set(key,row);
        }
        return [...byActivity.values()]
          .sort((a,b)=>Number(a.timeSec)-Number(b.timeSec)||String(b.date).localeCompare(String(a.date)))
          .slice(0,3);
      }

      function topLongestRuns(){
        return state.activities.filter(activity=>isRunningActivity(activity)).map(activity=>({
          activityId:String(activity.id),distanceM:Number(activity?.summary?.distanceM)||0,timeSec:Number(activity?.summary?.durationSec)||0,date:String(activity?.summary?.date||""),title:String(activity?.summary?.title||"")
        })).filter(row=>row.distanceM>0).sort((a,b)=>b.distanceM-a.distanceM||a.timeSec-b.timeSec).slice(0,3);
      }

      function formatBestTime(seconds) {
        const total = Math.max(0, Math.round(Number(seconds) || 0));
        const h = Math.floor(total / 3600);
        const m = Math.floor((total % 3600) / 60);
        const sec = total % 60;
        return h > 0
          ? `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`
          : `${m}:${String(sec).padStart(2,"0")}`;
      }

      function localBestEffortCandidates(def) {
        const tolerance = Math.max(12, Number(def?.meters || 0) * .012);
        const out = [];
        for (const activity of state.activities || []) {
          if (!isRunningActivity(activity)) continue;
          const summary = activity?.summary || {};
          const activityDistance = Number(summary.distanceM);
          const activityTime = Number(summary.durationSec);
          if (Number.isFinite(activityDistance) && Number.isFinite(activityTime) && activityTime > 0 &&
              Math.abs(activityDistance - def.meters) <= tolerance) {
            out.push({
              activityId:String(activity.id), timeSec:activityTime, distanceM:activityDistance,
              date:String(summary.date||""), title:String(summary.title||""), source:"activity"
            });
          }
          const laps = normalizeLapRows(activity?.freshLaps);
          for (const lap of laps) {
            const d = Number(lap?.distanceM), t = Number(lap?.durationSec);

                activityId:String(activity.id), timeSec:t, distanceM:d,
                date:String(summary.date||""), title:String(summary.title||""), source:"lap"
              });
            }
          }
        }
        return out;
      }

      function evolutionPredictionComment(rows){

        const first=rows[0],last=rows[rows.length-1],defs=[["time5K","5K"],["time10K","10K"],["timeHalfMarathon","Media"],["timeMarathon","Maratón"]];
        const changes=defs.map(([key,label])=>{const a=Number(first[key]),b=Number(last[key]);return Number.isFinite(a)&&a>0&&Number.isFinite(b)&&b>0?{label,diff:b-a}:null;}).filter(Boolean);
        if(!changes.length)return "Garmin no ofrece puntos comparables suficientes para valorar la evolución.";
        const avg=changes.reduce((s,r)=>s+r.diff,0)/changes.length;
        if(Math.abs(avg)<10)return "Los pronósticos Garmin están prácticamente estables. La capacidad estimada se mantiene sin cambios relevantes.";
        if(avg<0)return `Los pronósticos Garmin mejoran de forma conjunta. La señal más clara aparece en ${changes.sort((a,b)=>a.diff-b.diff)[0].label}.`;
        return `Los pronósticos Garmin han empeorado recientemente. Conviene interpretarlo junto con carga, volumen y recuperación antes de modificar el plan.`;
      }

      function normalizeHeartRateZones(raw) {
        const candidate = raw?.data ?? raw;
        const rows = Array.isArray(candidate)
          ? candidate
          : Array.isArray(candidate?.heartRateZones)
            ? candidate.heartRateZones
            : Array.isArray(candidate?.zones)
              ? candidate.zones
              : Array.isArray(candidate?.profiles)
                ? candidate.profiles
                : (candidate && typeof candidate === "object"
                    ? Object.values(candidate).filter(value =>
                        value && typeof value === "object" &&
                        (Array.isArray(value.zoneFloors) || Array.isArray(value.zones) || value.sport)
                      )
                    : []);

        const num = value => {
          const n = Number(value);
          return Number.isFinite(n) ? n : null;
        };
        const sportLabel = value => {
          const key = String(value || "").toUpperCase();
          if (key.includes("RUN")) return "Carrera";
          if (key.includes("CYCL")) return "Ciclismo";
          if (key.includes("SWIM")) return "Natación";
          if (key === "DEFAULT" || !key) return "General";
          return String(value || "General");
        };

        return rows.map((item, index) => {
          const floorsRaw =
            item?.zoneFloors ??
            item?.zoneFloorValues ??
            item?.heartRateZoneFloors ??
            item?.floors ??
            item?.zones ??
            null;

          let floors = [];
          if (Array.isArray(floorsRaw)) {
            floors = floorsRaw.map(value => {
              if (value && typeof value === "object") {
                return num(value?.value ?? value?.floor ?? value?.zoneFloor ?? value?.heartRate);
              }
              return num(value);
            }).filter(Number.isFinite);
          }

          if (floors.length < 5) {
            const legacyFloors = [
              num(item?.zone1Floor),
              num(item?.zone2Floor),
              num(item?.zone3Floor),
              num(item?.zone4Floor),
              num(item?.zone5Floor)
            ];
            if (legacyFloors.every(Number.isFinite)) floors = legacyFloors;
          }

          const explicitZones = Array.isArray(item?.heartRateZones)
            ? item.heartRateZones
            : Array.isArray(item?.zoneRanges)
              ? item.zoneRanges
              : [];

          let ranges = explicitZones.map((zone, i) => ({
            zone: i + 1,
            min: num(zone?.minHeartRate ?? zone?.min ?? zone?.lowerLimit ?? zone?.floor),
            max: num(zone?.maxHeartRate ?? zone?.max ?? zone?.upperLimit ?? zone?.ceiling)
          })).filter(zone => zone.min != null || zone.max != null);

          const maxHr = num(item?.maxHeartRateUsed ?? item?.maxHeartRate ?? item?.maxHr);
          if (!ranges.length && floors.length >= 5) {
            ranges = floors.slice(0, 5).map((floor, i) => ({
              zone: i + 1,
              min: floor,
              max: i < 4 ? floors[i + 1] - 1 : maxHr
            }));
          }

          return Object.freeze({
            id: String(item?.id ?? item?.sport ?? item?.sportTypeKey ?? index),
            sport: sportLabel(item?.sport ?? item?.sportTypeKey ?? item?.sportType ?? item?.profileType),
            method: String(item?.trainingMethod ?? item?.method ?? item?.zoneCalculationMethod ?? ""),
            maxHeartRate: num(item?.maxHeartRateUsed ?? item?.maxHeartRate ?? item?.maxHr),
            restingHeartRate: num(item?.restingHeartRateUsed ?? item?.restingHeartRate ?? item?.restingHr),
            lactateThresholdHeartRate: num(item?.lactateThresholdHeartRateUsed ?? item?.lactateThresholdHeartRate ?? item?.lthr),
            ranges
          });
        }).filter(item => item.ranges.length);
      }

      function atlasHrZoneRows() {
        const threshold = Number(latestLactatePoint()?.heartRate);
        const profiles = Array.isArray(state.heartRateZones) ? state.heartRateZones : [];
        const running = profiles.find(item => item.sport === "Carrera") || profiles.find(item => item.sport === "General") || profiles[0] || null;
        const maxHr = Number(running?.maxHeartRate);
        if (!Number.isFinite(threshold) || threshold <= 0) {
          return {rows:[], source:"Sin umbral de lactato Garmin válido · ATLAS no inventa zonas"};
        }
        // ATLAS 6-zone model anchored to the athlete's observed lactate-threshold HR.
        // Boundaries are percentages of LTHR, not Garmin's native five-zone configuration.
        const b1=Math.round(threshold*.85);
        const b2=Math.round(threshold*.90);
        const b3=Math.round(threshold*.95);
        const b4=Math.round(threshold*1.00);
        const b5=Math.round(threshold*1.05);
        const upper=Number.isFinite(maxHr)&&maxHr>b5?Math.round(maxHr):Math.max(b5+1,Math.round(threshold*1.10));
        return {
          rows:[`≤ ${b1}`,`${b1+1}–${b2}`,`${b2+1}–${b3}`,`${b3+1}–${b4}`,`${b4+1}–${Math.min(b5,upper)}`,`${Math.min(b5,upper)+1}–${upper}`],
          source:`FC ATLAS · umbral de lactato ${Math.round(threshold)} ppm`
        };
      }

      function atlasPaceZoneRows() {
        const anchors=state.paceAnchors;
        const thresholdSec=Number(anchors?.threshold?.paceSecKm), vo2Fast=Number(anchors?.vo2?.fasterPaceSecKm), vo2Slow=Number(anchors?.vo2?.slowerPaceSecKm);
        if(!Number.isFinite(thresholdSec)||thresholdSec<=0)return {rows:[],source:"Sin umbral Garmin válido"};
        // ATLAS pace zones are anchored only to the observed lactate-threshold pace.
        // Boundaries use speed factors around threshold so Z4 remains a genuinely
        // narrow threshold band instead of stretching into VO2 pace territory.
        const z1=thresholdSec/.78;
        const z2=thresholdSec/.88;
        const z3=thresholdSec/.96;
        const z4=thresholdSec/1.02;
        const z5=thresholdSec/1.11;
        const f=v=>formatPaceSeconds(v);
        const t=latestLactatePoint();
        return {rows:[`≥ ${f(z1)}`,`${f(z2)}–${f(z1)}`,`${f(z3)}–${f(z2)}`,`${f(z4)}–${f(z3)}`,`${f(z5)}–${f(z4)}`,`< ${f(z5)}`],source:t?`Ritmo ATLAS anclado al umbral Garmin · ${f(t.paceSecKm)} min/km`:`Ritmo ATLAS · umbral Garmin`};
      }

        const body=`<div class="card zones-table-card"><table class="zones-table"><thead><tr><th>Zona</th><th>Ritmo</th><th>FC</th></tr></thead><tbody>${rows}</tbody></table><div class="zone-note">Zonas ATLAS calculadas desde tu umbral de lactato observado.</div></div>`;
        return profileCollapsible("zones","🎯","Zonas",body);

      function currentTrainingLoadFocus() {
        const row = metric("load-balance");
        const raw = row?.raw;
        if (!raw || typeof raw !== "object") return null;

        const map =
          raw?.metricsTrainingLoadBalanceDTOMap ??
          raw?.trainingLoadBalanceDTOMap ??
          raw?.loadBalanceDTOMap ??
          null;

        let device = null;
        if (map && typeof map === "object" && !Array.isArray(map)) {
          const values = Object.values(map).filter(
            value => value && typeof value === "object"
          );
          device =
            values.find(value => value?.primaryTrainingDevice === true) ??
            values[0] ??
            null;
        } else if (Array.isArray(map)) {
          device =
            map.find(value => value?.primaryTrainingDevice === true) ??
            map[0] ??
            null;
        }

        if (!device) {
          // Some Garmin responses expose a single DTO directly.
          const directKeys = [
            "monthlyLoadAerobicLow",
            "monthlyLoadAerobicHigh",
            "monthlyLoadAnaerobic"
          ];
          if (directKeys.some(key => raw?.[key] != null)) device = raw;
        }

        if (!device) return null;

        const num = value => {
          const n = Number(value);
          return Number.isFinite(n) ? n : null;
        };

        const category = (value, min, max) => {
          if (!Number.isFinite(value)) return null;
          if (Number.isFinite(min) && value < min) return "Bajo";
          if (Number.isFinite(max) && value > max) return "Alto";
          if (Number.isFinite(min) || Number.isFinite(max)) return "En rango";
          return null;
        };

        const make = (key, label) => {
          const value = num(device?.[`monthlyLoad${key}`]);
          const min = num(device?.[`monthlyLoad${key}TargetMin`]);
          const max = num(device?.[`monthlyLoad${key}TargetMax`]);
          return Object.freeze({
            label,
            value,
            min,
            max,
            status: category(value, min, max)
          });
        };

        return Object.freeze({
          date: String(device?.calendarDate || row?.date || ""),
          feedback: String(
            device?.trainingBalanceFeedbackPhrase ??
            device?.feedbackPhrase ??
            ""
          ),
          lowAerobic: make("AerobicLow", "Baja aeróbica"),
          highAerobic: make("AerobicHigh", "Alta aeróbica"),
          anaerobic: make("Anaerobic", "Anaeróbica")
        });
      }

      function renderTrainingLoadFocusSection() {

      function formatStorageBytes(bytes) {

      function renderProfile() {
