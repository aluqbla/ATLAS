<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ATLAS" />
  <meta name="application-name" content="ATLAS" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ATLAS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <style>
    :root {
      --bg: #000000;
      --surface-1: #111111;
      --surface-2: #1C1C1E;
      --surface-raised: #242426;
      --divider: #2C2C2E;

      --text: #FFFFFF;
      --text-2: #A1A1A6;
      --text-3: #636366;

      --blue: #0A84FF;
      --blue-active: #409CFF;
      --green: #30D158;
      --yellow: #FFD60A;
      --red: #FF453A;
      --cyan: #64D2FF;
      --purple: #BF5AF2;
      --orange: #FF9F0A;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;

      --sidebar: 220px;
      --sidebar-compact: 72px;
      --tabbar-height: 56px;

      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    @supports (min-height: 100dvh) {
      body,
      .app-shell {
        min-height: 100dvh;
      }

      .sidebar {
        height: 100dvh;
      }
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: calc(var(--space-6) + env(safe-area-inset-top)) var(--space-4)
               calc(var(--space-6) + env(safe-area-inset-bottom));
      border-right: 1px solid var(--divider);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .sidebar.compact {
      width: var(--sidebar-compact);
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .02em;
      padding: 0 var(--space-2) var(--space-2);
    }

    .sidebar-nav {
      display: grid;
      gap: var(--space-2);
    }

    .nav-item,
    .profile-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      text-align: left;
    }

    .nav-item.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item:hover,
    .profile-item:hover {
      background: var(--surface-1);
      color: var(--text);
    }

    .nav-icon {
      width: 24px;
      text-align: center;
      font-size: 20px;
      flex: 0 0 24px;
    }

    .nav-label {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .sidebar-spacer {
      flex: 1;
    }

    .profile-item {
      border-top: 1px solid var(--divider);
      border-radius: 0;
      padding-top: var(--space-4);
    }

    .main {
      min-width: 0;
      width: 100%;
    }

    .screen {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding:
        calc(var(--space-6) + env(safe-area-inset-top))
        max(var(--space-6), env(safe-area-inset-right))
        calc(var(--space-9) + env(safe-area-inset-bottom))
        max(var(--space-6), env(safe-area-inset-left));
    }

    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-7);
    }

    .screen-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
    }

    .activity-detail-title {
      display: flex;
      align-items: center;
      min-width: 0;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
    }

    .activity-detail-title .activity-card-emoji {
      font-size: 24px;
      margin-right: 8px;
    }

    .activity-detail-title-text {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }


    .icon-button {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      background: var(--surface-1);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }

    .header-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
    }

    .garmin-sync-button {
      position:relative;
      width:40px;
      height:40px;
      border-radius:999px;
      background:var(--surface-1);
      display:inline-grid;
      place-items:center;
      cursor:pointer;
      font-size:9px;
      font-weight:800;
      letter-spacing:-.2px;
      color:var(--text-main);
    }

    .garmin-sync-button::before {
      content:"";
      position:absolute;
      inset:2px;
      border-radius:999px;
      border:2px solid transparent;
    }

    .garmin-sync-button.syncing::before {
      border-top-color:var(--blue);
      border-right-color:var(--blue);
      animation:atlas-spin .8s linear infinite;
    }

    .garmin-sync-button.error::after {
      content:"";
      position:absolute;
      right:2px;
      top:2px;
      width:7px;
      height:7px;
      border-radius:999px;
      background:var(--red);
    }

    @keyframes atlas-spin { to { transform:rotate(360deg); } }

    .section {
      margin-top: var(--space-7);
    }

    .section:first-of-type {
      margin-top: 0;
    }

    .section-title {
      margin: 0 0 var(--space-4);
      font-size: 20px;
      font-weight: 600;
    }

    .card {
      background: var(--surface-1);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }

    .card + .card {
      margin-top: var(--space-3);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .today-metrics .metric {
      padding: clamp(10px, 2.2vw, 20px);
    }

    .today-metrics .metric-label {
      font-size: clamp(10px, 2.7vw, 13px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .today-metrics .metric-value {
      font-size: clamp(20px, 6.5vw, 34px);
      white-space: nowrap;
    }

    .today-metrics .metric-caption {
      font-size: clamp(9px, 2.4vw, 13px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* v1.0.11 · Hoy */
    .today-date-title{white-space:nowrap;letter-spacing:-.035em;font-size:clamp(18px,4.7vw,28px)}
    .today-readiness-card{cursor:default}
    .today-readiness-card:hover{background:var(--surface-1)}
    .today-primary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .today-primary-grid .activity-metric{min-width:0;padding:clamp(9px,2.3vw,16px)}
    .today-primary-grid .activity-metric-label{font-size:clamp(8px,2.15vw,12px);white-space:nowrap}
    .today-primary-grid .activity-metric-value{font-size:clamp(16px,4.6vw,25px);white-space:nowrap}
    .today-primary-grid .activity-metric-unit{font-size:clamp(8px,2vw,11px)}
    .today-primary-grid .activity-metric-subline{font-size:clamp(8px,2vw,11px);white-space:nowrap}
    .metric-range-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:12px}
    .metric-range-button{appearance:none;border:0;border-radius:999px;background:var(--surface-2);color:var(--text-2);padding:8px 5px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
    .metric-range-button.active{background:var(--blue);color:#fff}

    .today-date-title{font-size:clamp(16px,4.2vw,22px);white-space:nowrap;overflow:hidden;text-overflow:clip}
    .body-battery-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
    .body-battery-summary>div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
    .body-battery-summary strong{display:block;font-size:18px}
    .body-battery-summary span{display:block;margin-top:3px;font-size:10px;color:var(--text-3)}

    .readiness-card {
      cursor: pointer;
    }

    .readiness-card:hover {
      background: var(--surface-2);
    }

    .readiness-score-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .readiness-circle {
      width: 72px;
      height: 72px;
      min-width: 72px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 7px solid var(--text-3);
      font-size: 28px;
      font-weight: 750;
      line-height: 1;
      background: #000;
      color: var(--text-main);
    }

    .readiness-factor-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .readiness-factor {
      background: var(--surface-1);
      border-radius: var(--radius-lg);
      padding: 16px;
      min-width: 0;
    }

    .readiness-factor-name {
      font-size: 13px;
      color: var(--text-2);
    }

    .readiness-factor-value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 700;
    }

    .readiness-factor-meta {
      margin-top: 5px;
      font-size: 12px;
      color: var(--text-3);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .chart-wrap {
      width: 100%;
      overflow: hidden;
    }

    .chart-wrap svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-2);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .metric {
      background: var(--surface-1);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      min-width: 0;
      cursor: pointer;
    }

    .metric:hover {
      background: var(--surface-2);
    }

    .metric-label {
      color: var(--text-2);
      font-size: 13px;
      margin-bottom: var(--space-2);
    }

    .metric-value {
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.02em;
    }

    .metric-caption,
    .secondary {
      margin-top: var(--space-2);
      font-size: 13px;
      color: var(--text-3);
    }

    .activity-card {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 14px 0;
      border: 0;
      border-bottom: 1px solid var(--divider);
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      min-width: 0;
    }

    button.activity-card {
      cursor: pointer;
    }

    button.activity-card:hover {
      background: var(--surface-2);
    }

    .activity-card:last-child {
      border-bottom: 0;
    }

    .activity-date-block {
      width: 42px;
      margin-left: -4px;
      text-align: center;
      line-height: 1;
      flex: 0 0 auto;
    }

    .activity-date-weekday,
    .activity-date-month {
      font-size: 10px;
      line-height: 1.1;
      font-weight: 700;
      color: var(--text-3);
      letter-spacing: .04em;
    }

    .activity-date-day {
      margin: 3px 0;
      font-size: 24px;
      line-height: 1;
      font-weight: 750;
      color: var(--text-main);
    }

    .activity-card-main {
      min-width: 0;
      overflow: hidden;
    }

    .activity-card-title {
      display: flex;
      align-items: center;
      max-width: 100%;
      font-weight: 600;
      line-height: 1.18;
      white-space: nowrap;
      overflow: hidden;
      min-width: 0;
    }

    .activity-card-emoji {
      flex: 0 0 auto;
      font-size: 17px;
      line-height: 1;
      margin-right: 5px;
    }

    .activity-card-title-text {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
    }

    .activity-card-meta {
      margin-top: 5px;
      color: var(--text-2);
      font-size: 15px;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width: 520px) {
      .activity-card {
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 6px;
        padding: 12px 0;
      }

      .activity-date-block {
        width: 38px;
        margin-left: -6px;
      }

      .activity-date-day {
        font-size: 22px;
      }

      .activity-card-meta {
        font-size: 14px;
      }
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 52px;
      padding: 14px 0;
      border-bottom: 1px solid var(--divider);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-title {
      font-size: 17px;
      font-weight: 600;
    }

    .row-meta {
      margin-top: 2px;
      font-size: 13px;
      color: var(--text-2);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
    }

    .chip.blue {
      color: var(--blue-active);
    }

    .button {
      min-height: 44px;
      border-radius: var(--radius-md);
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .button:active {
      background: var(--blue-active);
    }

    .button.secondary {
      background: var(--surface-2);
      color: var(--text);
    }

    .empty {
      color: var(--text-2);
      font-size: 15px;
      line-height: 1.5;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: var(--space-5);
      color: var(--blue-active);
      background: transparent;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: 8px;
    }

    .mobile-profile {
      display: none;
    }

    .tabbar-wrap {
      display: none;
    }

    @media (max-width: 900px) {
    }

    @media (max-width: 767px) {
      .app-shell {
        display: block;
      }

      input,
      select,
      textarea {
        font-size: 16px !important;
      }

      .sidebar {
        display: none;
      }

      .screen {
        padding:
          calc(var(--space-5) + env(safe-area-inset-top))
          max(var(--space-4), env(safe-area-inset-right))
          calc(var(--tabbar-height) + 44px + env(safe-area-inset-bottom))
          max(var(--space-4), env(safe-area-inset-left));
      }

      .screen-header {
        margin-bottom: var(--space-6);
      }

      .mobile-profile {
        display: inline-grid;
      }

      .tabbar-wrap {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding:
          8px
          max(12px, env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        pointer-events: none;
        z-index: 50;
      }

      .main,
      .screen,
      .card {
        min-width: 0;
      }

      .tabbar {
        min-height: var(--tabbar-height);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 24px;
        background: rgba(28,28,30,.72);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        overflow: hidden;
        pointer-events: auto;
      }

      .tabbar button {
        background: transparent;
        color: var(--text-3);
        min-height: 56px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        cursor: pointer;
      }

      .tabbar button.active {
        color: var(--blue-active);
      }

      .tab-icon {
        font-size: 22px;
        line-height: 1;
      }

      .tab-label {
        font-size: 11px;
        font-weight: 600;
      }
    }

    @media (max-width: 420px) {
      .readiness-factor-grid {
        grid-template-columns: 1fr;
      }
    }
  
    html, body {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
    }

    input, select, textarea, button {
      touch-action: manipulation;
    }


    .activity-detail-header { margin-bottom:12px; }
    .activity-detail-title {
      display:flex; align-items:center; min-width:0; max-width:100%;
      white-space:nowrap; overflow:hidden; font-size:30px; font-weight:750;
      line-height:1.08; letter-spacing:-.025em;
    }
    .activity-detail-title .activity-card-emoji { flex:0 0 auto; font-size:30px; margin-right:9px; }
    .activity-detail-title-text { flex:1 1 auto; min-width:0; white-space:nowrap; overflow:visible; text-overflow:clip; }
    .activity-overview-grid {
      display:grid; grid-template-columns:minmax(104px,1fr) minmax(0,3fr);
      gap:8px; align-items:stretch; margin-bottom:8px;
    }
    .activity-overview-grid.no-map { grid-template-columns:1fr; }
    .activity-context-line {
      display:grid; grid-template-rows:repeat(5,minmax(0,1fr)); gap:0;
      width:100%; min-width:0; padding:8px 10px; border:0;
      border-radius:var(--radius-lg); background:var(--surface-1);
      font-size:clamp(10px,2.7vw,13px); font-weight:700; letter-spacing:-.12px;
      color:var(--text-2); overflow:hidden;
    }
    .activity-context-item {
      min-width:0; display:flex; align-items:center; white-space:nowrap; overflow:hidden;
      text-overflow:clip; text-align:left; border:0; padding:0 2px;
    }
    .activity-map {
      width:100%; height:100%; min-height:164px; border-radius:var(--radius-lg);
      overflow:hidden; background:var(--surface-1);
    }
    .activity-map .leaflet-control-attribution { background:rgba(0,0,0,.68); color:#A1A1A6; font-size:9px; }
    .activity-map .leaflet-control-attribution a { color:#64D2FF; }
    .activity-gear-row {
      display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:7px; align-items:center;
      padding:7px 1px 5px; margin:0 0 4px; background:transparent;
    }
    .activity-gear-name {
      min-width:0; font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .activity-gear-distance { font-size:12px; color:var(--text-2); white-space:nowrap; font-weight:650; }
    .activity-metric-grid,.running-dynamics-grid {
      display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:7px;
    }
    .canonical-grid-3 { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .canonical-grid-9 { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .plan-section-body > .activity-metric-grid .canonical-metric {
      min-width:0;
    }
    .plan-section-body > .activity-metric-grid .canonical-metric-label-text,
    .plan-section-body > .activity-metric-grid .activity-metric-value,
    .plan-section-body > .activity-metric-grid .activity-metric-subline {
      max-width:100%;
    }
    .canonical-metric { cursor:default; }
    .canonical-metric[data-metric] { cursor:pointer; }
    .canonical-metric .activity-metric-label {
      display:flex; align-items:center; justify-content:flex-start; gap:4px; min-width:0;

<body>
  <div id="app"></div>

  <script>
    "use strict";

    // ============================================================
    // CONFIG
    // ============================================================

    const ATLAS_CONFIG = Object.freeze({
      APP_VERSION: "1.0.21",
      DB_NAME: "ATLAS",
      DB_VERSION: 6,
      DATA_SCHEMA_VERSION: 2,
      GARMIN_BRIDGE_URL: ""
    });

    // ============================================================
    // STORAGE
    // ============================================================

    const AtlasStorage = (() => {
      let db = null;

      function open() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB no está disponible en este navegador."));
            return;
          }

          const request = indexedDB.open(ATLAS_CONFIG.DB_NAME, ATLAS_CONFIG.DB_VERSION);

          request.onupgradeneeded = (event) => {
            const database = event.target.result;

            if (!database.objectStoreNames.contains("activities")) {
              const store = database.createObjectStore("activities", { keyPath: "id" });
              store.createIndex("date", "date", { unique: false });
              store.createIndex("sport", "sport", { unique: false });
              store.createIndex("year", "year", { unique: false });
              store.createIndex("title", "title", { unique: false });
            }

            if (!database.objectStoreNames.contains("metrics")) {
              const store = database.createObjectStore("metrics", { keyPath: "id" });
              store.createIndex("type", "type", { unique: false });
              store.createIndex("date", "date", { unique: false });
            }

            if (!database.objectStoreNames.contains("training")) {
              const store = database.createObjectStore("training", { keyPath: "id" });
              store.createIndex("type", "type", { unique: false });
              store.createIndex("date", "date", { unique: false });
            }

            if (!database.objectStoreNames.contains("profile")) {
              const store = database.createObjectStore("profile", { keyPath: "id" });
              store.createIndex("type", "type", { unique: false });
            }

            if (!database.objectStoreNames.contains("settings")) {
              database.createObjectStore("settings", { keyPath: "key" });
            }

            if (!database.objectStoreNames.contains("sync")) {
              database.createObjectStore("sync", { keyPath: "key" });
            }

            if (event.oldVersion < 3 && database.objectStoreNames.contains("rawHistory")) {
              database.deleteObjectStore("rawHistory");
            }

            if (!database.objectStoreNames.contains("rawHistory")) {
              const store = database.createObjectStore("rawHistory", { keyPath: "id" });
              store.createIndex("dataset", "dataset", { unique: false });
              store.createIndex("startDate", "startDate", { unique: false });
              store.createIndex("endDate", "endDate", { unique: false });
            }

            if (!database.objectStoreNames.contains("healthDays")) {
              const store = database.createObjectStore("healthDays", { keyPath: "id" });
              store.createIndex("date", "date", { unique: true });
            }

            if (!database.objectStoreNames.contains("lactateThreshold")) {
              const store = database.createObjectStore("lactateThreshold", { keyPath: "id" });
              store.createIndex("startDate", "startDate", { unique: false });
              store.createIndex("endDate", "endDate", { unique: false });
            }

            if (!database.objectStoreNames.contains("restingHeartRateHistory")) {
              const store = database.createObjectStore("restingHeartRateHistory", { keyPath: "date" });
              store.createIndex("date", "date", { unique: true });
            }
          };

          request.onsuccess = () => {
            db = request.result;
            resolve(db);
          };

          request.onerror = () => reject(request.error);
        });
      }

      function put(storeName, value) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readwrite");
          tx.objectStore(storeName).put(value);
          tx.oncomplete = () => resolve(value);
          tx.onerror = () => reject(tx.error);
        });
      }

      function get(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readonly");
          const request = tx.objectStore(storeName).get(key);
          request.onsuccess = () => resolve(request.result ?? null);
          request.onerror = () => reject(request.error);
        });
      }

      function getAll(storeName) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readonly");
          const request = tx.objectStore(storeName).getAll();
          request.onsuccess = () => resolve(request.result ?? []);
          request.onerror = () => reject(request.error);
        });
      }

      function clear(storeName) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readwrite");
          tx.objectStore(storeName).clear();
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
      }

      function resetDatabase() {
        return new Promise((resolve, reject) => {
          try {
            if (db) {
              db.close();
              db = null;
            }
            const request = indexedDB.deleteDatabase(ATLAS_CONFIG.DB_NAME);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error || new Error("ATLAS_DB_DELETE_FAILED"));
            request.onblocked = () => reject(new Error("ATLAS_DB_DELETE_BLOCKED"));
          } catch (error) {
            reject(error);
          }
        });
      }

      return { open, put, get, getAll, clear, resetDatabase };
    })();

    // ============================================================
    // DOMAIN
    // ============================================================

    const AtlasDomain = Object.freeze({
      normalizeProfile(raw) {
        return {
          id: "athlete",
          type: "athlete",
          name: raw?.fullName || raw?.userProfileFullName || "Atleta",
          imageUrl:
            raw?.profileImageUrlMedium ||
            raw?.profileImageUrlSmall ||
            raw?.profileImageUrlLarge ||
            null,
          primaryDevice:
            raw?.primaryTrainingDevice?.deviceName ||
            raw?.primaryTrainingDevice?.displayName ||
            raw?.primaryTrainingDevice?.productDisplayName ||
            raw?.primaryTrainingDevice?.productName ||
            raw?.primaryTrainingDevice?.name ||
            null,
          level: Number(raw?.userLevel || 0),
          points: Number(raw?.userPoint || 0)
        };
      },

      normalizeActivitySummary(raw) {
        const date = raw?.startTimeLocal ? String(raw.startTimeLocal).slice(0, 10) : null;
        return {
          id: String(raw?.activityId ?? ""),
          title: raw?.activityName || "Actividad",
          date,
          year: date ? Number(date.slice(0, 4)) : null,
          sport: raw?.activityType?.typeKey || "unknown",
          distanceM: Number(raw?.distance || 0),
          durationSec: Number(raw?.duration || 0),
          calories: Number(raw?.calories || 0),
          averageHR: raw?.averageHR ?? null,
          maxHR: raw?.maxHR ?? null,
          averagePower: raw?.avgPower ?? null,
          maxPower: raw?.maxPower ?? null,
          normalizedPower: raw?.normalizedPower ?? null,
          activityVo2Max:
            raw?.vO2MaxValue ??
            raw?.vo2MaxValue ??
            null,
          averageCadence:
            raw?.averageRunningCadenceInStepsPerMinute ??
            raw?.averageRunCadence ??
            raw?.averageCadence ??
            null,
          maxCadence:
            raw?.maxRunningCadenceInStepsPerMinute ??
            raw?.maxRunCadence ??
            raw?.maxCadence ??
            null,
          averageStrideLength:
            raw?.avgStrideLength ??
            raw?.averageStrideLength ??
            null,
          averageVerticalOscillation:
            raw?.avgVerticalOscillation ??
            raw?.averageVerticalOscillation ??
            null,
          averageVerticalRatio:
            raw?.avgVerticalRatio ??
            raw?.averageVerticalRatio ??
            null,
          averageGroundContactTime:
            raw?.avgGroundContactTime ??
            raw?.averageGroundContactTime ??
            null,
          averageGroundContactBalance:
            raw?.avgGroundContactBalance ??
            raw?.averageGroundContactBalance ??
            null,
          trainingLoad: raw?.activityTrainingLoad ?? null,
          trainingEffect: raw?.aerobicTrainingEffect ?? null,
          anaerobicTrainingEffect: raw?.anaerobicTrainingEffect ?? null,
          trainingEffectLabel: raw?.trainingEffectLabel ?? null,
          workoutId: raw?.workoutId ?? null,
          eventType:
            raw?.eventType?.typeKey ??
            raw?.eventType?.key ??
            (typeof raw?.eventType === "string" ? raw.eventType : null),
          splitSummaries: Array.isArray(raw?.splitSummaries)
            ? raw.splitSummaries
            : []
        };
      },

      normalizeActivityDetail(raw) {
        const s = raw?.summaryDTO || {};
        const m = raw?.metadataDTO || {};

        return {
          raw,
          startTimeLocal: s.startTimeLocal ?? raw?.activityDTO?.startTimeLocal ?? null,
          distanceM: Number(s.distance ?? 0),
          durationSec: Number(s.duration ?? 0),
          calories: s.calories ?? null,
          averageHR: s.averageHR ?? null,
          maxHR: s.maxHR ?? null,
          averagePower: s.averagePower ?? s.avgPower ?? null,
          normalizedPower: s.normalizedPower ?? null,
          averageSpeed: s.averageSpeed ?? null,
          elevationGainM: s.elevationGain ?? s.totalElevationGain ?? null,
          minElevationM: s.minElevation ?? null,
          maxElevationM: s.maxElevation ?? null,
          averageTemperatureC: s.averageTemperature ?? s.avgTemperature ?? null,
          trainingLoad: s.activityTrainingLoad ?? null,
          trainingEffect: s.trainingEffect ?? s.aerobicTrainingEffect ?? null,
          trainingEffectLabel:
            s.trainingEffectLabel ??
            s.aerobicTrainingEffectMessage ??
            s.activityTrainingEffectLabel ??
            null,
          anaerobicTrainingEffect: s.anaerobicTrainingEffect ?? null,
          rpe:
            s.directWorkoutRpe ??
            raw?.selfEvaluationDTO?.rpe ??
            null,
          feeling:
            s.directWorkoutFeel ??
            raw?.selfEvaluationDTO?.feeling ??
            null,
          workoutId: m.associatedWorkoutId ?? null,
          equipment:
            raw?.gearDTOs ??
            raw?.activityGearDTOs ??
            raw?.gear ??
            null,
          encodedPolyline:
            raw?.geoPolylineDTO?.polyline ??
            raw?.geoPolylineDTO?.encodedPolyline ??
            null
        };
      },

      normalizeMetrics(payload, date) {
        const out = [];
        const rows = payload?.trainingReadiness?.ok ? payload.trainingReadiness.data || [] : [];
        const readiness = [...rows].sort((a, b) =>
          String(b?.timestampLocal || b?.timestamp || "").localeCompare(
            String(a?.timestampLocal || a?.timestamp || "")
          )
        )[0];

        if (readiness) out.push({
          id: `training-readiness:${date}`,
          type: "training-readiness",
          date,
          value: readiness.score ?? null,
          unit: "score",
          level: readiness.level || null,
          sleepScore: readiness.sleepScore ?? null,
          sleepScoreFactorPercent: readiness.sleepScoreFactorPercent ?? null,
          sleepScoreFactorFeedback: readiness.sleepScoreFactorFeedback ?? null,
          recoveryTimeMin: readiness.recoveryTime ?? null,
          recoveryTimeFactorPercent: readiness.recoveryTimeFactorPercent ?? null,
          recoveryTimeFactorFeedback: readiness.recoveryTimeFactorFeedback ?? null,
          acuteLoad: readiness.acuteLoad ?? null,
          acwrFactorPercent: readiness.acwrFactorPercent ?? null,
          acwrFactorFeedback: readiness.acwrFactorFeedback ?? null,
          hrvWeeklyAverage: readiness.hrvWeeklyAverage ?? null,
          hrvFactorPercent: readiness.hrvFactorPercent ?? null,
          hrvFactorFeedback: readiness.hrvFactorFeedback ?? null,
          sleepHistoryFactorPercent: readiness.sleepHistoryFactorPercent ?? null,
          sleepHistoryFactorFeedback: readiness.sleepHistoryFactorFeedback ?? null,
          stressHistoryFactorPercent: readiness.stressHistoryFactorPercent ?? null,
          stressHistoryFactorFeedback: readiness.stressHistoryFactorFeedback ?? null,
          feedbackShort: readiness.feedbackShort ?? null
        });

        const vo2 = payload?.vo2max?.ok ? payload.vo2max.data?.generic : null;
        if (vo2) out.push({
          id: `vo2max:${date}`,
          type: "vo2max",
          date,
          value: vo2.vo2MaxPreciseValue ?? vo2.vo2MaxValue ?? null,
          unit: "ml/kg/min"
        });

        const racePredictions = payload?.racePredictions?.ok
          ? payload.racePredictions.data
          : null;
        if (racePredictions) out.push({
          id: `race-predictions:${date}`,
          type: "race-predictions",
          date,
          time5K: racePredictions.time5K ?? racePredictions.raceTime5K ?? null,
          time10K: racePredictions.time10K ?? racePredictions.raceTime10K ?? null,
          timeHalfMarathon:
            racePredictions.timeHalfMarathon ??
            racePredictions.raceTimeHalfMarathon ??
            null,
          timeMarathon:
            racePredictions.timeMarathon ??
            racePredictions.raceTimeMarathon ??
            null
        });

        const hrv = payload?.hrv?.ok ? payload.hrv.data?.hrvSummary : null;
        if (hrv) out.push({
          id: `hrv:${date}`,
          type: "hrv",
          date,
          value: hrv.lastNightAvg ?? null,
          unit: "ms",
          weeklyAvg: hrv.weeklyAvg ?? null,
          baselineLow:
            hrv?.baseline?.balancedLow ??
            hrv?.baselineBalancedLow ??
            null,
          baselineHigh:
            hrv?.baseline?.balancedUpper ??
            hrv?.baselineBalancedHigh ??
            null,
          status: hrv.status || null,
          feedbackPhrase: hrv.feedbackPhrase ?? null
        });

        const sleep = payload?.sleep?.ok ? payload.sleep.data?.dailySleepDTO : null;
        if (sleep) out.push({
          id: `sleep:${date}`,
          type: "sleep",
          date,
          value: sleep.sleepScores?.overall?.value ?? null,
          unit: "score",
          durationSec: sleep.sleepTimeSeconds ?? null,
          deepSec: sleep.deepSleepSeconds ?? null,
          remSec: sleep.remSleepSeconds ?? null,
          lightSec: sleep.lightSleepSeconds ?? null,
          avgHeartRate: sleep.avgHeartRate ?? null,
          avgStress: sleep.avgSleepStress ?? null
        });

        const heartRateRow = payload?.heartRate?.ok
          ? payload.heartRate.data
          : null;
        const restingHeartRate = heartRateRow?.restingHeartRate ?? null;
        if (restingHeartRate != null) out.push({
          id: `resting-hr:${date}`,
          type: "resting-hr",
          date,
          value: restingHeartRate,
          unit: "ppm"
        });

        const stressRows = payload?.stress?.ok ? payload.stress.data || [] : [];
        const stressRow = Array.isArray(stressRows) ? stressRows[0] : null;
        const stress = stressRow?.values || null;
        if (stress?.overallStressLevel != null) out.push({
          id: `stress:${date}`,
          type: "stress",
          date,
          value: stress.overallStressLevel,
          unit: "score"
        });

        const trainingStatus = payload?.trainingStatus?.ok ? payload.trainingStatus.data : null;
        if (trainingStatus) out.push({
          id: `training-status:${date}`,
          type: "training-status",
          date,
          value:

            lastError = error;

    const AtlasTrainingEngine = (() => {
      const Distance = Object.freeze({
        "5K": Object.freeze({ key: "5K", distanceM: 5000 }),
        "10K": Object.freeze({ key: "10K", distanceM: 10000 }),
        "HALF_MARATHON": Object.freeze({
          key: "HALF_MARATHON",
          distanceM: 21097.5
        }),
        "MARATHON": Object.freeze({
          key: "MARATHON",
          distanceM: 42195
        })
      });

      const DoublesPreference = Object.freeze([
        "avoid",
        "if_needed",
        "no_preference"
      ]);

      const Weekday = Object.freeze([
        "mon", "tue", "wed", "thu", "fri", "sat", "sun"
      ]);

      function isIsoDate(value) {
        return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
      }

      function createPlanInput(source = {}) {
        const distance = Distance[source.distanceKey];

        return Object.freeze({
          name: String(source.name || "").trim(),
          distanceKey: distance?.key || null,
          distanceM: distance?.distanceM ?? null,
          startDate: String(source.startDate || ""),
          raceDate: String(source.raceDate || ""),
          targetTimeSec:
            Number.isFinite(Number(source.targetTimeSec)) &&
            Number(source.targetTimeSec) > 0
              ? Number(source.targetTimeSec)
              : null,
          availableDays: Object.freeze(
            Array.isArray(source.availableDays)
              ? [...new Set(source.availableDays)]
                  .filter((day) => Weekday.includes(day))
              : []
          ),
          doublesPreference:
            DoublesPreference.includes(source.doublesPreference)
              ? source.doublesPreference
              : null,
          phaseAllocationChoice: null,
          availabilityByWeek:
            source?.availabilityByWeek &&
            typeof source.availabilityByWeek === "object"
              ? Object.freeze(
                  Object.fromEntries(
                    Object.entries(source.availabilityByWeek)
                      .filter(([week, days]) =>
                        isIsoDate(week) && Array.isArray(days)
                      )
                      .map(([week, days]) => [
                        week,
                        Object.freeze(
                          [...new Set(days)]
                            .filter((day) => Weekday.includes(day))
                        )
                      ])
                  )
                )
              : Object.freeze({}),
          intermediateRaces: Object.freeze(
            (Array.isArray(source?.intermediateRaces) ? source.intermediateRaces : [])
              .map((race) => {
                const def = Distance[race?.distanceKey];
                const date = String(race?.date || "");
                const importance = ["training","test","important"].includes(String(race?.importance || ""))
                  ? String(race.importance)
                  : (Number(race?.targetTimeSec) > 0 ? "important" : "test");
                return Object.freeze({
                  name: String(race?.name || def?.key || "Carrera secundaria").trim(),
                  distanceKey: def?.key || null,
                  distanceM: def?.distanceM ?? null,
                  date,
                  targetTimeSec: Number(race?.targetTimeSec) > 0 ? Number(race.targetTimeSec) : null,
                  importance
                });
              })
              .filter((race) => race.distanceKey && isIsoDate(race.date))
              .sort((a,b) => a.date.localeCompare(b.date))
          ),
          manualChanges:
            Object.freeze(
              (Array.isArray(source?.manualChanges)
                ? source.manualChanges
                : []
              )
                .filter((change) =>
                  change?.sessionId != null &&
                  change?.accepted === true
                )
                .map((change) => Object.freeze({
                  sessionId:String(change.sessionId),
                  accepted:true,
                  patch:Object.freeze({...change.patch})
                }))
            )
        });
      }

      function validatePlanInput(input) {
        const errors = [];

        if (!input?.distanceKey || !Distance[input.distanceKey]) {
          errors.push("distanceKey");
        }

        if (!Number.isFinite(Number(input?.distanceM))) {
          errors.push("distanceM");
        }

        if (!isIsoDate(input?.startDate)) {
          errors.push("startDate");
        }

        if (!isIsoDate(input?.raceDate)) {
          errors.push("raceDate");
        }

        if (
          !Number.isFinite(Number(input?.targetTimeSec)) ||
          Number(input.targetTimeSec) <= 0
        ) {
          errors.push("targetTimeSec");
        }

        if (
          !Array.isArray(input?.availableDays) ||
          input.availableDays.length === 0
        ) {
          errors.push("availableDays");
        }

        if (!DoublesPreference.includes(input?.doublesPreference)) {
          errors.push("doublesPreference");
        }

        return Object.freeze({
          valid: errors.length === 0,
          errors: Object.freeze(errors)
        });
      }

      function createSessionContract(source = {}) {
        return Object.freeze({
          id: source.id ?? null,
          date: source.date ?? null,
          family: source.family ?? null,
          name: source.name ?? null,
          type: source.type ?? null,
          role: source.role ?? null,
          purpose: source.purpose ?? null,
          modifier: source.modifier ?? null,
          dose: source.dose ?? null,
          distanceM: source.distanceM ?? null,
          durationSec: source.durationSec ?? null,
          targetPace: source.targetPace ?? null,
          structure: source.structure ?? null,
          steps: Array.isArray(source.steps)
            ? Object.freeze([...source.steps])
            : Object.freeze([]),
          notes: source.notes ?? null,
          primaryStimulus: source.primaryStimulus ?? null,
          separationConstraints: source.separationConstraints ?? null
        });
      }

      function median(values) {
        const rows = (values || [])
          .map(Number)
          .filter(Number.isFinite)
          .sort((a, b) => a - b);

        if (!rows.length) return null;

        const mid = Math.floor(rows.length / 2);
        return rows.length % 2
          ? rows[mid]
          : (rows[mid - 1] + rows[mid]) / 2;
      }

      function addDaysIso(dateString, days) {
        const date = new Date(`${dateString}T12:00:00Z`);
        if (Number.isNaN(date.getTime())) return null;
        date.setUTCDate(date.getUTCDate() + Number(days || 0));
        return date.toISOString().slice(0, 10);
      }

      function startOfIsoWeek(dateString) {
        const date = new Date(`${dateString}T12:00:00Z`);
        if (Number.isNaN(date.getTime())) return null;

        const day = date.getUTCDay();
        const diff = day === 0 ? -6 : 1 - day;
        date.setUTCDate(date.getUTCDate() + diff);

        return date.toISOString().slice(0, 10);
      }

      function snapshotWeekRanges(asOfDate) {
        const currentWeekStart = startOfIsoWeek(asOfDate);
        if (!currentWeekStart) return Object.freeze([]);

        const weeks = [];

        for (let offset = 8; offset >= 1; offset--) {
          const startDate = addDaysIso(currentWeekStart, -7 * offset);
          const endDate = addDaysIso(startDate, 6);

          weeks.push(Object.freeze({
            startDate,
            endDate
          }));
        }

        return Object.freeze(weeks);
      }

      function normalizeSnapshotActivity(source = {}) {
        return Object.freeze({
          id: source.id != null ? String(source.id) : null,
          date: String(source.date || ""),
          distanceM:
            Number.isFinite(Number(source.distanceM)) &&
            Number(source.distanceM) >= 0
              ? Number(source.distanceM)
              : 0,
          durationSec:
            Number.isFinite(Number(source.durationSec)) &&
            Number(source.durationSec) >= 0
              ? Number(source.durationSec)
              : 0,
          isRun: source.isRun === true,
          isStrength: source.isStrength === true,
          isQuality:
            source.isQuality === true
              ? true
              : source.isQuality === false
                ? false
                : null
        });
      }

      function buildSnapshotWeek(range, activities) {
        const rows = activities.filter((activity) =>
          activity.date >= range.startDate &&
          activity.date <= range.endDate
        );

        const runs = rows.filter((activity) => activity.isRun);
        const strength = rows.filter((activity) => activity.isStrength);

        const runDays = new Set(
          runs.map((activity) => activity.date)
        ).size;

        const qualityKnown = runs.filter(
          (activity) => activity.isQuality !== null
        );

        const qualitySessions = qualityKnown.filter(
          (activity) => activity.isQuality === true
        ).length;

        const longestRun = runs
          .slice()
          .sort((a, b) =>
            (b.distanceM - a.distanceM) ||
            (b.durationSec - a.durationSec)
          )[0] || null;

        const km = runs.reduce(
          (sum, activity) => sum + activity.distanceM,
          0
        ) / 1000;

        return Object.freeze({
          startDate: range.startDate,
          endDate: range.endDate,
          active: runDays >= 2,
          runDays,
          runSessions: runs.length,
          km,
          qualitySessions,
          qualityClassifiedSessions: qualityKnown.length,
          qualityDataComplete: qualityKnown.length === runs.length,
          strengthSessions: strength.length,
          longRunDistanceM: longestRun?.distanceM ?? null,
          longRunDurationSec: longestRun?.durationSec ?? null
        });
      }

      function degradeBaseLevel(level) {
        if (level === "HIGH") return "MEDIUM";
        if (level === "MEDIUM") return "LOW";
        return "LOW";
      }

      function buildAthleteSnapshot({ activities = [], asOfDate } = {}) {
        if (!isIsoDate(asOfDate)) {
          throw new Error("ATHLETE_SNAPSHOT_INVALID_AS_OF_DATE");
        }

        const weeks = snapshotWeekRanges(asOfDate);

        const normalizedActivities = (activities || [])
          .map(normalizeSnapshotActivity)
          .filter((activity) =>
            isIsoDate(activity.date) &&
            weeks.some((week) =>
              activity.date >= week.startDate &&
              activity.date <= week.endDate
            )
          );

        const weekly = weeks.map((range) =>
          buildSnapshotWeek(range, normalizedActivities)
        );

        const activeWeeks = weekly.filter((week) => week.active);
        const activeWeeksCount = activeWeeks.length;

        const frequencyMedian = median(
          activeWeeks.map((week) => week.runDays)
        );

        const habitualVolumeMedianKm = median(
          activeWeeks.map((week) => week.km)
        );

        const recentVolumeMedianKm = median(
          weekly.slice(-3).map((week) => week.km)
        );

        const continuity = activeWeeksCount / 8;

        const lastFourActiveWeeks =
          activeWeeks.slice(-4);

        const longRunDistanceSamples =
          lastFourActiveWeeks
            .map((week) =>
              week.longRunDistanceM
            )
            .filter((value) =>
              Number.isFinite(Number(value)) &&
              Number(value) > 0
            );

        const longRunDurationSamples =
          lastFourActiveWeeks
            .map((week) =>
              week.longRunDurationSec
            )
            .filter((value) =>
              Number.isFinite(Number(value)) &&
              Number(value) > 0
            );

        const longRunBase = Object.freeze({
          distanceMedianM:
            median(longRunDistanceSamples),
          durationMedianSec:
            median(longRunDurationSamples),
          samples:
            Math.min(
              longRunDistanceSamples.length,
              longRunDurationSamples.length
            )
        });

        const lastSixActiveWeeks = activeWeeks.slice(-6);
        const qualityWeeksKnown = lastSixActiveWeeks.filter(
          (week) => week.qualityDataComplete
        );

        const qualityWeeksWithQuality = qualityWeeksKnown.filter(
          (week) => week.qualitySessions > 0
        ).length;

        const qualityEvidenceComplete =
          lastSixActiveWeeks.length > 0 &&
          qualityWeeksKnown.length === lastSixActiveWeeks.length;

        const qualityEstablished =
          lastSixActiveWeeks.length >= 4 &&
          qualityEvidenceComplete &&
          qualityWeeksWithQuality >= 4;

        let rawBase;

        if (
          activeWeeksCount <= 4 ||
          frequencyMedian == null ||
          frequencyMedian <= 2
        ) {
          rawBase = "LOW";
        } else if (
          activeWeeksCount >= 7 &&
          frequencyMedian >= 4 &&
          qualityEstablished
        ) {
          rawBase = "HIGH";
        } else {
          rawBase = "MEDIUM";
        }

        const recentVolumeRatio =
          habitualVolumeMedianKm != null &&
          habitualVolumeMedianKm > 0 &&
          recentVolumeMedianKm != null
            ? recentVolumeMedianKm / habitualVolumeMedianKm
            : null;

        const recentVolumeDrop =
          recentVolumeRatio != null &&
          recentVolumeRatio < 0.70;

        const effectiveBase = recentVolumeDrop
          ? degradeBaseLevel(rawBase)
          : rawBase;

        return Object.freeze({
          asOfDate,
          weeks: Object.freeze(weekly),
          activeWeeks: activeWeeksCount,
          frequencyMedian,
          habitualVolumeMedianKm,
          recentVolumeMedianKm,
          continuity,
          longRunBase,
          qualityEstablished,
          qualityEvidenceComplete,
          qualityWeeksWithQuality,
          recentVolumeRatio,
          recentVolumeDrop,
          base: Object.freeze({
            raw: rawBase,
            effective: effectiveBase
          }),
          dependencies: Object.freeze({
            qualityClassification:
              qualityEvidenceComplete
                ? "available"
                : "pending"
          })
        });
      }

      function runAthleteSnapshotTests() {
        function makeWeek(monday, runDays, kmPerRun, qualityDays = []) {
          const rows = [];

          for (let index = 0; index < runDays; index++) {
            rows.push({
              id: `${monday}:run:${index}`,
              date: addDaysIso(monday, index),
              distanceM: kmPerRun * 1000,
              durationSec: kmPerRun * 330,
              isRun: true,
              isStrength: false,
              isQuality: qualityDays.includes(index)
            });
          }

          return rows;
        }

        const currentWeek = "2026-10-26";
        const mondays = [8,7,6,5,4,3,2,1].map((offset) =>
          addDaysIso(currentWeek, -7 * offset)
        );

        const lowActivities = mondays
          .slice(0, 4)
          .flatMap((monday) => makeWeek(monday, 2, 5, []));

        const mediumActivities = mondays
          .slice(0, 6)
          .flatMap((monday) => makeWeek(monday, 3, 6, [1]));

        const highActivities = mondays
          .flatMap((monday) => makeWeek(monday, 4, 6, [1]));

        const dropActivities = mondays.flatMap((monday, index) =>
          makeWeek(
            monday,
            4,
            index < 5 ? 8 : 3,
            [1]
          )
        );

        const low = buildAthleteSnapshot({
          activities: lowActivities,
          asOfDate: "2026-10-31"
        });

        const medium = buildAthleteSnapshot({
          activities: mediumActivities,
          asOfDate: "2026-10-31"
        });

        const high = buildAthleteSnapshot({
          activities: highActivities,
          asOfDate: "2026-10-31"
        });

        const drop = buildAthleteSnapshot({
          activities: dropActivities,
          asOfDate: "2026-10-31"
        });

        const results = Object.freeze([
          Object.freeze({
            name: "base LOW",
            pass: low.base.raw === "LOW"
          }),
          Object.freeze({
            name: "base MEDIUM",
            pass: medium.base.raw === "MEDIUM"
          }),
          Object.freeze({
            name: "base HIGH",
            pass:
              high.base.raw === "HIGH" &&
              high.qualityEstablished === true
          }),
          Object.freeze({
            name: "recent volume drop degrades effective base",
            pass:
              drop.recentVolumeDrop === true &&
              drop.base.raw === "HIGH" &&
              drop.base.effective === "MEDIUM"
          }),
          Object.freeze({
            name: "exactly 8 complete weeks",
            pass:
              high.weeks.length === 8 &&
              high.weeks[7].endDate === "2026-10-25"
          }),
          Object.freeze({
            name: "LR0 uses last four active weeks",
            pass:
              high.longRunBase.samples === 4 &&
              high.longRunBase.distanceMedianM === 6000 &&
              high.longRunBase.durationMedianSec === 1980
          })
        ]);

        return Object.freeze({
          passed: results.every((result) => result.pass),
          results
        });
      }


      const AbilityDistanceKeys = Object.freeze([
        "5K",
        "10K",
        "HALF_MARATHON",
        "MARATHON"
      ]);

      const EvidenceSource = Object.freeze({
        RACE_TEST: "race_test",
        BEST_EFFORT: "best_effort",
        EQUIVALENCE: "equivalence"
      });

      function daysBetweenIso(olderDate, newerDate) {
        const older = new Date(`${olderDate}T12:00:00Z`);
        const newer = new Date(`${newerDate}T12:00:00Z`);

        if (
          Number.isNaN(older.getTime()) ||
          Number.isNaN(newer.getTime())
        ) {
          return null;
        }

        return Math.floor(
          (newer.getTime() - older.getTime()) / 86400000
        );
      }

      function recencyBucket(date, asOfDate) {
        const ageDays = daysBetweenIso(date, asOfDate);

        if (ageDays == null || ageDays < 0) return "invalid";
        if (ageDays <= 42) return "current";
        if (ageDays <= 84) return "valid";
        if (ageDays <= 180) return "context";
        return "historical";
      }

      function officialDistanceKeyForMeters(distanceM) {
        const distance = Number(distanceM);
        if (!Number.isFinite(distance) || distance <= 0) return null;

        for (const key of AbilityDistanceKeys) {
          const official = Distance[key].distanceM;
          const ratio = distance / official;

          if (ratio >= 0.96 && ratio <= 1.04) {
            return key;
          }
        }

        return null;
      }

      function normalizeAbilityEvidence(source = {}, asOfDate) {
        const sourceType = String(source.source || "");
        const sourceDistanceM = Number(source.distanceM);
        const timeSec = Number(source.timeSec);
        const date = String(source.date || "");
        const distanceKey =
          officialDistanceKeyForMeters(sourceDistanceM);

        if (
          ![
            EvidenceSource.RACE_TEST,
            EvidenceSource.BEST_EFFORT
          ].includes(sourceType) ||
          !distanceKey ||
          !isIsoDate(date) ||
          !Number.isFinite(timeSec) ||
          timeSec <= 0
        ) {
          return null;
        }

        const recency = recencyBucket(date, asOfDate);

        if (
          recency === "invalid" ||
          recency === "historical"
        ) {
          return null;
        }

        return Object.freeze({
          source: sourceType,
          date,
          recency,
          distanceKey,
          distanceM: sourceDistanceM,
          timeSec,
          activityId:
            source.activityId != null
              ? String(source.activityId)
              : null
        });
      }

      function riegelTimeSec(
        sourceTimeSec,
        sourceDistanceM,
        targetDistanceM
      ) {
        const t1 = Number(sourceTimeSec);
        const d1 = Number(sourceDistanceM);
        const d2 = Number(targetDistanceM);

        if (
          !Number.isFinite(t1) ||
          !Number.isFinite(d1) ||
          !Number.isFinite(d2) ||
          t1 <= 0 ||
          d1 <= 0 ||
          d2 <= 0
        ) {
          return null;
        }

        return t1 * Math.pow(d2 / d1, 1.06);
      }

      function buildAbilityCandidates(
        evidence,
        targetDistanceKey
      ) {
        const target = Distance[targetDistanceKey];
        if (!target) return Object.freeze([]);

        const direct = evidence
          .filter((item) =>
            item.distanceKey === targetDistanceKey
          )
          .map((item) => Object.freeze({
            targetDistanceKey,
            predictedTimeSec: item.timeSec,
            source: item.source,
            date: item.date,
            recency: item.recency,
            sourceDistanceKey: item.distanceKey,
            sourceDistanceM: item.distanceM,
            activityId: item.activityId
          }));

        if (direct.length) {
          return Object.freeze(direct);
        }

        if (targetDistanceKey === "MARATHON") {
          return Object.freeze([]);
        }

        const allowedStandard = new Set([
          "5K",
          "10K",
          "HALF_MARATHON"
        ]);

        return Object.freeze(
          evidence
            .filter((item) =>
              allowedStandard.has(item.distanceKey) &&
              item.distanceKey !== targetDistanceKey
            )
            .map((item) => {
              const predicted = riegelTimeSec(
                item.timeSec,
                Distance[item.distanceKey].distanceM,
                target.distanceM
              );

              return Object.freeze({
                targetDistanceKey,
                predictedTimeSec: predicted,
                source: EvidenceSource.EQUIVALENCE,
                parentSource: item.source,
                date: item.date,
                recency: item.recency,
                sourceDistanceKey: item.distanceKey,
                sourceDistanceM: item.distanceM,
                activityId: item.activityId
              });
            })
            .filter((item) =>
              Number.isFinite(item.predictedTimeSec)
            )
        );
      }

      function evidencePriority(candidate) {
        if (candidate.source === EvidenceSource.RACE_TEST) return 1;
        if (candidate.source === EvidenceSource.BEST_EFFORT) return 2;
        return 3;
      }

      function consensusDispersion(values, center) {
        const rows = values
          .map(Number)
          .filter(Number.isFinite);

        if (!rows.length || !center) return null;

        return Math.max(
          ...rows.map((value) =>
            Math.abs(value - center) / center
          )
        );
      }

      function selectAbilityEvidence(candidates) {
        if (!candidates.length) return null;

        const bestPriority = Math.min(
          ...candidates.map(evidencePriority)
        );

        const compatible = candidates
          .filter((item) =>
            evidencePriority(item) === bestPriority
          )
          .sort((a, b) =>
            String(b.date).localeCompare(String(a.date))
          );

        const values = compatible.map(
          (item) => item.predictedTimeSec
        );

        const consensus = median(values);
        const dispersion =
          consensusDispersion(values, consensus);

        const highDispersion =
          dispersion != null &&
          dispersion > 0.06;

        const selected = compatible[0];

        return Object.freeze({
          predictedTimeSec: highDispersion
            ? selected.predictedTimeSec
            : consensus,
          dispersion,
          highDispersion,
          consensusCount: compatible.length,
          selectedEvidence: selected,
          evidence: Object.freeze(compatible),
          confidence:
            highDispersion ? "low" : null
        });
      }

      function buildCurrentAbility({
        evidence = [],
        asOfDate
      } = {}) {
        if (!isIsoDate(asOfDate)) {
          throw new Error(
            "CURRENT_ABILITY_INVALID_AS_OF_DATE"
          );
        }

        const normalizedEvidence = (evidence || [])
          .map((item) =>
            normalizeAbilityEvidence(item, asOfDate)
          )
          .filter(Boolean);

        const abilities = {};

        for (const targetDistanceKey of AbilityDistanceKeys) {
          const candidates = buildAbilityCandidates(
            normalizedEvidence,
            targetDistanceKey
          );

          const selection =
            selectAbilityEvidence(candidates);

          abilities[targetDistanceKey] = Object.freeze({
            distanceKey: targetDistanceKey,
            distanceM:
              Distance[targetDistanceKey].distanceM,
            available: Boolean(selection),
            predictedTimeSec:
              selection?.predictedTimeSec ?? null,
            confidence:
              selection?.confidence ?? null,
            dispersion:
              selection?.dispersion ?? null,
            trace: selection
              ? Object.freeze({
                  source:
                    selection.selectedEvidence?.source ??
                    null,
                  date:
                    selection.selectedEvidence?.date ??
                    null,
                  sourceDistanceM:
                    selection.selectedEvidence
                      ?.sourceDistanceM ?? null,
                  activityId:
                    selection.selectedEvidence
                      ?.activityId ?? null,
                  predictionSec:
                    selection.predictedTimeSec,
                  evidence:
                    selection.evidence
                })
              : null
          });
        }

        return Object.freeze({
          asOfDate,
          abilities: Object.freeze(abilities),
          evidenceCount: normalizedEvidence.length,
          dependencies: Object.freeze({
            raceTestEvidence:
              normalizedEvidence.some((item) =>
                item.source ===
                EvidenceSource.RACE_TEST
              )
                ? "available"
                : "pending",
            bestEffortEvidence:
              normalizedEvidence.some((item) =>
                item.source ===
                EvidenceSource.BEST_EFFORT
              )
                ? "available"
                : "pending",
            marathonDurabilityProfile: "pending"
          })
        });
      }

        const results = Object.freeze([

          Object.freeze({

          }),
          Object.freeze({

          Object.freeze({

              noMarathonRiegel.abilities.MARATHON
                .available === false

          Object.freeze({

        return Object.freeze({

      const PhysiologicalPaceBands = Object.freeze({
        // Fase 11.6: same threshold-based boundaries used by Profile pace zones.
        // Recovery remains a finite prescription inside Z1; Z2-Z4 match Profile exactly.
        recovery: Object.freeze({
          minSpeedFactor: 0.68,
          maxSpeedFactor: 0.78
        }),
        easy: Object.freeze({
          minSpeedFactor: 0.78,
          maxSpeedFactor: 0.88
        }),
        aerobic: Object.freeze({
          minSpeedFactor: 0.88,
          maxSpeedFactor: 0.96
        }),
        threshold: Object.freeze({
          minSpeedFactor: 0.96,
          maxSpeedFactor: 1.02
        })
      });

      function normalizeOfficialThreshold(source = null) {
        if (!source || typeof source !== "object") {
          return null;
        }

        const paceSecKm = Number(source.paceSecKm);

        if (
          source.official !== true ||
          !Number.isFinite(paceSecKm) ||
          paceSecKm <= 0
        ) {
          return null;
        }

        return Object.freeze({
          official: true,
          source: String(source.source || "authorized"),
          date: isIsoDate(source.date)
            ? String(source.date)
            : null,
          paceSecKm
        });
      }

      function paceBandFromThreshold(
        thresholdPaceSecKm,
        definition
      ) {
        const thresholdPace = Number(thresholdPaceSecKm);

        if (
          !Number.isFinite(thresholdPace) ||
          thresholdPace <= 0 ||
          !definition
        ) {
          return null;
        }

        return Object.freeze({
          fasterPaceSecKm:
            thresholdPace / definition.maxSpeedFactor,
          slowerPaceSecKm:
            thresholdPace / definition.minSpeedFactor,
          minSpeedFactor: definition.minSpeedFactor,
          maxSpeedFactor: definition.maxSpeedFactor
        });
      }

      function specificPaceFromAbility(ability) {
        if (
          !ability?.available ||
          !Number.isFinite(Number(ability.predictedTimeSec)) ||
          !Number.isFinite(Number(ability.distanceM)) ||
          Number(ability.predictedTimeSec) <= 0 ||
          Number(ability.distanceM) <= 0
        ) {
          return null;
        }

        const paceSecKm =
          Number(ability.predictedTimeSec) /
          (Number(ability.distanceM) / 1000);

        return Object.freeze({
          paceSecKm,
          predictedTimeSec: Number(ability.predictedTimeSec),
          distanceM: Number(ability.distanceM),
          confidence: ability.confidence ?? null,
          trace: ability.trace ?? null
        });
      }

      function buildPaceAnchors({
        officialThreshold = null,
        currentAbility = null,
        observed5K = null
      } = {}) {
        const threshold =
          normalizeOfficialThreshold(officialThreshold);

        const physiological = {};

        for (
          const [key, definition]
          of Object.entries(PhysiologicalPaceBands)
        ) {
          physiological[key] = threshold
            ? paceBandFromThreshold(
                threshold.paceSecKm,
                definition
              )
            : null;
        }

        const abilities =
          currentAbility?.abilities || {};

        const specific = Object.freeze({
          "5K":
            specificPaceFromAbility(
              abilities["5K"]
            ),
          "10K":
            specificPaceFromAbility(
              abilities["10K"]
            ),
          "HALF_MARATHON":
            specificPaceFromAbility(
              abilities["HALF_MARATHON"]
            ),
          "MARATHON":
            specificPaceFromAbility(
              abilities["MARATHON"]
            )
        });

        // ATLAS VO₂ pace rule:
        // derive a dedicated VO₂ band from the best valid 5K reference.
        // Priority: Training Engine current 5K ability, then observed Garmin fastest 5K split.
        // In pace terms (sec/km), 90–95% of 5K pace is faster than 5K pace.
        // Session prescription uses the deterministic midpoint (92.5%).
        const observed5KPaceSecKm =
          Number(observed5K?.paceSecKm) > 0
            ? Number(observed5K.paceSecKm)
            : (
                Number(observed5K?.timeSec) > 0
                  ? Number(observed5K.timeSec) / 5
                  : null
              );

        const vo2ReferencePaceSecKm =
          Number(specific["5K"]?.paceSecKm) > 0
            ? Number(specific["5K"].paceSecKm)
            : (
                Number.isFinite(observed5KPaceSecKm) &&
                observed5KPaceSecKm > 0
                  ? observed5KPaceSecKm
                  : null
              );

        const vo2 = vo2ReferencePaceSecKm
          ? Object.freeze({
              fasterPaceSecKm:
                vo2ReferencePaceSecKm * 0.90,
              slowerPaceSecKm:
                vo2ReferencePaceSecKm * 0.95,
              paceSecKm:
                vo2ReferencePaceSecKm * 0.925,
              sourceDistanceKey: "5K",
              source:
                specific["5K"]
                  ? "derived_vvo2_from_current_5k_90_95pct_pace"
                  : "derived_vvo2_from_observed_5k_90_95pct_pace",
              referencePaceSecKm: vo2ReferencePaceSecKm,
              referenceActivityId:
                specific["5K"] ? null : observed5K?.activityId ?? null,
              derivation: "5K pace × 0.90–0.95; midpoint × 0.925"
            })
          : null;

        return Object.freeze({
          status:
            threshold
              ? "READY"
              : "NEEDS_ANCHOR_TEST",
          threshold,
          physiological:
            Object.freeze(physiological),
          specific,
          vo2,
          dependencies: Object.freeze({
            officialThreshold:
              threshold ? "available" : "pending",
            currentAbility5K:
              specific["5K"] ? "available" : "pending",
            observed5K:
              Number.isFinite(observed5KPaceSecKm) &&
              observed5KPaceSecKm > 0
                ? "available"
                : "pending",
            vo2Reference:
              specific["5K"]
                ? "current_ability_5k"
                : (
                    Number.isFinite(observed5KPaceSecKm) &&
                    observed5KPaceSecKm > 0
                      ? "garmin_fastest_split_5k"
                      : "pending"
                  ),
            currentAbility10K:
              specific["10K"] ? "available" : "pending",
            currentAbilityHalf:
              specific["HALF_MARATHON"]
                ? "available"
                : "pending",
            currentAbilityMarathon:
              specific["MARATHON"]
                ? "available"
                : "pending"
          })
        });
      }

                ready.physiological.aerobic.slowerPaceSecKm
              ) < 1e-9
          }),
          Object.freeze({
            name: "threshold 98.5-101.5% speed",
            pass:
              Math.abs(
                thresholdBand.fasterPaceSecKm -
                263 / 1.015
              ) < 1e-9 &&
              Math.abs(
                thresholdBand.slowerPaceSecKm -
                263 / 0.985
              ) < 1e-9
          }),
          Object.freeze({
            name: "5K ability derives faster VO2 band",
            pass:
              Math.round(
                ready.specific["5K"].paceSecKm
              ) === 240 &&
              Math.round(
                ready.vo2.fasterPaceSecKm
              ) === 216 &&
              Math.round(
                ready.vo2.slowerPaceSecKm
              ) === 228 &&
              Math.round(
                ready.vo2.paceSecKm
              ) === 222
          }),
          Object.freeze({
            name: "VO2 and Plan share the same 5K anchor",
            pass:
              Math.abs(
                ready.vo2.referencePaceSecKm -
                ready.specific["5K"].paceSecKm
              ) < 1e-9
          }),
          Object.freeze({
            name: "Observed Garmin 5K can derive VO2 band",
            pass:

            pass:

          }),

            name: "unofficial threshold rejected",

        return Object.freeze({

      }


      const GoalAssessmentStatus = Object.freeze({
        SUPPORTED: "SUPPORTED",
        DEMANDING: "DEMANDING",
        NOT_SUPPORTED_CURRENTLY:
          "NOT_SUPPORTED_CURRENTLY",
        PREPARATION_INSUFFICIENT:
          "PREPARATION_INSUFFICIENT",
        NEEDS_ANCHOR_TEST:
          "NEEDS_ANCHOR_TEST"
      });

      function paceSecKmFromTimeDistance(
        timeSec,
        distanceM
      ) {
        const time = Number(timeSec);
        const distance = Number(distanceM);

        if (
          !Number.isFinite(time) ||
          !Number.isFinite(distance) ||
          time <= 0 ||
          distance <= 0
        ) {
          return null;
        }

        return time / (distance / 1000);
      }

      function shorterDistanceKeys(targetDistanceKey) {
        const order = [
          "5K",
          "10K",
          "HALF_MARATHON",
          "MARATHON"
        ];

        const targetIndex =
          order.indexOf(targetDistanceKey);

        if (targetIndex <= 0) {
          return Object.freeze([]);
        }

        return Object.freeze(
          order.slice(0, targetIndex)
        );
      }

      function goalPaceIncoherence(
        planInput,
        currentAbility
      ) {
        const targetDistance =
          Distance[planInput?.distanceKey];

        const targetPace =
          paceSecKmFromTimeDistance(
            planInput?.targetTimeSec,
            targetDistance?.distanceM
          );

        if (
          targetPace == null ||
          !currentAbility?.abilities
        ) {
          return null;
        }

        for (
          const shorterKey
          of shorterDistanceKeys(
            planInput.distanceKey
          )
        ) {
          const ability =
            currentAbility.abilities[shorterKey];

          if (
            !ability?.available ||
            !Number.isFinite(
              Number(ability.predictedTimeSec)
            )
          ) {
            continue;
          }

          const shorterPace =
            paceSecKmFromTimeDistance(
              ability.predictedTimeSec,
              ability.distanceM
            );

          if (
            shorterPace != null &&
            targetPace <= shorterPace
          ) {
            return Object.freeze({
              targetDistanceKey:
                planInput.distanceKey,
              targetPaceSecKm: targetPace,
              shorterDistanceKey: shorterKey,
              shorterAbilityPaceSecKm:
                shorterPace,
              shorterAbility:
                ability
            });
          }
        }

        return null;
