    const AtlasApp = (() => {
      async function unzipFitBlob(blob) {
        const buffer = await blob.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const view = new DataView(buffer);

        // Raw FIT, not ZIP.
        if (
          bytes.length >= 12 &&
          String.fromCharCode(...bytes.slice(8, 12)) === ".FIT"
        ) {
          return buffer;
        }

        // ZIP: locate End Of Central Directory.
        let eocd = -1;
        for (
          let i = Math.max(0, bytes.length - 65557);
          i <= bytes.length - 22;
          i++
        ) {
          if (
            view.getUint32(i, true) === 0x06054b50
          ) {
            eocd = i;
          }
        }

        if (eocd < 0) {
          throw new Error("FIT_ZIP_NOT_FOUND");
        }

        const entries = view.getUint16(eocd + 10, true);
        const centralOffset = view.getUint32(eocd + 16, true);
        let pos = centralOffset;

        for (let entry = 0; entry < entries; entry++) {
          if (view.getUint32(pos, true) !== 0x02014b50) break;

          const method = view.getUint16(pos + 10, true);
          const compressedSize = view.getUint32(pos + 20, true);
          const fileNameLength = view.getUint16(pos + 28, true);
          const extraLength = view.getUint16(pos + 30, true);
          const commentLength = view.getUint16(pos + 32, true);
          const localOffset = view.getUint32(pos + 42, true);

          const nameBytes = bytes.slice(
            pos + 46,
            pos + 46 + fileNameLength
          );
          const fileName = new TextDecoder().decode(nameBytes);

          if (/\.fit$/i.test(fileName)) {
            if (view.getUint32(localOffset, true) !== 0x04034b50) {
              throw new Error("FIT_ZIP_LOCAL_HEADER");
            }

            const localNameLength =
              view.getUint16(localOffset + 26, true);
            const localExtraLength =
              view.getUint16(localOffset + 28, true);
            const dataStart =
              localOffset + 30 + localNameLength + localExtraLength;

            const compressed = bytes.slice(
              dataStart,
              dataStart + compressedSize
            );

            if (method === 0) {
              return compressed.buffer.slice(
                compressed.byteOffset,
                compressed.byteOffset + compressed.byteLength
              );
            }

            if (method === 8 && "DecompressionStream" in window) {
              const stream = new Blob([compressed])
                .stream()
                .pipeThrough(new DecompressionStream("deflate-raw"));

              return await new Response(stream).arrayBuffer();
            }

            throw new Error("FIT_ZIP_COMPRESSION_UNSUPPORTED");
          }

          pos +=
            46 +
            fileNameLength +
            extraLength +
            commentLength;
        }

        throw new Error("FIT_FILE_NOT_FOUND_IN_ZIP");
      }

      function readFitScalar(view, offset, size, baseType, littleEndian) {
        const type = baseType & 0x1f;

        if (type === 7) {
          const bytes = new Uint8Array(
            view.buffer,
            view.byteOffset + offset,
            size
          );
          const zero = bytes.indexOf(0);
          return new TextDecoder().decode(
            zero >= 0 ? bytes.slice(0, zero) : bytes
          );
        }

        if (size < 1) return null;

        switch (type) {
          case 0:
          case 2:
          case 10:
          case 13:
            return view.getUint8(offset);
          case 1:
            return view.getInt8(offset);
          case 3:
            return size >= 2
              ? view.getInt16(offset, littleEndian)
              : null;
          case 4:
          case 11:
            return size >= 2
              ? view.getUint16(offset, littleEndian)
              : null;
          case 5:
            return size >= 4
              ? view.getInt32(offset, littleEndian)
              : null;
          case 6:
          case 12:
            return size >= 4
              ? view.getUint32(offset, littleEndian)
              : null;
          case 8:
            return size >= 4
              ? view.getFloat32(offset, littleEndian)
              : null;
          case 9:
            return size >= 8
              ? view.getFloat64(offset, littleEndian)
              : null;
          default:
            return null;
        }
      }

      function parseFitWorkoutSegments(arrayBuffer) {
        const view = new DataView(arrayBuffer);
        const bytes = new Uint8Array(arrayBuffer);

        if (bytes.length < 14) {
          throw new Error("FIT_TOO_SHORT");
        }

        const headerSize = view.getUint8(0);
        const dataSize = view.getUint32(4, true);
        const end = Math.min(
          bytes.length,
          headerSize + dataSize
        );

        const definitions = new Map();
        const workoutSteps = new Map();
        const laps = [];
        const trackPoints = [];
        let pos = headerSize;

        while (pos < end) {
          const header = view.getUint8(pos++);
          const compressed = (header & 0x80) !== 0;

          let localMessage;
          let isDefinition = false;
          let hasDeveloper = false;

          if (compressed) {
            localMessage = (header >> 5) & 0x03;
          } else {
            localMessage = header & 0x0f;
            isDefinition = (header & 0x40) !== 0;
            hasDeveloper = (header & 0x20) !== 0;
          }

          if (isDefinition) {
            if (pos + 5 > end) break;

            pos += 1; // reserved
            const architecture = view.getUint8(pos++);
            const littleEndian = architecture === 0;
            const globalMessage = view.getUint16(
              pos,
              littleEndian
            );
            pos += 2;

            const fieldCount = view.getUint8(pos++);
            const fields = [];

            for (let i = 0; i < fieldCount; i++) {
              if (pos + 3 > end) break;
              fields.push({
                num: view.getUint8(pos),
                size: view.getUint8(pos + 1),
                baseType: view.getUint8(pos + 2)
              });
              pos += 3;
            }

            const developerFields = [];
            if (hasDeveloper && pos < end) {
              const count = view.getUint8(pos++);
              for (let i = 0; i < count; i++) {
                if (pos + 3 > end) break;
                developerFields.push({
                  num: view.getUint8(pos),
                  size: view.getUint8(pos + 1),
                  developerIndex: view.getUint8(pos + 2)
                });
                pos += 3;
              }
            }

            definitions.set(localMessage, {
              globalMessage,
              littleEndian,
              fields,
              developerFields
            });
            continue;
          }

          const definition = definitions.get(localMessage);
          if (!definition) {
            throw new Error("FIT_MISSING_DEFINITION");
          }

          const fieldValues = new Map();

          for (const field of definition.fields) {
            if (pos + field.size > end) {
              pos = end;
              break;
            }

            const value = readFitScalar(
              view,
              pos,
              field.size,
              field.baseType,
              definition.littleEndian
            );

            fieldValues.set(field.num, value);
            pos += field.size;
          }

          for (const field of definition.developerFields) {
            pos += field.size;
            if (pos > end) {
              pos = end;
              break;
            }
          }

          // record global message number = 20
          if (definition.globalMessage === 20) {
            const latSemi=Number(fieldValues.get(0));
            const lonSemi=Number(fieldValues.get(1));
            const rawDistance=Number(fieldValues.get(5));
            const rawTimestamp=Number(fieldValues.get(253));
            const enhanced=Number(fieldValues.get(73));
            const speed=Number(fieldValues.get(6));
            const factor=180/2147483648;
            const hasCoords=
              Number.isFinite(latSemi)&&Number.isFinite(lonSemi)&&
              latSemi!==0x7fffffff&&lonSemi!==0x7fffffff;
            const distanceM=
              Number.isFinite(rawDistance)&&rawDistance>=0&&rawDistance<0xffffffff
                ? rawDistance/100
                : null;
            const timestampSec=
              Number.isFinite(rawTimestamp)&&rawTimestamp>=0&&rawTimestamp<0xffffffff
                ? rawTimestamp
                : null;
            let speedMps=null;
            if (Number.isFinite(enhanced)&&enhanced>=0&&enhanced<0xffffffff) speedMps=enhanced/1000;
            else if (Number.isFinite(speed)&&speed>=0&&speed<0xffff) speedMps=speed/1000;

            if (hasCoords || distanceM != null || timestampSec != null) {
              trackPoints.push({
                lat:hasCoords?latSemi*factor:null,
                lon:hasCoords?lonSemi*factor:null,
                speedMps,
                distanceM,
                timestampSec
              });
            }
          }

          // workout_step global message number = 27
          if (definition.globalMessage === 27) {
            const messageIndex = fieldValues.get(254);
            if (messageIndex != null) {
              workoutSteps.set(Number(messageIndex), {
                messageIndex: Number(messageIndex),
                name: fieldValues.get(0) || "",
                durationType: fieldValues.get(1),
                durationValue: fieldValues.get(2),
                targetValue: fieldValues.get(4),
                intensity: fieldValues.get(7)
              });
            }
          }

          // lap global message number = 19
          if (definition.globalMessage === 19) {
            laps.push({
              messageIndex: fieldValues.get(254),
              workoutStepIndex: fieldValues.get(71),
              intensity: fieldValues.get(23)
            });
          }
        }

        const classifyIntensity = (value) => {
          const intensity = Number(value);

          if (intensity === 2) return "WU";
          if (intensity === 3) return "CD";

          if (
            intensity === 0 ||
            intensity === 1 ||
            intensity === 4 ||
            intensity === 5 ||
            intensity === 6
          ) {
            return "MAIN";
          }

          return null;
        };

        const labels = laps.map((lap) => {
          const step =
            lap.workoutStepIndex != null
              ? workoutSteps.get(Number(lap.workoutStepIndex))
              : null;

          return (
            classifyIntensity(step?.intensity) ||
            classifyIntensity(lap.intensity) ||
            null
          );
        });

        const kilometerSplits=[];
        const distanceTimeline=trackPoints
          .filter(point=>Number.isFinite(Number(point?.distanceM))&&Number.isFinite(Number(point?.timestampSec)))
          .map(point=>({distanceM:Number(point.distanceM),timestampSec:Number(point.timestampSec)}))
          .filter((point,index,rows)=>
            point.distanceM>=0 &&
            (index===0 || (point.distanceM>=rows[index-1].distanceM && point.timestampSec>=rows[index-1].timestampSec))
          );

        if(distanceTimeline.length>=2){
          const lastDistance=distanceTimeline[distanceTimeline.length-1].distanceM;
          let segmentIndex=1;
          let previousBoundaryTime=null;
          const startDistance=distanceTimeline[0].distanceM;
          const startTime=distanceTimeline[0].timestampSec;
          previousBoundaryTime=startTime;
          for(let km=1;km*1000<=lastDistance;km++){
            const boundary=km*1000;
            while(segmentIndex<distanceTimeline.length&&distanceTimeline[segmentIndex].distanceM<boundary){
              segmentIndex+=1;
            }
            if(segmentIndex>=distanceTimeline.length)break;
            const b=distanceTimeline[segmentIndex];
            const a=distanceTimeline[Math.max(0,segmentIndex-1)];
            const span=b.distanceM-a.distanceM;
            if(!(span>0))continue;
            const ratio=(boundary-a.distanceM)/span;
            if(ratio<0||ratio>1)continue;
            const boundaryTime=a.timestampSec+(b.timestampSec-a.timestampSec)*ratio;
            const durationSec=boundaryTime-previousBoundaryTime;
            if(Number.isFinite(durationSec)&&durationSec>0&&durationSec<3600){
              kilometerSplits.push({
                kilometer:km,
                startDistanceM:km===1?startDistance:(km-1)*1000,
                endDistanceM:boundary,
                durationSec,
                paceSecKm:durationSec
              });
              previousBoundaryTime=boundaryTime;
            }
          }
        }

        // Geometry must be sampled only after removing non-geographic FIT
        // records. Sampling the mixed distance/timestamp stream could discard
        // large sections of long routes.
        const geoTrackPoints=trackPoints.filter(point=>
          Number.isFinite(Number(point?.lat)) &&
          Number.isFinite(Number(point?.lon)) &&
          Math.abs(Number(point.lat))<=90 &&
          Math.abs(Number(point.lon))<=180
        );
        const maxTrackPoints=2500;
        const stride=Math.max(1,Math.ceil(geoTrackPoints.length/maxTrackPoints));
        const sampledTrackPoints=geoTrackPoints.filter((_,index)=>
          index===0||index===geoTrackPoints.length-1||index%stride===0
        );

        return {
          labels,
          workoutSteps:[...workoutSteps.values()],
          fitLapCount:laps.length,
          trackPoints:sampledTrackPoints,
          kilometerSplits
        };
      }

      async function parseFitSegmentsFromBlob(blob) {
        const fitBuffer = await unzipFitBlob(blob);
        return parseFitWorkoutSegments(fitBuffer);
      }

      function summarizeRunningMetrics(payload) {
        const descriptors = Array.isArray(payload?.metricDescriptors)
          ? payload.metricDescriptors
          : [];
        const rows = Array.isArray(payload?.activityDetailMetrics)
          ? payload.activityDetailMetrics
          : [];

        const indexByKey = new Map();
        for (const descriptor of descriptors) {
          if (Number.isInteger(descriptor?.metricsIndex) && descriptor?.key) {
            indexByKey.set(String(descriptor.key), descriptor.metricsIndex);
          }
        }

        const collect = (...keys) => {
          const indices = keys
            .map((key) => indexByKey.get(key))
            .filter((index) => Number.isInteger(index));

          const values = [];
          for (const row of rows) {
            if (!Array.isArray(row?.metrics)) continue;
            for (const index of indices) {
              const value = row.metrics[index];
              if (value != null && Number.isFinite(Number(value))) {
                values.push(Number(value));
                break;
              }
            }
          }
          return values;
        };

        const avg = (values) =>
          values.length
            ? values.reduce((sum, value) => sum + value, 0) / values.length
            : null;
        const max = (values) => values.length ? Math.max(...values) : null;

        const cadence = collect("directRunCadence", "directCadence", "cadence");
        const groundContact = collect("directGroundContactTime", "groundContactTime");
        const verticalOscillation = collect("directVerticalOscillation", "verticalOscillation");
        const verticalRatio = collect("directVerticalRatio", "verticalRatio");
        const groundBalance = collect("directGroundContactBalance", "groundContactBalance");
        const power = collect("directPower", "power");

        return {
          averageCadence: avg(cadence),
          maxCadence: max(cadence),
          averageGroundContactTime: avg(groundContact),
          averageVerticalOscillation: avg(verticalOscillation),
          averageVerticalRatio: avg(verticalRatio),
          averageGroundContactBalance: avg(groundBalance),
          averagePower: avg(power),
          maxPower: max(power)
        };
      }

      function localDate(offsetDays = 0) {
        const date = new Date();
        date.setDate(date.getDate() + offsetDays);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      async function syncActivitiesIncremental(forceFullBootstrap = false) {
        const existing = await AtlasStorage.getAll("activities");
        const existingIds = new Set(existing.map((item) => String(item.id)));
        const bootstrapState = await AtlasStorage.get("sync", "activityBootstrapComplete");

        const pageSize = 100;
        const overlapKnownCount = 5;
        const bootstrap = forceFullBootstrap || bootstrapState?.value !== true;

        let start = 0;
        let knownSeen = 0;
        let newest = null;
        let processed = 0;
        let reachedEnd = false;
        let stop = false;

        while (!stop) {
          const response = await AtlasServices.activities(
            AtlasUI.state.bridgeUrl,
            start,
            pageSize
          );

          const rows = Array.isArray(response.data) ? response.data : [];
          if (!rows.length) {
            reachedEnd = true;
            break;
          }

          for (const raw of rows) {
            const summary = AtlasDomain.normalizeActivitySummary(raw);
            if (!summary.id) continue;

            if (!newest) newest = summary;

            const wasKnown = existingIds.has(String(summary.id));

            if (wasKnown) {
              knownSeen += 1;
            } else {
              knownSeen = 0;
            }

            const previous = await AtlasStorage.get("activities", summary.id);
            const nowIso = new Date().toISOString();

            const record = {
              id: summary.id,
              summary,
              detail: previous?.detail ?? null,
              summaryUpdatedAt: nowIso,
              detailUpdatedAt: previous?.detailUpdatedAt ?? null,
              detailLoaded: previous?.detailLoaded === true,
              fitBlob: previous?.fitBlob ?? null,
              fitUpdatedAt: previous?.fitUpdatedAt ?? null,
              fitLoaded: previous?.fitLoaded === true,
              running: previous?.running ?? null,
              runningUpdatedAt: previous?.runningUpdatedAt ?? null,
              runningLoaded: previous?.runningLoaded === true
            };

            await AtlasStorage.put("activities", record);
            existingIds.add(String(summary.id));
            processed += 1;

            if (!bootstrap && knownSeen >= overlapKnownCount) {
              stop = true;
              break;
            }
          }

          if (rows.length < pageSize) {
            reachedEnd = true;
            break;
          }

          start += pageSize;
        }

        if (bootstrap && reachedEnd) {
          await AtlasStorage.put("sync", {
            key: "activityBootstrapComplete",
            value: true
          });
        }

        const now = new Date().toISOString();
        await AtlasStorage.put("sync", {
          key: "lastActivitySync",
          value: now
        });

        if (newest) {
          await AtlasStorage.put("sync", {
            key: "lastActivityId",
            value: newest.id
          });
          await AtlasStorage.put("sync", {
            key: "lastActivityDate",
            value: newest.date
          });
        }

        return {
          bootstrap,
          processed,
          totalLocal: existingIds.size,
          newestId: newest?.id || null,
          newestDate: newest?.date || null
        };
      }


      async function setInitialImportProgress(phase, completed, total, label) {
        const safeTotal=Math.max(1,Number(total)||1);
        const safeCompleted=Math.max(0,Math.min(safeTotal,Number(completed)||0));
        const phaseRanges={
          catalog:[0,35],
          activities:[35,35],
          health:[35,95],
          finalizing:[95,100]
        };
        const range=phaseRanges[phase]||[0,100];
        let percent=Math.round(range[0]+(range[1]-range[0])*(safeCompleted/safeTotal));
        const previousPercent=Number(AtlasUI.state.initialImportProgress?.percent);
        if(Number.isFinite(previousPercent) && previousPercent>percent && AtlasUI.state.initialImportProgress?.active){
          percent=previousPercent;
        }
        const value={
          active:percent<100,
          phase,
          completed:safeCompleted,
          total:safeTotal,
          percent,
          label:String(label||"Sincronizando Garmin"),
          updatedAt:new Date().toISOString()
        };
        AtlasUI.state.initialImportProgress=value;
        await AtlasStorage.put("sync",{key:"initialImportProgress",value});
        AtlasUI.render({scrollMode:"preserve"});
        return value;
      }

      async function loadInitialImportProgress() {

      function historicalImportRetryable(error) {
        const message=String(error?.message||error||"");
        return (
          message.includes("429") ||
          message.includes("503") ||
          message.includes("502") ||
          message.includes("GARMIN_RATE_LIMITED") ||
          message.includes("GARMIN_REQUEST_FAILED") ||
          message.includes("BRIDGE_TIMEOUT") ||
          message.includes("BRIDGE_NETWORK_ERROR") ||
          message.includes("Failed to fetch") ||
          message.includes("NetworkError")
        );
      }

      function historicalActivityNeedsFit(record) {
        const summary=record?.summary||{};
        const sport=String(summary?.sport||"").toLowerCase();
        if(!sport.includes("run"))return false;
        const eventType=String(summary?.eventType||"").toLowerCase();
        const title=String(summary?.title||"").toLowerCase();
        const distance=Number(summary?.distanceM)||0;
        const raceWords=["race","carrera","maratón","maraton","media maratón","media maraton","10k","10 km","5k","5 km"];
        const raceByName=raceWords.some(word=>title.includes(word));
        const raceByEvent=eventType.includes("race")||eventType.includes("competition");
        const official=[5000,10000,21097.5,42195].some(target=>Math.abs(distance-target)<=Math.max(150,target*.02));
        return raceByEvent||raceByName||official;
      }

      async function archiveHistoricalActivity(record) {
        const id=String(record?.id||"");
        if(!id)throw new Error("ACTIVITY_ID_MISSING");
        const date=String(record?.summary?.date||"");
        const sport=String(record?.summary?.sport||"").toLowerCase();
        const isRunning=sport.includes("run");
        const needsFit=historicalActivityNeedsFit(record);
        const fetchedAt=new Date().toISOString();
        const archive={
          schema:2,
          fetchedAt,
          detailRaw:null,
          runningRaw:null,
          lapsRaw:null,
          typedSplitsRaw:null,
          gearRaw:null,
          preciseVo2Raw:null,
          fit:null,
          fitPolicy:needsFit?"race_or_official_distance":"not_required",
          errors:[]
        };
        let retryableFailures=0;

        const jobs=[["detailRaw",()=>AtlasServices.activityDetail(AtlasUI.state.bridgeUrl,id)]];
        if(isRunning){
          jobs.push(
            ["runningRaw",()=>AtlasServices.activityRunning(AtlasUI.state.bridgeUrl,id,date)],
            ["lapsRaw",()=>AtlasServices.activityLaps(AtlasUI.state.bridgeUrl,id)],
            ["typedSplitsRaw",()=>AtlasServices.activityTypedSplits(AtlasUI.state.bridgeUrl,id)],
            ["gearRaw",()=>AtlasServices.activityGear(AtlasUI.state.bridgeUrl,id)],
            ["preciseVo2Raw",()=>AtlasServices.activityPreciseVo2(AtlasUI.state.bridgeUrl,id)]
          );
        }

        // The independent Garmin sources for one activity are fetched in parallel.
        const settled=await Promise.allSettled(
          jobs.map(([,task])=>AtlasServices.withRetry(task,1))
        );
        settled.forEach((result,index)=>{
          const key=jobs[index][0];
          if(result.status==="fulfilled")archive[key]=result.value?.data??null;
          else{
            const error=result.reason;
            archive.errors.push(`${key}:${String(error?.message||error)}`);
            if(historicalImportRetryable(error))retryableFailures+=1;
          }
        });

        // FIT is intentionally reserved for races / official-distance efforts, where it adds
        // kilometer-by-kilometer timing and route data not guaranteed by summary/laps APIs.
        if(isRunning&&needsFit){
          try{
            const fitBlob=await AtlasServices.withRetry(
              ()=>AtlasServices.activityFit(AtlasUI.state.bridgeUrl,id),1
            );
            const fitMeta=await parseFitSegmentsFromBlob(fitBlob);
            archive.fit={
              available:true,
              parsedAt:new Date().toISOString(),
              lapCount:Number(fitMeta?.fitLapCount||0),
              labels:Array.isArray(fitMeta?.labels)?fitMeta.labels:[],
              kilometerSplits:Array.isArray(fitMeta?.kilometerSplits)?fitMeta.kilometerSplits:[],
              trackPoints:Array.isArray(fitMeta?.trackPoints)?fitMeta.trackPoints:[],
              workoutSteps:Array.isArray(fitMeta?.workoutSteps)?fitMeta.workoutSteps:[]
            };
          }catch(error){
            archive.fit={available:false,parsedAt:new Date().toISOString(),labels:[],kilometerSplits:[],trackPoints:[],workoutSteps:[]};
            archive.errors.push(`fit:${String(error?.message||error)}`);
            if(historicalImportRetryable(error))retryableFailures+=1;
          }
        }else if(isRunning){
          archive.fit={available:null,required:false,parsedAt:null,labels:[],kilometerSplits:[],trackPoints:[],workoutSteps:[]};
        }

        const complete=retryableFailures===0;
        const latest=await AtlasStorage.get("activities",id);
        const cachedDetail=archive.detailRaw
          ? AtlasDomain.normalizeActivityDetail(archive.detailRaw)
          : (latest?.detail ?? null);
        const fitCache=archive.fit?.available ? {
          labels:Array.isArray(archive.fit.labels)?archive.fit.labels:[],
          fitLapCount:Number(archive.fit.lapCount||0),
          kilometerSplits:Array.isArray(archive.fit.kilometerSplits)?archive.fit.kilometerSplits:[],
          trackPoints:Array.isArray(archive.fit.trackPoints)?archive.fit.trackPoints:[],
          workoutSteps:Array.isArray(archive.fit.workoutSteps)?archive.fit.workoutSteps:[]
        } : (latest?.fitMeta ?? null);
        const cachedPreciseVo2=archive.preciseVo2Raw && typeof archive.preciseVo2Raw === "object"
          ? {
              activityId:String(archive.preciseVo2Raw.activityId ?? id),
              value:archive.preciseVo2Raw.value ?? null,
              source:archive.preciseVo2Raw.source ?? "garmin-connect:maxmet.generic.vo2MaxPreciseValue",
              calendarDate:archive.preciseVo2Raw.calendarDate ?? date ?? null,
              obtainedAt:archive.preciseVo2Raw.obtainedAt ?? fetchedAt,
              matched:archive.preciseVo2Raw.matched === true
            }
          : (latest?.activityPreciseVo2 ?? null);
        await AtlasStorage.put("activities",{
          ...(latest||record),
          detail:cachedDetail,
          detailLoaded:Boolean(cachedDetail),
          detailUpdatedAt:cachedDetail ? fetchedAt : (latest?.detailUpdatedAt ?? null),
          freshLaps:archive.lapsRaw ?? latest?.freshLaps ?? null,
          garminTypedSplits:archive.typedSplitsRaw ?? latest?.garminTypedSplits ?? null,
          garminActivityGear:Array.isArray(archive.gearRaw) ? archive.gearRaw : (latest?.garminActivityGear ?? []),
          fitMeta:fitCache,
          fitSegments:Array.isArray(fitCache?.labels)&&fitCache.labels.length?fitCache.labels:(latest?.fitSegments??[]),
          activityPreciseVo2:cachedPreciseVo2,
          historicalArchive:archive,
          historicalArchiveComplete:complete,
          historicalArchiveAttemptedAt:fetchedAt
        });
        return {complete,errors:archive.errors};
      }

      async function syncHistoricalActivityArchive() {
        const rows=(await AtlasStorage.getAll("activities"))
          .slice()
          .sort((a,b)=>String(b?.summary?.date||"").localeCompare(String(a?.summary?.date||"")));
        const total=rows.length;
        let completed=rows.filter(row=>row?.historicalArchiveComplete===true).length;
        let attempted=0;
        const failures=[];

        await setInitialImportProgress("activities",completed,total,"Archivando actividades");

        for(const row of rows){
          if(row?.historicalArchiveComplete===true)continue;
          attempted+=1;
          try{
            const result=await archiveHistoricalActivity(row);
            if(result.complete)completed+=1;
            else failures.push(String(row.id));
          }catch(error){
            failures.push(`${String(row?.id||"")}:${String(error?.message||error)}`);
          }

          const meta={
            schema:2,
            total,
            completed,
            attempted,
            pending:Math.max(0,total-completed),
            failures:failures.slice(-50),
            updatedAt:new Date().toISOString(),
            complete:completed===total
          };
          await AtlasStorage.put("sync",{key:"deepActivityBootstrapMeta",value:meta});
          await setInitialImportProgress("activities",completed,total,"Archivando actividades");
        }

        const meta={
          schema:2,
          total,
          completed,
          attempted,
          pending:Math.max(0,total-completed),
          failures:failures.slice(-50),
          updatedAt:new Date().toISOString(),
          complete:completed===total
        };
        await AtlasStorage.put("sync",{key:"deepActivityBootstrapMeta",value:meta});
        if(meta.complete){
          await AtlasStorage.put("sync",{key:"deepActivityBootstrapComplete",value:true});
        }
        if(!meta.complete)throw new Error(`DEEP_ACTIVITY_IMPORT_PARTIAL_${meta.pending}`);
        return meta;
      }


      async function refreshDatabaseStats() {
        try {
          const storeNames = [
            "activities",
            "metrics",
            "training",
            "profile",
            "settings",
            "sync",
            "rawHistory",
            "healthDays",
            "lactateThreshold",
            "restingHeartRateHistory"
          ];

          const entries = await Promise.all(
            storeNames.map(async name => {
              try {
                const rows = await AtlasStorage.getAll(name);
                return [name, Array.isArray(rows) ? rows.length : 0];
              } catch (_) {
                return [name, null];
              }
            })
          );

          let storage = null;
          try {
            if (navigator?.storage?.estimate) {
              const estimate = await navigator.storage.estimate();
              storage = {
                usage: Number.isFinite(Number(estimate?.usage)) ? Number(estimate.usage) : null,
                quota: Number.isFinite(Number(estimate?.quota)) ? Number(estimate.quota) : null
              };
            }
          } catch (_) {}

          AtlasUI.state.databaseStats = Object.freeze({
            stores: Object.freeze(Object.fromEntries(entries)),
            storage: storage ? Object.freeze(storage) : null
          });
        } catch (error) {
          console.warn("ATLAS database stats:", error?.message || error);
          AtlasUI.state.databaseStats = null;
        }
      }

      function recomputeTrainingEnginePlanLayers() {
        const plan = AtlasUI.state.planConfig;

        AtlasUI.state.macrocycle =
          plan
            ? AtlasTrainingEngine.buildMacrocycle({
                planInput: plan,
                athleteSnapshot: AtlasUI.state.athleteSnapshot
              })
            : null;

        AtlasUI.state.canonicalCalendar =
          plan
            ? AtlasTrainingEngine.assignKnownCalendarPhases({
                planInput: plan,
                macrocycle: AtlasUI.state.macrocycle
              })
            : null;

        AtlasUI.state.volumeProgression =
          plan
            ? AtlasTrainingEngine.buildVolumeProgression({
                planInput: plan,
                athleteSnapshot: AtlasUI.state.athleteSnapshot
              })
            : null;

        AtlasUI.state.goalAssessment =
          plan
            ? AtlasTrainingEngine.buildGoalAssessment({
                planInput: plan,
                currentAbility: AtlasUI.state.currentAbility,
                paceAnchors: AtlasUI.state.paceAnchors,
                preparationInsufficient:
                  AtlasUI.state.macrocycle?.preparationInsufficient ?? null
              })
            : null;

        AtlasUI.state.phaseAllocation =
          plan
            ? AtlasTrainingEngine.resolvePhaseAllocation({
                planInput: plan,
                macrocycle: AtlasUI.state.macrocycle,
                canonicalCalendar: AtlasUI.state.canonicalCalendar,
                athleteSnapshot: AtlasUI.state.athleteSnapshot,
                volumeProgression: AtlasUI.state.volumeProgression,
                goalAssessment: AtlasUI.state.goalAssessment
              })
            : null;

        AtlasUI.state.canonicalSessions =
          plan
            ? AtlasTrainingEngine.buildCanonicalSessionMaterialization({
                planInput: plan,
                phaseAllocation: AtlasUI.state.phaseAllocation,
                canonicalCalendar: AtlasUI.state.canonicalCalendar,
                volumeProgression: AtlasUI.state.volumeProgression,
                athleteSnapshot: AtlasUI.state.athleteSnapshot,
                macrocycle: AtlasUI.state.macrocycle,
                paceAnchors: AtlasUI.state.paceAnchors
              })
            : null;

        AtlasUI.state.effectivePlan =
          AtlasUI.state.canonicalSessions?.available
            ? AtlasTrainingEngine.buildEffectivePlan({
                canonicalPlan: AtlasUI.state.canonicalSessions.sessions,
                acceptedManualChanges: plan?.manualChanges || [],
                acceptedAdaptiveChanges: [],
                asOfDate: localDate(0),
                planStartDate: plan?.startDate
              })
            : null;

        const liveSessions =
          AtlasUI.state.effectivePlan?.valid
            ? AtlasUI.state.effectivePlan.sessions

        AtlasUI.state.liveExecution =
          liveExecutionForPlan({
            sessions: liveSessions,

        const adaptiveSignals =

          );

        AtlasUI.state.adaptive =
          AtlasTrainingEngine.buildAdaptiveEngine({
            signals: adaptiveSignals
          });

        const executionPoor =

            (signal) =>
              signal.action === "PROGRESSION_HOLD"
          );

        AtlasUI.state.intelligence =
          AtlasTrainingEngine.buildPlanIntelligence({
            planHealth: AtlasUI.state.livePlanHealth,
            goalProgress:
              AtlasTrainingEngine.buildGoalProgress({
                state: "INSUFFICIENT_DATA",
                evidenceStrong: false,
                planHealth: AtlasUI.state.livePlanHealth
              }),
            performanceProgression:
              AtlasTrainingEngine.buildPerformanceProgression({
                direction: "INSUFFICIENT_DATA"
              }),
            recentExecutionClearlyPoor: executionPoor,
            workoutOutcomes: AtlasUI.state.liveExecution
          });

        AtlasUI.state.trainingEngineResult =
          AtlasTrainingEngine.buildTrainingEngineResult({
            status:
              AtlasUI.state.canonicalSessions?.available
                ? "ACTIVE"
                : null,
            asOfDate: localDate(0),
            input: plan,
            athleteSnapshot: AtlasUI.state.athleteSnapshot,
            currentAbility: AtlasUI.state.currentAbility,
            paceAnchors: AtlasUI.state.paceAnchors,
            goalAssessment: AtlasUI.state.goalAssessment,

      function normalizePlanRecord(record) {
        if (!record || typeof record !== "object") return null;
        const updatedAt = String(record.updatedAt || "");
        if (!updatedAt) return null;
        return {
          plan: record.deleted ? null : (record.plan || null),
          engine: record.deleted ? null : (record.engine || null),
          deleted: Boolean(record.deleted),
          updatedAt
        };
      }

      async function savePlanRecordLocal(record) {
        const normalized = normalizePlanRecord(record);
        if (!normalized) return null;
        await AtlasStorage.put("settings", {key:"activePlan", value:normalized});
        AtlasUI.state.planRecord = normalized;
        AtlasUI.state.planConfig = normalized.deleted ? null : normalized.plan;
        recomputeTrainingEnginePlanLayers();
        return normalized;
      }

      async function pushPlanRecordRemote(record) {
        const bridge = String(AtlasUI.state.bridgeUrl || "").trim();
        if (!bridge || !record) return;
        try {
          if (record.deleted) {
            await AtlasServices.withRetry(
              () => AtlasServices.deletePlanConfig(bridge, record),
              1
            );
          } else {
            await AtlasServices.withRetry(
              () => AtlasServices.putPlanConfig(bridge, record),
              1
            );
          }
        } catch (error) {
          console.warn("ATLAS plan cloud push:", error);
        }
      }

      async function syncPlanConfig() {
        const bridge = String(AtlasUI.state.bridgeUrl || "").trim();
        const local = normalizePlanRecord(AtlasUI.state.planRecord);
        if (!bridge) return;

        let remote = null;
        try {
          const response = await AtlasServices.withRetry(
            () => AtlasServices.getPlanConfig(bridge),
            1
          );
          remote = normalizePlanRecord(response?.data || null);
        } catch (error) {
          console.warn("ATLAS plan cloud pull:", error);
          return;
        }

        if (!local && !remote) return;
        if (!local && remote) {
          await savePlanRecordLocal(remote);
          AtlasUI.render();
          return;
        }
        if (local && !remote) {
          await pushPlanRecordRemote(local);
          return;
        }

        const localTime = Date.parse(local.updatedAt) || 0;
        const remoteTime = Date.parse(remote.updatedAt) || 0;

        if (remoteTime > localTime) {
          await savePlanRecordLocal(remote);
          AtlasUI.render();
        } else if (localTime > remoteTime) {
          await pushPlanRecordRemote(local);
        }
      }

      async function publishPlanSession(sessionId,{quiet=false}={}) {
        const id=String(sessionId||"");
        const session=AtlasUI.state.effectivePlan?.sessions?.find?.(s=>String(s?.id)===id)
          || AtlasUI.state.canonicalSessions?.sessions?.find?.(s=>String(s?.id)===id)
          || null;
        if(!session) throw new Error("ATLAS_SESSION_NOT_FOUND");
        if(!AtlasUI.planSessionGarminEligible(session)) throw new Error("ATLAS_SESSION_NOT_PUBLISHABLE");
        const bridge=String(AtlasUI.state.bridgeUrl||"").trim();
        if(!bridge) throw new Error("GARMIN_BRIDGE_NOT_CONFIGURED");
        const workout=AtlasUI.planSessionToGarminWorkout(session);
        if(!workout) throw new Error("ATLAS_GARMIN_WORKOUT_NOT_AVAILABLE");
        const fingerprint=AtlasUI.planSessionPublicationFingerprint(session);
        const existing=AtlasUI.state.garminPublications?.[id]||null;
        AtlasUI.state.publicationBusy=id;
        if(!quiet)AtlasUI.render({scrollMode:"preserve"});
        try{
          let workoutId=existing?.workoutId||null;
          let scheduleId=existing?.scheduleId||null;
          if(workoutId){
            await AtlasServices.updateGarminWorkout(bridge,workoutId,workout);
            if(existing?.date!==session.date && scheduleId){
              await AtlasServices.rescheduleGarminWorkout(bridge,scheduleId,session.date);
            }else if(existing?.date!==session.date && !scheduleId){
              const scheduled=await AtlasServices.send(bridge,`/training/workouts/${encodeURIComponent(workoutId)}/schedule`,"POST",{date:session.date});
              scheduleId=scheduled?.data?.scheduleId||scheduled?.data?.id||null;
            }
          }else{
            const created=await AtlasServices.createGarminWorkout(bridge,workout,session.date);
            workoutId=created?.data?.workoutId||created?.data?.workout?.workoutId||created?.data?.workout?.id||null;
            scheduleId=created?.data?.scheduleId||created?.data?.schedule?.scheduleId||created?.data?.schedule?.id||null;
            if(!workoutId) throw new Error("GARMIN_WORKOUT_ID_MISSING");
          }
          const next={...(AtlasUI.state.garminPublications||{}),[id]:{workoutId,scheduleId,date:session.date,fingerprint,updatedAt:new Date().toISOString()}};
          await persistGarminPublications(next);
          return next[id];
        }finally{
          AtlasUI.state.publicationBusy=null;
        }
      }

      async function publishPlanToGarmin() {
        const sessions=(AtlasUI.state.effectivePlan?.valid?AtlasUI.state.effectivePlan.sessions:AtlasUI.state.canonicalSessions?.sessions)||[];
        const eligible=sessions.filter(AtlasUI.planSessionGarminEligible);
        if(!eligible.length)throw new Error("ATLAS_NO_PUBLISHABLE_SESSIONS");
        AtlasUI.state.planPublicationProgress={percent:0,label:"Preparando"};
        AtlasUI.render({scrollMode:"preserve"});
        try{
          for(let i=0;i<eligible.length;i++){
            const session=eligible[i];
            const existing=AtlasUI.state.garminPublications?.[String(session.id)];
            const current=existing?.workoutId&&existing?.fingerprint===AtlasUI.planSessionPublicationFingerprint(session)&&existing?.date===session.date;
            AtlasUI.state.planPublicationProgress={percent:Math.round((i/eligible.length)*100),label:`Publicando ${i+1}/${eligible.length}`};
            AtlasUI.render({scrollMode:"preserve"});
            if(!current)await publishPlanSession(session.id,{quiet:true});
          }
          AtlasUI.state.planPublicationProgress={percent:100,label:"Completado"};
          AtlasUI.render({scrollMode:"preserve"});
        }finally{
          AtlasUI.state.planPublicationProgress=null;
        }
      }

      function addDaysIso(iso, days) {
        const [y, m, d] = String(iso).split("-").map(Number);
        const date = new Date(Date.UTC(y, m - 1, d));
        date.setUTCDate(date.getUTCDate() + days);
        return date.toISOString().slice(0, 10);
      }

      function minIsoDate(...values) {
        const valid = values.filter((v) => /^\d{4}-\d{2}-\d{2}$/.test(String(v || "")));
        return valid.length ? valid.sort()[0] : null;
      }

      function extractIsoDates(value, out = []) {
        if (value == null) return out;
        if (typeof value === "string") {
          const m = value.match(/^(\d{4}-\d{2}-\d{2})/);
          if (m) out.push(m[1]);
          return out;
        }
        if (Array.isArray(value)) {
          for (const item of value) extractIsoDates(item, out);
          return out;
        }
        if (typeof value === "object") {
          for (const child of Object.values(value)) extractIsoDates(child, out);
        }
        return out;
      }

      async function saveRawHistoryChunk(dataset, startDate, endDate, response) {
        const record = {
          id: `${dataset}:${startDate}:${endDate}`,
          dataset,
          startDate,
          endDate,
          payload: response?.data ?? null,
          meta: response?.meta ?? {},
          fetchedAt: new Date().toISOString()
        };
        await AtlasStorage.put("rawHistory", record);
        return record;
      }

      async function discoverGarminHistoryStart() {
        const currentYear = Number(localDate(0).slice(0, 4));
        const earliestActivity = AtlasUI.state.activities
          .map((x) => x?.summary?.date)
          .filter(Boolean)
          .sort()[0] || null;

        let earliestSummary = null;
        let seenData = false;

        for (let year = currentYear; year >= 2008; year--) {
          const startDate = `${year}-01-01`;
          const endDate = year === currentYear ? localDate(0) : `${year}-12-31`;
          const response = await AtlasServices.withRetry(
            () => AtlasServices.history(AtlasUI.state.bridgeUrl, "dailySummaries", startDate, endDate),
            1
          );
          await saveRawHistoryChunk("dailySummaries", startDate, endDate, response);

          const dates = extractIsoDates(response?.data).filter((d) => d >= startDate && d <= endDate);
          if (dates.length) {
            seenData = true;
            const yearEarliest = dates.sort()[0];
            earliestSummary = minIsoDate(earliestSummary, yearEarliest);
          } else if (seenData) {
            break;
          }
        }

        return minIsoDate(earliestSummary, earliestActivity) || earliestActivity || localDate(0);
      }

      function historyChunks(startDate, endDate, daysPerChunk) {
        const chunks = [];
        let cursor = startDate;
        while (cursor <= endDate) {
          const candidate = addDaysIso(cursor, daysPerChunk - 1);
          const chunkEnd = candidate < endDate ? candidate : endDate;
          chunks.push([cursor, chunkEnd]);
          cursor = addDaysIso(chunkEnd, 1);
        }
        return chunks;
      }

      async function syncIncrementalHealthHistory() {
        const normalizationMeta = await AtlasStorage.get("sync", "healthNormalizationMeta");
        const lastDate = normalizationMeta?.value?.lastDate;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(String(lastDate || ""))) {
          throw new Error("HEALTH_INCREMENTAL_LAST_DATE_MISSING");
        }

        const today = localDate(0);
        const startDate = addDaysIso(lastDate, -1); // Solape de 1 día para capturar cierres tardíos/cambios.
        const datasets = [
          "dailySummaries",
          "bodyBattery",
          "sleep",
          "hrv",
          "trainingReadiness",
          "vo2max",
          "trainingStatus",
          "weight"
        ];

        const failures = [];
        let saved = 0;

        for (const dataset of datasets) {
          try {
            const response = await AtlasServices.withRetry(
              () => AtlasServices.history(
                AtlasUI.state.bridgeUrl,
                dataset,
                startDate,
                today
              ),
              1
            );
            await saveRawHistoryChunk(dataset, startDate, today, response);
            saved += 1;
          } catch (error) {
            failures.push(`${dataset}:${String(error?.message || error)}`);
          }
        }

        const meta = {
          startDate,
          lastDate: today,
          datasets: datasets.length,
          saved,
          failures,
          completedAt: failures.length ? null : new Date().toISOString()
        };

        await AtlasStorage.put("sync", {
          key: "incrementalHealthHistoryMeta",
          value: meta
        });

        if (failures.length) {
          throw new Error(`HEALTH_INCREMENTAL_PARTIAL_${failures.length}`);
        }

        return meta;
      }

      async function syncFullHealthHistory() {
        const complete = await AtlasStorage.get("sync", "fullHealthHistoryComplete");
        if (complete?.value === true) return AtlasUI.state.historySync;

        // Fuentes históricas canónicas. Evitamos duplicar métricas ya incluidas
        // dentro de dailySummaries y respetamos límites conservadores de Garmin.
        const datasets = [
          ["dailySummaries", 365],
          ["bodyBattery", 28],
          ["sleep", 28],
          ["hrv", 180],
          ["trainingReadiness", 28],
          ["vo2max", 365],
          ["trainingStatus", 365],
          ["weight", 365]
        ];

        const firstDate = await discoverGarminHistoryStart();
        const today = localDate(0);
        let chunksSaved = 0;
        const failures = [];

        for (const [dataset, chunkDays] of datasets) {
          if (dataset === "dailySummaries") continue; // Ya se guardó durante descubrimiento.
          for (const [startDate, endDate] of historyChunks(firstDate, today, chunkDays)) {
            try {
              const response = await AtlasServices.withRetry(
                () => AtlasServices.history(AtlasUI.state.bridgeUrl, dataset, startDate, endDate),
                1
              );
              await saveRawHistoryChunk(dataset, startDate, endDate, response);
              chunksSaved += 1;
              if (chunksSaved % 5 === 0) {
                AtlasUI.state.historySync = {
                  firstDate,
                  lastDate: today,
                  datasets: datasets.length,
                  chunks: chunksSaved,
                  complete: false
                };
                AtlasUI.render();
              }
            } catch (error) {
              failures.push(`${dataset}:${startDate}:${endDate}:${String(error?.message || error)}`);
            }
          }
        }

        const allRaw = await AtlasStorage.getAll("rawHistory");
        const meta = {
          firstDate,
          lastDate: today,
          datasets: new Set(allRaw.map((x) => x.dataset)).size,
          chunks: allRaw.length,
          complete: failures.length === 0,
          completedAt: failures.length ? null : new Date().toISOString(),
          failures
        };

        await AtlasStorage.put("sync", { key: "fullHealthHistoryMeta", value: meta });
        if (!failures.length) {
          await AtlasStorage.put("sync", { key: "fullHealthHistoryComplete", value: true });
        }
        AtlasUI.state.historySync = meta;

        if (failures.length) {
          throw new Error(`HISTORY_PARTIAL_${failures.length}`);
        }
        return meta;
      }

      function atlasDateFromRecord(value) {
        if (!value || typeof value !== "object") return null;

        const direct = [
          value.calendarDate,
          value.date,
          value.measurementDate,
          value.summaryDate
        ];

        const nested = [
          value?.hrvSummary?.calendarDate,
          value?.generic?.calendarDate,
          value?.dailySleepDTO?.calendarDate,
          value?.sleepSummary?.calendarDate
        ];

        for (const candidate of [...direct, ...nested]) {
          const text = String(candidate || "");
          const match = text.match(/^(\d{4}-\d{2}-\d{2})/);
          if (match) return match[1];
        }

        const timestamps = [
          value.measurementTimeLocal,
          value.timestampLocal,
          value.startTimestampLocal,
          value.createTimeStamp
        ];

        for (const candidate of timestamps) {
          const text = String(candidate || "");
          const match = text.match(/^(\d{4}-\d{2}-\d{2})/);
          if (match) return match[1];
        }

        return null;
      }

      function collectDatedGarminRecords(value, out = []) {
        if (value == null) return out;

        if (Array.isArray(value)) {
          for (const item of value) collectDatedGarminRecords(item, out);
          return out;
        }

        if (typeof value !== "object") return out;

        const date = atlasDateFromRecord(value);
        if (date) {
          out.push({ date, value });
          return out; // Conservar el objeto fechado completo; no duplicar hijos.
        }

        for (const child of Object.values(value)) {
          if (child && typeof child === "object") {
            collectDatedGarminRecords(child, out);
          }
        }

        return out;
      }

      async function normalizeRawHistoryToHealthDays() {
        const raw = await AtlasStorage.getAll("rawHistory");
        if (!raw.length) throw new Error("RAW_HISTORY_EMPTY");

        const days = new Map();
        const sourceSet = new Set();

        for (const chunk of raw) {
          const dataset = String(chunk?.dataset || "");
          if (!dataset) continue;
          sourceSet.add(dataset);

          const records = collectDatedGarminRecords(chunk?.payload);
          for (const item of records) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(item.date)) continue;

            let day = days.get(item.date);
            if (!day) {
              day = {
                id: item.date,
                date: item.date,
                sources: {},
                normalizedAt: null
              };
              days.set(item.date, day);
            }

            if (!Array.isArray(day.sources[dataset])) {
              day.sources[dataset] = [];
            }

            // No interpretar el payload: conservar cada registro Garmin completo.
            day.sources[dataset].push(item.value);
          }
        }

        await AtlasStorage.clear("healthDays");
        const stamp = new Date().toISOString();
        const ordered = [...days.values()].sort((a, b) => a.date.localeCompare(b.date));

        for (const day of ordered) {
          day.normalizedAt = stamp;
          await AtlasStorage.put("healthDays", day);
        }

        const meta = {
          firstDate: ordered[0]?.date || null,
          lastDate: ordered[ordered.length - 1]?.date || null,
          days: ordered.length,
          sources: sourceSet.size,
          normalizedAt: stamp
        };

        await AtlasStorage.put("sync", {
          key: "healthNormalizationMeta",
          value: meta
        });
        await AtlasStorage.put("sync", {
          key: "healthNormalizationComplete",
          value: true
        });

        AtlasUI.state.healthNormalization = meta;
        return meta;
      }


      function utcDayNumber(dateString) {
        const match = String(dateString || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return null;
        const ms = Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
        return Number.isFinite(ms) ? Math.floor(ms / 86400000) : null;
      }

      function isoFromUtcDay(dayNumber) {
        if (!Number.isFinite(dayNumber)) return null;
        return new Date(dayNumber * 86400000).toISOString().slice(0, 10);
      }



      async function syncRestingHeartRateHistory() {
        const SYNC_SCHEMA = 2;
        const metaRow = await AtlasStorage.get("sync", "restingHeartRateHistoryMeta");
        const normalization = await AtlasStorage.get("sync", "healthNormalizationMeta");
        const today = localDate(0);

        const previous = metaRow?.value || null;
        const valid =
          previous?.schema === SYNC_SCHEMA &&
          /^\d{4}-\d{2}-\d{2}$/.test(String(previous?.lastDate || ""));

        const firstDate =
          normalization?.value?.firstDate ||
          state.healthDays[0]?.date ||
          today;

        const startDate = valid
          ? addDaysIso(previous.lastDate, -1)
          : firstDate;

        if (!valid) {
          await AtlasStorage.clear("restingHeartRateHistory");
        }

        const chunks = valid
          ? [[startDate, today]]
          : historyChunks(startDate, today, 28);

        let saved = 0;
        const failures = [];

        for (const [from, to] of chunks) {
          try {
            const response = await AtlasServices.withRetry(
              () => AtlasServices.restingHeartRateHistory(
                AtlasUI.state.bridgeUrl,
                from,
                to
              ),
              1
            );

            const rows = Array.isArray(response?.rows) ? response.rows : [];
            for (const row of rows) {

              ) {
                await AtlasStorage.put("restingHeartRateHistory", {
                  date,
                  value,
                  fetchedAt: new Date().toISOString()
                });
                saved += 1;
              }
            }
          } catch (error) {
            failures.push(`${from}:${to}:${String(error?.message || error)}`);
          }
        }

        const meta = {
          schema: SYNC_SCHEMA,
          firstDate,
          lastDate: today,
          saved,
          failures,
          completedAt: failures.length ? null : new Date().toISOString()
        };

        await AtlasStorage.put("sync", {
          key: "restingHeartRateHistoryMeta",
          value: meta
        });

        if (failures.length) {
          throw new Error(`RHR_HISTORY_PARTIAL_${failures.length}`);
        }

        return meta;
      }

      async function auditLocalIntegrity() {
        const [activities, rawHistory, healthDays] = await Promise.all([
          AtlasStorage.getAll("activities"),
          AtlasStorage.getAll("rawHistory"),
          AtlasStorage.getAll("healthDays")
        ]);

        const activityIds = new Set();
        let activityDuplicates = 0;
        let activityInvalidDates = 0;
        const activityDates = [];

        for (const item of activities) {
          const id = String(item?.id ?? "");
          if (id) {
            if (activityIds.has(id)) activityDuplicates += 1;
            activityIds.add(id);
          }

          const date = String(item?.summary?.date || "");
          if (utcDayNumber(date) == null) {
            activityInvalidDates += 1;
          } else {
            activityDates.push(date);
          }
        }

        activityDates.sort();

        const healthDateSet = new Set();
        let healthDuplicates = 0;
        let healthInvalidDates = 0;

        for (const item of healthDays) {
          const date = String(item?.date || item?.id || "");
          if (utcDayNumber(date) == null) {
            healthInvalidDates += 1;
            continue;
          }
          if (healthDateSet.has(date)) healthDuplicates += 1;
          healthDateSet.add(date);
        }

        const healthDates = [...healthDateSet].sort();
        let missingHealthDays = 0;
        const missingHealthSample = [];

        if (healthDates.length) {
          const first = utcDayNumber(healthDates[0]);
          const last = utcDayNumber(healthDates[healthDates.length - 1]);

          for (let day = first; day <= last; day++) {
            const date = isoFromUtcDay(day);
            if (!healthDateSet.has(date)) {
              missingHealthDays += 1;
              if (missingHealthSample.length < 10) missingHealthSample.push(date);
            }
          }
        }

        const rawDatasets = new Map();
        let rawInvalidRanges = 0;

        for (const chunk of rawHistory) {
          const dataset = String(chunk?.dataset || "");
          const start = utcDayNumber(chunk?.startDate);
          const end = utcDayNumber(chunk?.endDate);

          if (!dataset || start == null || end == null || start > end) {
            rawInvalidRanges += 1;
            continue;
          }

          if (!rawDatasets.has(dataset)) rawDatasets.set(dataset, []);
          rawDatasets.get(dataset).push([start, end]);
        }

        let rawCoverageGaps = 0;
        const rawGapDatasets = [];

        for (const [dataset, ranges] of rawDatasets.entries()) {
          ranges.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
          let mergedEnd = null;
          let datasetGaps = 0;

          for (const [start, end] of ranges) {
            if (mergedEnd == null) {
              mergedEnd = end;
              continue;
            }

            if (start > mergedEnd + 1) {
              datasetGaps += 1;
              rawCoverageGaps += 1;
            }

            if (end > mergedEnd) mergedEnd = end;
          }

          if (datasetGaps) rawGapDatasets.push(dataset);
        }

        const audit = {
          ok:
            activityDuplicates === 0 &&
            activityInvalidDates === 0 &&
            healthDuplicates === 0 &&
            healthInvalidDates === 0 &&
            missingHealthDays === 0 &&
            rawInvalidRanges === 0 &&
            rawCoverageGaps === 0 &&
            rawDatasets.size === 8,
          checkedAt: new Date().toISOString(),
          activities: {
            count: activities.length,
            uniqueIds: activityIds.size,
            duplicates: activityDuplicates,
            invalidDates: activityInvalidDates,
            firstDate: activityDates[0] || null,
            lastDate: activityDates[activityDates.length - 1] || null
          },
          health: {
            count: healthDays.length,
            uniqueDates: healthDateSet.size,
            duplicates: healthDuplicates,
            invalidDates: healthInvalidDates,
            firstDate: healthDates[0] || null,
            lastDate: healthDates[healthDates.length - 1] || null,
            missingDays: missingHealthDays,
            missingSample: missingHealthSample
          },
          raw: {
            chunks: rawHistory.length,
            datasets: rawDatasets.size,
            invalidRanges: rawInvalidRanges,
            coverageGaps: rawCoverageGaps,
            gapDatasets: rawGapDatasets
          }
        };

        await AtlasStorage.put("sync", {
          key: "integrityAuditMeta",
          value: audit
        });

        AtlasUI.state.integrityAudit = audit;
        return audit;
      }

      async function syncNow() {
        if (!AtlasUI.state.dbReady || AtlasUI.state.syncing) return;

        if (!AtlasUI.state.bridgeUrl) {
          AtlasUI.state.syncError = "Configura primero la URL del Garmin Bridge.";
          AtlasUI.render();
          return;
        }

        AtlasUI.state.syncing = true;
        AtlasUI.state.syncError = null;
        AtlasUI.state.syncStatus = {
          profile: "idle",
          metrics: "idle",
          training: "idle",
          activities: "idle",
          history: "idle"
        };
        AtlasUI.render();

        const today = localDate(0);
        const endDate = localDate(14);
        const errors = [];
        const initialImportRow=await AtlasStorage.get("sync","initialImportComplete");
        const firstImport=initialImportRow?.value!==true;
        if(firstImport){
          await loadInitialImportProgress();
          await setInitialImportProgress("catalog",0,1,"Preparando importación histórica");
        }

        try {
          const profileR = await runSyncBlock("profile", () =>
            AtlasServices.profile(AtlasUI.state.bridgeUrl)
          );

          if (profileR.ok) {
            const profile = AtlasDomain.normalizeProfile(profileR.data.data);
            await AtlasStorage.put("profile", profile);
          } else {
            errors.push(`Perfil: ${profileR.error}`);
          }

          const metricsR = await runSyncBlock("metrics", () =>
            AtlasServices.metrics(AtlasUI.state.bridgeUrl, today)
          );

          if (metricsR.ok) {
            const metrics = AtlasDomain.normalizeMetrics(
              metricsR.data.data,
              today
            );
            for (const item of metrics) {
              await AtlasStorage.put("metrics", item);
            }
          } else {
            errors.push(`Métricas: ${metricsR.error}`);
          }

          const trainingR = await runSyncBlock("training", () =>
            AtlasServices.training(
              AtlasUI.state.bridgeUrl,
              today,
              endDate
            )
          );

          if (trainingR.ok) {
            const training = AtlasDomain.normalizeTraining(
              trainingR.data.data
            );
            for (const item of training) {
              await AtlasStorage.put("training", item);
            }
          } else {
            errors.push(`Training: ${trainingR.error}`);
          }

          const activitiesR = await runSyncBlock(
            "activities",
            () => syncActivitiesIncremental(firstImport)
          );

          if (!activitiesR.ok) {
            errors.push(`Actividades: ${activitiesR.error}`);
          }

          if(firstImport){
            await setInitialImportProgress("catalog",1,1,"Catálogo de actividades completo");
            await setInitialImportProgress("health",0,1,"Importando salud y rendimiento");
          }

          try {
            const localActivities=await AtlasStorage.getAll("activities");
            const dates=localActivities.map(item=>String(item?.summary?.date||"")).filter(date=>/^\d{4}-\d{2}-\d{2}$/.test(date)).sort();
            const startDate=dates[0]||"2000-01-01";
            const fastest=await AtlasServices.fastestSplits(AtlasUI.state.bridgeUrl,startDate,today,3);
            await AtlasStorage.put("sync",{key:"fastestSplits",value:fastest?.data??null});
          } catch(error) {
            errors.push(`Mejores marcas: ${String(error?.message||error)}`);
          }

          const historyComplete = await AtlasStorage.get("sync", "fullHealthHistoryComplete");
          let historyChanged = false;

          if (historyComplete?.value !== true) {
            const historyR = await runSyncBlock("history", () => syncFullHealthHistory());
            if (!historyR.ok) {
              errors.push(`Histórico: ${historyR.error}`);
            } else {
              historyChanged = true;
            }
          } else {
            const historyR = await runSyncBlock("history", () => syncIncrementalHealthHistory());
            if (!historyR.ok) {
              errors.push(`Histórico incremental: ${historyR.error}`);
            } else {
              historyChanged = true;
            }
          }

          const normalizationComplete = await AtlasStorage.get("sync", "healthNormalizationComplete");
          if (normalizationComplete?.value !== true || historyChanged) {
            try {
              await normalizeRawHistoryToHealthDays();
            } catch (error) {
              errors.push(`Normalización: ${String(error?.message || error)}`);
            }
          }

          try {
            await syncRestingHeartRateHistory();
          } catch (error) {
            errors.push(`FC reposo histórica: ${String(error?.message || error)}`);
          }

          try {
            await syncLactateThresholdHistory();
          } catch (error) {
            errors.push(`Umbral lactato: ${String(error?.message || error)}`);
          }

          try {
            const audit = await auditLocalIntegrity();
            if (!audit.ok) {
              errors.push("Integridad: revisar datos locales");
            }
          } catch (error) {
            errors.push(`Integridad: ${String(error?.message || error)}`);
          }

          if(firstImport){
            await setInitialImportProgress("finalizing",0,1,"Verificando base de datos");
            const catalogComplete=await AtlasStorage.get("sync","activityBootstrapComplete");
            const healthComplete=await AtlasStorage.get("sync","fullHealthHistoryComplete");
            const complete=catalogComplete?.value===true && healthComplete?.value===true;
            const initialMeta={
              complete,
              completedAt:complete?new Date().toISOString():null,
              updatedAt:new Date().toISOString(),
              errors:[...errors]
            };
            await AtlasStorage.put("sync",{key:"initialImportMeta",value:initialMeta});
            AtlasUI.state.initialImportMeta=initialMeta;
            if(complete){
              await AtlasStorage.put("sync",{key:"initialImportComplete",value:true});
              await setInitialImportProgress("finalizing",1,1,"Importación histórica completada");
              AtlasUI.state.initialImportProgress=null;
              await AtlasStorage.put("sync",{key:"initialImportProgress",value:null});
            }
          }

          const stamp = new Date().toISOString();
          await AtlasStorage.put("sync", {
            key: "lastGarminSync",
            value: stamp
          });

          await AtlasStorage.put("sync", {
            key: "lastGarminSyncStatus",
            value: errors.length ? "partial" : "ok"
          });

          await AtlasStorage.put("sync", {
            key: "lastGarminSyncErrors",
            value: errors
          });

          await hydrateLocal();

          AtlasUI.state.syncError = errors.length
            ? `Sincronización parcial: ${errors.join(" · ")}`
            : null;
        } catch (error) {
          const message = String(error?.message || error);
          console.error("ATLAS sync fatal:", error);
          AtlasUI.state.syncError = `Sincronización interrumpida: ${message}`;

          try {
            await AtlasStorage.put("sync", {
              key: "lastGarminSyncStatus",
              value: "error"
            });
            await AtlasStorage.put("sync", {
              key: "lastGarminSyncErrors",
              value: [message]
            });
          } catch (_) {}
        } finally {
          AtlasUI.state.syncing = false;
          AtlasUI.render();
          await refreshDatabaseStats();
          void syncEquipmentOptional();
          void syncHeartRateZonesOptional();
        }
      }

      function downloadJsonFile(payload, filename) {

        const link = document.createElement("a");

      function firstFinite(...values) {
        for (const value of values) {
          const n = Number(value);
          if (Number.isFinite(n)) return n;
        }
        return null;
      }

      function firstText(...values) {
        for (const value of values) {
          if (value !== null && value !== undefined && String(value).trim() !== "") return String(value);
        }
        return null;
      }

      function compactGear(payload) {
        const rows = Array.isArray(payload) ? payload : (Array.isArray(payload?.data) ? payload.data : []);
        return rows.map((row) => ({
          id: firstText(row?.gearPk, row?.uuid, row?.gearId, row?.id),
          name: firstText(row?.displayName, row?.customMakeModel, row?.gearTypeName, row?.name),
          type: firstText(row?.gearTypeName, row?.gearType, row?.type),
          distanceM: firstFinite(row?.totalDistance, row?.distance, row?.totalDistanceMeters),
          maxDistanceM: firstFinite(row?.maximumMeters, row?.maxDistance, row?.maximumDistance)
        })).filter((row) => row.id || row.name);
      }

      function compactLapRows(payload) {
        const roots = [payload, payload?.lapDTOs, payload?.laps, payload?.data, payload?.splits, payload?.splitDTOs];
        let rows = roots.find(Array.isArray) || [];
        if (!rows.length && payload && typeof payload === "object") {
          const candidate = Object.values(payload).find((value) => Array.isArray(value) && value.some((row) => row && typeof row === "object"));
          rows = candidate || [];
        }
        return rows.map((row, index) => ({
          index: firstFinite(row?.lapIndex, row?.lapNumber, row?.splitIndex, row?.messageIndex) ?? index + 1,
          distanceM: firstFinite(row?.distance, row?.distanceM, row?.totalDistance),
          durationSec: firstFinite(row?.duration, row?.durationSec, row?.elapsedDuration, row?.movingDuration, row?.elapsedTime),
          averageSpeedMps: firstFinite(row?.averageSpeed, row?.avgSpeed),
          averageHR: firstFinite(row?.averageHR, row?.avgHR, row?.averageHeartRate),
          maxHR: firstFinite(row?.maxHR, row?.maxHeartRate),
          averageCadence: firstFinite(row?.averageRunCadence, row?.averageRunningCadenceInStepsPerMinute, row?.averageCadence, row?.avgCadence),
          averagePower: firstFinite(row?.averagePower, row?.avgPower),
          maxPower: firstFinite(row?.maxPower),
          elevationGainM: firstFinite(row?.elevationGain, row?.totalElevationGain),
          temperatureC: firstFinite(row?.averageTemperature, row?.avgTemperature),
          intensity: firstText(row?.intensity, row?.lapType, row?.type)
        })).filter((row) => Object.values(row).some((value) => value !== null));
      }

      function compactTypedSplits(payload) {
        const out = [];
        const walk = (node, path = "") => {
          if (out.length >= 500) return;
          if (Array.isArray(node)) {
            node.forEach((item, index) => walk(item, `${path}[${index}]`));
            return;
          }
          if (!node || typeof node !== "object") return;
          const distanceM = firstFinite(node?.distance, node?.distanceM, node?.totalDistance, node?.splitDistanceMeters);
          const durationSec = firstFinite(node?.duration, node?.durationSec, node?.elapsedDuration, node?.elapsedTime, node?.timeSec);
          if (distanceM != null || durationSec != null) {
            out.push({
              type: firstText(node?.splitType, node?.type, node?.name, path),
              distanceM,
              durationSec,
              averageSpeedMps: firstFinite(node?.averageSpeed, node?.avgSpeed),
              averageHR: firstFinite(node?.averageHR, node?.avgHR),
              maxHR: firstFinite(node?.maxHR),
              averagePower: firstFinite(node?.averagePower, node?.avgPower),
              averageCadence: firstFinite(node?.averageCadence, node?.avgCadence)
            });
            return;
          }
          Object.entries(node).forEach(([key, value]) => {
            if (value && typeof value === "object") walk(value, path ? `${path}.${key}` : key);
          });
        };
        walk(payload);
        return out;
      }

      function compactHealthDay(day) {
        const sources = day?.sources || {};
        const rows = (name) => Array.isArray(sources?.[name]) ? sources[name] : [];
        const first = (name) => rows(name)[0] || null;

        const sleep = sleepWrap?.dailySleepDTO || sleepWrap?.sleepSummary || sleepWrap;
        const hrvWrap = first("hrv") || {};

        return {
          date: day?.date || day?.id || null,
          sleep: {
            score: firstFinite(sleep?.sleepScores?.overall?.value, sleep?.sleepScore),
            durationSec: firstFinite(sleep?.sleepTimeSeconds, sleep?.durationSec),

          },

          },

          bodyBattery: {
            highest: firstFinite(daily?.bodyBatteryHighestValue, daily?.bodyBatteryHigh),
            lowest: firstFinite(daily?.bodyBatteryLowestValue, daily?.bodyBatteryLow),
            charged: firstFinite(daily?.bodyBatteryChargedValue),
            drained: firstFinite(daily?.bodyBatteryDrainedValue)
          },
          stress: firstFinite(daily?.averageStressLevel, daily?.overallStressLevel),
          steps: firstFinite(daily?.totalSteps, daily?.steps),
          calories: firstFinite(daily?.totalKilocalories, daily?.activeKilocalories),
          weightKg: (() => {
            const grams = firstFinite(weight?.weight, weight?.weightInGrams);
            if (grams != null && grams > 300) return grams / 1000;
            return firstFinite(weight?.weightKg, weight?.weight);
          })()
        };
      }

      async function compactAiActivity(record) {
        const id = String(record?.id || "");
        const date = String(record?.summary?.date || "");
        const sport = String(record?.summary?.sport || "").toLowerCase();
        const isRunning = sport.includes("run");
        const errors = [];
        const jobs = [
          ["detail", () => AtlasServices.activityDetail(AtlasUI.state.bridgeUrl, id)],
          ["laps", () => AtlasServices.activityLaps(AtlasUI.state.bridgeUrl, id)],
          ["gear", () => AtlasServices.activityGear(AtlasUI.state.bridgeUrl, id)]
        ];
        if (isRunning) {
          jobs.push(
            ["running", () => AtlasServices.activityRunning(AtlasUI.state.bridgeUrl, id, date)],
            ["typed", () => AtlasServices.activityTypedSplits(AtlasUI.state.bridgeUrl, id)],
            ["vo2", () => AtlasServices.activityPreciseVo2(AtlasUI.state.bridgeUrl, id)]
          );
        }
        const settled = await Promise.allSettled(jobs.map(([, task]) => AtlasServices.withRetry(task, 1)));
        const result = {};
        settled.forEach((item, index) => {
          const key = jobs[index][0];
          if (item.status === "fulfilled") result[key] = item.value?.data ?? null;
          else errors.push(`${key}:${String(item.reason?.message || item.reason)}`);
        });

        const rawDetail = result.detail || record?.detail?.raw || null;
        const detail = rawDetail ? AtlasDomain.normalizeActivityDetail(rawDetail) : (record?.detail || null);
        const runningRaw = result.running?.details || result.running?.activity || result.running || null;
        const runningMetrics = isRunning && runningRaw ? summarizeRunningMetrics(result.running?.details || result.running) : (record?.running || null);
        let kilometerSplits = [];
        if (isRunning) {
          try {
            const fitBlob = await AtlasServices.activityFit(AtlasUI.state.bridgeUrl, id);
            const fitMeta = await parseFitSegmentsFromBlob(fitBlob);
            kilometerSplits = Array.isArray(fitMeta?.kilometerSplits) ? fitMeta.kilometerSplits : [];
          } catch (error) {
            errors.push(`fit:${String(error?.message || error)}`);
          }
        }

        return {
          id,
          title: record?.summary?.title || null,
          date: record?.summary?.date || null,
          sport: record?.summary?.sport || null,
          summary: record?.summary || null,
          detail: detail ? {
            startTimeLocal: detail.startTimeLocal ?? null,
            distanceM: detail.distanceM ?? null,
            durationSec: detail.durationSec ?? null,
            calories: detail.calories ?? null,
            averageHR: detail.averageHR ?? null,
            maxHR: detail.maxHR ?? null,
            averagePower: detail.averagePower ?? null,
            normalizedPower: detail.normalizedPower ?? null,
            averageSpeed: detail.averageSpeed ?? null,
            elevationGainM: detail.elevationGainM ?? null,
            minElevationM: detail.minElevationM ?? null,
            maxElevationM: detail.maxElevationM ?? null,
            averageTemperatureC: detail.averageTemperatureC ?? null,
            trainingLoad: detail.trainingLoad ?? null,
            trainingEffect: detail.trainingEffect ?? null,
            trainingEffectLabel: detail.trainingEffectLabel ?? null,
            anaerobicTrainingEffect: detail.anaerobicTrainingEffect ?? null,
            rpe: detail.rpe ?? null,
            feeling: detail.feeling ?? null,
            workoutId: detail.workoutId ?? null
          } : null,
          runningMetrics: isRunning ? {
            ...(record?.running || {}),
            ...(runningMetrics || {})
          } : null,
          laps: compactLapRows(result.laps),
          kilometerSplits,
          typedSplits: isRunning ? compactTypedSplits(result.typed) : [],
          gear: compactGear(result.gear),
          preciseVo2: isRunning ? (result.vo2?.value ?? result.vo2?.data?.value ?? null) : null,
          sourceErrors: errors
        };
      }
