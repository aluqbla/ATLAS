      async function exportAiJson({ incremental = false } = {}) {
        if (AtlasUI.state.exportProgress?.active) return;
        if (!AtlasUI.state.bridgeUrl) {
          window.alert("Configura primero el Worker de Garmin.");
          return;
        }
        AtlasUI.state.exportError = null;
        setExportProgress(1, incremental ? "Preparando actualización IA" : "Preparando JSON para IA", "Leyendo base local");
        try {
          const local = await readAiLocalSnapshot();
          const marker = incremental ? await AtlasStorage.get("settings", "lastAiExportAt") : null;
          const since = marker?.value || null;
          const sinceDate = since ? String(since).slice(0, 10) : null;
          let activities = (local.activities || []).slice();
          let healthDays = (local.healthDays || []).slice();
          let metrics = (local.metrics || []).slice();
          let rhr = (local.restingHeartRateHistory || []).slice();
          let lt = (local.lactateThreshold || []).slice();
          if (incremental && sinceDate) {
            activities = activities.filter((row) => {
              const date = String(row?.summary?.date || "");
              const updated = [row?.summaryUpdatedAt, row?.detailUpdatedAt, row?.activityFreshUpdatedAt].filter(Boolean).sort().at(-1) || "";
              return date >= sinceDate || updated > since;
            });
            healthDays = healthDays.filter((row) => String(row?.date || "") >= sinceDate);
            metrics = metrics.filter((row) => String(row?.date || "") >= sinceDate);
            rhr = rhr.filter((row) => String(row?.date || "") >= sinceDate);
            lt = lt.filter((row) => String(row?.endDate || row?.startDate || "") >= sinceDate);
          }
          activities.sort((a, b) => String(b?.summary?.date || "").localeCompare(String(a?.summary?.date || "")));
          const compactActivities = [];
          const failures = [];
          const total = Math.max(1, activities.length);
          for (let i = 0; i < activities.length; i++) {
            setExportProgress(5 + (i / total) * 86, incremental ? "Actualizando actividades" : "Recopilando actividades", `${i + 1} de ${activities.length}`);
            try {
              compactActivities.push(await compactAiActivity(activities[i]));

      async function refreshActivityData(id) {
        const existing = await AtlasStorage.get(
          "activities",
          String(id)
        );
        if (!existing) throw new Error("ACTIVITY_NOT_FOUND");

        await AtlasStorage.put("activities", {
          ...existing,
          activityFreshLoading: true
        });
        // Preserve every cached field so the detail view stays instant while Garmin refreshes.
        const memoryActivity = AtlasUI.state.activities.find(
          (item) => String(item?.id) === String(id)
        );
        if (memoryActivity) memoryActivity.activityFreshLoading = true;

        const isRunning = String(
          existing?.summary?.sport || ""
        ).toLowerCase().includes("run");

        try {
          const detailPromise = AtlasServices.activityDetail(
            AtlasUI.state.bridgeUrl,
            String(id)
          );

          const runningPromise = isRunning
            ? AtlasServices.activityRunning(
                AtlasUI.state.bridgeUrl,
                String(id),
                existing?.summary?.date
              )
            : Promise.resolve(null);

          const lapsPromise = isRunning
            ? AtlasServices.activityLaps(
                AtlasUI.state.bridgeUrl,
                String(id)
              )
            : Promise.resolve(null);

          const fitPromise = isRunning
            ? AtlasServices.activityFit(
                AtlasUI.state.bridgeUrl,
                String(id)
              )
            : Promise.resolve(null);

          const preciseVo2Promise = isRunning
            ? AtlasServices.activityPreciseVo2(
                AtlasUI.state.bridgeUrl,
                String(id)
              )
            : Promise.resolve(null);

          // Fast first paint: detail + laps update the visible activity as soon as they arrive.
          // FIT/running/VO2 continue in parallel and enrich the same record afterwards.
          void Promise.allSettled([detailPromise, lapsPromise]).then(async ([detailEarly,lapsEarly])=>{
            try{
              const latest=await AtlasStorage.get("activities",String(id));
              if(!latest)return;
              const patch={...latest};
              if(detailEarly.status==="fulfilled"){
                patch.detail=AtlasDomain.normalizeActivityDetail(detailEarly.value.data);
                patch.detailLoaded=true;
                patch.detailUpdatedAt=new Date().toISOString();
              }
              if(isRunning&&lapsEarly.status==="fulfilled"){
                patch.freshLaps=lapsEarly.value?.data??null;
              }
              await AtlasStorage.put("activities",patch);
              const memory=AtlasUI.state.activities.find(item=>String(item.id)===String(id));
              if(memory)Object.assign(memory,patch);
              if(String(AtlasUI.state.route?.id??"")===String(id)&&AtlasUI.state.route?.view==="activity-detail"){
                AtlasUI.render({scrollMode:"preserve"});
              }
            }catch(error){console.warn("ATLAS activity early paint:",error?.message||error);}
          });

          const [
            detailResult,
            runningResult,
            lapsResult,
            fitResult,
            preciseVo2Result
          ] = await Promise.allSettled([
            detailPromise,
            runningPromise,
            lapsPromise,
            fitPromise,
            preciseVo2Promise
          ]);

          if (detailResult.status !== "fulfilled") {
            throw detailResult.reason;
          }

          const detail = AtlasDomain.normalizeActivityDetail(
            detailResult.value.data
          );

          let running = null;
          let freshSummary = existing.summary;

          if (
            isRunning &&
            runningResult.status === "fulfilled" &&
            runningResult.value
          ) {
            const activityRaw =
              runningResult.value?.data?.activity || null;
            const detailsRaw =
              runningResult.value?.data?.details || null;

            freshSummary = activityRaw
              ? AtlasDomain.normalizeActivitySummary(activityRaw)
              : existing.summary;

            const chart = summarizeRunningMetrics(detailsRaw);

            const choose = (...values) => {
              for (const value of values) {
                if (
                  value !== null &&
                  value !== undefined &&
                  value !== ""
                ) {
                  return value;
                }
              }
              return null;
            };

            running = {
              activityVo2Max: choose(
                freshSummary?.activityVo2Max,
                existing?.summary?.activityVo2Max
              ),
              averageCadence: choose(
                freshSummary?.averageCadence,
                chart.averageCadence
              ),
              maxCadence: choose(
                freshSummary?.maxCadence,
                chart.maxCadence
              ),
              averageStrideLength: choose(
                freshSummary?.averageStrideLength,
                existing?.summary?.averageStrideLength
              ),
              averageVerticalOscillation: choose(
                freshSummary?.averageVerticalOscillation,
                chart.averageVerticalOscillation
              ),
              averageVerticalRatio: choose(
                freshSummary?.averageVerticalRatio,
                chart.averageVerticalRatio
              ),
              averageGroundContactTime: choose(
                freshSummary?.averageGroundContactTime,
                chart.averageGroundContactTime
              ),
              averageGroundContactBalance: choose(
                freshSummary?.averageGroundContactBalance,
                chart.averageGroundContactBalance
              ),
              averagePower: choose(
                freshSummary?.averagePower,
                chart.averagePower
              ),
              maxPower: choose(
                freshSummary?.maxPower,
                chart.maxPower
              ),
              normalizedPower: choose(
                freshSummary?.normalizedPower,
                existing?.summary?.normalizedPower
              )
            };
          }

          const freshLaps =
            lapsResult.status === "fulfilled"
              ? lapsResult.value?.data ?? existing?.freshLaps ?? null
              : existing?.freshLaps ?? null;

          const garminWorkoutRaw = null;
          const garminWorkoutSegments = [];

          let fitSegments = [];
          let fitMeta = null;

          if (
            isRunning &&
            fitResult.status === "fulfilled" &&
            fitResult.value
          ) {
            try {
              fitMeta = await parseFitSegmentsFromBlob(
                fitResult.value
              );

              const apiLapCount = normalizeLapRows(
                freshLaps
              ).length;

              if (
                fitMeta.fitLapCount === apiLapCount &&
                fitMeta.labels.length === apiLapCount
              ) {
                fitSegments = fitMeta.labels;
              }
            } catch (error) {
              console.error("ATLAS FIT parse:", error);
            }
          }

          const activityPreciseVo2 =
            preciseVo2Result.status === "fulfilled" &&
            preciseVo2Result.value?.data
              ? {
                  activityId: String(
                    preciseVo2Result.value.data.activityId ?? id
                  ),
                  value: preciseVo2Result.value.data.value ?? null,
                  source:
                    preciseVo2Result.value.data.source ??
                    "garmin-connect:maxmet.generic.vo2MaxPreciseValue",
                  calendarDate:
                    preciseVo2Result.value.data.calendarDate ?? null,
                  obtainedAt:
                    preciseVo2Result.value.data.obtainedAt ??
                    new Date().toISOString(),
                  association:
                    preciseVo2Result.value.meta?.association ??
                    "latest-run-on-activity-date",
                  matched:
                    preciseVo2Result.value.data.matched === true &&
                    preciseVo2Result.value.meta?.exactOpenedActivityMatch === true &&
                    String(
                      preciseVo2Result.value.data.activityId ?? ""
                    ) === String(id) &&
                    Number.isFinite(
                      Number(preciseVo2Result.value.data.value)
                    ) &&
                    !Number.isInteger(
                      Number(preciseVo2Result.value.data.value)
                    ) &&
                    Number(preciseVo2Result.value.data.value) > 10 &&
                    Number(preciseVo2Result.value.data.value) < 100
                }
              : {
                  activityId: String(id),
                  value: null,
                  source: "garmin-connect:maxmet.generic.vo2MaxPreciseValue",
                  calendarDate: existing?.summary?.date ?? null,
                  obtainedAt: new Date().toISOString(),
                  matched: false
                };

          const updated = {
            ...existing,
            summary: {
              ...existing.summary,
              ...freshSummary
            },
            detail,
            detailLoaded: true,
            detailUpdatedAt: new Date().toISOString(),
            running: running ?? existing?.running ?? null,
            runningLoaded: Boolean(running ?? existing?.running),
            runningUpdatedAt: running
              ? new Date().toISOString()
              : existing?.runningUpdatedAt ?? null,
            freshLaps,
            fitSegments: fitSegments.length ? fitSegments : (existing?.fitSegments ?? garminWorkoutSegments),
            garminWorkoutRaw,
            fitMeta: fitMeta ?? existing?.fitMeta ?? null,
            activityPreciseVo2:
              activityPreciseVo2?.matched || !existing?.activityPreciseVo2
                ? activityPreciseVo2
                : existing.activityPreciseVo2,
            activityFreshLoading: false,
            activityFreshUpdatedAt: new Date().toISOString()
          };

          await AtlasStorage.put(
            "activities",
            updated
          );
          await hydrateLocal();

          if (isRunning) {
            (async () => {
              try {
                const timeout = new Promise((_, reject) => {
                  setTimeout(
                    () => reject(new Error("ACTIVITY_TYPED_SPLITS_TIMEOUT")),
                    4000
                  );
                });

                const typedSplitsPayload = await Promise.race([
                  AtlasServices.activityTypedSplits(
                    AtlasUI.state.bridgeUrl,
                    String(id)
                  ),
                  timeout
                ]);

                const latest = await AtlasStorage.get("activities", String(id));
                if (!latest) return;

                await AtlasStorage.put("activities", {
                  ...latest,
                  garminTypedSplits: typedSplitsPayload?.data ?? null,
                  garminTypedSplitsUpdatedAt: new Date().toISOString()
                });

                await hydrateLocal();
              } catch (error) {
                console.warn("ATLAS typed splits:", error);
              }
            })();
          }

          if (isRunning) {
            queueMicrotask(() => {
              (async () => {
                try {
                  const timeout = new Promise((_, reject) => {
                    setTimeout(
                      () => reject(new Error("ACTIVITY_GEAR_TIMEOUT")),
                      12000
                    );
                  });

                  const gearPayload = await Promise.race([
                    AtlasServices.activityGear(
                      AtlasUI.state.bridgeUrl,
                      String(id)
                    ),
                    timeout
                  ]);

                  const latest = await AtlasStorage.get("activities", String(id));
                  if (!latest) return;

                  await AtlasStorage.put("activities", {
                    ...latest,
                    garminActivityGear: Array.isArray(gearPayload?.data)
                      ? gearPayload.data
                      : [],
                    garminActivityGearUpdatedAt: new Date().toISOString()
                  });

                  await hydrateLocal();

                  if (
                    String(state.route?.id ?? "") === String(id) &&
                    state.route?.view === "activity-detail"
                  ) {
                    render();
                  }
                } catch (error) {
                  console.warn("ATLAS activity gear:", error);
                }
              })();
            });
          }

          return updated;
        } catch (error) {
          await AtlasStorage.put("activities", {
            ...existing,
            activityFreshLoading: false
          });
          await hydrateLocal();
          throw error;
        }
      }

      // v0.0.156 · Execution/Reconciliation + future-only Adaptive refinement.
      // Evidence is conservative: totals can prove completion/partial completion,
      // but aggregate activity data never invents interval-target failure.
      function atlasV00156ActivityDistanceM(activity) {
        const n = Number(activity?.summary?.distanceM ?? activity?.distanceM);
        return Number.isFinite(n) && n > 0 ? n : null;
      }

      function atlasV00156ActivityDurationSec(activity) {
        const n = Number(activity?.summary?.durationSec ?? activity?.durationSec);
        return Number.isFinite(n) && n > 0 ? n : null;
      }

      function atlasV00156EvidenceForMatch(session, activity) {
        const family = liveSessionSportFamily(session);
        const plannedDistance = Number(session?.distanceM);
        const actualDistance = atlasV00156ActivityDistanceM(activity);
        const plannedDuration = Number(session?.durationSec);
        const actualDuration = atlasV00156ActivityDurationSec(activity);
        let ratio = null;
        let source = null;

        if (family === "running" && plannedDistance > 0 && actualDistance > 0) {
          ratio = actualDistance / plannedDistance;
          source = "distance";
        } else if (plannedDuration > 0 && actualDuration > 0) {
          ratio = actualDuration / plannedDuration;
          source = "duration";
        }

        if (!Number.isFinite(ratio)) {
          return Object.freeze({
            evidenceSufficient: true,
            completionRatio: 1,
            performanceSignal: "as_planned",
            ratio: null,
            source: "date_sport_unique"
          });
        }

        const completionRatio = Math.max(0, Math.min(1, ratio));
        return Object.freeze({
          evidenceSufficient: true,
          completionRatio: ratio >= 0.85 ? 1 : completionRatio,
          performanceSignal: "as_planned",
          ratio: Math.round(ratio * 1000) / 1000,
          source
        });
      }

      function liveExecutionForPlan({
        sessions = [],
        activities = [],
        asOfDate
      } = {}) {
        const today = String(asOfDate || "");
        const results = [];
        const usedActivityIds = new Set();
        const orderedSessions = [...(sessions || [])].sort((a, b) =>
          String(a?.date || "").localeCompare(String(b?.date || ""))
        );

        const sessionsByDate = new Map();
        for (const session of orderedSessions) {
          if (!session?.date) continue;
          const key = String(session.date);
          if (!sessionsByDate.has(key)) sessionsByDate.set(key, []);
          sessionsByDate.get(key).push(session);
        }

        const activitiesByDate = new Map();
        for (const activity of activities || []) {
          const date = String(activity?.summary?.date || "");
          if (!date) continue;
          if (!activitiesByDate.has(date)) activitiesByDate.set(date, []);
          activitiesByDate.get(date).push(activity);
        }

        const compatibleOn = (date, family) =>
          (activitiesByDate.get(date) || []).filter((activity) => {
            const id = String(activity?.id ?? activity?.summary?.id ?? "");
            return !usedActivityIds.has(id) && liveActivitySportFamily(activity) === family;
          });

        for (const session of orderedSessions) {
          const date = String(session?.date || "");
          if (!date) continue;
          const family = liveSessionSportFamily(session);
          const compatible = compatibleOn(date, family);
          const sameFamilySessions = (sessionsByDate.get(date) || []).filter(
            (candidate) => liveSessionSportFamily(candidate) === family
          );

          if (compatible.length === 1 && sameFamilySessions.length === 1) {
            const activity = compatible[0];
            const evidence = atlasV00156EvidenceForMatch(session, activity);
            const reconciliation = AtlasTrainingEngine.buildExecutionReconciliation({
              plannedSession: session,
              mainRace: session?.role === "race",
              match: {
                plannedSessionId: session.id,
                activityId: activity.id ?? activity?.summary?.id ?? null,
                matchClass: "strong",
                evidenceSufficient: evidence.evidenceSufficient,
                completionRatio: evidence.completionRatio,
                performanceSignal: evidence.performanceSignal
              }
            });
            usedActivityIds.add(String(activity?.id ?? activity?.summary?.id ?? ""));
            results.push(Object.freeze({
              ...reconciliation,
              evidence: evidence,
              policy: "EXACT_DATE_SPORT_UNIQUE_WITH_TOTALS"
            }));
            continue;
          }

          if (compatible.length > 0) {
            const reconciliation = AtlasTrainingEngine.buildExecutionReconciliation({
              plannedSession: session,
              mainRace: session?.role === "race",
              match: {
                plannedSessionId: session.id,
                activityId: null,
                matchClass: "ambiguous",
                evidenceSufficient: false
              }
            });
            results.push(Object.freeze({
              ...reconciliation,
              policy: "AMBIGUOUS_SAME_DATE_SPORT"
            }));
            continue;
          }

          // Today remains pending only when no compatible completed activity exists.
          if (today && date >= today) {
            results.push(Object.freeze({
              plannedSessionId: String(session.id),
              activityId: null,
              matchClass: null,
              completion: "PENDING",
              outcome: "PENDING",
              adherenceCreditEligible: false,
              policy: "FUTURE_OR_TODAY_PENDING"
            }));
            continue;
          }

          // Conservative ±1-day reconciliation for a clearly shifted workout.
          const adjacentDates = [addDays(date, -1), addDays(date, 1)];
          const shiftedCandidates = [];
          for (const shiftedDate of adjacentDates) {
            const competingPlan = (sessionsByDate.get(shiftedDate) || []).some(
              (candidate) => liveSessionSportFamily(candidate) === family
            );
            if (competingPlan) continue;
            for (const activity of compatibleOn(shiftedDate, family)) {
              const evidence = atlasV00156EvidenceForMatch(session, activity);
              const ratio = Number(evidence.ratio);
              const plausible = !Number.isFinite(ratio) || (ratio >= 0.75 && ratio <= 1.35);
              if (plausible) shiftedCandidates.push({ activity, evidence, shiftedDate });
            }
          }

          if (shiftedCandidates.length === 1) {
            const { activity, evidence, shiftedDate } = shiftedCandidates[0];
            const reconciliation = AtlasTrainingEngine.buildExecutionReconciliation({
              plannedSession: session,
              mainRace: session?.role === "race",
              match: {
                plannedSessionId: session.id,
                activityId: activity.id ?? activity?.summary?.id ?? null,
                matchClass: "out_of_date",
                evidenceSufficient: true,
                completionRatio: evidence.completionRatio,
                performanceSignal: evidence.performanceSignal
              }
            });
            usedActivityIds.add(String(activity?.id ?? activity?.summary?.id ?? ""));
            results.push(Object.freeze({
              ...reconciliation,
              evidence: evidence,
              shiftedToDate: shiftedDate,
              policy: "ADJACENT_DATE_SPORT_UNIQUE_PLAUSIBLE_TOTAL"
            }));
            continue;
          }

          results.push(Object.freeze({
            plannedSessionId: String(session.id),
            activityId: null,
            matchClass: null,
            completion: "UNMATCHED",
            outcome: "NOT_COMPLETED",
            adherenceCreditEligible: session.role !== "race",
            policy: "PAST_NO_COMPATIBLE_ACTIVITY"
          }));
        }

        return Object.freeze(results);
      }

      function liveAdaptiveSignalsFromExecution(sessions, execution) {
        const today = localDate(0);
        const byId = new Map((sessions || []).map((session) => [String(session.id), session]));
        const adverse = new Set(["NOT_COMPLETED", "FAILED_TARGET", "ABORTED", "COMPLETED_PARTIALLY"]);
        const recentKey = (execution || [])
          .filter((item) => {
            const session = byId.get(String(item?.plannedSessionId));
            return session?.primaryStimulus === true && session?.date < today && adverse.has(item?.outcome);
          })
          .sort((a, b) => String(byId.get(String(b.plannedSessionId))?.date || "").localeCompare(String(byId.get(String(a.plannedSessionId))?.date || "")))
          .slice(0, 3);

        if (!recentKey.length) return Object.freeze([]);

        const nextFutureKey = (sessions || [])
          .filter((session) => session?.primaryStimulus === true && String(session?.date || "") >= today)
          .sort((a, b) => String(a.date).localeCompare(String(b.date)))[0];

        if (!nextFutureKey) return Object.freeze([]);

        const hardFailures = recentKey.filter((item) => ["NOT_COMPLETED", "FAILED_TARGET", "ABORTED"].includes(item.outcome));
        if (hardFailures.length >= 2) {
          return Object.freeze([Object.freeze({
            id: "live:progression-hold",
            action: "PROGRESSION_HOLD",
            sessionId: String(nextFutureKey.id),
            reason: "two_recent_key_failures",
            evidence: Object.freeze({
              failedKeySessions: hardFailures.length,
              targetFutureDate: nextFutureKey.date,
              futureOnly: true
            })
          })]);
        }

        const latest = recentKey[0];
        if (latest?.outcome === "COMPLETED_PARTIALLY") {
          return Object.freeze([Object.freeze({
            id: "live:soften-next-key",
            action: "SOFTEN",
            sessionId: String(nextFutureKey.id),
            reason: "recent_key_session_partial",
            evidence: Object.freeze({
              targetFutureDate: nextFutureKey.date,
              futureOnly: true
            })
          })]);
        }

        return Object.freeze([]);
      }
