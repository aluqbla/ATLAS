<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>ATLAS</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/today.css">
  <link rel="stylesheet" href="css/activities.css">
  <link rel="stylesheet" href="css/plan.css">
  <link rel="stylesheet" href="css/evolution.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/canonical.css">
  <link rel="stylesheet" href="css/empty.css">
  <script defer src="js/data/db.js"></script>
  <script defer src="js/data/repositories.js"></script>
  <script defer src="js/navigation.js"></script>
  <script defer src="js/views.js"></script>
  <script defer src="js/garmin/official.js"></script>
  <script defer src="js/data/offline.js"></script>
  <script defer src="js/data/init.js"></script>
</head>
<body>
  <div class="atlas-shell atlas-app">
    <header class="atlas-identity" aria-label="ATLAS">
      <img src="assets/ATLAS.jpeg" alt="ATLAS" width="2132" height="364">
    </header>
    <main id="atlas-main" class="atlas-main">
    <section class="atlas-view" id="view-hoy" role="tabpanel" aria-labelledby="tab-hoy" tabindex="0">
      <div class="today-heading"><h1 class="atlas-page-title atlas-view-heading">Hoy</h1></div>
      <div class="today-hero" aria-label="Estado ATLAS y seis métricas">
        <button class="today-state" id="today-state-button" type="button" aria-label="Ver detalle de Estado ATLAS">
          <span class="today-ring" id="today-state-ring"><span class="today-ring-value" id="today-state-score">—</span></span>
          <span class="today-state-copy"><span class="today-state-caption"><span id="today-date-caption">Fecha de hoy</span></span><span class="today-state-title" id="today-state-word">—</span><span class="today-state-description" id="today-state-note">—</span></span>
        </button>
        <div class="today-metrics" id="today-metrics" aria-label="Seis métricas"></div>
      </div>
      <h2 class="today-section-title">🕘 Último entrenamiento</h2><div class="today-sessions" id="today-last"></div>
      <h2 class="today-section-title">🗓️ Próximos entrenamientos</h2><div class="today-sessions" id="today-next"></div>
    </section>
      <section id="view-actividades" class="atlas-view" role="tabpanel" aria-labelledby="tab-actividades" tabindex="0" hidden>
      <div class="activities-heading"><h1 class="atlas-page-title atlas-view-heading">Actividades</h1></div>
      <div class="activities-toolbar" aria-label="Filtros de actividades">
        <select id="activities-sport" class="atlas-field" aria-label="Filtrar deporte"><option value="all">Todos los deportes</option><option value="running">🏃🏻‍♂️ Carrera</option><option value="cycling">🚴🏻‍♂️ Ciclismo</option><option value="strength">🏋🏻‍♂️ Fuerza</option><option value="walking">🚶🏻‍♂️ Caminar</option></select>
        <select id="activities-year" class="atlas-field" aria-label="Filtrar por año"><option value="all">Todo</option></select>
        <input id="activities-search" class="atlas-field activities-search" type="search" placeholder="Buscar actividad…" aria-label="Buscar actividades" autocomplete="off">
      </div>
      <p id="activities-summary" class="activities-summary" aria-live="polite"></p>
      <div id="activities-list" class="activities-list"></div>
    </section>
      <section id="view-plan" class="atlas-view" role="tabpanel" aria-labelledby="tab-plan" tabindex="0" hidden></section>
      <section id="view-evolucion" class="atlas-view" role="tabpanel" aria-labelledby="tab-evolucion" tabindex="0" hidden></section>
      <section id="view-perfil" class="atlas-view" role="tabpanel" aria-labelledby="tab-perfil" tabindex="0" hidden></section>
    </main>
  <section class="today-detail" id="today-detail" role="dialog" aria-modal="true" aria-labelledby="today-detail-title" hidden>
    <div class="today-detail-inner"><div class="today-detail-header"><button class="today-detail-back today-back" id="today-detail-back" type="button" aria-label="Volver a Hoy">‹</button><h2 id="today-detail-title"></h2></div><div id="today-detail-body"></div><button type="button" id="today-detail-close" class="atlas-button atlas-button--quiet today-detail-close atlas-return-button">Volver a Hoy</button></div>
  </section>
    <section class="activity-detail" id="activity-detail" role="dialog" aria-modal="true" aria-labelledby="activity-detail-title" hidden>
      <div class="activity-detail-inner"><div class="activity-detail-head"><button type="button" id="activity-detail-back" class="activity-detail-back" aria-label="Volver">‹</button><h2 id="activity-detail-title"></h2></div><div id="activity-detail-body" class="activity-detail-body"></div><button type="button" id="activity-detail-close" class="atlas-button atlas-button--quiet activity-detail-close atlas-return-button">Volver</button></div>
    </section>
    <section class="profile-detail" id="profile-detail" role="dialog" aria-modal="true" aria-labelledby="profile-detail-title" hidden>
      <div class="profile-detail-inner"><div class="profile-detail-top"><button id="profile-detail-back" class="profile-detail-back today-back" type="button" aria-label="Volver al perfil">‹</button><h2 id="profile-detail-title">Ajustes</h2></div><div id="profile-detail-body"></div><button id="profile-detail-close" class="today-bottom-back profile-detail-close atlas-return-button" type="button">Volver a Perfil</button></div>
    </section>
    <nav class="atlas-nav atlas-glass" aria-label="Navegación principal" role="tablist" aria-orientation="horizontal">
      <button id="tab-hoy" class="atlas-nav__item" type="button" role="tab" aria-controls="view-hoy" aria-selected="true" tabindex="0"><span class="atlas-nav__icon" aria-hidden="true">🏠</span><span class="atlas-nav__label">Hoy</span></button>
      <button id="tab-actividades" class="atlas-nav__item" type="button" role="tab" aria-controls="view-actividades" aria-selected="false" tabindex="-1"><span class="atlas-nav__icon" aria-hidden="true">🏃🏻‍♂️</span><span class="atlas-nav__label">Actividades</span></button>
      <button id="tab-plan" class="atlas-nav__item" type="button" role="tab" aria-controls="view-plan" aria-selected="false" tabindex="-1"><span class="atlas-nav__icon" aria-hidden="true">📅</span><span class="atlas-nav__label">Plan</span></button>
      <button id="tab-evolucion" class="atlas-nav__item" type="button" role="tab" aria-controls="view-evolucion" aria-selected="false" tabindex="-1"><span class="atlas-nav__icon" aria-hidden="true">📈</span><span class="atlas-nav__label">Evolución</span></button>
      <button id="tab-perfil" class="atlas-nav__item" type="button" role="tab" aria-controls="view-perfil" aria-selected="false" tabindex="-1"><span class="atlas-nav__icon" aria-hidden="true">👤</span><span class="atlas-nav__label">Perfil</span></button>
    </nav>
  </div>
</body>
</html>
