      function backButton() {
        if (!state.history.length) return "";
        return `<button class="back-button" data-action="back">← Atrás</button>`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function metric(type) {
        return state.metrics
          .filter((item) => item.type === type)
          .sort((a, b) =>
            String(b?.date || "").localeCompare(String(a?.date || ""))
          )[0] || null;
      }

      function formatDistance(meters) {
        const value = Number(meters);
        if (!Number.isFinite(value) || value < 0) return "—";

        if (value < 1000) {
          return `${Math.round(value).toLocaleString("es-ES")} m`;
        }

        const km = value / 1000;
        return `${km.toLocaleString("es-ES", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        })} km`;
      }

      function formatMetricDistanceKm(meters) {
        const value = Number(meters);
        if (!Number.isFinite(value) || value < 0) return "—";
        return (value / 1000).toLocaleString("es-ES", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        });
      }

      function paceMainValue(value) {
        return String(value || "—").replace(/\s*min\/km\s*$/i, "");
      }

      function formatHundredth(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        return n.toLocaleString("es-ES", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        });
      }

      function formatCardDuration(seconds) {
        const total = Math.max(0, Math.round(Number(seconds) || 0));
        const hours = Math.floor(total / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const secs = total % 60;

        if (hours > 0) {
          return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
        }

        return `${minutes}:${String(secs).padStart(2, "0")}`;
      }

      function formatCardPace(distanceM, durationSec) {
        const distance = Number(distanceM);
        const duration = Number(durationSec);

        if (!Number.isFinite(distance) || distance <= 0 ||
            !Number.isFinite(duration) || duration <= 0) {
          return null;
        }

        const pace = Math.round(duration / (distance / 1000));
        const minutes = Math.floor(pace / 60);
        const seconds = pace % 60;
        return `${minutes}:${String(seconds).padStart(2, "0")} min/km`;
      }

      function formatDuration(seconds) {
        const total = Math.max(0, Number(seconds) || 0);
        const h = Math.floor(total / 3600);
        const m = Math.round((total % 3600) / 60);
        return h ? `${h} h ${m} min` : `${m} min`;
      }

      function syncLabel(value) {
        return {
          idle: "—",
          syncing: "…",
          ok: "OK",
          error: "Error"
        }[value] || "—";
      }

      function readinessZone(score) {
        const value = Number(score);
        if (!Number.isFinite(value)) {
          return { color: "var(--text-3)", label: "Sin datos" };
        }
        if (value >= 95) return { color: "var(--purple)", label: "Excelente" };
        if (value >= 75) return { color: "var(--blue-active)", label: "Alta" };
        if (value >= 50) return { color: "var(--green)", label: "Moderada" };
        if (value >= 25) return { color: "var(--orange)", label: "Baja" };
        return { color: "var(--red)", label: "Deficiente" };
      }

      function trainingReadinessPresentation(readiness) {
        const zone=readinessZone(readiness?.value);
        if(!readiness||readiness.value==null){
          return {score:"—",title:"Sin datos de preparación",detail:readinessAnalysis(readiness),color:zone.color};
        }
        const score=formatGarminDecimal(readiness.value);
        return {
          score,
          title:`Preparación ${zone.label.toLowerCase()}`,
          detail:readinessAnalysis(readiness),
          color:zone.color
        };
      }

      function localDate(offsetDays = 0) {
        const date = new Date();
        date.setDate(date.getDate() + Number(offsetDays || 0));
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function addDaysIso(dateString, days) {
        const match = String(dateString || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) return dateString;
        const date = new Date(
          Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]))
        );
        date.setUTCDate(date.getUTCDate() + Number(days || 0));
        return date.toISOString().slice(0, 10);
      }

      function atlasDateFromRecord(value) {
        if (!value || typeof value !== "object") return null;

        const direct = [
          value.calendarDate,
          value.date,
          value.startDate,
          value.measurementDate,
          value.timestampLocal,
          value.timestamp,
          value.measurementTimeGMT,
          value.measurementTimeLocal
        ];

        for (const candidate of direct) {
          if (candidate == null || candidate === "") continue;

          if (typeof candidate === "string") {
            const match = candidate.match(/(\d{4}-\d{2}-\d{2})/);
            if (match) return match[1];
          }

          if (typeof candidate === "number" && Number.isFinite(candidate)) {
            const ms = candidate > 1e12 ? candidate : candidate * 1000;
            const date = new Date(ms);
            if (!Number.isNaN(date.getTime())) {
              return date.toISOString().slice(0, 10);
            }
          }
        }

        return null;
      }

      function isRunningActivity(activity) {
        const sport = String(
          activity?.summary?.sport ||
          activity?.sport ||
          activity?.summary?.raw?.activityType?.typeKey ||
          ""
        ).toLowerCase();
        return sport.includes("run") || sport.includes("running") || sport.includes("carrera");
      }

      function runningVolumeKm(days = 7) {
        const today = localDate(0);
        const start = addDaysIso(today, -(days - 1));
        const meters = state.activities.reduce((sum, activity) => {
          const date = String(activity?.summary?.date || "");
          if (!isRunningActivity(activity) || date < start || date > today) return sum;
          return sum + (Number(activity?.summary?.distanceM) || 0);
        }, 0);
        return meters / 1000;
      }

      function latestLactatePoint() {
        const rows = lactateThresholdSeries();
        return rows[rows.length - 1] || null;
      }


      function canonicalMetricHtml({
        emoji="•",
        label="",
        value="—",
        unit="",
        secondary="",
        secondValue=null,
        secondUnit="",
        metricId=null,
        extraClass=""
      }={}) {
        const attr = metricId
          ? ` data-metric="${escapeHtml(metricId)}"`
          : "";
        const dual = secondValue !== null && secondValue !== undefined;

        return `<article class="activity-metric canonical-metric ${dual ? "canonical-dual" : ""} ${extraClass}"${attr}>
          <div class="activity-metric-label">
            <span class="canonical-metric-emoji">${emoji}</span>
            <span class="canonical-metric-label-text">${escapeHtml(label)}</span>
          </div>
          <div class="activity-metric-reading">
            <div class="activity-metric-value">${escapeHtml(value ?? "—")}</div>
            ${unit ? `<div class="activity-metric-unit">${escapeHtml(unit)}</div>` : ""}
          </div>
          ${dual ? `
            <div class="activity-metric-reading canonical-second-reading">
              <div class="activity-metric-value">${escapeHtml(secondValue ?? "—")}</div>
              ${secondUnit ? `<div class="activity-metric-unit">${escapeHtml(secondUnit)}</div>` : ""}
            </div>
          ` : secondary ? `<div class="activity-metric-subline">${escapeHtml(secondary)}</div>` : ""}
        </article>`;
      }

      function compactNumber(value, maxDecimals=1) {
        const n=Number(value);
        if(!Number.isFinite(n))return "—";
        return n.toLocaleString("es-ES",{
          minimumFractionDigits:0,
          maximumFractionDigits:maxDecimals
        });
      }

      function sleepQualityLabel(score) {
        const n=Number(score);
        if(!Number.isFinite(n))return "Sin datos";
        if(n>=90)return "Excelente";
        if(n>=80)return "Bueno";
        if(n>=60)return "Regular";
        return "Deficiente";
      }

      function sleepQualityColor(score) {
        const n=Number(score);
        if(!Number.isFinite(n))return "var(--text-3)";
        if(n>=90)return "var(--blue)";
        if(n>=80)return "var(--green)";
        if(n>=60)return "#FFD60A";
        return "var(--red)";
      }

      function restingHrSevenDayAverage() {
        const rows=[...state.restingHeartRateHistory]
          .filter(row=>Number(row?.value)>20&&Number(row?.value)<250)
          .sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))
          .slice(0,7);
        if(!rows.length)return null;
        return rows.reduce((sum,row)=>sum+Number(row.value),0)/rows.length;
      }

      function translateGarminStatus(value) {
        const raw=String(value||"").trim();
        if(!raw)return "";
        const key=raw.toUpperCase();
        const map={
          BALANCED:"Equilibrada", UNBALANCED:"Desequilibrada", LOW:"Baja", POOR:"Baja",
          GOOD:"Bueno", MODERATE:"Moderado", HIGH:"Alto", VERY_HIGH:"Muy alto",
          EXCELLENT:"Excelente", FAIR:"Aceptable", POOR_SLEEP:"Sueño bajo",
          OPTIMAL:"Óptimo", MAINTAINING:"Mantenimiento", PRODUCTIVE:"Productivo",
          RECOVERY:"Recuperación", STRAINED:"Sobrecarga", DETRAINING:"Desentrenamiento"
        };
        if(map[key])return map[key];
        return raw
          .replaceAll("_"," ")
          .toLowerCase()
          .replace(/^./,c=>c.toUpperCase());
      }

      function translateGarminFeedback(value) {
        const raw=String(value||"").trim();
        if(!raw)return "";
        const key=raw.toUpperCase();
        const map={
          FOCUS_ON_SLEEP_PATTERNS:"Conviene mejorar la regularidad y la calidad del sueño.",
          FOCUS_ON_SLEEP:"El sueño está limitando tu preparación actual.",
          FOCUS_ON_RECOVERY:"La recuperación todavía necesita tiempo.",
          RECOVERY_TIME_HIGH:"Aún queda bastante tiempo de recuperación.",
          RECOVERY_TIME_MODERATE:"La recuperación es moderada.",
          HRV_STATUS_LOW:"La VFC está por debajo de tu rango habitual.",
          HRV_STATUS_UNBALANCED:"La VFC está fuera de tu rango equilibrado.",
          HRV_STATUS_BALANCED:"La VFC se mantiene dentro de tu rango habitual.",
          ACUTE_LOAD_HIGH:"La carga reciente es elevada.",
          ACUTE_LOAD_LOW:"La carga reciente es baja.",
          ACUTE_LOAD_OPTIMAL:"La carga reciente está en un rango adecuado.",
          STRESS_HISTORY_HIGH:"El estrés reciente está reduciendo tu preparación.",
          SLEEP_HISTORY_POOR:"El historial reciente de sueño está penalizando la preparación.",
          READY_FOR_TRAINING:"Los principales indicadores respaldan una buena disposición para entrenar.",
          GOOD:"Bueno", MODERATE:"Moderado", LOW:"Bajo", HIGH:"Alto", POOR:"Bajo",
          BALANCED:"Equilibrado", UNBALANCED:"Desequilibrado", EXCELLENT:"Excelente"
        };
        return map[key] || translateGarminStatus(raw);
      }

      function readinessAnalysis(readiness) {
        if(!readiness||readiness.value==null)return "Garmin no dispone de datos suficientes para valorar tu preparación de hoy.";
        const score=Number(readiness.value);
        const positives=[], cautions=[];
        const sleep=Number(readiness?.sleepScore);
        if(Number.isFinite(sleep)){if(sleep>=80)positives.push("buen sueño");else if(sleep<60)cautions.push("sueño flojo");}
        const hrv=String(readiness?.hrvFactorFeedback||"").toUpperCase();
        if(/BALANCED|GOOD|POSITIVE/.test(hrv)&&!/UNBALANCED/.test(hrv))positives.push("VFC equilibrada");
        if(/LOW|UNBALANCED|POOR/.test(hrv))cautions.push("VFC fuera de rango");
        const load=String(readiness?.acwrFactorFeedback||"").toUpperCase();
        if(/OPTIMAL|BALANCED|GOOD/.test(load))positives.push("carga adecuada");
        if(/HIGH|LOW|POOR/.test(load))cautions.push(/HIGH/.test(load)?"carga reciente alta":"carga reciente baja");
        const recovery=Number(readiness?.recoveryTimeMin);
        if(Number.isFinite(recovery)&&recovery>24*60)cautions.push("recuperación aún incompleta");
        let lead=score>=75?"Buena disposición para entrenar":score>=50?"Preparación suficiente, pero no óptima":score>=25?"Conviene controlar la exigencia":"Prioriza recuperación hoy";
        const parts=[];
        if(positives.length)parts.push(`${positives.slice(0,2).join(" y ")} juegan a favor`);
        if(cautions.length)parts.push(`${cautions.slice(0,2).join(" y ")} aconsejan prudencia`);
        return parts.length?`${lead}. ${parts.join("; ")}.`:`${lead}. El balance global de recuperación y carga determina la puntuación actual.`;
      }

      function hrvBaselineText(hrv) {
        const low=Number(hrv?.baselineLow),high=Number(hrv?.baselineHigh);
        if(Number.isFinite(low)&&Number.isFinite(high))return `Rango: ${Math.round(low)}-${Math.round(high)} ms`;
        const weekly=Number(hrv?.weeklyAvg);
        return Number.isFinite(weekly)?`Media 7 días: ${Math.round(weekly)} ms`:translateGarminStatus(hrv?.status)||"Sin rango disponible";
      }

      function paceRangeText(fast, slow, includeUnit=true) {
        const a=Number(fast),b=Number(slow);
        if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0)return "";
        const main=`${formatPaceSeconds(Math.min(a,b))}-${formatPaceSeconds(Math.max(a,b))}`;
        return includeUnit?`${main} min/km`:main;
      }

      function todayLongDate() {
        const label=new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(new Date());
        return label.charAt(0).toUpperCase()+label.slice(1);
      }

      function findFiniteByKeys(value, keys, depth=0) {
        if(value==null||depth>8)return null;
        if(Array.isArray(value)){
          for(let i=value.length-1;i>=0;i--){const found=findFiniteByKeys(value[i],keys,depth+1);if(found!=null)return found;}
          return null;
        }
        if(typeof value!=="object")return null;
        for(const key of keys){
          const n=Number(value?.[key]);
          if(Number.isFinite(n))return n;
        }
        for(const child of Object.values(value)){
          if(child&&typeof child==="object"){const found=findFiniteByKeys(child,keys,depth+1);if(found!=null)return found;}
        }
        return null;
      }

      function bodyBatteryLevelsFromPayload(value) {
        const levels=[];
        const walk=(node)=>{
          if(Array.isArray(node)){
            for(const item of node)walk(item);
            return;
          }
          if(!node||typeof node!=="object")return;
          const descriptors=Array.isArray(node.bodyBatteryValueDescriptorDTOList)
            ? node.bodyBatteryValueDescriptorDTOList
            : Array.isArray(node.bodyBatteryValueDescriptorsDTOList)
              ? node.bodyBatteryValueDescriptorsDTOList
              : [];
          const rows=Array.isArray(node.bodyBatteryValuesArray)?node.bodyBatteryValuesArray:[];
          if(descriptors.length&&rows.length){
            const index=descriptors.findIndex(d=>String(d?.bodyBatteryValueDescriptorKey||"").toLowerCase()==="bodybatterylevel");
            if(index>=0){
              for(const row of rows){
                const n=Number(Array.isArray(row)?row[index]:null);
                if(Number.isFinite(n)&&n>=0&&n<=100)levels.push(n);
              }
            }
          }
          for(const child of Object.values(node)){
            if(child&&typeof child==="object")walk(child);
          }
        };
        walk(value);
        return levels;
      }

      function bodyBatteryPointFromHealthDay(day) {
        if(!day)return null;
        const roots=[...(day?.sources?.bodyBattery||[]),...(day?.sources?.dailySummaries||[])];
        let current=findFiniteByKeys(roots,["bodyBatteryMostRecentValue","bodyBatteryCurrentValue","bodyBatteryValue"]);
        let high=findFiniteByKeys(roots,["bodyBatteryHighestValue","bodyBatteryHigh","highest"]);
        let low=findFiniteByKeys(roots,["bodyBatteryLowestValue","bodyBatteryLow","lowest"]);
        const charged=findFiniteByKeys(roots,["bodyBatteryChargedValue","bodyBatteryCharged","charged"]);
        const drained=findFiniteByKeys(roots,["bodyBatteryDrainedValue","bodyBatteryDrained","drained"]);
        const levels=bodyBatteryLevelsFromPayload(roots);
        if(levels.length){
          if(!Number.isFinite(current))current=levels[levels.length-1];
          if(!Number.isFinite(high))high=Math.max(...levels);
          if(!Number.isFinite(low))low=Math.min(...levels);
        }
        const candidates=[current,high,low].filter(v=>Number.isFinite(v)&&v>=0&&v<=100);
        if(!candidates.length)return null;
        return {date:day.date,value:Number.isFinite(current)?Math.max(0,Math.min(100,current)):Math.max(0,Math.min(100,high)),high,low,charged,drained,series:levels};
      }

      function latestBodyBattery() {
        for(let i=state.healthDays.length-1;i>=0;i--){const point=bodyBatteryPointFromHealthDay(state.healthDays[i]);if(point)return point;}
        return null;
      }

      function bodyBatteryStatus(value) {
        const n=Number(value);
        if(!Number.isFinite(n))return "Sin datos";
        if(n>=75)return "Muy alta";
        if(n>=50)return "Buena";
        if(n>=25)return "Baja";
        return "Muy baja";
      }

        return `<article class="activity-metric canonical-metric"${attr}>

      function formatGarminDecimal(value) {
        if (value === null || value === undefined || value === "") return "—";
        const number = Number(value);
        if (!Number.isFinite(number)) return "—";
        return String(number).replace(".", ",");
      }

      function sportKey(sport) {
        return String(sport || "").trim().toLowerCase();
      }

      function resolvedSportKey(sport, title = "") {
        const key = sportKey(sport);
        const name = String(title || "").trim().toLowerCase();

        if (
          key === "paddleball" ||
          name === "paddleball" ||
          name.includes("pádel") ||
          name.includes("padel")
        ) {
          return "padel";
        }

        if (key === "kayaking_v2") return "kayaking";
        if (key === "trail_running" || name === "trail") return "trail_running";

        if (
          key === "soccer" ||
          key === "football" ||
          name.includes("fútbol") ||
          name.includes("futbol") ||
          name.includes("football") ||
          name.includes("soccer")
        ) {
          return "soccer";
        }

        return key;
      }

      function localizedActivityTitle(title, sport = "") {
        const raw = String(title || "Actividad").trim();
        const lower = raw.toLowerCase();
        const resolved = resolvedSportKey(sport, raw);

        if (lower === "paddleball") return "Pádel";
        if (lower === "kayaking v2" || lower === "kayaking_v2") return "Piragüismo";
        if (lower === "trail") return "Carrera de montaña";
        if (lower === "other") return resolved === "soccer" ? "Fútbol" : "Otros";

        return raw;
      }

        if (key.includes("walk")) return "🚶🏻‍♂️";
        if (key.includes("hiking") || key.includes("sender")) return "🥾";

      function isRunningSport(sport, title = "") {
        const key = resolvedSportKey(sport, title);
        return (
          key === "running" ||
          key === "trail_running" ||
          key === "treadmill_running" ||
          key === "track_running" ||
          key === "indoor_track" ||
          key.includes("running") ||
          key.includes("run")
        );
      }

      function activitySportFamily(sport, title = "") {
        const key = resolvedSportKey(sport, title);

        if (isRunningSport(sport, title)) return "running";

        if (
          key.includes("cycling") ||
          key.includes("biking") ||
          key.includes("bike")
        ) return "cycling";

        if (key.includes("swim")) return "swimming";

        if (
          key === "padel" ||
          key.includes("tennis") ||
          key === "soccer" ||
          key === "football"
        ) return "court";

        if (
          key.includes("strength") ||
          key.includes("hiit") ||
          key.includes("cardio")
        ) return "strength";

        if (
          key.includes("walking") ||
          key.includes("walk") ||
          key.includes("hiking")
        ) return "walking";

        if (
          key.includes("kayak") ||
          key.includes("canoe") ||
          key.includes("rowing") ||
          key.includes("row")
        ) return "paddling";

        if (
          key.includes("yoga") ||
          key.includes("pilates")
        ) return "mindbody";

        return "general";
      }

      function formatSpeedKmh(distanceM, durationSec) {
        const distance = Number(distanceM);
        const duration = Number(durationSec);

        if (
          !Number.isFinite(distance) ||
          distance <= 0 ||
          !Number.isFinite(duration) ||
          duration <= 0
        ) return "—";

        const kmh = (distance / 1000) / (duration / 3600);
        return kmh.toLocaleString("es-ES", {
          minimumFractionDigits: 1,
          maximumFractionDigits: 1
        });
      }

      function formatSwimPace(distanceM, durationSec) {
        const distance = Number(distanceM);
        const duration = Number(durationSec);

        if (
          !Number.isFinite(distance) ||
          distance <= 0 ||
          !Number.isFinite(duration) ||
          duration <= 0
        ) return "—";

        const total = Math.round(duration / (distance / 100));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
      }

        const duration = d.durationSec;

          ? `${Math.round(Number(d.averageHR))}`
          : "—";
        const maxHr = d.maxHR != null
          ? `${Math.round(Number(d.maxHR))}`
          : "—";
        const calories = d.calories != null
          ? `${Math.round(Number(d.calories))}`
          : "—";
        const load = d.trainingLoad != null
          ? `${Math.round(Number(d.trainingLoad))}`
          : "—";
        const power = d.averagePower != null
          ? `${Math.round(Number(d.averagePower))}`
          : "—";
        const elevation = d.elevationGainM != null
          ? `${Math.round(Number(d.elevationGainM))}`
          : "—";

        if (family === "running") {

            summary.distanceM,
            summary.durationSec

          return [
            metricBox("Distancia", formatMetricDistanceKm(distance), "km"),
            metricBox("Tiempo", formatCardDuration(duration)),

            metricBox("FC media", avgHr, "ppm"),

            metricBox("Potencia", power, "W"),

            metricBox("Potencia", power, "W"),
            metricBox("Desnivel", elevation, "m +"),

          return [
            metricBox("Distancia", formatMetricDistanceKm(distance), "km"),
            metricBox("Tiempo", formatCardDuration(duration)),
            metricBox("Ritmo", formatSwimPace(distance, duration), "min/100 m"),
            metricBox("FC media", avgHr, "ppm"),
            metricBox("Calorías", calories, "kcal"),
            metricBox("FC máx.", maxHr, "ppm"),
            metricBox("Carga", load),
            metricBox(
              "Efecto aeróbico",
              d.trainingEffect != null ? `${d.trainingEffect}` : "—"
            )
          ].join("");
        }

        if (family === "court") {
          return [
            metricBox("Tiempo", formatCardDuration(duration)),
            metricBox("FC media", avgHr, "ppm"),
            metricBox("FC máx.", maxHr, "ppm"),
            metricBox("Calorías", calories, "kcal"),
            metricBox("Distancia", formatMetricDistanceKm(distance), "km"),
            metricBox("Carga", load),
            metricBox(
              "Aeróbico",
              d.trainingEffect != null ? `${d.trainingEffect}` : "—"
            ),
            metricBox(
              "Anaeróbico",
              d.anaerobicTrainingEffect != null
                ? `${d.anaerobicTrainingEffect}`
                : "—"
            )
          ].join("");
        }

        if (family === "strength") {
          return [
            metricBox("Tiempo", formatCardDuration(duration)),
            metricBox("FC media", avgHr, "ppm"),
            metricBox("FC máx.", maxHr, "ppm"),
            metricBox("Calorías", calories, "kcal"),
            metricBox("Carga", load),
            metricBox(
              "Aeróbico",
              d.trainingEffect != null ? `${d.trainingEffect}` : "—"
            ),
            metricBox(
              "Anaeróbico",
              d.anaerobicTrainingEffect != null
                ? `${d.anaerobicTrainingEffect}`
                : "—"
            ),
            metricBox(
              "Potencia",

            )

        }

        if (family === "walking") {
          return [
            metricBox("Distancia", formatMetricDistanceKm(distance), "km"),
            metricBox("Tiempo", formatCardDuration(duration)),
            metricBox("Ritmo", formatCardPace(distance, duration) || "—"),
            metricBox("FC media", avgHr, "ppm"),
            metricBox("Calorías", calories, "kcal"),
            metricBox("Desnivel", elevation, "m +"),
            metricBox("FC máx.", maxHr, "ppm"),
            metricBox("Carga", load)
          ].join("");
        }

        if (family === "paddling") {
          return [
            metricBox("Distancia", formatMetricDistanceKm(distance), "km"),
            metricBox("Tiempo", formatCardDuration(duration)),
            metricBox("Velocidad", formatSpeedKmh(distance, duration), "km/h"),
            metricBox("FC media", avgHr, "ppm"),
            metricBox("Calorías", calories, "kcal"),
            metricBox("Cadencia", cadence, "spm"),
            metricBox("FC máx.", maxHr, "ppm"),
            metricBox("Carga", load)
          ].join("");
        }

        if (family === "mindbody") {
          return [
            metricBox("Tiempo", formatCardDuration(duration)),
            metricBox("FC media", avgHr, "ppm"),
            metricBox("FC máx.", maxHr, "ppm"),
            metricBox("Calorías", calories, "kcal"),
            metricBox("Carga", load),
            metricBox(
              "Aeróbico",
              d.trainingEffect != null ? `${d.trainingEffect}` : "—"
            ),
            metricBox(
              "Anaeróbico",
              d.anaerobicTrainingEffect != null
                ? `${d.anaerobicTrainingEffect}`
                : "—"
            ),
            metricBox("Distancia", formatMetricDistanceKm(distance), "km")
          ].join("");
        }

        return [
          metricBox("Distancia", formatMetricDistanceKm(distance), "km"),
          metricBox("Tiempo", formatCardDuration(duration)),
          metricBox("FC media", avgHr, "ppm"),
          metricBox("FC máx.", maxHr, "ppm"),
          metricBox("Calorías", calories, "kcal"),
          metricBox("Carga", load),
          metricBox(
            "Aeróbico",
            d.trainingEffect != null ? `${d.trainingEffect}` : "—"
          ),
          metricBox(
            "Anaeróbico",

      function activityGearSection(family, gear) {

      function activityDetailTitleFontSize(title) {

      function activityDetailHeader(title, sport = "") {

      function activityMetaDate(value, fallbackDate) {
        const raw = value ? String(value).replace(" ", "T") : String(fallbackDate || "");
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) return fallbackDate || "—";
        return date.toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"2-digit"})
          .replaceAll(".","").toUpperCase();
      }

      function activityMetaTime(value) {
        if (!value) return "—";
        const date = new Date(String(value).replace(" ", "T"));
        if (Number.isNaN(date.getTime())) return "—";
        return date.toLocaleTimeString("es-ES",{hour:"numeric",minute:"2-digit",hour12:false});
      }

      function formatActivityMetaDateTime(value, fallbackDate) {
        return `${activityMetaDate(value,fallbackDate)} · ${activityMetaTime(value)}`;
      }

      function formatTemperature(value) {
        const n = Number(value);
        if (!Number.isFinite(n)) return "—";
        return `${String(Math.round(n*10)/10).replace(".",",")} ºC`;
      }

      function normalizeGarminRpe(value) {
        const raw = Number(value);
        if (!Number.isFinite(raw)) return null;
        const normalized = raw > 10 ? raw / 10 : raw;
        return Math.max(0, Math.min(10, normalized));
      }

      function rpePresentation(value) {
        const normalized = normalizeGarminRpe(value);
        if (!Number.isFinite(normalized)) return {emoji:"⚪",text:"—"};
        const score = Math.round(normalized * 10) / 10;
        let emoji="🔵";
        if (score>=3) emoji="🟢";
        if (score>=5) emoji="🟡";
        if (score>=7) emoji="🟠";
        if (score>=9) emoji="🔴";
        if (score>=10) emoji="🟣";
        return {
          emoji,
          text: score.toLocaleString("es-ES", {
            minimumFractionDigits: Number.isInteger(score) ? 0 : 1,
            maximumFractionDigits: 1
          })
        };
      }

      function feelingPresentation(value) {
        if (value == null || value === "") return {emoji:"😐",text:"—"};
        const raw=String(value).trim().toLowerCase();
        const n=Number(value);
        let level=null;
        // Garmin/FIT encodes Feel as 0,25,50,75,100. Keep 1–5 support only
        // for legacy records that were already normalized by another source.
        if (Number.isFinite(n)) {
          if ([0,25,50,75,100].includes(n)) level=Math.round(n/25)+1;
          else if (n>=1 && n<=5) level=Math.round(n);
          else if (n>=0 && n<=100) level=Math.max(1,Math.min(5,Math.round(n/25)+1));
        } else if (raw.includes("very_weak") || raw.includes("muy débil") || raw.includes("muy debil")) level=1;
        else if (raw.includes("weak") || raw==="débil" || raw==="debil") level=2;
        else if (raw.includes("normal")) level=3;
        else if (raw.includes("very_strong") || raw.includes("muy fuerte")) level=5;
        else if (raw.includes("strong") || raw.includes("fuerte")) level=4;
        const map={
          1:{emoji:"😫",text:"Muy débil"},2:{emoji:"🙁",text:"Débil"},
          3:{emoji:"😐",text:"Normal"},4:{emoji:"🙂",text:"Fuerte"},5:{emoji:"😄",text:"Muy fuerte"}
        };
        return map[level] || {emoji:"😐",text:String(value)};
      }

      function gearInfo(value) {
        const payload = value?.data ?? value;
        const items = Array.isArray(payload) ? payload : [];
        if (!items.length) return {name:"—",totalKm:null,uuid:null};

        const item = items[0] || {};
        const name = item.gearName ?? item.customMakeModel ?? item.displayName ?? item.name ?? item.modelName ?? item.model ?? "—";
        const uuid = item.uuid ?? item.gearUuid ?? item.gearUUID ?? item.id ?? item.gearPk ?? null;
        const rawDistance = item.totalDistance ?? item.accumulatedDistance ?? item.totalDistanceMeters ?? item.totalMeters ?? item.distance ?? item.currentDistance ?? null;
        const n = Number(rawDistance);
        let totalKm = Number.isFinite(n) && n > 0 ? (n >= 1000 ? n / 1000 : n) : null;

        // Activity gear payloads sometimes omit/zero accumulated distance.
        // Resolve it against the already-synced Garmin equipment list.
        const equipment = Array.isArray(state.equipment) ? state.equipment : [];
        const match = equipment.find((candidate) =>
          (uuid && candidate?.uuid && String(candidate.uuid)===String(uuid)) ||
          (name && candidate?.name && String(candidate.name).trim().toLowerCase()===String(name).trim().toLowerCase())
        );
        const equipmentMeters = Number(match?.totalDistanceM);
        if ((!Number.isFinite(totalKm) || totalKm<=0) && Number.isFinite(equipmentMeters) && equipmentMeters>0) {
          totalKm = equipmentMeters/1000;
        }
        return {name,totalKm,uuid:uuid?String(uuid):null};
      }

      function formatGearKm(value) {
        if (!Number.isFinite(Number(value))) return "— km";
        return `${Number(value).toLocaleString("es-ES",{minimumFractionDigits:0,maximumFractionDigits:1})} km`;
      }

      function metricEmoji(label) {
        const key = String(label || "").toLowerCase();

        if (key.includes("cadencia")) return "🔄";
        if (key.includes("carga")) return "📈";
        if (key.includes("aerób")) return "🫀";

      function dynamicEmoji(label) {
        const key = String(label || "").toLowerCase();
        if (key.includes("cadencia")) return "🔄";
        if (key.includes("zancada")) return "👣";
        if (key.includes("oscilación")) return "↕️";

      function metricBox(label,value,unit="",secondary="") {
        return canonicalMetricHtml({
          emoji:metricEmoji(label),
          label,
          value:value==null||value===""?"—":String(value),
          unit,
          secondary
        });
      }

      function dynamicBox(label,value,unit="") {
        return canonicalMetricHtml({
          emoji:dynamicEmoji(label),
          label,
          value:value==null||value===""?"—":String(value),
          unit
        });
      }

      function translateGarminBenefit(value) {
        const raw = String(value || "").trim();
        if (!raw) return "Beneficio Garmin no disponible";
        const key = raw.toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .replace(/[_\-.]+/g, " ");

        if (key.includes("recovery")) return "Recuperación";
        if (key.includes("base")) return "Base";
        if (key.includes("threshold") || key.includes("umbral")) return "Umbral";
        if (key.includes("tempo")) return "Tempo";
        if (key.includes("vo2") || key.includes("vo 2")) return "VO₂ máx.";
        if (key.includes("anaerobic") || key.includes("anaerob")) return "Capacidad anaeróbica";
        if (key.includes("sprint")) return "Sprint";
        if (key.includes("high aerobic")) return "Aeróbico alto";
        if (key.includes("low aerobic")) return "Aeróbico bajo";
        if (key.includes("aerobic")) return "Aeróbico";
        return raw
          .replace(/\bThreshold\b/gi, "Umbral")
          .replace(/\bRecovery\b/gi, "Recuperación")
          .replace(/\bAnaerobic\b/gi, "Anaeróbico")
          .replace(/\bVO2 Max\b/gi, "VO₂ máx.");
      }

      function weightedLapSlice(laps, from, to) {
        const rows = chartEligibleLaps(laps).filter((lap) =>
          Number(lap.distanceM) > 0 && Number.isFinite(lapPaceSecKm(lap))
        );
        const total = rows.reduce((sum, lap) => sum + Number(lap.distanceM), 0);
        if (!(total > 0)) return null;

        const lo = total * from;
        const hi = total * to;
        let cursor = 0, distance = 0, time = 0, hrNum = 0, hrDen = 0;

        for (const lap of rows) {
          const d = Number(lap.distanceM);
          const a = cursor;
          const b = cursor + d;
          const overlap = Math.max(0, Math.min(b, hi) - Math.max(a, lo));
          cursor = b;
          if (!(overlap > 0)) continue;

          const pace = lapPaceSecKm(lap);
          const hr = Number(lap.averageHR);
          distance += overlap;
          if (pace > 0) time += pace * (overlap / 1000);
          if (Number.isFinite(hr) && hr > 0) {
            hrNum += hr * overlap;
            hrDen += overlap;
          }
        }

        return distance > 0 ? {
          pace: time > 0 ? time / (distance / 1000) : null,
          hr: hrDen > 0 ? hrNum / hrDen : null
        } : null;
      }

      function localActivityAnalysis(activity, d, lapRows, segments) {
        const sportFamily = activitySportFamily(
          activity?.summary?.sport,
          activity?.summary?.title
        );

        const distance = Number(d.distanceM);
        const duration = Number(d.durationSec);
        const avgPace = distance > 0 && duration > 0
          ? duration / (distance / 1000)
          : null;
        const km = distance > 0
          ? (distance / 1000).toLocaleString("es-ES", {
              minimumFractionDigits: 0,
              maximumFractionDigits: 2
            })
          : null;

        if (sportFamily !== "running") {
          return duration > 0
            ? `Actividad completada en ${formatCardDuration(duration)}.`
            : "Actividad completada.";
        }

        const useful = chartEligibleLaps(lapRows);
        const benefitKey=translateGarminBenefit(d.trainingEffectLabel).toLowerCase();
        const longRun = distance >= 18000 || (duration >= 5400 && distance >= 14000);
        const sessionType = benefitKey.includes("recuperación") ? "recovery"
          : benefitKey === "base" || benefitKey.includes("aeróbico bajo") ? (longRun ? "long" : "easy")
          : benefitKey.includes("tempo") ? "tempo"
          : benefitKey.includes("umbral") ? "threshold"
          : benefitKey.includes("vo₂") ? "vo2"
          : benefitKey.includes("anaerób") || benefitKey.includes("sprint") ? "anaerobic"
          : longRun ? "long" : "run";
        const sessionLead={
          recovery:"Rodaje de recuperación: el objetivo principal es sumar movimiento con un coste bajo y favorecer la recuperación entre sesiones exigentes.",
          easy:"Rodaje fácil/aeróbico: busca acumular trabajo útil sin convertirlo en una sesión de calidad encubierta.",
          long:"Tirada larga: el valor está en sostener el esfuerzo con estabilidad y llegar al final sin una degradación excesiva del ritmo o de la respuesta cardiovascular.",
          tempo:"Trabajo tempo: debe sentirse sostenido y controlado, exigente pero sin la tensión propia del umbral.",
          threshold:"Trabajo de umbral: la clave es acumular minutos cerca del límite sostenible manteniendo regularidad entre bloques.",
          vo2:"Trabajo de VO₂ máx.: interesa repetir esfuerzos intensos con suficiente calidad y sin una caída acusada entre repeticiones.",
          anaerobic:"Trabajo de alta intensidad: prima la calidad de cada esfuerzo y la capacidad de repetirlos con técnica y potencia.",
          run:"Sesión de carrera: conviene valorar sobre todo estabilidad, coste cardiovascular y cómo termina la segunda mitad."
        }[sessionType];
        const hasStructured =
          Array.isArray(segments) &&
          segments.length === useful.length &&
          segments.some((x) => x === "MAIN");

        if (hasStructured) {
          const main = useful.filter((_, i) => segments[i] === "MAIN");
          const paced = main
            .map((lap) => ({lap, pace: lapPaceSecKm(lap)}))
            .filter((x) => Number.isFinite(x.pace));

          if (paced.length >= 2) {
            const sorted = paced.map(x => x.pace).sort((a,b)=>a-b);
            const median = sorted.length % 2
              ? sorted[(sorted.length-1)/2]
              : (sorted[sorted.length/2-1] + sorted[sorted.length/2]) / 2;

            const work = paced.filter(x => x.pace <= median);
            const first = work[0];
            const last = work[work.length - 1];
            const mean = work.length
              ? work.reduce((s,x)=>s+x.pace,0)/work.length
              : null;
            const cv = work.length > 1 && mean
              ? Math.sqrt(work.reduce((s,x)=>s+Math.pow(x.pace-mean,2),0)/work.length)/mean*100
              : null;
            const quality = cv == null ? "bien resuelta" : cv < 1.6 ? "muy consistente" : cv < 3.2 ? "consistente" : "algo irregular";

            let text = `${sessionLead} Sesión de calidad ${quality}`;
            if (work.length) text += `: ${work.length} repeticiones de trabajo`;
            if (mean) text += ` a ${formatPaceSeconds(mean)} min/km de media`;
            text += ".";

            if (first && last) {
              const delta = Math.round(last.pace - first.pace);
              if (Math.abs(delta) <= 3) {
                text += " No hay pérdida relevante de ritmo entre la primera y la última repetición.";
              } else if (delta < -3) {
                text += ` La última repetición es ${Math.abs(delta)} s/km más rápida, señal de buen margen final.`;
              } else if (delta > 5) {
                text += ` La última repetición es ${delta} s/km más lenta, una caída que conviene vigilar si se repite.`;
              }

              const firstHr = Number(first.lap.averageHR);
              const lastHr = Number(last.lap.averageHR);
              if (Number.isFinite(firstHr) && Number.isFinite(lastHr)) {
                const hrDelta = Math.round(lastHr - firstHr);
                if (hrDelta >= 10) {
                  text += ` La FC sube ${hrDelta} ppm del primer al último bloque, mostrando un coste fisiológico creciente.`;
                } else if (hrDelta <= 4 && quality !== "algo irregular") {
                  text += " La respuesta cardiovascular se mantiene estable entre bloques.";
                }
              }
            }
            return text;
          }
        }

        const first = weightedLapSlice(useful, 0, .5);
        const last = weightedLapSlice(useful, .5, 1);
        let text = `${sessionLead}`;

        if (first?.pace && last?.pace) {
          const paceDelta = Math.round(last.pace - first.pace);
          const hrDelta = Number.isFinite(first?.hr) && Number.isFinite(last?.hr)
            ? Math.round(last.hr - first.hr)
            : null;

          if (hrDelta != null && hrDelta >= 9 && Math.abs(paceDelta) <= 7) {
            text += ` El ritmo se mantiene estable, pero la FC sube alrededor de ${hrDelta} ppm en la segunda mitad: hay una deriva cardiovascular clara.`;
          } else if (hrDelta != null && hrDelta <= 3 && Math.abs(paceDelta) <= 5) {
            text += " La segunda mitad mantiene ritmo y FC prácticamente estables, señal de buen control del esfuerzo.";
          } else if (paceDelta <= -7 && (hrDelta == null || hrDelta <= 7)) {
            text += ` Terminas ${Math.abs(paceDelta)} s/km más rápido sin un aumento desproporcionado de FC, señal de margen final.`;
          } else if (paceDelta >= 10) {
            text += ` La segunda mitad pierde alrededor de ${Math.abs(paceDelta)} s/km, señal de fatiga o menor capacidad para sostener el ritmo al final.`;
          }
        }

        return text;
      }

      function localActivityBenefit(activity, d) {
        const family = activitySportFamily(
          activity?.summary?.sport,
          activity?.summary?.title
        );
        const benefit = translateGarminBenefit(d.trainingEffectLabel);
        const key = benefit.toLowerCase();

        if (family === "strength") {
          return "Refuerza fuerza útil, estabilidad y tolerancia muscular para soportar mejor el volumen y los ritmos de carrera.";
        }
        if (key.includes("recuperación")) {
          return "Favorece la recuperación activa y suma estímulo aeróbico con un coste de fatiga bajo.";
        }
        if (key === "base") {
          return "Aporta base aeróbica y economía de carrera, acumulando trabajo sin comprometer innecesariamente la siguiente sesión clave.";
        }
        if (key.includes("umbral")) {
          return "Mejora la capacidad de sostener ritmos altos cerca del umbral durante más tiempo.";
        }
        if (key.includes("vo₂")) {
          return "Estimula el VO₂ máx., la economía a ritmos altos y la capacidad de repetir esfuerzos intensos.";
        }
        if (key.includes("anaerób")) {
          return "Mejora la capacidad de producir y repetir esfuerzos de alta intensidad y tolerar mejor la acumulación de fatiga.";
        }
        if (key.includes("sprint")) {
          return "Mejora velocidad, coordinación y capacidad neuromuscular con esfuerzos muy breves y de alta intensidad.";
        }
        if (key.includes("tempo")) {
          return "Refuerza la resistencia a ritmos sostenidos exigentes y mejora la economía de carrera.";
        }
        return "Añade resistencia aeróbica y continuidad de entrenamiento con una carga útil.";
      }

      function decodeEncodedPolyline(encoded) {
        if (!encoded || typeof encoded!=="string") return [];
        const points=[]; let index=0,lat=0,lon=0;
        try {
          while(index<encoded.length) {
            let result=0,shift=0,byte;
            do { byte=encoded.charCodeAt(index++)-63; result|=(byte&0x1f)<<shift; shift+=5; }
            while(byte>=0x20 && index<encoded.length);
            lat+=(result&1)?~(result>>1):(result>>1);
            result=0; shift=0;
            do { byte=encoded.charCodeAt(index++)-63; result|=(byte&0x1f)<<shift; shift+=5; }
            while(byte>=0x20 && index<encoded.length);
            lon+=(result&1)?~(result>>1):(result>>1);
            points.push({lat:lat/1e5,lon:lon/1e5,speedMps:null});
          }
        } catch(_) { return []; }
        return points;
      }

      function paceColorFromSpeed(speed,minSpeed,maxSpeed) {
        const n=Number(speed);
        if (!Number.isFinite(n)||n<=0||maxSpeed<=minSpeed) return "#0A84FF";
        const t=Math.max(0,Math.min(1,(n-minSpeed)/(maxSpeed-minSpeed)));
        return `hsl(210 100% ${66-t*32}%)`;
      }

      function initActivityMap() {
        const container=document.getElementById("activity-map");
        if (!container || typeof window.L==="undefined") return;
        const activity=state.activities.find(item=>String(item.id)===String(state.route.id));
        if (!activity) return;
        const fitPointsRaw=Array.isArray(activity?.fitMeta?.trackPoints)?activity.fitMeta.trackPoints:[];
        const fitPoints=fitPointsRaw.filter(point=>
          Number.isFinite(Number(point?.lat)) &&
          Number.isFinite(Number(point?.lon)) &&
          Math.abs(Number(point.lat))<=90 &&
          Math.abs(Number(point.lon))<=180
        );
        const encoded=activity?.detail?.encodedPolyline||activity?.summary?.encodedPolyline||null;
        const encodedPoints=decodeEncodedPolyline(encoded).filter(point=>
          Number.isFinite(Number(point?.lat)) &&
          Number.isFinite(Number(point?.lon))
        );
        // Backward-compatible choice: old FIT caches may have been sampled before
        // invalid/non-geographic records were removed. Prefer the Garmin polyline
        // when it contains a materially denser route; otherwise use FIT because it
        // also carries speed for pace colouring.
        const points=(
          encodedPoints.length>=2 &&
          (fitPoints.length<2 || encodedPoints.length>fitPoints.length*1.35)
        ) ? encodedPoints : fitPoints;
        if (points.length<2) return;

        const map=L.map(container,{zoomControl:true,attributionControl:true,preferCanvas:true});
        L.tileLayer(
          `${state.bridgeUrl.replace(/\/$/, "")}/map/v2/tiles/{z}/{x}/{y}.png`,
          {
            maxZoom:19,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
          }
        ).addTo(map);

        const speeds=points.map(p=>Number(p.speedMps)).filter(v=>Number.isFinite(v)&&v>0);
        const minSpeed=speeds.length?Math.min(...speeds):0;
        const maxSpeed=speeds.length?Math.max(...speeds):0;

        for(let i=1;i<points.length;i++) {
          const a=points[i-1],b=points[i];
          const s=Number.isFinite(Number(b.speedMps))?Number(b.speedMps):Number(a.speedMps);
          L.polyline([[a.lat,a.lon],[b.lat,b.lon]],{
            color:paceColorFromSpeed(s,minSpeed,maxSpeed),weight:5,opacity:.95,lineCap:"round"
          }).addTo(map);
        }
        map.fitBounds(L.latLngBounds(points.map(p=>[p.lat,p.lon])).pad(.08),{animate:false});
        requestAnimationFrame(()=>map.invalidateSize(false));
      }

      function activityDateParts(dateString) {
        const match = String(dateString || "").match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!match) {
          return { weekday: "—", day: "—", month: "—" };
        }

        const date = new Date(
          Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]))
        );

        const weekdays = ["DOM", "LUN", "MAR", "MIÉ", "JUE", "VIE", "SÁB"];
        const months = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SEP", "OCT", "NOV", "DIC"];

        return {
          weekday: weekdays[date.getUTCDay()],
          day: String(date.getUTCDate()),
          month: months[date.getUTCMonth()]
        };
      }

      function activityTitleFontSize(title) {
        const length = String(title || "").length;
        if (length > 58) return 12;
        if (length > 44) return 13;
        if (length > 32) return 14;
        if (length > 24) return 15;
        return 17;
      }

      function activityCardHtml({
        id = null,
        date = null,
        title = "Actividad",
        sport = "unknown",
        distanceM = null,
        durationSec = null,
        pace = true,
        status = null,
        context = null,
        planSessionId = null,
        metaParts = null
      } = {}) {
        const parts = activityDateParts(date);
        const displayTitle = localizedActivityTitle(title, sport);
        const emoji = sportEmoji(sport, displayTitle);
        const distance = Number(distanceM);
        const duration = Number(durationSec);

        const meta=Array.isArray(metaParts)?metaParts.filter(Boolean):[];

        if(!Array.isArray(metaParts)){
          if(Number.isFinite(distance)&&distance>0)meta.push(formatDistance(distance));
          if(Number.isFinite(duration)&&duration>0)meta.push(formatCardDuration(duration));
          if(pace){const paceText=formatCardPace(distance,duration);if(paceText)meta.push(paceText);}
        }

        if(status)meta.push(status);

        const interactive =
          Boolean(id || planSessionId);

        const tag =
          interactive ? "button" : "div";

        const clickAttr = id
          ? ` data-activity-id="${escapeHtml(id)}"`
          : planSessionId
            ? ` data-plan-session-id="${escapeHtml(planSessionId)}"`
            : "";

        return `
          <${tag}
            class="activity-card"
            ${clickAttr}
            ${interactive ? 'type="button"' : ""}
          >
            <div class="activity-date-block" aria-label="${escapeHtml(date || "")}">
              <div class="activity-date-weekday">${escapeHtml(parts.weekday)}</div>
              <div class="activity-date-day">${escapeHtml(parts.day)}</div>
              <div class="activity-date-month">${escapeHtml(parts.month)}</div>

            <div class="activity-card-main">

                <span class="activity-card-emoji">${emoji}</span>
                <span
                  class="activity-card-title-text"
                  data-fit-title
                  style="font-size:${activityTitleFontSize(displayTitle)}px"
                >${escapeHtml(displayTitle)}</span>
              </div>
              <div class="activity-card-meta">${meta.length ? meta.join(" · ") : "—"}</div>
              ${context
                ? `<div class="activity-card-context">${escapeHtml(context)}</div>`
                : ""}
            </div>
          </${tag}>
        `;
      }

      function activityRowsHtml(rows) {

      function activityMonthLabel(dateString) {
        const match=String(dateString||"").match(/^(\d{4})-(\d{2})-/);
        if(!match)return "Sin fecha";
        const monthNames=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
        return `${monthNames[Number(match[2])-1]||""} de ${match[1]}`;
      }

      function activityRowsGroupedHtml(rows) {
        if(!rows.length)return `<div class="empty">No hay actividades con estos filtros.</div>`;
        const groups=[];
        for(const item of rows){
          const date=String(item?.summary?.date||"");
          const key=/^\d{4}-\d{2}/.test(date)?date.slice(0,7):"unknown";
          let group=groups[groups.length-1];
          if(!group||group.key!==key){group={key,date,items:[]};groups.push(group);}
          group.items.push(item);
        }
        return groups.map(group=>{
          const km=group.items.reduce((sum,item)=>sum+Math.max(0,Number(item?.summary?.distanceM||0)),0)/1000;
          const count=group.items.length;
          return `<div class="activity-month-group"><div class="activity-month-separator"><span>${escapeHtml(activityMonthLabel(group.date))}</span><span>${count} actividad${count===1?"":"es"} · ${compactNumber(km,1)} km</span></div>${activityRowsHtml(group.items)}</div>`;
        }).join("");
      }

      function startOfIsoWeek(dateString) {
        const date = new Date(`${dateString}T12:00:00`);
        if (Number.isNaN(date.getTime())) return dateString;
        const day = date.getDay();
        const diff = day === 0 ? -6 : 1 - day;
        date.setDate(date.getDate() + diff);
        return [
          date.getFullYear(),
          String(date.getMonth() + 1).padStart(2, "0"),
          String(date.getDate()).padStart(2, "0")
        ].join("-");
      }

      function planWeekDates(offset = 0) {
        const monday = addDaysIso(
          startOfIsoWeek(localDate(0)),
          Number(offset || 0) * 7
        );
        return Array.from({length:7}, (_, index) =>
          addDaysIso(monday, index)
        );
      }

      function planWeekLabel(dates) {
        if (!Array.isArray(dates) || dates.length < 7) return "SEMANA";
        const start = new Date(`${dates[0]}T12:00:00`);
        const end = new Date(`${dates[6]}T12:00:00`);
        if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime())) return "SEMANA";
        const months=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
        const yy=(date)=>String(date.getFullYear()).slice(-2);
        if(start.getMonth()===end.getMonth()&&start.getFullYear()===end.getFullYear()){
          return `${start.getDate()}-${end.getDate()} ${months[start.getMonth()]} ${yy(end)}`;
        }
        if(start.getFullYear()===end.getFullYear()){
          return `${start.getDate()} ${months[start.getMonth()]} - ${end.getDate()} ${months[end.getMonth()]} ${yy(end)}`;
        }
        return `${start.getDate()} ${months[start.getMonth()]} ${yy(start)} - ${end.getDate()} ${months[end.getMonth()]} ${yy(end)}`;
      }

      function planWeekRelativeLabel(offset) {
        const n = Number(offset || 0);
        if (n === 0) return "Esta semana";
        if (n === -1) return "Semana anterior";
        if (n === -2) return "Hace dos semanas";
        if (n === 1) return "Próxima semana";
        if (n === 2) return "Dentro de 2 semanas";
        if (n < -2) return `Hace ${Math.abs(n)} semanas`;
        return `Dentro de ${n} semanas`;
      }

      function planDayDateParts(dateString) {
        const date = new Date(`${dateString}T12:00:00`);
        if (Number.isNaN(date.getTime())) {
          return {weekday:"—",day:"—",month:"—"};
        }

        return {
          weekday: date.toLocaleDateString("es-ES", {weekday:"short"})
            .replace(".", ""),
          day: String(date.getDate()),
          month: date.toLocaleDateString("es-ES", {month:"short"})
            .replace(".", "")
        };
      }

      function trainingCompleted(item) {
        return Boolean(
          item?.associatedActivityId ||
          item?.completed === true ||
          ["completed","done","hecho"].includes(
            String(item?.status || "").toLowerCase()
          )
        );
      }

      function planSessionMeta(item, activity = null) {

          activity?.summary?.distanceM ??
          item?.estimatedDistanceM ??
          null;
        const durationSec =
          activity?.summary?.durationSec ??
          item?.estimatedDurationSec ??

        if (durationSec != null && Number(durationSec) > 0) {

        const name = String(title || "").trim().toLowerCase();

        if (
          name === "paddleball" ||
          name.includes("pádel") ||
          name.includes("padel")
        ) {

          initial_partial:"Entrada",
          preparation:"Preparación",
          development:"Desarrollo",
          specific:"Específica",
          taper:"Taper",
          race_week:"Semana de carrera"
        }[value] || value || "";

      function planFamilyLabel(value) {
        return {
          competition:"Competición",
          long_run:"Tirada larga",
          strength:"Fuerza",
          easy_aerobic_recovery:"Rodaje",
          recovery:"Recuperación",
          easy:"Fácil",
          aerobic:"Aeróbico",
          threshold:"Umbral",
          vo2:"VO₂",
          specific_5k:"Ritmo 5K",
          specific_10k:"Ritmo 10K",
          specific_half:"Ritmo media maratón",
          specific_marathon:"Ritmo maratón",
          fast_repetitions:"Repeticiones rápidas",

        }[value] || value || "";
