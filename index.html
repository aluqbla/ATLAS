<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ATLAS v0.0.1</title>

  <style>
    :root {
      --bg: #000000;
      --surface-1: #111111;
      --surface-2: #1C1C1E;
      --surface-raised: #242426;
      --divider: #2C2C2E;

      --text: #FFFFFF;
      --text-2: #A1A1A6;
      --text-3: #636366;

      --blue: #0A84FF;
      --blue-active: #409CFF;
      --green: #30D158;
      --yellow: #FFD60A;
      --red: #FF453A;
      --cyan: #64D2FF;
      --purple: #BF5AF2;
      --orange: #FF9F0A;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;

      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 32px;
      --space-8: 40px;
      --space-9: 48px;

      --sidebar: 220px;
      --sidebar-compact: 72px;
      --tabbar-height: 56px;

      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font: inherit;
    }

    button {
      border: 0;
      color: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) 1fr;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: calc(var(--space-6) + env(safe-area-inset-top)) var(--space-4)
               calc(var(--space-6) + env(safe-area-inset-bottom));
      border-right: 1px solid var(--divider);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .sidebar.compact {
      width: var(--sidebar-compact);
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .02em;
      padding: 0 var(--space-2) var(--space-2);
    }

    .sidebar-nav {
      display: grid;
      gap: var(--space-2);
    }

    .nav-item,
    .profile-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      text-align: left;
    }

    .nav-item.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .nav-item:hover,
    .profile-item:hover {
      background: var(--surface-1);
      color: var(--text);
    }

    .nav-icon {
      width: 24px;
      text-align: center;
      font-size: 20px;
      flex: 0 0 24px;
    }

    .nav-label {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
    }

    .sidebar-spacer {
      flex: 1;
    }

    .profile-item {
      border-top: 1px solid var(--divider);
      border-radius: 0;
      padding-top: var(--space-4);
    }

    .main {
      min-width: 0;
      width: 100%;
    }

    .screen {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding:
        calc(var(--space-6) + env(safe-area-inset-top))
        max(var(--space-6), env(safe-area-inset-right))
        calc(var(--space-9) + env(safe-area-inset-bottom))
        max(var(--space-6), env(safe-area-inset-left));
    }

    .screen-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-7);
    }

    .screen-title {
      margin: 0;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-pill);
      background: var(--surface-1);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }

    .section {
      margin-top: var(--space-7);
    }

    .section:first-of-type {
      margin-top: 0;
    }

    .section-title {
      margin: 0 0 var(--space-4);
      font-size: 20px;
      font-weight: 600;
    }

    .card {
      background: var(--surface-1);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }

    .card + .card {
      margin-top: var(--space-3);
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .metric {
      background: var(--surface-1);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      min-width: 0;
      cursor: pointer;
    }

    .metric:hover {
      background: var(--surface-2);
    }

    .metric-label {
      color: var(--text-2);
      font-size: 13px;
      margin-bottom: var(--space-2);
    }

    .metric-value {
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.02em;
    }

    .metric-caption,
    .secondary {
      margin-top: var(--space-2);
      font-size: 13px;
      color: var(--text-3);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      min-height: 52px;
      padding: 14px 0;
      border-bottom: 1px solid var(--divider);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-title {
      font-size: 17px;
      font-weight: 600;
    }

    .row-meta {
      margin-top: 2px;
      font-size: 13px;
      color: var(--text-2);
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
    }

    .chip.blue {
      color: var(--blue-active);
    }

    .button {
      min-height: 44px;
      border-radius: var(--radius-md);
      padding: 0 16px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .button:active {
      background: var(--blue-active);
    }

    .button.secondary {
      background: var(--surface-2);
      color: var(--text);
    }

    .empty {
      color: var(--text-2);
      font-size: 15px;
      line-height: 1.5;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: var(--space-5);
      color: var(--blue-active);
      background: transparent;
      cursor: pointer;
      padding: 0;
      font-weight: 600;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: 8px;
    }

    .mobile-profile {
      display: none;
    }

    .tabbar-wrap {
      display: none;
    }

    @media (max-width: 900px) {
      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 767px) {
      .app-shell {
        display: block;
      }

      .sidebar {
        display: none;
      }

      .screen {
        padding:
          calc(var(--space-5) + env(safe-area-inset-top))
          max(var(--space-4), env(safe-area-inset-right))
          calc(var(--tabbar-height) + 44px + env(safe-area-inset-bottom))
          max(var(--space-4), env(safe-area-inset-left));
      }

      .screen-header {
        margin-bottom: var(--space-6);
      }

      .mobile-profile {
        display: inline-grid;
      }

      .metric-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .tabbar-wrap {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding:
          8px
          max(12px, env(safe-area-inset-right))
          calc(8px + env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
        pointer-events: none;
        z-index: 50;
      }

      .tabbar {
        min-height: var(--tabbar-height);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 24px;
        background: rgba(28,28,30,.72);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        overflow: hidden;
        pointer-events: auto;
      }

      .tabbar button {
        background: transparent;
        color: var(--text-3);
        min-height: 56px;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2px;
        cursor: pointer;
      }

      .tabbar button.active {
        color: var(--blue-active);
      }

      .tab-icon {
        font-size: 22px;
        line-height: 1;
      }

      .tab-label {
        font-size: 11px;
        font-weight: 600;
      }
    }

    @media (max-width: 420px) {
      .metric-grid {
        grid-template-columns: 1fr;
      }
    }
  
    html, body {
      touch-action: pan-x pan-y;
      -webkit-text-size-adjust: 100%;
    }

    input, select, textarea, button {
      touch-action: manipulation;
    }

  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    "use strict";

    // ============================================================
    // CONFIG
    // ============================================================

    const ATLAS_CONFIG = Object.freeze({
      APP_VERSION: "0.0.46",
      DB_NAME: "ATLAS",
      DB_VERSION: 1,
      DATA_SCHEMA_VERSION: 1,
      GARMIN_BRIDGE_URL: "https://atlas.aj-luque.workers.dev"
    });

    // ============================================================
    // STORAGE
    // ============================================================

    const AtlasStorage = (() => {
      let db = null;

      function open() {
        return new Promise((resolve, reject) => {
          if (!("indexedDB" in window)) {
            reject(new Error("IndexedDB no está disponible en este navegador."));
            return;
          }

          const request = indexedDB.open(ATLAS_CONFIG.DB_NAME, ATLAS_CONFIG.DB_VERSION);

          request.onupgradeneeded = (event) => {
            const database = event.target.result;

            if (!database.objectStoreNames.contains("activities")) {
              const store = database.createObjectStore("activities", { keyPath: "id" });
              store.createIndex("date", "date", { unique: false });
              store.createIndex("sport", "sport", { unique: false });
              store.createIndex("year", "year", { unique: false });
              store.createIndex("title", "title", { unique: false });
            }

            if (!database.objectStoreNames.contains("metrics")) {
              const store = database.createObjectStore("metrics", { keyPath: "id" });
              store.createIndex("type", "type", { unique: false });
              store.createIndex("date", "date", { unique: false });
            }

            if (!database.objectStoreNames.contains("training")) {
              const store = database.createObjectStore("training", { keyPath: "id" });
              store.createIndex("type", "type", { unique: false });
              store.createIndex("date", "date", { unique: false });
            }

            if (!database.objectStoreNames.contains("profile")) {
              const store = database.createObjectStore("profile", { keyPath: "id" });
              store.createIndex("type", "type", { unique: false });
            }

            if (!database.objectStoreNames.contains("settings")) {
              database.createObjectStore("settings", { keyPath: "key" });
            }

            if (!database.objectStoreNames.contains("sync")) {
              database.createObjectStore("sync", { keyPath: "key" });
            }
          };

          request.onsuccess = () => {
            db = request.result;
            resolve(db);
          };

          request.onerror = () => reject(request.error);
        });
      }

      function put(storeName, value) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readwrite");
          tx.objectStore(storeName).put(value);
          tx.oncomplete = () => resolve(value);
          tx.onerror = () => reject(tx.error);
        });
      }

      function get(storeName, key) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readonly");
          const request = tx.objectStore(storeName).get(key);
          request.onsuccess = () => resolve(request.result ?? null);
          request.onerror = () => reject(request.error);
        });
      }

      function getAll(storeName) {
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, "readonly");
          const request = tx.objectStore(storeName).getAll();
          request.onsuccess = () => resolve(request.result ?? []);
          request.onerror = () => reject(request.error);
        });
      }

      return { open, put, get, getAll };
    })();

    // ============================================================
    // DOMAIN
    // ============================================================

    const AtlasDomain = Object.freeze({
      normalizeProfile(raw) {
        return {
          id: "athlete",
          type: "athlete",
          name: raw?.fullName || raw?.userProfileFullName || "Atleta",
          imageUrl: raw?.profileImageUrlMedium || raw?.profileImageUrlSmall || null,
          level: Number(raw?.userLevel || 0),
          points: Number(raw?.userPoint || 0)
        };
      },

      normalizeActivitySummary(raw) {
        const date = raw?.startTimeLocal ? String(raw.startTimeLocal).slice(0, 10) : null;
        return {
          id: String(raw?.activityId ?? ""),
          title: raw?.activityName || "Actividad",
          date,
          year: date ? Number(date.slice(0, 4)) : null,
          sport: raw?.activityType?.typeKey || "unknown",
          distanceM: Number(raw?.distance || 0),
          durationSec: Number(raw?.duration || 0),
          calories: Number(raw?.calories || 0),
          averageHR: raw?.averageHR ?? null,
          maxHR: raw?.maxHR ?? null,
          averagePower: raw?.avgPower ?? null,
          maxPower: raw?.maxPower ?? null,
          normalizedPower: raw?.normalizedPower ?? null,
          activityVo2Max:
            raw?.vO2MaxValue ??
            raw?.vo2MaxValue ??
            null,
          averageCadence:
            raw?.averageRunningCadenceInStepsPerMinute ??
            raw?.averageRunCadence ??
            raw?.averageCadence ??
            null,
          maxCadence:
            raw?.maxRunningCadenceInStepsPerMinute ??
            raw?.maxRunCadence ??
            raw?.maxCadence ??
            null,
          averageStrideLength:
            raw?.avgStrideLength ??
            raw?.averageStrideLength ??
            null,
          averageVerticalOscillation:
            raw?.avgVerticalOscillation ??
            raw?.averageVerticalOscillation ??
            null,
          averageVerticalRatio:
            raw?.avgVerticalRatio ??
            raw?.averageVerticalRatio ??
            null,
          averageGroundContactTime:
            raw?.avgGroundContactTime ??
            raw?.averageGroundContactTime ??
            null,
          averageGroundContactBalance:
            raw?.avgGroundContactBalance ??
            raw?.averageGroundContactBalance ??
            null,
          trainingLoad: raw?.activityTrainingLoad ?? null,
          trainingEffect: raw?.aerobicTrainingEffect ?? null,
          anaerobicTrainingEffect: raw?.anaerobicTrainingEffect ?? null,
          trainingEffectLabel: raw?.trainingEffectLabel ?? null,
          workoutId: raw?.workoutId ?? null
        };
      },

      normalizeActivityDetail(raw) {
        const s = raw?.summaryDTO || {};
        const m = raw?.metadataDTO || {};

        return {
          raw,
          startTimeLocal: s.startTimeLocal ?? raw?.activityDTO?.startTimeLocal ?? null,
          distanceM: Number(s.distance ?? 0),
          durationSec: Number(s.duration ?? 0),
          calories: s.calories ?? null,
          averageHR: s.averageHR ?? null,
          maxHR: s.maxHR ?? null,
          averagePower: s.averagePower ?? s.avgPower ?? null,
          normalizedPower: s.normalizedPower ?? null,
          averageSpeed: s.averageSpeed ?? null,
          elevationGainM: s.elevationGain ?? s.totalElevationGain ?? null,
          minElevationM: s.minElevation ?? null,
          maxElevationM: s.maxElevation ?? null,
          averageTemperatureC: s.averageTemperature ?? s.avgTemperature ?? null,
          trainingLoad: s.activityTrainingLoad ?? null,
          trainingEffect: s.trainingEffect ?? s.aerobicTrainingEffect ?? null,
          trainingEffectLabel:
            s.trainingEffectLabel ??
            s.aerobicTrainingEffectMessage ??
            s.activityTrainingEffectLabel ??
            null,
          anaerobicTrainingEffect: s.anaerobicTrainingEffect ?? null,
          rpe:
            s.directWorkoutFeel ??
            s.directWorkoutRpe ??
            raw?.selfEvaluationDTO?.rpe ??
            null,
          feeling:
            s.directWorkoutFeel ??
            raw?.selfEvaluationDTO?.feeling ??
            null,
          workoutId: m.associatedWorkoutId ?? null,
          equipment:
            raw?.gearDTOs ??
            raw?.activityGearDTOs ??
            raw?.gear ??
            null,
          encodedPolyline:
            raw?.geoPolylineDTO?.polyline ??
            raw?.geoPolylineDTO?.encodedPolyline ??
            null
        };
      },

      normalizeMetrics(payload, date) {
        const out = [];
        const rows = payload?.trainingReadiness?.ok ? payload.trainingReadiness.data || [] : [];
        const readiness = [...rows].sort((a, b) =>
          String(b?.timestampLocal || b?.timestamp || "").localeCompare(
            String(a?.timestampLocal || a?.timestamp || "")
          )
        )[0];

        if (readiness) out.push({
          id: `training-readiness:${date}`,
          type: "training-readiness",
          date,
          value: readiness.score ?? null,
          unit: "score",
          level: readiness.level || null,
          recoveryTimeMin: readiness.recoveryTime ?? null,
          acuteLoad: readiness.acuteLoad ?? null
        });

        const vo2 = payload?.vo2max?.ok ? payload.vo2max.data?.generic : null;
        if (vo2) out.push({
          id: `vo2max:${date}`,
          type: "vo2max",
          date,
          value: vo2.vo2MaxPreciseValue ?? vo2.vo2MaxValue ?? null,
          unit: "ml/kg/min"
        });

        const hrv = payload?.hrv?.ok ? payload.hrv.data?.hrvSummary : null;
        if (hrv) out.push({
          id: `hrv:${date}`,
          type: "hrv",
          date,
          value: hrv.lastNightAvg ?? null,
          unit: "ms",
          weeklyAvg: hrv.weeklyAvg ?? null,
          status: hrv.status || null
        });

        const sleep = payload?.sleep?.ok ? payload.sleep.data?.dailySleepDTO : null;
        if (sleep) out.push({
          id: `sleep:${date}`,
          type: "sleep",
          date,
          value: sleep.sleepScores?.overall?.value ?? null,
          unit: "score",
          durationSec: sleep.sleepTimeSeconds ?? null,
          deepSec: sleep.deepSleepSeconds ?? null,
          remSec: sleep.remSleepSeconds ?? null,
          lightSec: sleep.lightSleepSeconds ?? null,
          avgHeartRate: sleep.avgHeartRate ?? null,
          avgStress: sleep.avgSleepStress ?? null
        });

        const heartRateRow = payload?.heartRate?.ok
          ? payload.heartRate.data
          : null;
        const restingHeartRate = heartRateRow?.restingHeartRate ?? null;
        if (restingHeartRate != null) out.push({
          id: `resting-hr:${date}`,
          type: "resting-hr",
          date,
          value: restingHeartRate,
          unit: "bpm"
        });

        const stressRows = payload?.stress?.ok ? payload.stress.data || [] : [];
        const stressRow = Array.isArray(stressRows) ? stressRows[0] : null;
        const stress = stressRow?.values || null;
        if (stress?.overallStressLevel != null) out.push({
          id: `stress:${date}`,
          type: "stress",
          date,
          value: stress.overallStressLevel,
          unit: "score"
        });

        const trainingStatus = payload?.trainingStatus?.ok ? payload.trainingStatus.data : null;
        if (trainingStatus) out.push({
          id: `training-status:${date}`,
          type: "training-status",
          date,
          value:
            trainingStatus.trainingStatusPhrase ??
            trainingStatus.trainingStatus ??
            trainingStatus.status ??
            null,
          unit: "status"
        });

        const loadBalance = payload?.loadBalance?.ok ? payload.loadBalance.data : null;
        if (loadBalance) out.push({
          id: `load-balance:${date}`,
          type: "load-balance",
          date,
          value:
            loadBalance.loadRatio ??
            loadBalance.trainingLoadRatio ??
            null,
          unit: "ratio",
          raw: loadBalance
        });

        return out;
      },

      normalizeTraining(payload) {
        const rows = payload?.scheduledWorkouts?.ok ? payload.scheduledWorkouts.data || [] : [];
        return rows.map((row) => {
          const workout = row?.workout || {};
          return {
            id: `workout:${row.workoutScheduleId}`,
            type: "workout",
            date: row.calendarDate || null,
            workoutScheduleId: row.workoutScheduleId,
            workoutId: workout.workoutId ?? null,
            title: workout.workoutName || "Entrenamiento",
            description: workout.description || "",
            sport: workout.sportType?.sportTypeKey || "unknown",
            estimatedDistanceM: workout.estimatedDistanceInMeters ?? null,
            estimatedDurationSec: workout.estimatedDurationInSecs ?? null,
            associatedActivityId: row.associatedActivityId ?? null
          };
        });
      }
    });

    // ============================================================
    // SERVICES
    // ============================================================

    const AtlasServices = Object.freeze({
      async get(baseUrl, path) {
        if (!baseUrl) throw new Error("GARMIN_BRIDGE_NOT_CONFIGURED");

        const base = String(baseUrl).replace(/\/+$/, "");
        const response = await fetch(`${base}${path}`, {
          method: "GET",
          headers: { "Accept": "application/json" }
        });

        let payload;
        try {
          payload = await response.json();
        } catch {
          throw new Error(`BRIDGE_INVALID_JSON_${response.status}`);
        }

        if (!response.ok || payload?.ok !== true) {
          throw new Error(payload?.error?.code || `BRIDGE_HTTP_${response.status}`);
        }

        return payload;
      },

      async withRetry(task, retries = 1) {
        let lastError = null;

        for (let attempt = 0; attempt <= retries; attempt++) {
          try {
            return await task();
          } catch (error) {
            lastError = error;

            const message = String(error?.message || "");
            const retryable =
              message.includes("429") ||
              message.includes("503") ||
              message.includes("502") ||
              message.includes("GARMIN_RATE_LIMITED") ||
              message.includes("GARMIN_REQUEST_FAILED");

            if (!retryable || attempt === retries) break;

            await new Promise((resolve) => setTimeout(resolve, 700));
          }
        }

        throw lastError;
      },

      profile(baseUrl) {
        return this.get(baseUrl, "/profile");
      },

      activities(baseUrl, start = 0, limit = 20) {
        return this.get(baseUrl, `/activities?start=${start}&limit=${limit}`);
      },

      activityDetail(baseUrl, id) {
        return this.get(baseUrl, `/activities/${encodeURIComponent(id)}`);
      },

      activityRunning(baseUrl, id, date) {
        return this.get(
          baseUrl,
          `/activities/${encodeURIComponent(id)}/running?date=${encodeURIComponent(date)}`
        );

          baseUrl,

        );
      },

        if (!baseUrl) throw new Error("GARMIN_BRIDGE_NOT_CONFIGURED");

        const base = String(baseUrl).replace(/\/+$/, "");
        const response = await fetch(
          `${base}/activities/${encodeURIComponent(id)}/fit`,
          { method: "GET" }
        );

        if (!response.ok) {
          let code = `BRIDGE_HTTP_${response.status}`;
          try {
            const payload = await response.json();
            code = payload?.error?.code || code;
          } catch {}
          throw new Error(code);
        }

        return response.blob();
      },

      metrics(baseUrl, date) {
        return this.get(baseUrl, `/metrics?date=${encodeURIComponent(date)}`);
      },

      training(baseUrl, startDate, endDate) {
        return this.get(
          baseUrl,
          `/training?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}`
        );
      }

      function formatPace(distanceM, durationSec) {
        if (!distanceM || !durationSec) return "—";

        const sec = Math.round(secPerKm % 60);
        return `${min}:${String(sec).padStart(2, "0")} /km`;
      }

      function formatActivityDateTime(value, fallbackDate) {
        if (!value) return fallbackDate || "—";
        const raw = String(value).replace(" ", "T");
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) return String(value);
        return date.toLocaleString("es-ES", {
          day: "2-digit",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function decodePolyline(encoded) {
        if (!encoded || typeof encoded !== "string") return [];
        const points = [];
        let index = 0, lat = 0, lng = 0;

        while (index < encoded.length) {
          let b, shift = 0, result = 0;
          do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20 && index <= encoded.length);

          const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
          lat += dlat;

          shift = 0;
          result = 0;
          do {
            b = encoded.charCodeAt(index++) - 63;
            result |= (b & 0x1f) << shift;
            shift += 5;
          } while (b >= 0x20 && index <= encoded.length);

          const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
          lng += dlng;
          points.push([lat / 1e5, lng / 1e5]);
        }

        return points;
      }

      function routeSvg(encoded) {
        const points = decodePolyline(encoded);
        if (points.length < 2) {
          return `<div class="empty">Ruta no disponible.</div>`;
        }

        const lats = points.map((p) => p[0]);
        const lngs = points.map((p) => p[1]);
        const minLat = Math.min(...lats), maxLat = Math.max(...lats);
        const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
        const latSpan = maxLat - minLat || 1;
        const lngSpan = maxLng - minLng || 1;

        const coords = points.map(([lat, lng]) => {
          const x = 12 + ((lng - minLng) / lngSpan) * 276;
          const y = 168 - ((lat - minLat) / latSpan) * 156;
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(" ");

        return `
          <svg viewBox="0 0 300 180" role="img" aria-label="Ruta de la actividad"
            style="width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2)">
            <polyline points="${coords}" fill="none" stroke="var(--blue)"
              stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
      }

      function equipmentText(value) {
        if (!value) return "—";
        const items = Array.isArray(value) ? value : [value];
        const names = items.map((item) =>
          item?.displayName ||
          item?.gearName ||
          item?.name ||
          item?.customMakeModel ||
          null
        ).filter(Boolean);
        return names.length ? names.join(", ") : "—";
      }

      function firstVisible(...values) {
        for (const value of values) {
          if (value !== null && value !== undefined && value !== "") return value;
        }
        return null;
      }

      function formatCadence(value) {
        if (value == null || !Number.isFinite(Number(value))) return "—";
        return String(Math.round(Number(value)));
      }

      function formatStrideLength(value) {
        if (value == null || !Number.isFinite(Number(value))) return "—";
        const n = Number(value);
        const meters = n > 10 ? n / 100 : n;
        return `${meters.toFixed(2)} m`;
      }

      function normalizeLapRows(payload) {
        const raw =
          Array.isArray(payload?.lapDTOs) ? payload.lapDTOs :
          Array.isArray(payload) ? payload :
          [];

        return raw.map((lap, index) => {
          const distanceM = Number(
            lap?.distance ??
            lap?.summaryDTO?.distance ??
            0
          );
          const durationSec = Number(
            lap?.duration ??
            lap?.movingDuration ??
            lap?.summaryDTO?.duration ??
            0
          );

          return {
            number: index + 1,
            distanceM,
            durationSec,
            averageHR:
              lap?.averageHR ??
              lap?.avgHr ??
              lap?.summaryDTO?.averageHR ??
              null,
            averagePower:
              lap?.averagePower ??
              lap?.avgPower ??
              lap?.summaryDTO?.averagePower ??
              null
          };
        }).filter((lap) => lap.distanceM > 0 || lap.durationSec > 0);
      }

      function lapsPaceChart(laps) {
        if (!laps.length) {
          return `<div class="empty">Vueltas no disponibles.</div>`;
        }

        const paces = laps.map((lap) =>
          lap.distanceM > 0 && lap.durationSec > 0
            ? lap.durationSec / (lap.distanceM / 1000)
            : null
        );

        const valid = paces.filter((value) => Number.isFinite(value));
        if (!valid.length) {
          return `<div class="empty">Ritmo por vuelta no disponible.</div>`;
        }

        const fastest = Math.min(...valid);
        const slowest = Math.max(...valid);
        const span = slowest - fastest || 1;

        return `
          <div style="display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:12px">
            ${paces.map((pace, index) => {
              if (!Number.isFinite(pace)) {
                return `<div style="flex:1"></div>`;
              }

              const height = 45 + ((slowest - pace) / span) * 85;

              return `
                <div style="flex:1;min-width:10px;text-align:center">
                  <div
                    title="Vuelta ${index + 1}: ${formatPace(laps[index].distanceM, laps[index].durationSec)}"
                    style="height:${height.toFixed(0)}px;background:var(--blue);border-radius:6px 6px 2px 2px"
                  ></div>
                  <div class="row-meta" style="font-size:10px;margin-top:4px">${index + 1}</div>

            }).join("")}

    const AtlasApp = (() => {
      async function unzipFitBlob(blob) {
        const buffer = await blob.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        const view = new DataView(buffer);

        // Raw FIT, not ZIP.
        if (
          bytes.length >= 12 &&
          String.fromCharCode(...bytes.slice(8, 12)) === ".FIT"
        ) {
          return buffer;
        }

        // ZIP: locate End Of Central Directory.
        let eocd = -1;
        for (
          let i = Math.max(0, bytes.length - 65557);
          i <= bytes.length - 22;
          i++
        ) {
          if (
            view.getUint32(i, true) === 0x06054b50
          ) {
            eocd = i;
          }
        }

        if (eocd < 0) {
          throw new Error("FIT_ZIP_NOT_FOUND");
        }

        const entries = view.getUint16(eocd + 10, true);
        const centralOffset = view.getUint32(eocd + 16, true);
        let pos = centralOffset;

        for (let entry = 0; entry < entries; entry++) {
          if (view.getUint32(pos, true) !== 0x02014b50) break;

          const method = view.getUint16(pos + 10, true);
          const compressedSize = view.getUint32(pos + 20, true);
          const fileNameLength = view.getUint16(pos + 28, true);
          const extraLength = view.getUint16(pos + 30, true);
          const commentLength = view.getUint16(pos + 32, true);
          const localOffset = view.getUint32(pos + 42, true);

          const nameBytes = bytes.slice(
            pos + 46,
            pos + 46 + fileNameLength
          );
          const fileName = new TextDecoder().decode(nameBytes);

          if (/\.fit$/i.test(fileName)) {
            if (view.getUint32(localOffset, true) !== 0x04034b50) {
              throw new Error("FIT_ZIP_LOCAL_HEADER");
            }

            const localNameLength =
              view.getUint16(localOffset + 26, true);
            const localExtraLength =
              view.getUint16(localOffset + 28, true);
            const dataStart =
              localOffset + 30 + localNameLength + localExtraLength;

            const compressed = bytes.slice(
              dataStart,
              dataStart + compressedSize
            );

            if (method === 0) {
              return compressed.buffer.slice(
                compressed.byteOffset,
                compressed.byteOffset + compressed.byteLength
              );
            }

            if (method === 8 && "DecompressionStream" in window) {
              const stream = new Blob([compressed])
                .stream()
                .pipeThrough(new DecompressionStream("deflate-raw"));

              return await new Response(stream).arrayBuffer();
            }

            throw new Error("FIT_ZIP_COMPRESSION_UNSUPPORTED");
          }

          pos +=
            46 +
            fileNameLength +
            extraLength +
            commentLength;
        }

        throw new Error("FIT_FILE_NOT_FOUND_IN_ZIP");
      }

      function readFitScalar(view, offset, size, baseType, littleEndian) {
        const type = baseType & 0x1f;

        if (type === 7) {
          const bytes = new Uint8Array(
            view.buffer,
            view.byteOffset + offset,
            size
          );
          const zero = bytes.indexOf(0);
          return new TextDecoder().decode(
            zero >= 0 ? bytes.slice(0, zero) : bytes
          );
        }

        if (size < 1) return null;

        switch (type) {
          case 0:
          case 2:
          case 10:
          case 13:
            return view.getUint8(offset);
          case 1:
            return view.getInt8(offset);
          case 3:
            return size >= 2
              ? view.getInt16(offset, littleEndian)
              : null;
          case 4:
          case 11:
            return size >= 2
              ? view.getUint16(offset, littleEndian)
              : null;
          case 5:
            return size >= 4
              ? view.getInt32(offset, littleEndian)
              : null;
          case 6:
          case 12:
            return size >= 4
              ? view.getUint32(offset, littleEndian)
              : null;
          case 8:
            return size >= 4
              ? view.getFloat32(offset, littleEndian)
              : null;
          case 9:
            return size >= 8
              ? view.getFloat64(offset, littleEndian)
              : null;
          default:
            return null;
        }
      }

      function parseFitWorkoutSegments(arrayBuffer) {
        const view = new DataView(arrayBuffer);
        const bytes = new Uint8Array(arrayBuffer);

        if (bytes.length < 14) {
          throw new Error("FIT_TOO_SHORT");
        }

        const headerSize = view.getUint8(0);
        const dataSize = view.getUint32(4, true);
        const end = Math.min(
          bytes.length,
          headerSize + dataSize
        );

        const definitions = new Map();
        const workoutSteps = new Map();
        const laps = [];
        let pos = headerSize;

        while (pos < end) {
          const header = view.getUint8(pos++);
          const compressed = (header & 0x80) !== 0;

          let localMessage;
          let isDefinition = false;
          let hasDeveloper = false;

          if (compressed) {
            localMessage = (header >> 5) & 0x03;
          } else {
            localMessage = header & 0x0f;
            isDefinition = (header & 0x40) !== 0;
            hasDeveloper = (header & 0x20) !== 0;
          }

          if (isDefinition) {
            if (pos + 5 > end) break;

            pos += 1; // reserved
            const architecture = view.getUint8(pos++);
            const littleEndian = architecture === 0;
            const globalMessage = view.getUint16(
              pos,
              littleEndian
            );
            pos += 2;

            const fieldCount = view.getUint8(pos++);
            const fields = [];

            for (let i = 0; i < fieldCount; i++) {
              if (pos + 3 > end) break;
              fields.push({
                num: view.getUint8(pos),
                size: view.getUint8(pos + 1),
                baseType: view.getUint8(pos + 2)
              });
              pos += 3;
            }

            const developerFields = [];
            if (hasDeveloper && pos < end) {
              const count = view.getUint8(pos++);
              for (let i = 0; i < count; i++) {
                if (pos + 3 > end) break;
                developerFields.push({
                  num: view.getUint8(pos),
                  size: view.getUint8(pos + 1),
                  developerIndex: view.getUint8(pos + 2)
                });
                pos += 3;
              }
            }

            definitions.set(localMessage, {
              globalMessage,
              littleEndian,
              fields,
              developerFields
            });
            continue;
          }

          const definition = definitions.get(localMessage);
          if (!definition) {
            throw new Error("FIT_MISSING_DEFINITION");
          }

          const fieldValues = new Map();

          for (const field of definition.fields) {
            if (pos + field.size > end) {
              pos = end;
              break;
            }

            const value = readFitScalar(
              view,
              pos,
              field.size,
              field.baseType,
              definition.littleEndian
            );

            fieldValues.set(field.num, value);
            pos += field.size;
          }

          for (const field of definition.developerFields) {
            pos += field.size;
            if (pos > end) {
              pos = end;
              break;
            }
          }

          // workout_step global message number = 27
          if (definition.globalMessage === 27) {
            const messageIndex = fieldValues.get(254);
            if (messageIndex != null) {
              workoutSteps.set(Number(messageIndex), {
                messageIndex: Number(messageIndex),
                name: fieldValues.get(0) || "",
                durationType: fieldValues.get(1),
                durationValue: fieldValues.get(2),
                targetValue: fieldValues.get(4),
                intensity: fieldValues.get(7)
              });
            }
          }

          // lap global message number = 19
          if (definition.globalMessage === 19) {
            laps.push({
              messageIndex: fieldValues.get(254),
              workoutStepIndex: fieldValues.get(71),
              intensity: fieldValues.get(23)
            });
          }
        }

        const classifyIntensity = (value) => {
          const intensity = Number(value);

          if (intensity === 2) return "WU";
          if (intensity === 3) return "CD";

          if (
            intensity === 0 ||
            intensity === 1 ||
            intensity === 4 ||
            intensity === 5 ||
            intensity === 6
          ) {
            return "MAIN";
          }

          return null;
        };

        const labels = laps.map((lap) => {
          const step =
            lap.workoutStepIndex != null
              ? workoutSteps.get(Number(lap.workoutStepIndex))
              : null;

          return (
            classifyIntensity(step?.intensity) ||
            classifyIntensity(lap.intensity) ||
            null
          );
        });

        return {
          labels,
          workoutSteps: [...workoutSteps.values()],
          fitLapCount: laps.length
        };
      }

      async function parseFitSegmentsFromBlob(blob) {
        const fitBuffer = await unzipFitBlob(blob);
        return parseFitWorkoutSegments(fitBuffer);
      }

      function summarizeRunningMetrics(payload) {
        const descriptors = Array.isArray(payload?.metricDescriptors)
          ? payload.metricDescriptors
          : [];
        const rows = Array.isArray(payload?.activityDetailMetrics)
          ? payload.activityDetailMetrics
          : [];

        const indexByKey = new Map();
        for (const descriptor of descriptors) {
          if (Number.isInteger(descriptor?.metricsIndex) && descriptor?.key) {
            indexByKey.set(String(descriptor.key), descriptor.metricsIndex);
          }
        }

        const collect = (...keys) => {
          const indices = keys
            .map((key) => indexByKey.get(key))
            .filter((index) => Number.isInteger(index));

          const values = [];
          for (const row of rows) {
            if (!Array.isArray(row?.metrics)) continue;
            for (const index of indices) {
              const value = row.metrics[index];
              if (value != null && Number.isFinite(Number(value))) {
                values.push(Number(value));
                break;
              }
            }
          }
          return values;
        };

        const avg = (values) =>
          values.length
            ? values.reduce((sum, value) => sum + value, 0) / values.length
            : null;
        const max = (values) => values.length ? Math.max(...values) : null;

        const cadence = collect("directRunCadence", "directCadence", "cadence");
        const groundContact = collect("directGroundContactTime", "groundContactTime");
        const verticalOscillation = collect("directVerticalOscillation", "verticalOscillation");
        const verticalRatio = collect("directVerticalRatio", "verticalRatio");
        const groundBalance = collect("directGroundContactBalance", "groundContactBalance");
        const power = collect("directPower", "power");

        return {
          averageCadence: avg(cadence),
          maxCadence: max(cadence),
          averageGroundContactTime: avg(groundContact),
          averageVerticalOscillation: avg(verticalOscillation),
          averageVerticalRatio: avg(verticalRatio),
          averageGroundContactBalance: avg(groundBalance),
          averagePower: avg(power),
          maxPower: max(power)
        };
      }

      function localDate(offsetDays = 0) {
        const date = new Date();
        date.setDate(date.getDate() + offsetDays);
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      async function getActivitySyncMeta() {
        const [lastSync, lastId, lastDate] = await Promise.all([
          AtlasStorage.get("sync", "lastActivitySync"),
          AtlasStorage.get("sync", "lastActivityId"),
          AtlasStorage.get("sync", "lastActivityDate")
        ]);

        return {
          lastSync: lastSync?.value || null,
          lastId: lastId?.value ? String(lastId.value) : null,
          lastDate: lastDate?.value || null
        };
      }

      async function syncActivitiesIncremental() {
        const existing = await AtlasStorage.getAll("activities");
        const existingIds = new Set(existing.map((item) => String(item.id)));
        const bootstrapState = await AtlasStorage.get("sync", "activityBootstrapComplete");

        const pageSize = 20;
        const initialMax = 100;
        const overlapKnownCount = 5;
        const bootstrap = bootstrapState?.value !== true || existing.length < initialMax;

        let start = 0;
        let knownSeen = 0;
        let newest = null;
        let processed = 0;
        let stop = false;

        while (!stop) {
          const response = await AtlasServices.activities(
            AtlasUI.state.bridgeUrl,
            start,
            pageSize
          );

          const rows = Array.isArray(response.data) ? response.data : [];
          if (!rows.length) break;

          for (const raw of rows) {
            const summary = AtlasDomain.normalizeActivitySummary(raw);
            if (!summary.id) continue;

            if (!newest) newest = summary;

            const wasKnown = existingIds.has(String(summary.id));

            if (wasKnown) {
              knownSeen += 1;
            } else {
              knownSeen = 0;
            }

            const previous = await AtlasStorage.get("activities", summary.id);
            const nowIso = new Date().toISOString();

            const record = {
              id: summary.id,
              summary,
              detail: previous?.detail ?? null,
              summaryUpdatedAt: nowIso,
              detailUpdatedAt: previous?.detailUpdatedAt ?? null,
              detailLoaded: previous?.detailLoaded === true,
              fitBlob: previous?.fitBlob ?? null,
              fitUpdatedAt: previous?.fitUpdatedAt ?? null,
              fitLoaded: previous?.fitLoaded === true,
              running: previous?.running ?? null,
              runningUpdatedAt: previous?.runningUpdatedAt ?? null,
              runningLoaded: previous?.runningLoaded === true
            };

            await AtlasStorage.put("activities", record);
            existingIds.add(String(summary.id));
            processed += 1;

            if (bootstrap) {
              if (existingIds.size >= initialMax) {
                stop = true;
                break;
              }
            } else if (knownSeen >= overlapKnownCount) {
              stop = true;
              break;
            }
          }

          if (rows.length < pageSize) break;
          start += pageSize;
        }

        if (existingIds.size >= initialMax) {
          await AtlasStorage.put("sync", {
            key: "activityBootstrapComplete",
            value: true
          });
        }

        const now = new Date().toISOString();
        await AtlasStorage.put("sync", {
          key: "lastActivitySync",
          value: now
        });

        if (newest) {
          await AtlasStorage.put("sync", {
            key: "lastActivityId",
            value: newest.id
          });
          await AtlasStorage.put("sync", {
            key: "lastActivityDate",
            value: newest.date
          });
        }

        return {
          bootstrap,
          processed,
          totalLocal: existingIds.size,
          newestId: newest?.id || null,
          newestDate: newest?.date || null
        };
      }

      async function hydrateLocal() {
        const [profile, activities, metrics, training, bridge, lastSync, activitySync, lastSyncStatus, lastSyncErrors] = await Promise.all([
          AtlasStorage.get("profile", "athlete"),
          AtlasStorage.getAll("activities"),
          AtlasStorage.getAll("metrics"),
          AtlasStorage.getAll("training"),
          AtlasStorage.get("settings", "garminBridgeUrl"),
          AtlasStorage.get("sync", "lastGarminSync"),
          getActivitySyncMeta(),
          AtlasStorage.get("sync", "lastGarminSyncStatus"),
          AtlasStorage.get("sync", "lastGarminSyncErrors")
        ]);

        AtlasUI.state.profile = profile;
        const migratedActivities = [];
        for (const item of activities) {
          if (item?.summary) {
            const normalized = {
              ...item,
              fitBlob: item.fitBlob ?? null,
              fitUpdatedAt: item.fitUpdatedAt ?? null,
              fitLoaded: item.fitLoaded === true,
              running: item.running ?? null,
              runningUpdatedAt: item.runningUpdatedAt ?? null,
              runningLoaded: item.runningLoaded === true
            };
            if (
              normalized.fitBlob !== item.fitBlob ||
              normalized.fitUpdatedAt !== item.fitUpdatedAt ||
              normalized.fitLoaded !== item.fitLoaded
            ) {
              await AtlasStorage.put("activities", normalized);
            }
            migratedActivities.push(normalized);
            continue;
          }

          const migrated = {
            id: String(item.id),
            summary: {
              id: String(item.id),
              title: item.title || "Actividad",
              date: item.date || null,
              year: item.year ?? null,
              sport: item.sport || "unknown",
              distanceM: item.distanceM ?? 0,
              durationSec: item.durationSec ?? 0,
              calories: item.calories ?? 0,
              averageHR: item.averageHR ?? null,
              maxHR: item.maxHR ?? null,
              averagePower: item.averagePower ?? null,
              trainingLoad: item.trainingLoad ?? null,
              trainingEffect: item.trainingEffect ?? null,
              workoutId: item.workoutId ?? null
            },
            detail: null,
            summaryUpdatedAt: null,
            detailUpdatedAt: null,
            detailLoaded: false,
            fitBlob: null,
            fitUpdatedAt: null,
            fitLoaded: false,
            running: null,
            runningUpdatedAt: null,
            runningLoaded: false
          };

          await AtlasStorage.put("activities", migrated);
          migratedActivities.push(migrated);
        }

        AtlasUI.state.activities = migratedActivities.sort((a, b) =>
          String(b?.summary?.date || "").localeCompare(String(a?.summary?.date || ""))
        );
        AtlasUI.state.metrics = metrics;
        AtlasUI.state.training = training.sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
        AtlasUI.state.bridgeUrl = bridge?.value || ATLAS_CONFIG.GARMIN_BRIDGE_URL || "";
        AtlasUI.state.lastSync = lastSync?.value || null;
        AtlasUI.state.activitySync = activitySync;

        if (!AtlasUI.state.syncing && lastSyncStatus?.value === "partial") {
          AtlasUI.state.syncError = Array.isArray(lastSyncErrors?.value)
            ? `Última sincronización parcial: ${lastSyncErrors.value.join(" · ")}`
            : "Última sincronización parcial.";
        }
      }

      async function saveBridgeUrl(value) {
        const clean = String(value || "").trim().replace(/\/+$/, "");
        AtlasUI.state.bridgeUrl = clean;
        await AtlasStorage.put("settings", { key: "garminBridgeUrl", value: clean });
        AtlasUI.state.syncError = null;
        AtlasUI.render();
      }

      function setSyncStatus(key, value) {
        AtlasUI.state.syncStatus = {
          ...AtlasUI.state.syncStatus,
          [key]: value
        };
        AtlasUI.render();
      }

      async function runSyncBlock(key, task) {
        setSyncStatus(key, "syncing");

        try {
          const result = await AtlasServices.withRetry(task, 1);
          setSyncStatus(key, "ok");
          return { ok: true, data: result };
        } catch (error) {
          setSyncStatus(key, "error");
          return {
            ok: false,
            error: String(error?.message || error)
          };
        }
      }

      async function syncNow() {
        if (!AtlasUI.state.dbReady || AtlasUI.state.syncing) return;

        if (!AtlasUI.state.bridgeUrl) {
          AtlasUI.state.syncError = "Configura primero la URL del Garmin Bridge.";
          AtlasUI.render();
          return;
        }

        AtlasUI.state.syncing = true;
        AtlasUI.state.syncError = null;
        AtlasUI.state.syncStatus = {
          profile: "idle",
          metrics: "idle",
          training: "idle",
          activities: "idle"
        };
        AtlasUI.render();

        const today = localDate(0);
        const endDate = localDate(14);
        const errors = [];

        try {
          const profileR = await runSyncBlock("profile", () =>
            AtlasServices.profile(AtlasUI.state.bridgeUrl)
          );

          if (profileR.ok) {
            const profile = AtlasDomain.normalizeProfile(profileR.data.data);
            await AtlasStorage.put("profile", profile);
          } else {
            errors.push(`Perfil: ${profileR.error}`);
          }

          const metricsR = await runSyncBlock("metrics", () =>
            AtlasServices.metrics(AtlasUI.state.bridgeUrl, today)
          );

          if (metricsR.ok) {
            const metrics = AtlasDomain.normalizeMetrics(
              metricsR.data.data,
              today
            );
            for (const item of metrics) {
              await AtlasStorage.put("metrics", item);
            }
          } else {
            errors.push(`Métricas: ${metricsR.error}`);
          }

          const trainingR = await runSyncBlock("training", () =>
            AtlasServices.training(
              AtlasUI.state.bridgeUrl,
              today,
              endDate
            )
          );

          if (trainingR.ok) {
            const training = AtlasDomain.normalizeTraining(
              trainingR.data.data
            );
            for (const item of training) {
              await AtlasStorage.put("training", item);
            }
          } else {
            errors.push(`Training: ${trainingR.error}`);
          }

          const activitiesR = await runSyncBlock(
            "activities",
            () => syncActivitiesIncremental()
          );

          if (!activitiesR.ok) {
            errors.push(`Actividades: ${activitiesR.error}`);
          }

          const stamp = new Date().toISOString();
          await AtlasStorage.put("sync", {
            key: "lastGarminSync",
            value: stamp
          });

          await AtlasStorage.put("sync", {
            key: "lastGarminSyncStatus",
            value: errors.length ? "partial" : "ok"
          });

          await AtlasStorage.put("sync", {
            key: "lastGarminSyncErrors",
            value: errors
          });

          await hydrateLocal();

          AtlasUI.state.syncError = errors.length
            ? `Sincronización parcial: ${errors.join(" · ")}`
            : null;
        } finally {
          AtlasUI.state.syncing = false;
          AtlasUI.render();
        }
      }

      async function ensureActivityDetail(id) {
        const existing = await AtlasStorage.get("activities", String(id));
        if (!existing) throw new Error("ACTIVITY_NOT_FOUND");

        const response = await AtlasServices.activityDetail(
          AtlasUI.state.bridgeUrl,
          String(id)
        );

        const detail = AtlasDomain.normalizeActivityDetail(response.data);
        const updated = {
          ...existing,
          detail,
          detailLoaded: true,
          detailUpdatedAt: new Date().toISOString()
        };

        await AtlasStorage.put("activities", updated);
        await hydrateLocal();

        return detail;
      }

      async function ensureActivityRunning(id) {
        const existing = await AtlasStorage.get("activities", String(id));
        if (!existing) throw new Error("ACTIVITY_NOT_FOUND");

        const date = existing?.summary?.date;
        if (!date) throw new Error("ACTIVITY_DATE_NOT_FOUND");

        const response = await AtlasServices.activityRunning(
          AtlasUI.state.bridgeUrl,
          String(id),
          date
        );

        const activityRaw = response?.data?.activity || null;
        const detailsRaw = response?.data?.details || null;

        const freshSummary = activityRaw
          ? AtlasDomain.normalizeActivitySummary(activityRaw)
          : existing.summary;

        const chart = summarizeRunningMetrics(detailsRaw);

        const choose = (...values) => {
          for (const value of values) {
            if (value !== null && value !== undefined && value !== "") return value;
          }
          return null;
        };

        const running = {
          activityVo2Max: choose(
            freshSummary?.activityVo2Max,
            existing?.summary?.activityVo2Max
          ),
          averageCadence: choose(
            freshSummary?.averageCadence,
            chart.averageCadence,
            existing?.summary?.averageCadence
          ),
          maxCadence: choose(
            freshSummary?.maxCadence,
            chart.maxCadence,
            existing?.summary?.maxCadence
          ),
          averageStrideLength: choose(
            freshSummary?.averageStrideLength,
            existing?.summary?.averageStrideLength
          ),
          averageVerticalOscillation: choose(
            freshSummary?.averageVerticalOscillation,
            chart.averageVerticalOscillation,
            existing?.summary?.averageVerticalOscillation
          ),
          averageVerticalRatio: choose(
            freshSummary?.averageVerticalRatio,
            chart.averageVerticalRatio,
            existing?.summary?.averageVerticalRatio
          ),
          averageGroundContactTime: choose(
            freshSummary?.averageGroundContactTime,
            chart.averageGroundContactTime,
            existing?.summary?.averageGroundContactTime
          ),
          averageGroundContactBalance: choose(
            freshSummary?.averageGroundContactBalance,
            chart.averageGroundContactBalance,
            existing?.summary?.averageGroundContactBalance
          ),
          averagePower: choose(
            freshSummary?.averagePower,
            chart.averagePower,
            existing?.summary?.averagePower
          ),
          maxPower: choose(
            freshSummary?.maxPower,
            chart.maxPower,
            existing?.summary?.maxPower
          ),
          normalizedPower: choose(
            freshSummary?.normalizedPower,
            existing?.summary?.normalizedPower
          )
        };

        const updated = {
          ...existing,
          summary: {
            ...existing.summary,
            ...freshSummary
          },
          running,
          runningLoaded: true,
          runningUpdatedAt: new Date().toISOString()
        };

        await AtlasStorage.put("activities", updated);
        await hydrateLocal();

        return running;
      }

      async function refreshActivityData(id) {
        const existing = await AtlasStorage.get(
          "activities",
          String(id)
        );
        if (!existing) throw new Error("ACTIVITY_NOT_FOUND");

        await AtlasStorage.put("activities", {
          ...existing,
          detail: null,
          detailLoaded: false,
          running: null,
          runningLoaded: false,
          freshLaps: null,
          fitSegments: [],
          fitMeta: null,
          activityPreciseVo2: null,
          activityFreshLoading: true
        });
        await hydrateLocal();

        const isRunning = String(
          existing?.summary?.sport || ""
        ).toLowerCase().includes("run");

        try {
          const detailPromise = AtlasServices.activityDetail(
            AtlasUI.state.bridgeUrl,
            String(id)
          );

          const runningPromise = isRunning
            ? AtlasServices.activityRunning(
                AtlasUI.state.bridgeUrl,
                String(id),
                existing?.summary?.date
              )
            : Promise.resolve(null);

          const lapsPromise = isRunning
            ? AtlasServices.activityLaps(
                AtlasUI.state.bridgeUrl,
                String(id)
              )
            : Promise.resolve(null);

          const fitPromise = isRunning
            ? AtlasServices.activityFit(
                AtlasUI.state.bridgeUrl,
                String(id)
              )
            : Promise.resolve(null);

          const preciseVo2Promise = isRunning
            ? AtlasServices.activityPreciseVo2(
                AtlasUI.state.bridgeUrl,
                String(id)
              )
            : Promise.resolve(null);

          const [
            detailResult,
            runningResult,
            lapsResult,
            fitResult,
            preciseVo2Result
          ] = await Promise.allSettled([
            detailPromise,
            runningPromise,
            lapsPromise,
            fitPromise,
            preciseVo2Promise
          ]);

          if (detailResult.status !== "fulfilled") {
            throw detailResult.reason;
          }

          const detail = AtlasDomain.normalizeActivityDetail(
            detailResult.value.data
          );

          let running = null;
          let freshSummary = existing.summary;

          if (
            isRunning &&
            runningResult.status === "fulfilled" &&
            runningResult.value
          ) {
            const activityRaw =
              runningResult.value?.data?.activity || null;
            const detailsRaw =
              runningResult.value?.data?.details || null;

            freshSummary = activityRaw
              ? AtlasDomain.normalizeActivitySummary(activityRaw)
              : existing.summary;

            const chart = summarizeRunningMetrics(detailsRaw);

            const choose = (...values) => {
              for (const value of values) {
                if (
                  value !== null &&
                  value !== undefined &&
                  value !== ""
                ) {
                  return value;
                }
              }
              return null;
            };

            running = {
              activityVo2Max: choose(
                freshSummary?.activityVo2Max,
                existing?.summary?.activityVo2Max
              ),
              averageCadence: choose(
                freshSummary?.averageCadence,
                chart.averageCadence
              ),
              maxCadence: choose(
                freshSummary?.maxCadence,
                chart.maxCadence
              ),
              averageStrideLength: choose(
                freshSummary?.averageStrideLength,
                existing?.summary?.averageStrideLength
              ),
              averageVerticalOscillation: choose(
                freshSummary?.averageVerticalOscillation,
                chart.averageVerticalOscillation
              ),
              averageVerticalRatio: choose(
                freshSummary?.averageVerticalRatio,
                chart.averageVerticalRatio
              ),
              averageGroundContactTime: choose(
                freshSummary?.averageGroundContactTime,
                chart.averageGroundContactTime
              ),
              averageGroundContactBalance: choose(
                freshSummary?.averageGroundContactBalance,
                chart.averageGroundContactBalance
              ),
              averagePower: choose(
                freshSummary?.averagePower,
                chart.averagePower
              ),
              maxPower: choose(
                freshSummary?.maxPower,
                chart.maxPower
              ),
              normalizedPower: choose(
                freshSummary?.normalizedPower,
                existing?.summary?.normalizedPower
              )
            };
          }

          const freshLaps =
            lapsResult.status === "fulfilled"
              ? lapsResult.value?.data ?? null
              : null;

          let fitSegments = [];
          let fitMeta = null;

          if (
            isRunning &&
            fitResult.status === "fulfilled" &&
            fitResult.value
          ) {
            try {
              fitMeta = await parseFitSegmentsFromBlob(
                fitResult.value
              );

              const apiLapCount = normalizeLapRows(
                freshLaps
              ).length;

              if (
                fitMeta.fitLapCount === apiLapCount &&
                fitMeta.labels.length === apiLapCount
              ) {
                fitSegments = fitMeta.labels;
              }
            } catch (error) {
              console.error("ATLAS FIT parse:", error);
            }
          }

          const activityPreciseVo2 =
            preciseVo2Result.status === "fulfilled" &&
            preciseVo2Result.value?.data
              ? {
                  activityId: String(
                    preciseVo2Result.value.data.activityId ?? id
                  ),
                  value: preciseVo2Result.value.data.value ?? null,
                  source:
                    preciseVo2Result.value.data.source ??
                    "garmin-connect:maxmet.generic.vo2MaxPreciseValue",
                  calendarDate:
                    preciseVo2Result.value.data.calendarDate ?? null,
                  obtainedAt:
                    preciseVo2Result.value.data.obtainedAt ??
                    new Date().toISOString(),
                  association:
                    preciseVo2Result.value.meta?.association ??
                    "latest-run-on-activity-date",
                  matched:
                    preciseVo2Result.value.data.matched === true &&
                    preciseVo2Result.value.meta?.exactOpenedActivityMatch === true &&
                    String(
                      preciseVo2Result.value.data.activityId ?? ""
                    ) === String(id) &&
                    Number.isFinite(
                      Number(preciseVo2Result.value.data.value)
                    ) &&
                    !Number.isInteger(
                      Number(preciseVo2Result.value.data.value)
                    ) &&
                    Number(preciseVo2Result.value.data.value) > 10 &&
                    Number(preciseVo2Result.value.data.value) < 100
                }
              : {
                  activityId: String(id),
                  value: null,
                  source: "garmin-connect:maxmet.generic.vo2MaxPreciseValue",
                  calendarDate: existing?.summary?.date ?? null,
                  obtainedAt: new Date().toISOString(),
                  matched: false
                };

          const updated = {
            ...existing,
            summary: {
              ...existing.summary,
              ...freshSummary
            },
            detail,
            detailLoaded: true,
            detailUpdatedAt: new Date().toISOString(),
            running,
            runningLoaded: Boolean(running),
            runningUpdatedAt: running
              ? new Date().toISOString()
              : null,
            freshLaps,
            fitSegments,
            fitMeta,
            activityPreciseVo2,
            activityFreshLoading: false,
            activityFreshUpdatedAt: new Date().toISOString()
          };

          await AtlasStorage.put(
            "activities",
            updated
          );
          await hydrateLocal();
          return updated;
        } catch (error) {
          await AtlasStorage.put("activities", {
            ...existing,
            activityFreshLoading: false
          });
          await hydrateLocal();
          throw error;
        }
      }

      async function ensureActivityFit(id) {
        const existing = await AtlasStorage.get(
          "activities",
          String(id)
        );
        if (!existing) throw new Error("ACTIVITY_NOT_FOUND");

        return AtlasServices.activityFit(
          AtlasUI.state.bridgeUrl,
          String(id)
        );
      }

      async function bootstrapBridgeFromUrl() {
        try {
          const url = new URL(window.location.href);
          const bridge = url.searchParams.get("bridge");

          if (!bridge) return;

          const normalized = String(bridge).trim().replace(/\/+$/, "");
          if (!/^https:\/\//i.test(normalized)) return;

          await AtlasStorage.put("settings", {
            key: "garminBridgeUrl",
            value: normalized
          });

          AtlasUI.state.bridgeUrl = normalized;

          url.searchParams.delete("bridge");
          window.history.replaceState({}, "", url.toString());
        } catch (error) {
          console.error("ATLAS bridge bootstrap:", error);
        }
      }

      async function bootstrapBridgeFromUrl() {
        try {
          const url = new URL(window.location.href);
          let bridge = url.searchParams.get("bridge");

          if (!bridge && url.hash.startsWith("#bridge=")) {
            bridge = decodeURIComponent(url.hash.slice("#bridge=".length));
          }

          if (!bridge) return;

          const normalized = String(bridge).trim().replace(/\/+$/, "");
          if (!/^https:\/\//i.test(normalized)) return;

          await AtlasStorage.put("settings", {
            key: "garminBridgeUrl",
            value: normalized
          });

          AtlasUI.state.bridgeUrl = normalized;

          url.searchParams.delete("bridge");
          url.hash = "";
          window.history.replaceState({}, "", url.toString());
        } catch (error) {
          console.error("ATLAS bridge bootstrap:", error);
        }
      }

      function portableSetupLink() {
        const bridge = String(
          AtlasUI.state.bridgeUrl ||
          ATLAS_CONFIG.GARMIN_BRIDGE_URL ||
          ""
        ).trim();

        if (!bridge) return "";

        const url = new URL(window.location.href);
        url.searchParams.delete("bridge");
        url.hash = `bridge=${encodeURIComponent(bridge)}`;
        return url.toString();
      }

      async function copyPortableSetupLink() {
        const link = portableSetupLink();
        if (!link) return;

        try {
          await navigator.clipboard.writeText(link);
          alert("Enlace de configuración copiado.");
        } catch {
          prompt("Copia este enlace y ábrelo en el otro dispositivo:", link);
        }
      }

      async function init() {
        AtlasUI.render();

        try {
          await AtlasStorage.open();
          AtlasUI.state.dbReady = true;

          await AtlasStorage.put("sync", {
            key: "schemaVersion",
            value: ATLAS_CONFIG.DATA_SCHEMA_VERSION
          });

          await AtlasStorage.put("settings", {
            key: "lastTab",
            value: "today"
          });

          await bootstrapBridgeFromUrl();
          await hydrateLocal();

          if (
            AtlasUI.state.bridgeUrl &&
            !AtlasUI.state.autoSyncDone
          ) {
            AtlasUI.state.autoSyncDone = true;

            // Fire after initial render; do not block app startup.
            setTimeout(() => {
              syncNow().catch((error) => {
                console.error("ATLAS auto sync:", error);
              });
            }, 0);
          }
        } catch (error) {
          AtlasUI.state.dbError = String(error?.message || error);
        }

        AtlasUI.render();
      }

      return {
        init,
        saveBridgeUrl,
        syncNow,
        ensureActivityDetail,
        ensureActivityRunning,
        refreshActivityData,
        ensureActivityFit,
        copyPortableSetupLink
      };
    })();

    document.addEventListener("gesturestart", (event) => {
      event.preventDefault();
    }, { passive: false });

    document.addEventListener("gesturechange", (event) => {
      event.preventDefault();
    }, { passive: false });

    document.addEventListener("gestureend", (event) => {
      event.preventDefault();
    }, { passive: false });

    AtlasApp.init();
  </script>
</body>
</html>
