<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ATLAS">
  <title>ATLAS</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <link rel="stylesheet" href="./css/today.css">
  <link rel="stylesheet" href="./css/activities.css">
  <link rel="stylesheet" href="./css/plan.css">
  <link rel="stylesheet" href="./css/refinement.css">
  <link rel="stylesheet" href="./css/evolution.css">
  <link rel="stylesheet" href="./css/profile.css">
  <script defer src="./js/data/database.js"></script>
  <script defer src="./js/data/repositories.js"></script>
  <script defer src="./js/data/offline.js"></script>
  <script defer src="./js/app.js"></script>
  <script defer src="./js/today.js"></script>
  <script defer src="./js/activities.js"></script>
  <script defer src="./js/plan.js"></script>
  <script defer src="./js/evolution.js"></script>
  <script defer src="./js/profile.js"></script>
</head>
<body>
  <header class="atlas-brand" aria-label="ATLAS">
    <img src="./assets/atlas-wordmark.jpeg" alt="ATLAS" width="2132" height="364">
  </header>

  <main class="atlas-main" id="atlas-main">
    <section class="atlas-view" id="view-hoy" role="tabpanel" aria-labelledby="tab-hoy" tabindex="0">
      <div class="today-heading"><h1 class="atlas-page-title atlas-view-heading">Hoy</h1><span class="today-demo">DEMO · SIMULADO</span></div>
      <p class="today-notice">Datos ficticios para comprobar el diseño. Sin conexión a Garmin.</p>
      <div class="today-hero" aria-label="Estado ATLAS y seis métricas simuladas">
        <button class="today-state" id="today-state-button" type="button" aria-label="Ver detalle simulado de Estado ATLAS">
          <span class="today-ring" id="today-state-ring"><span class="today-ring-value" id="today-state-score">—</span></span>
          <span class="today-state-copy"><span class="today-state-caption"><span id="today-date-caption">Fecha de hoy</span></span><span class="today-state-title" id="today-state-word">—</span><span class="today-state-description" id="today-state-note">—</span></span>
        </button>
        <div class="today-metrics" id="today-metrics" aria-label="Seis métricas simuladas"></div>
      </div>
      <h2 class="today-section-title">🕘 Último entrenamiento</h2><div class="today-sessions" id="today-last"></div>
      <h2 class="today-section-title">🗓️ Próximos entrenamientos</h2><div class="today-sessions" id="today-upcoming"></div>
    </section>
    <section class="atlas-view" id="view-actividades" role="tabpanel" aria-labelledby="tab-actividades" tabindex="0" hidden>
      <div class="activities-heading"><h1 class="atlas-page-title atlas-view-heading">Actividades</h1><span class="today-demo">DEMO · SIMULADO</span></div>
      <p class="activities-notice">Historial ficticio para validar la interfaz. Sin conexión a Garmin.</p>
      <div class="activities-toolbar" aria-label="Filtros de actividades">
        <select id="activities-sport" class="atlas-field" aria-label="Filtrar deporte"><option value="all">Todos los deportes</option><option value="running">🏃🏻‍♂️ Carrera</option><option value="cycling">🚴🏻‍♂️ Ciclismo</option><option value="strength">🏋🏻‍♂️ Fuerza</option><option value="walking">🚶🏻‍♂️ Caminar</option></select>
        <select id="activities-year" class="atlas-field" aria-label="Filtrar por año"><option value="all">Todo</option></select>
        <input id="activities-search" class="atlas-field activities-search" type="search" placeholder="Buscar actividad…" aria-label="Buscar actividades" autocomplete="off">
      </div>
      <p id="activities-summary" class="activities-summary" aria-live="polite"></p>
      <div id="activities-list" class="activities-list"></div>
    </section>
    <section class="atlas-view" id="view-plan" role="tabpanel" aria-labelledby="tab-plan" tabindex="0" hidden>
      <h1 class="atlas-page-title atlas-view-heading">Plan</h1>
    </section>
    <section class="atlas-view" id="view-evolucion" role="tabpanel" aria-labelledby="tab-evolucion" tabindex="0" hidden>
      <h1 class="atlas-page-title atlas-view-heading">Evolución</h1>
    </section>
    <section class="atlas-view" id="view-perfil" role="tabpanel" aria-labelledby="tab-perfil" tabindex="0" hidden>
      <h1 class="atlas-page-title atlas-view-heading">Perfil</h1>
    </section>
  </main>

  <section class="profile-detail" id="profile-detail" role="dialog" aria-modal="true" aria-labelledby="profile-detail-title" hidden>
    <div class="profile-detail-inner"><div class="profile-detail-top"><button type="button" id="profile-detail-back" class="profile-detail-back" aria-label="Volver al perfil">‹</button><h2 id="profile-detail-title"></h2></div><div id="profile-detail-body"></div><button id="profile-detail-close" type="button" class="atlas-button atlas-button--quiet profile-detail-close">Volver a Perfil</button></div>
  </section>

  <section class="today-detail" id="today-detail" role="dialog" aria-modal="true" aria-labelledby="today-detail-title" hidden>
    <div class="today-detail-inner"><div class="today-detail-header"><button class="today-detail-back" id="today-detail-back" type="button" aria-label="Volver a Hoy">‹</button><h2 id="today-detail-title"></h2></div><div id="today-detail-body"></div><button type="button" id="today-detail-close" class="atlas-button atlas-button--quiet today-detail-close">Volver a Hoy</button></div>
  </section>

  <section class="activity-detail" id="activity-detail" role="dialog" aria-modal="true" aria-labelledby="activity-detail-title" hidden>
    <div class="activity-detail-inner">
      <div class="activity-detail-head"><button type="button" id="activity-detail-back" class="activity-detail-back" aria-label="Volver a las actividades">‹</button><h2 id="activity-detail-title"></h2></div>
      <div id="activity-detail-body" class="activity-detail-body"></div>
      <button type="button" id="activity-detail-close" class="atlas-button atlas-button--quiet activity-detail-close">Volver</button>
    </div>
  </section>

  <nav class="atlas-tabbar" role="tablist" aria-label="Navegación principal de ATLAS">
    <button class="atlas-tab" type="button" id="tab-hoy" role="tab" aria-controls="view-hoy" aria-selected="true" tabindex="0" data-view="hoy">
      <span class="atlas-tab-icon" aria-hidden="true">🏠</span>
      <span class="atlas-tab-label">Hoy</span>
    </button>
    <button class="atlas-tab" type="button" id="tab-actividades" role="tab" aria-controls="view-actividades" aria-selected="false" tabindex="-1" data-view="actividades">
      <span class="atlas-tab-icon" aria-hidden="true">🏃🏻‍♂️</span>
      <span class="atlas-tab-label">Actividades</span>
    </button>
    <button class="atlas-tab" type="button" id="tab-plan" role="tab" aria-controls="view-plan" aria-selected="false" tabindex="-1" data-view="plan">
      <span class="atlas-tab-icon" aria-hidden="true">📅</span>
      <span class="atlas-tab-label">Plan</span>
    </button>
    <button class="atlas-tab" type="button" id="tab-evolucion" role="tab" aria-controls="view-evolucion" aria-selected="false" tabindex="-1" data-view="evolucion">
      <span class="atlas-tab-icon" aria-hidden="true">📈</span>
      <span class="atlas-tab-label">Evolución</span>
    </button>
    <button class="atlas-tab" type="button" id="tab-perfil" role="tab" aria-controls="view-perfil" aria-selected="false" tabindex="-1" data-view="perfil">
      <span class="atlas-tab-icon" aria-hidden="true">👤</span>
      <span class="atlas-tab-label">Perfil</span>
    </button>
  </nav>
</body>
</html>
